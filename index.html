  /* ===== MERCADO LIVRE: "Só os melhores" com margem mínima de 20% ===== */
  window.lpMLBestOnly=function(){
    const minMargin=N(data.settings?.mlBestMarginPct||20);
    const rows=(data.mercadoLivreItems||[]).map(x=>{
      const p=(data.products||[]).find(p=>String(p.id)===String(x.productId));if(!p||N(p.qty)<=0)return null;
      const feePct=Math.min(N(x.mlClassicFeePct??data.settings?.mlClassicFeePct??14),N(x.mlPremiumFeePct??data.settings?.mlPremiumFeePct??19));
      const freight=N(x.mlFreight??data.settings?.mlDefaultFreight),other=N(x.mlOtherCost??data.settings?.mlDefaultOther),cost=N(p.cost);
      const price=N(x.mlSuggestedPrice||x.mlPrice||p.price)*1.05;

      ${rows.map(r=>`<div class="lp-diff"><b>${E(r.p.name)}</b><small class="cell-sub">Preço ${M(r.price)} • lucro ${M(r.profit)} • margem ${r.margin.toFixed(1)}%</small><div class="actions" style="margin-top:8px"><button class="btn ghost small" onclick="searchMLSimilar(${r.x.id})">Buscar anúncios</button><button class="btn ghost small" onclick="mlV6CompetitorModal(${r.x.id})">Registrar preços</button></div></div>`).join('')||'<div class="empty">Nenhum produto atingiu essa margem.</div>'}
      <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Fechar</button></div>`);
  };
  const prevMLV13=window.renderMercadoLivre;
  window.renderMercadoLivre=function(){
    prevMLV13();

    const actions=page.querySelector('.heading .actions');
    if(actions&&!page.querySelector('[data-lp-best-ml]')){
      const b=document.createElement('button');b.className='btn primary';b.dataset.lpBestMl='1';b.textContent='Só os melhores (≥20%)';b.onclick=window.lpMLBestOnly;actions.prepend(b);
    }
  };

  /* ===== BACKUP AUTOMÁTICO + AUDITORIA ===== */
  window.lpAutoBackupNow=function(showMsg=true){

      localStorage.setItem('lepneus_auto_backup_v13',JSON.stringify(payload));
      localStorage.setItem('lepneus_auto_backup_time_v13',payload.savedAt);

  const prevBackupV13=window.renderBackup;
  window.renderBackup=function(){

    const page=$id('backup');if(!page||$id('lpAutoBackupPanelV13'))return;
    const panel=document.createElement('div');panel.id='lpAutoBackupPanelV13';panel.className='grid2 lp-extra-card';
    const last=localStorage.getItem('lepneus_auto_backup_time_v13')||'Ainda não executado';
    panel.innerHTML=`<div class="card"><div class="panel-head"><div><h3 class="section-title" style="margin:0">Backup automático local</h3><small class="cell-sub">Uma cópia de segurança no navegador é atualizada periodicamente.</small></div></div><div class="notice"><b>Último backup:</b> ${E(last)}</div><button class="btn primary" onclick="lpAutoBackupNow(true)">Executar agora</button></div>
      <div class="card"><div class="panel-head"><div><h3 class="section-title" style="margin:0">Auditoria de alterações</h3><small class="cell-sub">Últimas ações registradas pelo sistema.</small></div></div><div class="lp-audit-list">${(data.history||[]).slice(0,30).map(h=>`<div class="lp-audit-row"><b>${E(h.action||'Alteração')}</b><small>${E(h.date||'')} • ${E(h.user||'Administrador')}</small></div>`).join('')||'<div class="empty">Nenhuma alteração registrada.</div>'}</div></div>`;
    page.appendChild(panel);

  setInterval(()=>window.lpAutoBackupNow(false),10*60*1000);

})();

<script id="lp-fluid-v14-js">
(function(){
  const qs=(s,r=document)=>r.querySelector(s);

  /* 1) Navegação em um único frame: evita vários reflows no mesmo clique */
  let navFrame=0;
  const previousOpenPage=window.openPage;
  window.openPage=function(id,btn){
    if(navFrame)cancelAnimationFrame(navFrame);
    navFrame=requestAnimationFrame(()=>{
      navFrame=0;
      try{
        if(typeof previousOpenPage==='function') previousOpenPage(id,btn);
      }catch(e){
        console.error('Navegação:',e);
      }
    });
  };

  /* 2) Render da página ativa agrupado, sem renderizações repetidas */
  let renderFrame=0;
  const previousStable=window.renderPageStable;
  window.renderPageStable=function(id){
    if(renderFrame)cancelAnimationFrame(renderFrame);
    renderFrame=requestAnimationFrame(()=>{
      renderFrame=0;
      try{
        if(typeof previousStable==='function')previousStable(id);
      }catch(e){
        console.error('Render:',id,e);
      }
    });
  };

  /* 3) Pesquisa de estoque com debounce */
  let stockTimer=0;
  const previousStockFilter=window.lpStockFilter;
  window.lpStockFilter=function(){
    clearTimeout(stockTimer);
    stockTimer=setTimeout(()=>{
      try{previousStockFilter?.()}catch(e){console.warn(e)}
    },120);
  };

  /* 4) Evita recriar gráficos em cima dos antigos */
  const chartRegistry=new Map();
  function destroyChartForCanvas(canvas){
    if(!canvas)return;
    try{
      if(window.Chart?.getChart){
        const ch=Chart.getChart(canvas);
        if(ch)ch.destroy();
      }
    }catch(e){}
    const old=chartRegistry.get(canvas.id);
    try{old?.destroy?.()}catch(e){}
    chartRegistry.delete(canvas.id);
  }
  const NativeChart=window.Chart;
  if(typeof NativeChart==='function' && !window.__lpChartWrapped){
    window.__lpChartWrapped=true;
    const Wrapped=function(ctx,config){
      const canvas=ctx?.canvas||ctx;
      if(canvas?.id)destroyChartForCanvas(canvas);
      const instance=new NativeChart(ctx,config);
      if(canvas?.id)chartRegistry.set(canvas.id,instance);
      return instance;
    };
    Object.keys(NativeChart).forEach(k=>{try{Wrapped[k]=NativeChart[k]}catch(e){}});
    Wrapped.prototype=NativeChart.prototype;
    window.Chart=Wrapped;
  }

  /* 5) Modal: fecha rápido, sem camada invisível prendendo clique */
  const previousClose=window.closeModal;
  window.closeModal=function(){
    const m=qs('#modal');
    try{previousClose?.()}catch(e){}
    if(m){
      m.classList.remove('show');
      m.style.display='none';
      m.style.pointerEvents='none';
    }
    document.body.style.overflow='';
  };

  /* 6) ESC e toque fora do modal */
  if(!window.__lpFluidModalEvents){
    window.__lpFluidModalEvents=true;
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&qs('#modal.show'))window.closeModal();
    });
    qs('#modal')?.addEventListener('click',e=>{
      if(e.target===e.currentTarget)window.closeModal();
    });
  }

  /* 7) Melhor resposta visual nos botões sem bloquear a ação */
  document.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.btn,.nav button,.iconbtn');
    if(!b)return;
    b.classList.add('lp-pressed');
  },{passive:true});
  document.addEventListener('pointerup',()=>{
    document.querySelectorAll('.lp-pressed').forEach(x=>x.classList.remove('lp-pressed'));
  },{passive:true});

  /* 8) Evita renderAll pesado se nada está ativo */
  const previousRenderAll=window.renderAll;
  window.renderAll=function(){
    const active=qs('.page.active');
    if(!active)return;
    try{
      if(typeof window.renderPageStable==='function')return window.renderPageStable(active.id);
      return previousRenderAll?.();
    }catch(e){console.error(e)}
  };

  /* 9) Sidebar no mobile: fecha assim que navega */
  document.addEventListener('click',e=>{
    if(e.target.closest('.nav button')&&window.innerWidth<=800){
      requestAnimationFrame(()=>qs('#sidebar')?.classList.remove('open'));
    }
  });

})();
</script>

.heading p,.metric .label,.cell-sub,.muted,small,label,th{color:var(--pv-muted)!important}
.card,.metric,.settings-section,.table-wrap{background:linear-gradient(180deg,#0e1a2a,#0c1725)!important;border:1px solid var(--pv-line)!important;color:var(--pv-text)!important;box-shadow:var(--pv-shadow)!important;border-radius:16px!important}
.metric{min-height:122px!important} .metric .label{font-size:12px!important} .metric .value{font-size:25px!important}
input,select,textarea{background:#0a1727!important;color:#eff5fb!important;border:1px solid #2a3c54!important}
input::placeholder,textarea::placeholder{color:#71839a!important}
.btn.ghost{background:#122136!important;color:#e8eff7!important;border-color:#2a3b52!important}
.btn.primary{background:linear-gradient(135deg,#ef3340,#d82431)!important;color:#fff!important}
thead th{background:#0a1727!important;color:#9eb0c4!important;border-color:#223249!important}
tbody td{color:#eaf1f8!important;border-color:#1c2b3e!important} tbody tr:hover{background:#112137!important}
.notice,.alert,.soft-chip,.mini,.field{background:#101e30!important;color:#dbe6f2!important;border-color:#2a3b52!important}
.modal{background:rgba(1,6,13,.72)!important;backdrop-filter:blur(8px)!important}
.modal-card{background:#0d1928!important;color:#f4f8fd!important;border-color:#2a3a50!important}
.modal-card .notice,.modal-card .field,.modal-card .mini{background:#101e30!important;color:#dce7f3!important}
.modal-close-x{background:#14253a!important;color:#fff!important;border-color:#34485f!important}

#dashboard .lp-preview-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
#dashboard .lp-preview-grid{display:grid;grid-template-columns:1.45fr .85fr;gap:14px;margin-top:14px}
#dashboard .lp-preview-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
#dashboard .lp-kpi-card{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:linear-gradient(180deg,#0e1a2a,#0d1826);border:1px solid var(--pv-line);border-radius:15px;padding:16px;box-shadow:var(--pv-shadow)}
#dashboard .lp-kpi-icon{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:#16283d;font-size:24px}
#dashboard .lp-kpi-icon.green{background:linear-gradient(135deg,#18c07a,#12a965)} #dashboard .lp-kpi-icon.red{background:linear-gradient(135deg,#ef4a58,#d72734)}
#dashboard .lp-kpi-icon.blue{background:linear-gradient(135deg,#36a7fb,#2186e6)} #dashboard .lp-kpi-icon.orange{background:linear-gradient(135deg,#ff9d37,#ef7e20)}
#dashboard .lp-kpi-copy span{display:block;color:#b6c3d3;font-size:12px} #dashboard .lp-kpi-copy b{display:block;color:#fff;font-size:25px;margin-top:4px} #dashboard .lp-kpi-copy small{display:block;margin-top:4px;color:#8fa0b6}
#dashboard .lp-chart-card{min-height:300px} #dashboard .lp-chart-wrap{height:245px}
#dashboard .lp-dashboard-banner{position:relative;overflow:hidden;margin-top:14px;min-height:126px;border-radius:16px;border:1px solid #293b52;background:linear-gradient(90deg,rgba(7,15,25,.96),rgba(7,15,25,.74)),radial-gradient(circle at 70% 50%,rgba(239,51,64,.14),transparent 36%);display:grid;grid-template-columns:1.2fr .8fr;align-items:center;padding:20px 26px}
#dashboard .lp-dashboard-banner h3{font-size:23px;color:#fff;margin:0 0 6px} #dashboard .lp-dashboard-banner p{color:#c7d2df;margin:0}
#dashboard .lp-dashboard-banner .lp-banner-badges{display:flex;gap:18px;flex-wrap:wrap;margin-top:13px} #dashboard .lp-dashboard-banner .lp-banner-badges span{color:#fff;font-size:12px;font-weight:800}
#dashboard .lp-dashboard-banner img{position:absolute;right:18px;bottom:-46px;width:190px;height:190px;object-fit:cover;border-radius:50%}
.lp-dashboard-only{display:none!important} #dashboard .lp-dashboard-only{display:block!important}

@media(max-width:1180px){#dashboard .lp-preview-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} #dashboard .lp-preview-grid,#dashboard .lp-preview-grid3{grid-template-columns:1fr}}
@media(max-width:800px){.brand .brand-logo{width:92px!important;height:92px!important;min-width:92px!important} #dashboard .lp-preview-kpis{grid-template-columns:1fr 1fr} #dashboard .lp-dashboard-banner{grid-template-columns:1fr;padding-right:150px} #dashboard .lp-dashboard-banner img{width:150px;height:150px;right:-8px;bottom:-24px}}
@media(max-width:560px){#dashboard .lp-preview-kpis{grid-template-columns:1fr} #dashboard .lp-dashboard-banner{padding-right:20px;padding-bottom:120px} #dashboard .lp-dashboard-banner img{width:135px;height:135px;right:15px;bottom:-10px}}
</style>

<script id="lp-preview-style-v15-js">
(function(){
  const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};
  const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const E=v=>typeof esc==='function'?esc(v):String(v??'');
  const $q=(s,r=document)=>r.querySelector(s);

  function activeSalesSafe(){
    try{return typeof activeSales==='function'?activeSales():(data.sales||[]).filter(s=>String(s.status||'').toLowerCase()!=='cancelada')}
    catch(e){return data.sales||[]}
  }
  function currentName(){
    try{const u=typeof currentUser==='function'?currentUser():null;return u?.name||u?.username||'Administrador';}
    catch(e){return 'Administrador'}
  }
  function parseDate(v){
    if(!v)return null;
    try{if(typeof parseBRDateTime==='function'){const d=parseBRDateTime(v);if(d&&!isNaN(d))return d}}catch(e){}
    const m=String(v).match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(m)return new Date(+m[3],+m[2]-1,+m[1]);
    const d=new Date(v);return isNaN(d)?null:d;
  }
  function sameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

  function enhanceTopbar(){
    const top=$q('.topbar');if(!top)return;
    const profile=$q('.profile',top);
    if(profile){
      const strong=$q('.profile-copy strong',profile);
      const small=$q('.profile-copy small',profile);
      if(strong)strong.textContent=currentName();
      if(small)small.textContent='Usuário';
    }
    const actions=$q('.top-actions',top);
    if(actions&&!$q('.lp-bell-wrap',actions)){
      const wrap=document.createElement('div');
      wrap.className='lp-bell-wrap';
      const warnings=(data.products||[]).filter(p=>N(p.qty)<1).length;
      wrap.innerHTML=`<button class="iconbtn" title="Notificações">🔔</button>${warnings?`<span class="lp-bell-dot">${Math.min(warnings,99)}</span>`:''}`;
      actions.insertBefore(wrap,profile||actions.firstChild);
    }
  }

  window.renderDashboard=function(){
    try{ensureData();enhanceData()}catch(e){}
    const sales=activeSalesSafe(),today=new Date();
    const todaySales=sales.filter(s=>sameDay(parseDate(s.date),today));
    const revenue=todaySales.reduce((a,s)=>a+N(s.total),0),profit=todaySales.reduce((a,s)=>a+N(s.profit),0);
    const stockUnits=(data.products||[]).reduce((a,p)=>a+N(p.qty),0),stockZero=(data.products||[]).filter(p=>N(p.qty)<1).length;
    const sold={};sales.forEach(s=>(s.items||[]).forEach(i=>{const k=i.name||'Produto';sold[k]=(sold[k]||0)+N(i.qty)}));
    const top=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const monthly=new Map();sales.forEach(s=>{const d=parseDate(s.date);if(!d)return;const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;monthly.set(k,(monthly.get(k)||0)+N(s.profit||0))});
    const keys=[...monthly.keys()].sort().slice(-12);
    const recent=sales.slice(0,5);
    const openServices=(data.serviceOrders||[]).filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).slice(0,5);

    document.getElementById('dashboard').innerHTML=
      `<div class="heading"><div><h1>Bem-vindo, ${E(currentName())}!</h1><p>Aqui está o resumo da sua empresa hoje.</p></div></div>
      <div class="lp-preview-kpis">
        <div class="lp-kpi-card"><div class="lp-kpi-icon green">🛒</div><div class="lp-kpi-copy"><span>Vendas Hoje</span><b>${M(revenue)}</b><small>${todaySales.length} venda(s)</small></div></div>
        <div class="lp-kpi-card"><div class="lp-kpi-icon red">🏷️</div><div class="lp-kpi-copy"><span>Lucro Hoje</span><b>${M(profit)}</b><small>resultado registrado</small></div></div>
        <div class="lp-kpi-card"><div class="lp-kpi-icon blue">◈</div><div class="lp-kpi-copy"><span>Total de Produtos</span><b>${stockUnits}</b><small>unidades em estoque</small></div></div>
        <div class="lp-kpi-card"><div class="lp-kpi-icon orange">⚠️</div><div class="lp-kpi-copy"><span>Baixo Estoque</span><b>${stockZero}</b><small>produtos zerados</small></div></div>
      </div>
      <div class="lp-preview-grid">
        <div class="card lp-chart-card"><div class="panel-head"><div><h3 class="section-title" style="margin:0">Lucro Mensal</h3><small class="cell-sub">Evolução dos últimos meses</small></div></div><div class="lp-chart-wrap"><canvas id="lpPreviewProfit"></canvas></div></div>
        <div class="card"><div class="panel-head"><h3 class="section-title" style="margin:0">Produtos Mais Vendidos</h3></div><div class="summary-list">${top.map(([name,q],i)=>`<div><span>${i+1} • ${E(name)}</span><b>${q} un.</b></div>`).join('')||'<div class="empty">Sem vendas registradas.</div>'}</div></div>
      </div>
      <div class="lp-preview-grid3">
        <div class="card"><div class="panel-head"><h3 class="section-title" style="margin:0">Status do Estoque</h3></div><div class="summary-list"><div><span>Em estoque</span><b>${(data.products||[]).filter(p=>N(p.qty)>2).length}</b></div><div><span>Estoque baixo</span><b>${(data.products||[]).filter(p=>N(p.qty)>0&&N(p.qty)<=2).length}</b></div><div><span>Zerado</span><b>${stockZero}</b></div></div></div>
        <div class="card"><div class="panel-head"><h3 class="section-title" style="margin:0">Últimas Vendas</h3></div><div class="summary-list">${recent.map(s=>`<div><span>${E((s.items||[])[0]?.name||s.customer||'Venda')}</span><b>${M(s.total)}</b></div>`).join('')||'<div class="empty">Sem vendas recentes.</div>'}</div></div>
        <div class="card"><div class="panel-head"><h3 class="section-title" style="margin:0">Serviços em Andamento</h3></div><div class="summary-list">${openServices.map(o=>`<div><span>${E(o.service||'Serviço')}</span><b>${E(o.status||'Aberta')}</b></div>`).join('')||'<div class="empty">Nenhum serviço em andamento.</div>'}</div></div>
      </div>
      <div class="lp-dashboard-banner lp-dashboard-only">
        <div><h3>Pneu certo, medida certa, sem enrolação!</h3><p>Controle, estoque, catálogo e atendimento em um só lugar.</p><div class="lp-banner-badges"><span>✓ Garantia de fábrica</span><span>✓ Montagem e balanceamento</span></div></div>

<style id="lp-final-visual-v16">
/* ===== Correção final visual: mantém menu bom e reconstrói centro com contraste ===== */
html,body{
  background:#f4f7fb!important;
  color:#152033!important;
}
body{
  background:linear-gradient(180deg,#f7f9fc 0%,#eef3f8 100%)!important;
}
.main,.content,.page,.page.active{
  background:transparent!important;
  color:#152033!important;
}
.content{padding:28px 28px 40px!important}

/* Sidebar escura preservada */
.sidebar{
  background:linear-gradient(180deg,#071321 0%,#0b1728 100%)!important;
  border-right:1px solid rgba(255,255,255,.06)!important;
}
.brand{padding:16px 14px 22px!important;gap:14px!important}
.brand .brand-logo{
  width:92px!important;height:92px!important;min-width:92px!important;

  background:#fff!important;border:2px solid rgba(255,255,255,.08)!important;
  box-shadow:none!important;
}
.brand .brand-logo img{

}

.brand-copy small{font-size:10px!important;color:#a9b8ca!important;letter-spacing:.08em!important}

.nav button:hover{background:#112238!important;color:#fff!important}
.nav button.active{

  color:#fff!important;border:0!important;
  box-shadow:0 10px 24px rgba(239,51,64,.18)!important;
}

/* Topbar igual à referência, sem sacrificar a área clara central */

}

}

.search-icon{color:#c2cfdd!important}

.iconbtn{background:#102136!important;color:#fff!important;border:1px solid #253a53!important}
.profile-copy strong{color:#fff!important}
.profile-copy small{color:#9aaabc!important}

/* Área principal clara, legível */
.heading h1,.heading h2,.heading h3,.section-title,.panel-head h3{
  color:#162033!important;
}
.heading p,.cell-sub,.muted,small,label,th{color:#6b7c91!important}

#dashboard .lp-chart-wrap{height:250px!important}
#dashboard .summary-list>div{
  padding:12px 0!important;border-bottom:1px solid #e8edf3!important;
}
#dashboard .summary-list>div:last-child{border-bottom:0!important}
#dashboard .summary-list span{color:#445469!important}
#dashboard .summary-list b{color:#111827!important}

#dashboard .lp-dashboard-banner{
  position:relative!important;overflow:hidden!important;margin-top:14px!important;min-height:132px!important;
  border-radius:16px!important;border:1px solid #18283e!important;
  background:
    linear-gradient(90deg,rgba(5,14,24,.98),rgba(8,23,39,.88)),
    linear-gradient(135deg,#08131f,#0d1b2d)!important;
  padding:22px 230px 22px 26px!important;
  box-shadow:0 12px 30px rgba(5,14,24,.16)!important;
}
#dashboard .lp-dashboard-banner:before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#ef3340;
}
#dashboard .lp-dashboard-banner h3{color:#fff!important;font-size:22px!important;margin:0 0 7px!important}
#dashboard .lp-dashboard-banner p{color:#bfcbd8!important;margin:0!important}
#dashboard .lp-dashboard-banner .lp-banner-badges{display:flex!important;gap:18px!important;flex-wrap:wrap!important;margin-top:13px!important}
#dashboard .lp-dashboard-banner .lp-banner-badges span{color:#fff!important;font-size:12px!important;font-weight:800!important}
#dashboard .lp-dashboard-banner img{
  position:absolute!important;right:18px!important;bottom:-33px!important;
  width:185px!important;height:185px!important;border-radius:50%!important;
  object-fit:cover!important;background:#fff!important;border:2px solid rgba(255,255,255,.12)!important;
}

/* Modal volta a ser claro e legível */
.modal{background:rgba(15,23,42,.32)!important;backdrop-filter:blur(7px)!important}
.modal-card{background:#fff!important;color:#172033!important;border-color:#d9e2ec!important}
.modal-card h1,.modal-card h2,.modal-card h3,.modal-card h4,.modal-card strong,.modal-card b{color:#172033!important}
.modal-card p,.modal-card small,.modal-card label,.modal-card span{color:#64748b!important}
.modal-card .notice,.modal-card .field,.modal-card .mini{background:#f8fafc!important;color:#334155!important;border-color:#e2e8f0!important}
.modal-close-x{background:#fff!important;color:#172033!important;border-color:#d7e0ea!important}

/* Mantém a imagem promocional somente no Dashboard */
.lp-dashboard-only{display:none!important}
#dashboard .lp-dashboard-only{display:block!important}

  #dashboard .lp-preview-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #dashboard .lp-preview-grid,#dashboard .lp-preview-grid3{grid-template-columns:1fr!important}
}

  .content{padding:18px 14px 34px!important}

  #dashboard .lp-dashboard-banner{padding-right:155px!important}
  #dashboard .lp-dashboard-banner img{width:145px!important;height:145px!important;right:6px!important;bottom:-14px!important}
}
@media(max-width:560px){
  #dashboard .lp-preview-kpis{grid-template-columns:1fr!important}
  #dashboard .lp-dashboard-banner{padding:20px 20px 120px!important}
  #dashboard .lp-dashboard-banner img{width:132px!important;height:132px!important;right:16px!important;bottom:-8px!important}
}

<style id="lp-runtime-fix-v17-css">
/* ===== Enquadramento: remove o espaço branco entre menu e conteúdo ===== */
.app{
  grid-template-columns:238px minmax(0,1fr)!important;
  width:100%!important;
}
.main{
  margin-left:0!important;
  width:auto!important;
  min-width:0!important;
  max-width:none!important;
}
.sidebar{
  width:auto!important;
  min-width:0!important;
}
.content{
  width:100%!important;
  min-width:0!important;
  box-sizing:border-box!important;
}

/* O botão de 3 barras agora recolhe o menu também no desktop */
.app.lp-sidebar-collapsed{

}

  justify-content:center!important;

  width:54px!important;height:54px!important;min-width:54px!important;
}
.app.lp-sidebar-collapsed .nav button{

}

}

/* Notificações */
.lp-notification-list{display:grid;gap:9px;margin-top:12px}
.lp-notification-item{

}
.lp-notification-item .ico{

.lp-notification-item b{display:block;color:#172033!important}

/* Modal ML mais bem enquadrado */
.modal-card.lp-ml-wide{

.lp-ml-rank-list{display:grid;gap:12px;margin-top:14px}

  border:1px solid #dce4ee;border-radius:15px;background:#fff;padding:14px;

}
.lp-ml-rank-card.warn{border-left-color:#e0a126}
.lp-ml-rank-card.bad{border-left-color:#dc3545}
.lp-ml-rank-head{

}
.lp-ml-rank-name{display:flex;gap:10px;align-items:flex-start}
.lp-ml-rank-number{
  width:32px;height:32px;min-width:32px;border-radius:50%;display:grid;place-items:center;
  background:#101c2d;color:#fff;font-size:12px;font-weight:900;
}
.lp-ml-detail-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;
}
.lp-ml-detail-box{
  padding:10px;border:1px solid #e3e9f0;border-radius:11px;background:#f8fafc;
}
.lp-ml-detail-box span{
  display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#6b7c91;
}

  display:block;margin-top:4px;color:#172033!important;font-size:13px;
}
.lp-ml-rank-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}

/* Tela do ML: começa com 20 itens, sem deixar tudo amontoado */

}

/* Mobile */

}
@media(max-width:520px){
  .lp-ml-detail-grid{grid-template-columns:1fr}
}

<script id="lp-runtime-fix-v17-js">
(function(){
  const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};
  const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const E=v=>typeof esc==='function'?esc(v):String(v??'');

  /* ===== 3 barras ===== */
  window.toggleSidebar=function(){
    const sidebar=document.getElementById('sidebar');
    const app=document.querySelector('.app');
    if(!sidebar||!app)return;
    if(window.innerWidth<=800){
      sidebar.classList.toggle('open');
      return;
    }
    app.classList.toggle('lp-sidebar-collapsed');
    try{
      localStorage.setItem('lp_sidebar_collapsed',app.classList.contains('lp-sidebar-collapsed')?'1':'0');
    }catch(e){}
  };

  function restoreSidebar(){
    if(window.innerWidth<=800)return;
    try{
      if(localStorage.getItem('lp_sidebar_collapsed')==='1'){
        document.querySelector('.app')?.classList.add('lp-sidebar-collapsed');
      }
    }catch(e){}
  }

  /* ===== Sininho ===== */
  function notificationData(){
    const zero=(data.products||[]).filter(p=>N(p.qty)<1);
    const pending=(data.pendingImportDifferences||[]).filter(x=>x.status==='Pendente');
    const overdueServices=(data.serviceOrders||[]).filter(o=>{
      if(!o.dueDate||['Concluída','Entregue','Cancelada'].includes(o.status))return false;
      const d=new Date(o.dueDate+'T23:59:59');
      return !isNaN(d)&&d<new Date();
    });
    const reminders=(data.reminders||[]).filter(r=>r.status!=='Concluído');
    return {zero,pending,overdueServices,reminders};
  }

  window.lpOpenNotifications=function(){
    const d=notificationData();
    const total=d.zero.length+d.pending.length+d.overdueServices.length+d.reminders.length;
    const rows=[
      d.zero.length?`<div class="lp-notification-item"><div class="ico">📦</div><div><b>${d.zero.length} produto(s) zerado(s)</b><small>Abra o Estoque para conferir os produtos sem unidade.</small><div class="actions" style="margin-top:7px"><button class="btn ghost small" onclick="closeModal();openPage('estoque')">Ver estoque</button></div></div></div>`:'',
      d.pending.length?`<div class="lp-notification-item"><div class="ico">↘</div><div><b>${d.pending.length} baixa(s) de planilha aguardando revisão</b><small>Confirme se a redução foi venda ou ajuste.</small><div class="actions" style="margin-top:7px"><button class="btn ghost small" onclick="closeModal();openPage('vendas')">Revisar vendas</button></div></div></div>`:'',
      d.overdueServices.length?`<div class="lp-notification-item"><div class="ico">🔧</div><div><b>${d.overdueServices.length} serviço(s) atrasado(s)</b><small>Há serviços que passaram da previsão de entrega.</small><div class="actions" style="margin-top:7px"><button class="btn ghost small" onclick="closeModal();openPage('os')">Ver serviços</button></div></div></div>`:'',
      d.reminders.length?`<div class="lp-notification-item"><div class="ico">📅</div><div><b>${d.reminders.length} lembrete(s) em aberto</b><small>Confira a agenda e os lembretes pendentes.</small><div class="actions" style="margin-top:7px"><button class="btn ghost small" onclick="closeModal();openPage('agenda')">Abrir agenda</button></div></div></div>`:''
    ].join('');
    showModal(`<h2>Notificações</h2><div class="notice"><b>${total}</b> alerta(s) disponível(is) no Controle.</div><div class="lp-notification-list">${rows||'<div class="empty">Nenhuma notificação pendente.</div>'}</div>`);
  };

  function bindBell(){
    const wrap=document.querySelector('.lp-bell-wrap');
    if(!wrap)return;
    const btn=wrap.querySelector('button');
    if(btn){
      btn.onclick=window.lpOpenNotifications;
      btn.setAttribute('aria-label','Abrir notificações');
    }
    const d=notificationData();
    const count=d.zero.length+d.pending.length+d.overdueServices.length+d.reminders.length;
    let dot=wrap.querySelector('.lp-bell-dot');
    if(count){
      if(!dot){dot=document.createElement('span');dot.className='lp-bell-dot';wrap.appendChild(dot)}
      dot.textContent=Math.min(count,99);
    }else if(dot)dot.remove();
  }

  /* ===== Cálculo detalhado e consistente do Mercado Livre ===== */
  function mlCalc(x){
    const p=(data.products||[]).find(p=>String(p.id)===String(x.productId));
    if(!p||N(p.qty)<=0)return null;
    const s=data.settings||{};
    const classic=N(x.mlClassicFeePct??x.mlFeePct??s.mlClassicFeePct??16);
    const premium=N(x.mlPremiumFeePct??s.mlPremiumFeePct??21);
    const feePct=Math.min(classic||16,premium||21);
    const type=feePct===classic?'Clássico':'Premium';
    const cost=N(p.cost);
    const freight=N(x.mlFreight??s.mlDefaultFreight??0);
    const other=N(x.mlOtherCost??s.mlDefaultOther??0);
    const fiscalPct=.05;
    const marginMin=N(s.mlMinMarginPct??5)/100;
    const den=1-(feePct/100)-fiscalPct-marginMin;
    const minPrice=den>0?(cost+freight+other)/den:(cost+freight+other);
    const marketAvg=N(x.mlMarketAvg),marketMin=N(x.mlMarketMin);
    const discount=N(s.mlCompetitiveDiscountPct??1)/100;
    const marketTarget=marketAvg>0?marketAvg*(1-discount):(marketMin>0?marketMin*1.02:0);
    let base=Math.max(N(p.price),minPrice,marketTarget);
    let price=base*1.05; /* +5% de oportunidade conforme solicitado anteriormente */
    if(s.mlPsychologicalPrice!==false&&price>1)price=Math.ceil(price)-.10;
    const fee=price*feePct/100;
    const fiscal=price*fiscalPct;
    const profit=price-cost-fee-fiscal-freight-other;
    const margin=price?profit/price*100:0;
    let score=0;
    if(profit>0)score+=35;
    if(margin>=N(s.mlMinMarginPct??5))score+=25;
    if(N(p.qty)>=3)score+=10;
    if(marketAvg>0){
      const delta=(price-marketAvg)/marketAvg;
      if(delta<=.05)score+=25;
      else if(delta<=.12)score+=12;
    }else score+=5;
    score=Math.max(0,Math.min(100,Math.round(score)));
    let cls='warn',label='Falta comparar';
    if(profit<=0){cls='bad';label='Não compensa'}
    else if(marketAvg>0 && margin>=N(s.mlMinMarginPct??5) && price<=marketAvg*1.12){cls='good';label='Compensa'}
    else if(marketAvg>0){cls='warn';label='Revisar'}
    return {x,p,cost,freight,other,fiscal,fee,feePct,type,minPrice,price,profit,margin,score,marketAvg,marketMin,similar:N(x.mlSimilarListings),cls,label};
  }

  function mlRank(limit){
    return (data.mercadoLivreItems||[]).map(mlCalc).filter(Boolean).sort((a,b)=>b.score-a.score||b.profit-a.profit).slice(0,limit);
  }

  function detailCard(r,i){
    return `<div class="lp-ml-rank-card ${r.cls}">
      <div class="lp-ml-rank-head">
        <div class="lp-ml-rank-name"><span class="lp-ml-rank-number">${i+1}</span><div><b>${E(r.p.name)}</b><small class="cell-sub">${E(r.p.code||'')} • estoque ${N(r.p.qty)} • ${E(r.type)}</small></div></div>
        <div><span class="badge ${r.cls==='good'?'ok':r.cls==='bad'?'danger':'warn'}">${E(r.label)}</span> <span class="soft-chip">${r.score}/100</span></div>
      </div>
      <div class="lp-ml-detail-grid">
        <div class="lp-ml-detail-box"><span>Custo do produto</span><b>${M(r.cost)}</b></div>
        <div class="lp-ml-detail-box"><span>Preço sugerido</span><b>${M(r.price)}</b></div>
        <div class="lp-ml-detail-box"><span>Lucro estimado</span><b>${M(r.profit)}</b></div>
        <div class="lp-ml-detail-box"><span>Margem</span><b>${r.margin.toFixed(1)}%</b></div>
        <div class="lp-ml-detail-box"><span>Taxa Mercado Livre</span><b>${M(r.fee)} • ${r.feePct.toFixed(1)}%</b></div>
        <div class="lp-ml-detail-box"><span>Reserva fiscal</span><b>${M(r.fiscal)} • 5%</b></div>
        <div class="lp-ml-detail-box"><span>Frete + outros</span><b>${M(r.freight+r.other)}</b></div>
        <div class="lp-ml-detail-box"><span>Preço mínimo</span><b>${M(r.minPrice)}</b></div>
        <div class="lp-ml-detail-box"><span>Menor concorrente</span><b>${r.marketMin?M(r.marketMin):'Não informado'}</b></div>
        <div class="lp-ml-detail-box"><span>Média concorrentes</span><b>${r.marketAvg?M(r.marketAvg):'Não informada'}</b></div>
        <div class="lp-ml-detail-box"><span>Anúncios similares</span><b>${r.similar||'Não informado'}</b></div>
        <div class="lp-ml-detail-box"><span>Tipo recomendado</span><b>${E(r.type)}</b></div>
      </div>
      <div class="lp-ml-rank-actions">
        <button class="btn ghost small" onclick="searchMLSimilar(${r.x.id})">Buscar anúncios</button>
        <button class="btn ghost small" onclick="mlV6CompetitorModal(${r.x.id})">Registrar preços</button>
        <button class="btn ghost small" onclick="mlV6Details(${r.x.id})">Detalhes completos</button>
        <button class="btn primary small" onclick="mlV6ApplyPrice(${r.x.id})">Aplicar preço</button>
      </div>
    </div>`;
  }

  function openRank(title,limit){
    const arr=mlRank(limit);
    showModal(`<h2>${title}</h2>
      <div class="notice">Ranking interno considerando custo, estoque, taxa estimada do Mercado Livre, reserva fiscal de 5%, frete/outros custos, margem e os preços de concorrentes que você registrar. Não representa garantia de venda.</div>
      <div class="lp-ml-rank-list">${arr.map(detailCard).join('')||'<div class="empty">Nenhum produto disponível para gerar o ranking.</div>'}</div>`);
    document.querySelector('#modal .modal-card')?.classList.add('lp-ml-wide');
  }

  /* Top 10 com as informações adicionais pedidas */
  window.mlV6Top10=function(){openRank('Top 10 para preparar anúncio',10)};

  /* Botão real dos 20 melhores */
  window.lpMLTop20=function(){openRank('20 melhores oportunidades do Mercado Livre',20)};

  /* Se o usuário já tinha o botão “Só os melhores”, ele vira o botão dos 20 melhores */
  const oldRenderML=window.renderMercadoLivre;
  window.renderMercadoLivre=function(){
    window.__lpMLVisibleCount=Math.max(20,N(window.__lpMLVisibleCount||20));
    const r=oldRenderML?.();
    const page=document.getElementById('mercadolivre');
    if(!page)return r;

    const oldBest=page.querySelector('[data-lp-best-ml]');
    if(oldBest){
      oldBest.textContent='20 melhores';
      oldBest.onclick=window.lpMLTop20;
    }

    /* Acrescenta explicação mais específica sem poluir os cartões */
    if(!page.querySelector('.lp-ml-specific-note')){
      const help=page.querySelector('.lp-ml-help');
      const note=document.createElement('div');
      note.className='notice lp-ml-specific-note';
      note.style.marginTop='12px';
      note.innerHTML='<b>Leitura dos valores:</b> custo = valor pago no produto; taxa ML = estimativa do anúncio; reserva fiscal = 5%; frete + outros = despesas adicionais; lucro = valor que sobra depois desses custos. Para comparar com o mercado, registre o menor preço e a média dos concorrentes.';
      if(help)help.insertAdjacentElement('afterend',note);
    }
    return r;
  };

  /* Remove classe de modal largo quando fechar */
  const oldClose=window.closeModal;
  window.closeModal=function(){
    document.querySelector('#modal .modal-card')?.classList.remove('lp-ml-wide');
    return oldClose?.();
  };

  function boot(){
    /* enquadramento */
    const main=document.querySelector('.main');
    if(main)main.style.marginLeft='0px';
    restoreSidebar();
    bindBell();
  }

  document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,120));
  setTimeout(boot,320);

  /* Atualiza o sininho quando telas são renderizadas */
  const oldRenderAll=window.renderAll;
  window.renderAll=function(){
    const r=oldRenderAll?.();
    setTimeout(bindBell,0);
    return r;
  };
})();
</script>

<script id="lp-modal-client-v18-js">
(function(){
  /* ===== 1) MODAL NÃO FECHA MAIS AO CLICAR FORA ===== */
  const modal=document.getElementById('modal');
  if(modal){
    /* remove o comportamento anterior de fechar ao clicar no backdrop */
    const clone=modal.cloneNode(true);
    modal.parentNode.replaceChild(clone,modal);
  }

  /* Reaponta show/close para o modal atual, mantendo X e botões */
  const getModal=()=>document.getElementById('modal');
  window.closeModal=function(){
    const m=getModal();
    if(!m)return;
    m.classList.remove('show');
    m.style.display='none';
    m.style.pointerEvents='none';
    document.body.style.overflow='';
  };

  const oldShow=window.showModal;
  window.showModal=function(content){
    const m=getModal();
    if(!m)return;
    const body=m.querySelector('#modalBody');
    if(body)body.innerHTML=content;
    m.style.display='flex';
    m.style.pointerEvents='auto';
    m.classList.add('show');
    document.body.style.overflow='hidden';

    /* garante X funcional */
    const x=m.querySelector('.modal-close-x');
    if(x)x.onclick=window.closeModal;

    /* clicar fora NÃO fecha */
    m.onclick=function(ev){
      if(ev.target===m){
        ev.preventDefault();
        ev.stopPropagation();
      }
    };
  };

  /* ESC também não fecha mais, conforme pedido */
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape' && getModal()?.classList.contains('show')){
      ev.preventDefault();
      ev.stopPropagation();
    }
  },true);

  /* ===== 2) CLIENTE LIVRE NA TELA DE SERVIÇO ===== */
  window.lpOSClientMode='existing';

  window.lpToggleOSClientMode=function(mode){
    window.lpOSClientMode=mode;
    const existing=document.getElementById('lp-os-existing');
    const free=document.getElementById('lp-os-free');
    const b1=document.getElementById('lp-os-mode-existing');
    const b2=document.getElementById('lp-os-mode-free');
    if(existing)existing.style.display=mode==='existing'?'grid':'none';
    if(free)free.style.display=mode==='free'?'grid':'none';
    b1?.classList.toggle('active',mode==='existing');
    b2?.classList.toggle('active',mode==='free');
    if(mode==='existing')window.osFillPhone?.();
  };

  const originalOsModal=window.osModal;
  window.osModal=function(){
    const today=new Date();
    today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
    const todayVal=today.toISOString().slice(0,10);

    showModal(`<h2>Novo serviço</h2>
      <div class="form">
        <label>Data do serviço<input id="osdate" type="date" value="${todayVal}"></label>
        <label>Previsão de entrega<input id="osdue" type="date"></label>

        <label class="full">Cliente
          <div class="lp-client-mode">
            <button type="button" id="lp-os-mode-existing" class="active" onclick="lpToggleOSClientMode('existing')">Cliente cadastrado</button>
            <button type="button" id="lp-os-mode-free" onclick="lpToggleOSClientMode('free')">Digitar nome</button>
          </div>
          <div id="lp-os-existing" class="lp-client-free-wrap">
            <select id="oscustomer" onchange="osFillPhone()">${typeof customerOptions==='function'?customerOptions():''}</select>
          </div>
          <div id="lp-os-free" class="lp-client-free-wrap" style="display:none">
            <input id="oscustomerfree" placeholder="Digite o nome do cliente">
          </div>
        </label>

        <label>Telefone / WhatsApp<input id="osphone" placeholder="(00) 00000-0000"></label>
        <label>Responsável<input id="osowner" value="Administrador"></label>

        <label class="full">Serviço<input id="osservice" placeholder="Descrição do serviço"></label>
        <label>Produto utilizado<select id="osproduct"><option value="">Nenhum</option>${typeof productOptions==='function'?productOptions():''}</select></label>
        <label>Quantidade<input id="osqty" type="number" min="0" value="0"></label>
        <label>Valor do serviço<input id="osservicevalue" type="number" step="0.01" value="0"></label>
        <label>Desconto<input id="osdiscount" type="number" step="0.01" value="0"></label>
        <label>Status<select id="osstatus"><option>Aberta</option><option>Aguardando</option><option>Em andamento</option><option>Concluída</option></select></label>
        <label class="full">Observações<textarea id="osnotes" rows="3"></textarea></label>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="lpSaveOSFlexibleClient()">Salvar serviço</button>
      </div>`);
    window.lpOSClientMode='existing';
    setTimeout(()=>window.osFillPhone?.(),0);
  };

  window.lpSaveOSFlexibleClient=function(){
    const freeMode=window.lpOSClientMode==='free';
    const typedName=String(document.getElementById('oscustomerfree')?.value||'').trim();
    const phone=String(document.getElementById('osphone')?.value||'').trim();

    if(freeMode && !typedName){
      alert('Digite o nome do cliente.');
      return;
    }

    /* se digitou nome livre, cria cliente automaticamente */
    if(freeMode){
      data.customers=Array.isArray(data.customers)?data.customers:[];
      let c=data.customers.find(x=>String(x.name||'').trim().toLowerCase()===typedName.toLowerCase() && String(x.phone||'').trim()===phone);
      if(!c){
        c={
          id:Date.now(),
          name:typedName,
          phone:phone,
          createdAt:new Date().toLocaleString('pt-BR')
        };
        data.customers.unshift(c);
      }
      let sel=document.getElementById('oscustomer');
      if(sel){
        const opt=document.createElement('option');
        opt.value=c.id;
        opt.textContent=c.name;
        opt.selected=true;
        sel.appendChild(opt);
      }else{
        const fake=document.createElement('select');
        fake.id='oscustomer';
        fake.style.display='none';
        const opt=document.createElement('option');
        opt.value=c.id;
        opt.selected=true;
        fake.appendChild(opt);
        document.getElementById('modalBody')?.appendChild(fake);
      }
    }

    if(typeof window.saveOS==='function'){
      window.saveOS();
    }
  };

})();
</script>


<script id="lp-catalog-firebase-v19-js">
(function(){
  const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};

  function fbUser(){
    try{
      if(typeof lpFirebaseUser!=='undefined' && lpFirebaseUser) return lpFirebaseUser;
    }catch(e){}
    return window.lpFirebaseUser||null;
  }
  function fbAuth(){
    try{
      if(typeof lpAuth!=='undefined' && lpAuth) return lpAuth;
    }catch(e){}
    return window.lpAuth||null;
  }
  function fbDb(){
    try{
      if(typeof lpDb!=='undefined' && lpDb) return lpDb;
    }catch(e){}
    return window.lpDb||null;
  }

  /* Mantém o estado Firebase espelhado no window para os botões novos */
  function syncFirebaseState(){
    try{
      if(typeof lpFirebaseUser!=='undefined') window.lpFirebaseUser=lpFirebaseUser||null;
      if(typeof lpAuth!=='undefined') window.lpAuth=lpAuth||null;
      if(typeof lpDb!=='undefined') window.lpDb=lpDb||null;
    }catch(e){}
  }
  syncFirebaseState();

  try{
    const a=fbAuth();
    if(a&&typeof a.onAuthStateChanged==='function'){
      a.onAuthStateChanged(user=>{
        try{ lpFirebaseUser=user||null; }catch(e){}
        window.lpFirebaseUser=user||null;
        syncFirebaseState();
        if(document.getElementById('catalogo')?.classList.contains('active'))renderCatalogo();
        if(document.getElementById('usuarios')?.classList.contains('active'))renderUsuarios();
      });
    }
  }catch(e){console.warn('Firebase state bridge:',e)}

  function isTire(p){
    const s=(String(p?.category||'')+' '+String(p?.name||'')+' '+String(p?.location||'')).toLowerCase();
    if(N(p?.qty)<=0)return false;
    if(s.includes('acess')||s.includes('peça')||s.includes('peca')||s.includes('câmara')||s.includes('camara')||s.includes('roda')||s.includes('material'))return false;
    return s.includes('pneu')||s.includes('moto')||s.includes('carro')||s.includes('r13')||s.includes('r14')||s.includes('r15')||s.includes('r16')||s.includes('r17')||s.includes('r18')||s.includes('r19')||s.includes('r20');
  }

  /* Preserva a foto existente no Firebase; se não houver, reutiliza uma da mesma marca; senão usa a imagem de marca */
  async function resolveImageStrict(p,existing={}){
    const existingImage=String(existing?.image||'').trim();
    if(existingImage)return existingImage;

    const brand=String(p?.brand||existing?.brand||'').trim();
    const db=fbDb();

    if(brand&&db){
      try{
        const snap=await db.collection('produtos').where('brand','==',brand).limit(30).get();
        for(const doc of snap.docs){
          const img=String(doc.data()?.image||'').trim();
          if(img)return img;
        }
      }catch(e){console.warn('Imagem por marca:',e)}
    }

    try{
      if(typeof lpBrandFallbackImage==='function') return lpBrandFallbackImage(brand||'Le Pneus');
    }catch(e){}
    try{
      if(typeof window.lpResolveCatalogImage==='function'){
        return await window.lpResolveCatalogImage(p,existing);
      }
    }catch(e){}
    return '';
  }

  /* Reforça publicação unitária com a regra de foto solicitada */
  const oldPublish=window.publishProductToFirebase;
  window.publishProductToFirebase=async function(productId,silent=false){
    syncFirebaseState();
    const user=fbUser();
    if(!user){
      if(!silent&&typeof firebaseLoginModal==='function')firebaseLoginModal();
      return {ok:false,reason:'auth'};
    }
    const p=(data.products||[]).find(x=>String(x.id)===String(productId));
    if(!p)return {ok:false,reason:'missing'};

    try{
      const db=fbDb();
      if(!db)throw new Error('Firestore indisponível');

      let found=null;
      if(typeof findFirebaseCatalogDoc==='function'){
        found=await findFirebaseCatalogDoc(p);
      }
      const existing=found?found.data():{};

      if(N(p.qty)<=0){
        if(found){
          await db.collection('produtos').doc(found.id).set({
            stock:0,
            updatedAt:firebase.firestore.FieldValue.serverTimestamp()
          },{merge:true});
        }
        data.catalogItems=(data.catalogItems||[]).filter(x=>String(x.productId)!==String(p.id));
        save();
        return {ok:true,outOfStock:true,docId:found?.id||''};
      }

      const image=await resolveImageStrict(p,existing);

      let payload;
      if(typeof productToFirebaseCatalog==='function'){
        payload=productToFirebaseCatalog(p,{...existing,image});
      }else{
        payload={
          categoria:p.category||'Pneu',
          brand:p.brand||'',
          model:p.name||'',
          size:p.size||'',
          aro:p.aro||'',
          load:p.load||'',
          app:p.app||'',
          price:N(p.price),
          stock:N(p.qty),
          promo:!!p.promo,
          image,
          code:p.code||'',
          controlId:String(p.id),
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        };
      }

      let docId;
      if(found){
        docId=found.id;
        await db.collection('produtos').doc(docId).set(payload,{merge:true});
      }else{
        const ref=await db.collection('produtos').add(payload);
        docId=ref.id;
      }

      let local=(data.catalogItems||[]).find(x=>String(x.productId)===String(p.id));
      const vals={
        code:p.code,name:p.name,brand:p.brand,category:p.category,
        qty:N(p.qty),price:N(p.price),status:'Publicado',
        firebaseId:docId,image,updatedAt:new Date().toLocaleString('pt-BR')
      };
      if(local)Object.assign(local,vals);
      else{
        data.catalogItems=data.catalogItems||[];
        data.catalogItems.unshift({
          id:Date.now()+Math.random(),productId:p.id,...vals,
          importedAt:new Date().toLocaleString('pt-BR')
        });
      }
      save();
      if(!silent)alert('Produto sincronizado com o catálogo.');
      return {ok:true,docId};
    }catch(e){
      console.error('Publicação Firebase:',e);
      if(!silent)alert('Não foi possível atualizar o catálogo.');
      return {ok:false,error:e};
    }
  };

  /* Envia TODOS os pneus elegíveis, mesmo que ainda não estejam em catalogItems */
  window.lpSendAllCloud=async function(){
    syncFirebaseState();
    if(!fbUser()){
      alert('O Firebase ainda não reconheceu a sessão. Abra Usuários e conecte novamente.');
      return;
    }

    const tires=(data.products||[]).filter(isTire);
    if(!tires.length){
      alert('Nenhum pneu com estoque disponível para enviar.');
      return;
    }

    if(!confirm(`Enviar/atualizar ${tires.length} pneu(s) no catálogo público?`))return;

    let ok=0,err=0,created=0,updated=0,withPhoto=0;
    const start=Date.now();

    for(const p of tires){
      try{
        const existed=(data.catalogItems||[]).some(x=>String(x.productId)===String(p.id));
        const r=await window.publishProductToFirebase(p.id,true);
        if(r?.ok){
          ok++;
          existed?updated++:created++;
          const local=(data.catalogItems||[]).find(x=>String(x.productId)===String(p.id));
          if(String(local?.image||'').trim())withPhoto++;
        }else err++;
      }catch(e){
        console.error('Sync all:',p?.code,p?.name,e);
        err++;
      }
    }

    save();
    renderCatalogo();

    const secs=((Date.now()-start)/1000).toFixed(1);
    alert(`Sincronização concluída.\n\nPneus processados: ${tires.length}\nSucesso: ${ok}\nNovos no catálogo: ${created}\nAtualizados: ${updated}\nCom imagem: ${withPhoto}\nErros: ${err}\nTempo: ${secs}s`);
  };

  /* Botão equivalente para catálogo local + nuvem */
  window.lpSendAllTiresToCatalog=async function(){
    syncFirebaseState();
    const tires=(data.products||[]).filter(isTire);
    if(!tires.length)return alert('Nenhum pneu com estoque disponível.');

    data.catalogItems=data.catalogItems||[];
    for(const p of tires){
      let item=data.catalogItems.find(x=>String(x.productId)===String(p.id));
      const vals={
        code:p.code,name:p.name,brand:p.brand,category:p.category,
        qty:N(p.qty),price:N(p.price),updatedAt:new Date().toLocaleString('pt-BR')
      };
      if(item)Object.assign(item,vals);
      else data.catalogItems.unshift({
        id:Date.now()+Math.random(),productId:p.id,status:'Pronto para publicar',
        importedAt:new Date().toLocaleString('pt-BR'),...vals
      });
    }
    save();

    if(fbUser()){
      await window.lpSendAllCloud();
    }else{
      renderCatalogo();
      alert(`Todos os ${tires.length} pneu(s) foram preparados no catálogo local. Para publicar no site, conecte o Firebase em Usuários.`);
    }
  };

  /* Corrige os indicadores de conexão no Catálogo e Usuários */
  const oldRenderCatalog=window.renderCatalogo;
  window.renderCatalogo=function(){
    syncFirebaseState();
    const r=oldRenderCatalog?.();
    const page=document.getElementById('catalogo');
    if(page){
      page.querySelectorAll('*').forEach(()=>{});
      const statusText=fbUser()?'Conectado':'Desconectado';
      const badges=[...page.querySelectorAll('.badge')];
      badges.forEach(b=>{
        if(/firebase/i.test(b.textContent||'')){
          b.textContent='Firebase '+statusText;
          b.className='badge '+(fbUser()?'ok':'warn');
        }
      });
    }
    return r;
  };

  const oldRenderUsers=window.renderUsuarios;
  window.renderUsuarios=function(){
    syncFirebaseState();
    return oldRenderUsers?.();
  };

  setTimeout(syncFirebaseState,100);
  setTimeout(syncFirebaseState,500);
})();
</script>

<script id="lp-users-v20-js">
(function(){
  const E=v=>typeof esc==='function'?esc(v):String(v??'');

  function fbAuthSafe(){
    try{ if(typeof lpAuth!=='undefined'&&lpAuth)return lpAuth; }catch(e){}
    return window.lpAuth||null;
  }
  function fbUserSafe(){
    try{ if(typeof lpFirebaseUser!=='undefined'&&lpFirebaseUser)return lpFirebaseUser; }catch(e){}
    return window.lpFirebaseUser||fbAuthSafe()?.currentUser||null;
  }
  function fbDbSafe(){
    try{ if(typeof lpDb!=='undefined'&&lpDb)return lpDb; }catch(e){}
    return window.lpDb||null;
  }

  window.lpFirebaseConnectionTest=async function(){
    const user=fbUserSafe();
    if(!user)return alert('Firebase desconectado. Entre com a conta do Firebase primeiro.');
    try{
      const db=fbDbSafe();
      if(!db)throw new Error('Firestore não disponível');
      await db.collection('produtos').limit(1).get();
      alert('Conexão Firebase OK.\n\nAutenticação: OK\nFirestore: OK\nCatálogo: acessível');
    }catch(e){
      console.error('Teste Firebase:',e);
      alert('A autenticação está ativa, mas o Firestore não respondeu corretamente. Confira as regras e a conexão.');
    }
  };

  window.lpFirebaseAdminLogin=function(){
    if(typeof firebaseLoginModal==='function')return firebaseLoginModal();
    alert('A tela de login do Firebase ainda não carregou.');
  };

  window.lpFirebaseAdminLogout=async function(){
    try{
      const auth=fbAuthSafe();
      if(auth)await auth.signOut();
      try{lpFirebaseUser=null}catch(e){}
      window.lpFirebaseUser=null;
      alert('Firebase desconectado.');
    }catch(e){
      console.error(e);
      alert('Não foi possível desconectar o Firebase.');
    }
    if(document.getElementById('usuarios')?.classList.contains('active'))renderUsuarios();
    if(document.getElementById('catalogo')?.classList.contains('active'))renderCatalogo();
  };

  /* Tela final única de usuários, evitando os vários layouts antigos sobrepostos */
  window.renderUsuarios=function(){
    try{ensureData();enhanceData()}catch(e){}
    data.users=Array.isArray(data.users)?data.users:[];
    if(!data.users.length){
      data.users.push({id:1,name:'Administrador',username:'admin',role:'ADMINISTRADOR',active:true});
      try{save()}catch(e){}
    }

    const user=fbUserSafe();
    window.lpFirebaseUser=user||null;

    const rows=data.users.map(u=>`
      <tr>
        <td><b>${E(u.name||'Usuário')}</b></td>

        </td>
      </tr>`).join('');

    const email=user?.email||'—';
    const uid=user?.uid?String(user.uid).slice(0,10)+'…':'—';

    document.getElementById('usuarios').innerHTML=
      heading('Usuários e Permissões','Perfis internos do Controle e conexão do catálogo com o Firebase',
        `<button class="btn primary" onclick="userModal()">+ Novo perfil</button>`)+
      `<div class="lp-users-layout">
        <div class="lp-users-card">
          <div class="lp-user-head">
            <div><h3>Perfis do Controle</h3><small>Organizam nome, função e permissões internas.</small></div>
            <span class="soft-chip">${data.users.length} perfil(is)</span>
          </div>
          <div class="notice"><b>Importante:</b> esses perfis são internos do Controle. O login que libera a sincronização do Catálogo é o Firebase, mostrado ao lado.</div>
          <div class="table-wrap" style="box-shadow:none;margin-top:12px">
            <table>
              <thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="lp-permission-note">
            <b>Perfis:</b> Administrador = acesso completo; Gerente = operação e relatórios;
            Financeiro = caixa/financeiro; Vendedor = vendas/clientes; Estoque = produtos/compras.
          </div>
        </div>

        <div class="lp-firebase-admin-card">
          <div class="lp-fb-head">
            <div><h3>Firebase • Catálogo LePneus</h3><small>Conta usada somente para sincronizar o site público.</small></div>
            ${user?'<span class="badge ok">Conectado</span>':'<span class="badge warn">Desconectado</span>'}
          </div>

          <div class="lp-fb-account">
            <div><span>Status</span><b>${user?'Autenticado':'Sem sessão'}</b></div>
            <div><span>E-mail</span><b>${E(email)}</b></div>
            <div><span>ID da sessão</span><b>${E(uid)}</b></div>
            <div><span>Coleção</span><b>produtos</b></div>
          </div>

          <div class="actions" style="margin-top:12px">
            ${user
              ?`<button class="btn ghost" onclick="lpFirebaseConnectionTest()">Testar conexão</button>
                <button class="btn ghost" onclick="lpFirebaseAdminLogout()">Desconectar</button>`
              :`<button class="btn primary" onclick="lpFirebaseAdminLogin()">Entrar no Firebase</button>`}
          </div>

          <div class="notice" style="margin-top:12px">
            A senha é validada pelo Firebase e <b>não fica salva no HTML</b>.
            Quando estiver conectado, o Catálogo deve reconhecer a mesma sessão para o envio em massa.
          </div>
        </div>
      </div>`;
  };

  /* Mantém a tela atualizada quando a sessão muda */
  try{
    const auth=fbAuthSafe();
    if(auth&&typeof auth.onAuthStateChanged==='function'){
      auth.onAuthStateChanged(user=>{
        try{lpFirebaseUser=user||null}catch(e){}
        window.lpFirebaseUser=user||null;
        if(document.getElementById('usuarios')?.classList.contains('active'))renderUsuarios();
        if(document.getElementById('catalogo')?.classList.contains('active'))renderCatalogo();
      });
    }
  }catch(e){console.warn('Auth users:',e)}
})();
</script>

<script id="lp-modal-scroll-v21-js">
(function(){
  const getModal=()=>document.getElementById('modal');

  function ensureCloseButton(){
    const m=getModal();
    if(!m)return;
    const body=m.querySelector('#modalBody');
    if(!body)return;

    let x=body.querySelector(':scope > .modal-close-x');
    if(!x){
      x=document.createElement('button');
      x.type='button';
      x.className='modal-close-x';
      x.setAttribute('aria-label','Fechar');
      x.setAttribute('title','Fechar');
      x.textContent='×';
      body.prepend(x);
    }
    x.onclick=function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      window.closeModal();
    };
  }

  /* Última definição de showModal: sempre injeta o X. */
  window.showModal=function(content){
    const m=getModal();
    if(!m)return;
    const body=m.querySelector('#modalBody');
    if(!body)return;

    body.innerHTML=content;
    ensureCloseButton();

    m.style.display='flex';
    m.style.pointerEvents='auto';
    m.classList.add('show');
    document.body.style.overflow='hidden';

    const card=m.querySelector('.modal-card');
    if(card){
      card.scrollTop=0;
      card.focus?.({preventScroll:true});
    }

    /* Clicar fora não fecha. */
    m.onclick=function(ev){
      if(ev.target===m){
        ev.preventDefault();
        ev.stopPropagation();
      }
    };
  };

  window.closeModal=function(){
    const m=getModal();
    if(!m)return;
    m.classList.remove('show');
    m.style.display='none';
    m.style.pointerEvents='none';
    document.body.style.overflow='';
    const card=m.querySelector('.modal-card');
    card?.classList.remove('lp-ml-wide');
    if(card)card.scrollTop=0;
  };

  /* Garante rolagem com roda do mouse mesmo sobre elementos internos do modal. */
  function bindModalWheel(){
    const m=getModal();
    if(!m || m.dataset.lpWheelBound==='1')return;
    m.dataset.lpWheelBound='1';

    m.addEventListener('wheel',function(ev){
      if(!m.classList.contains('show'))return;
      const card=m.querySelector('.modal-card');
      if(!card)return;

      /* Se estiver sobre textarea/select ou um elemento realmente rolável, deixe o navegador cuidar. */
      const target=ev.target;
      const inner=target?.closest?.('textarea,select,.lp-inner-scroll');
      if(inner)return;

      const max=card.scrollHeight-card.clientHeight;
      if(max<=0)return;

      const next=Math.max(0,Math.min(max,card.scrollTop+ev.deltaY));
      if(next!==card.scrollTop){
        card.scrollTop=next;
        ev.preventDefault();
      }
    },{passive:false,capture:true});
  }

  /* Bloqueia ESC como solicitado anteriormente. */
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape' && getModal()?.classList.contains('show')){
      ev.preventDefault();
      ev.stopImmediatePropagation();
    }
  },true);

  function boot(){
    ensureCloseButton();
    bindModalWheel();
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,50));
  }else{
    setTimeout(boot,50);
  }
})();
</script>

<script id="lp-catalog-dedupe-v22-js">
(function(){
  const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};

  function dbSafe(){
    try{if(typeof lpDb!=='undefined'&&lpDb)return lpDb}catch(e){}
    return window.lpDb||null;
  }
  function userSafe(){
    try{if(typeof lpFirebaseUser!=='undefined'&&lpFirebaseUser)return lpFirebaseUser}catch(e){}
    return window.lpFirebaseUser||window.lpAuth?.currentUser||null;
  }
  function norm(v){
    return String(v??'')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim().replace(/\s+/g,' ');
  }
  function normCode(v){
    let s=String(v??'').trim().toUpperCase();
    s=s.replace(/\.0+$/,'').replace(/\s+/g,'');
    return s;
  }
  function productKey(p){
    const code=normCode(p?.code);
    if(code)return 'C:'+code;
    const brand=norm(p?.brand);
    const model=norm(p?.name||p?.model);
    const size=norm(p?.size);
    const aro=norm(p?.aro);
    return 'P:'+brand+'|'+model+'|'+size+'|'+aro;
  }
  function docKey(d){
    const code=normCode(d?.code);
    if(code)return 'C:'+code;
    return 'P:'+norm(d?.brand)+'|'+norm(d?.model||d?.name)+'|'+norm(d?.size)+'|'+norm(d?.aro);
  }
  function brandKey(v){
    return norm(v).split(' ')[0]||'LE PNEUS';
  }
  function isCatalogTire(p){
    const s=norm((p?.category||'')+' '+(p?.name||'')+' '+(p?.location||''));
    if(N(p?.qty)<=0)return false;
    if(/ACESS|PECA|CAMARA|RODA|MATERIAL/.test(s))return false;
    return /PNEU|MOTO|CARRO|R13|R14|R15|R16|R17|R18|R19|R20|R21|R22/.test(s);
  }

  function brandFallback(brand){
    const b=brandKey(brand).toLowerCase();
    const domains={
      pirelli:'pirelli.com',michelin:'michelin.com',bridgestone:'bridgestone.com',
      continental:'continental-tires.com',goodyear:'goodyear.com',dunlop:'dunloptires.com',
      hankook:'hankooktire.com',yokohama:'yokohamatire.com',kumho:'kumhotire.com',
      maxxis:'maxxis.com',firestone:'firestone.com',nexen:'nexentire.com',
      metzeler:'metzeler.com',borilli:'borilli.com.br',maggion:'maggion.com.br',
      levorin:'levorin.com.br',delinte:'delintetires.com',linglong:'linglongtire.com',
      westlake:'westlaketire.com',goodride:'goodridetire.com'
    };
    if(domains[b])return `https://logo.clearbit.com/${domains[b]}?size=512`;
    const safe=String(brand||'Le Pneus').replace(/[&<>"']/g,'').slice(0,32);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" rx="40" fill="#101827"/><circle cx="450" cy="230" r="120" fill="#ffffff" opacity=".07"/><text x="450" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="68" font-weight="700" fill="#ffffff">${safe}</text><text x="450" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#cbd5e1">IMAGEM DA MARCA</text></svg>`;
    return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
  }

  async function cloudSnapshot(){
    const db=dbSafe();
    if(!db)throw new Error('Firestore indisponível');
    const snap=await db.collection('produtos').get();
    return snap.docs.map(doc=>({id:doc.id,data:doc.data()}));
  }

  function groupCloud(docs){
    const groups=new Map();
    docs.forEach(x=>{
      const key=docKey(x.data);
      if(!key)return;
      if(!groups.has(key))groups.set(key,[]);
      groups.get(key).push(x);
    });
    return groups;
  }

  function buildBrandImages(docs){
    const map=new Map();
    docs.forEach(x=>{
      const img=String(x.data?.image||'').trim();
      const brand=brandKey(x.data?.brand);
      if(img&&brand&&!map.has(brand))map.set(brand,img);
    });
    (data.catalogItems||[]).forEach(x=>{
      const img=String(x.image||'').trim();
      const brand=brandKey(x.brand);
      if(img&&brand&&!map.has(brand))map.set(brand,img);
    });
    return map;
  }

  function choosePrimary(group,p){
    let best=group[0],scoreBest=-1;
    group.forEach(x=>{
      const d=x.data||{};
      let score=0;
      if(String(d.controlId||'')===String(p?.id||''))score+=100;
      if(normCode(d.code)&&normCode(d.code)===normCode(p?.code))score+=50;
      if(String(d.image||'').trim())score+=25;
      if(N(d.stock)>0)score+=5;
      if(score>scoreBest){scoreBest=score;best=x}
    });
    return best;
  }

  async function imageFor(p,group,brandImages){
    /* 1. Qualquer foto já existente deste mesmo produto tem prioridade. */
    for(const x of group||[]){
      const img=String(x.data?.image||'').trim();
      if(img)return img;
    }

    /* 2. Foto local já vinculada ao produto. */
    const local=(data.catalogItems||[]).find(x=>
      String(x.productId)===String(p.id) || normCode(x.code)===normCode(p.code)
    );
    if(String(local?.image||'').trim())return local.image;

    /* 3. Foto de outro pneu da mesma marca. */
    const bk=brandKey(p.brand);
    if(brandImages.has(bk))return brandImages.get(bk);

    /* 4. Resolver antigo, se disponível. */
    try{
      if(typeof window.lpResolveCatalogImage==='function'){
        const img=await window.lpResolveCatalogImage(p,{});
        if(String(img||'').trim())return img;
      }
    }catch(e){console.warn(e)}

    /* 5. Fallback garantido da marca. */
    return brandFallback(p.brand||'Le Pneus');
  }

  function payloadFor(p,existing,image){
    let payload=null;
    try{
      if(typeof productToFirebaseCatalog==='function'){
        payload=productToFirebaseCatalog(p,{...(existing||{}),image});
      }
    }catch(e){}
    if(!payload){
      payload={
        categoria:p.category||'Pneu',
        brand:p.brand||'',
        model:p.name||'',
        size:p.size||'',
        aro:p.aro||'',
        load:p.load||'',
        app:p.app||'',
        price:N(p.price),
        stock:N(p.qty),
        promo:!!p.promo,
        image,
        code:String(p.code||''),
        controlId:String(p.id)
      };
    }
    payload.image=image;
    payload.code=String(p.code||'');
    payload.controlId=String(p.id);
    payload.stock=N(p.qty);
    payload.price=N(p.price);
    payload.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
    return payload;
  }

  function dedupeLocal(){
    data.catalogItems=Array.isArray(data.catalogItems)?data.catalogItems:[];
    const map=new Map(),clean=[];
    for(const x of data.catalogItems){
      const p=(data.products||[]).find(p=>String(p.id)===String(x.productId));
      const key=p?productKey(p):(normCode(x.code)?'C:'+normCode(x.code):'P:'+norm(x.brand)+'|'+norm(x.name));
      if(!key){clean.push(x);continue}
      if(!map.has(key)){
        map.set(key,x);clean.push(x);continue;
      }
      const keep=map.get(key);
      /* Mescla a melhor foto/ID do Firebase antes de descartar o clone local. */
      if(!String(keep.image||'').trim()&&String(x.image||'').trim())keep.image=x.image;
      if(!keep.firebaseId&&x.firebaseId)keep.firebaseId=x.firebaseId;
      if(N(x.qty)>N(keep.qty))keep.qty=N(x.qty);
    }
    const removed=data.catalogItems.length-clean.length;
    data.catalogItems=clean;
    return removed;
  }

  async function repairCore({syncProducts=true,deleteDuplicates=true}={}){
    if(!userSafe())throw new Error('Firebase desconectado');
    const db=dbSafe();
    const docs=await cloudSnapshot();
    const groups=groupCloud(docs);
    const brandImages=buildBrandImages(docs);
    const tires=(data.products||[]).filter(isCatalogTire);

    let duplicatesRemoved=0,photosFilled=0,updated=0,created=0,errors=0;
    const liveIds=new Set();

    for(const p of tires){
      try{
        const key=productKey(p);
        const group=groups.get(key)||[];
        const primary=group.length?choosePrimary(group,p):null;
        const image=await imageFor(p,group,brandImages);

        if(image && !(group||[]).some(x=>String(x.data?.image||'').trim()))photosFilled++;

        let docId;
        if(primary){
          docId=primary.id;
          if(syncProducts){
            const payload=payloadFor(p,primary.data,image);
            await db.collection('produtos').doc(docId).set(payload,{merge:true});
            updated++;
          }
        }else{
          const payload=payloadFor(p,{},image);
          const ref=await db.collection('produtos').add(payload);
          docId=ref.id;created++;
          groups.set(key,[{id:docId,data:payload}]);
        }
        liveIds.add(docId);

        /* Remove clones deste mesmo produto no Firestore. */
        if(deleteDuplicates && group.length>1){
          for(const x of group){
            if(x.id===docId)continue;
            await db.collection('produtos').doc(x.id).delete();
            duplicatesRemoved++;
          }
        }

        let local=(data.catalogItems||[]).find(x=>
          String(x.productId)===String(p.id) || normCode(x.code)===normCode(p.code)
        );
        const vals={
          productId:p.id,code:p.code,name:p.name,brand:p.brand,category:p.category,
          qty:N(p.qty),price:N(p.price),image,firebaseId:docId,status:'Publicado',
          updatedAt:new Date().toLocaleString('pt-BR')
        };
        if(local)Object.assign(local,vals);
        else{
          data.catalogItems=data.catalogItems||[];
          data.catalogItems.unshift({id:Date.now()+Math.random(),importedAt:new Date().toLocaleString('pt-BR'),...vals});
        }
      }catch(e){
        console.error('Reparo catálogo:',p?.code,p?.name,e);
        errors++;
      }
    }

    /* Remove clones na nuvem mesmo em grupos que não estejam mais no estoque atual,
       desde que a chave seja realmente igual (código ou identificação estrita). */
    if(deleteDuplicates){
      for(const [key,group] of groups){
        if(group.length<=1)continue;
        const localP=tires.find(p=>productKey(p)===key);
        if(localP)continue; /* já tratado acima */
        const primary=group.find(x=>String(x.data?.image||'').trim())||group[0];
        for(const x of group){
          if(x.id===primary.id)continue;
          try{
            /* preserva foto no primário antes de remover */
            if(!String(primary.data?.image||'').trim()&&String(x.data?.image||'').trim()){
              await db.collection('produtos').doc(primary.id).set({image:x.data.image},{merge:true});
              primary.data.image=x.data.image;
            }
            await db.collection('produtos').doc(x.id).delete();
            duplicatesRemoved++;
          }catch(e){errors++}
        }
      }
    }

    const localDuplicatesRemoved=dedupeLocal();
    save();

    return {
      scanned:docs.length,
      products:tires.length,
      updated,created,
      duplicatesRemoved,
      localDuplicatesRemoved,
      photosFilled,
      errors
    };
  }

  window.lpRepairCatalogNow=async function(){
    if(!userSafe()){
      alert('Conecte o Firebase em Usuários antes de reparar o catálogo.');
      return;
    }
    if(!confirm('Reparar o catálogo agora?\n\nO sistema vai identificar produtos duplicados pelo código, manter apenas um registro por pneu, preservar fotos existentes e preencher fotos que estiverem faltando pela marca.'))return;

    try{
      const r=await repairCore({syncProducts:true,deleteDuplicates:true});
      renderCatalogo();
      alert(
        `Catálogo reparado.\n\n`+
        `Pneus processados: ${r.products}\n`+
        `Atualizados: ${r.updated}\n`+
        `Novos: ${r.created}\n`+
        `Duplicados removidos do Firebase: ${r.duplicatesRemoved}\n`+
        `Duplicados removidos do Controle: ${r.localDuplicatesRemoved}\n`+
        `Fotos preenchidas: ${r.photosFilled}\n`+
        `Erros: ${r.errors}`
      );
    }catch(e){
      console.error(e);
      alert('Não foi possível reparar o catálogo. Confira a conexão Firebase.');
    }
  };

  /* Enviar todos agora também faz deduplicação antes/durante a sincronização. */
  window.lpSendAllCloud=async function(){
    if(!userSafe()){
      alert('O Firebase ainda não reconheceu a sessão. Abra Usuários e conecte novamente.');
      return;
    }
    const tires=(data.products||[]).filter(isCatalogTire);
    if(!tires.length)return alert('Nenhum pneu com estoque disponível.');
    if(!confirm(`Enviar/atualizar ${tires.length} pneu(s)?\n\nAntes de concluir, o sistema também vai eliminar clones encontrados e corrigir fotos ausentes.`))return;

    try{
      const r=await repairCore({syncProducts:true,deleteDuplicates:true});
      renderCatalogo();
      alert(
        `Sincronização concluída.\n\n`+
        `Pneus: ${r.products}\nAtualizados: ${r.updated}\nNovos: ${r.created}\n`+
        `Clones removidos: ${r.duplicatesRemoved+r.localDuplicatesRemoved}\n`+
        `Fotos corrigidas: ${r.photosFilled}\nErros: ${r.errors}`
      );
    }catch(e){
      console.error(e);
      alert('Falha na sincronização. Confira Firebase e tente novamente.');
    }
  };

  /* Publicação unitária também procura por código normalizado antes de criar novo doc. */
  window.publishProductToFirebase=async function(productId,silent=false){
    if(!userSafe()){
      if(!silent&&typeof firebaseLoginModal==='function')firebaseLoginModal();
      return {ok:false,reason:'auth'};
    }
    const p=(data.products||[]).find(x=>String(x.id)===String(productId));
    if(!p)return {ok:false,reason:'missing'};
    if(N(p.qty)<=0)return {ok:false,reason:'stock'};

    try{
      const db=dbSafe();
      const docs=await cloudSnapshot();
      const key=productKey(p);
      const group=docs.filter(x=>docKey(x.data)===key);
      const brandImages=buildBrandImages(docs);
      const primary=group.length?choosePrimary(group,p):null;
      const image=await imageFor(p,group,brandImages);
      const payload=payloadFor(p,primary?.data||{},image);
      let docId;

      if(primary){
        docId=primary.id;
        await db.collection('produtos').doc(docId).set(payload,{merge:true});
      }else{
        const ref=await db.collection('produtos').add(payload);
        docId=ref.id;
      }

      /* Se já havia clones, limpa no mesmo clique. */
      for(const x of group){
        if(x.id!==docId)await db.collection('produtos').doc(x.id).delete();
      }

      dedupeLocal();
      let local=(data.catalogItems||[]).find(x=>
        String(x.productId)===String(p.id)||normCode(x.code)===normCode(p.code)
      );
      const vals={productId:p.id,code:p.code,name:p.name,brand:p.brand,category:p.category,qty:N(p.qty),price:N(p.price),image,firebaseId:docId,status:'Publicado',updatedAt:new Date().toLocaleString('pt-BR')};
      if(local)Object.assign(local,vals);
      else{
        data.catalogItems=data.catalogItems||[];
        data.catalogItems.unshift({id:Date.now()+Math.random(),importedAt:new Date().toLocaleString('pt-BR'),...vals});
      }
      save();
      if(!silent)alert('Produto sincronizado sem criar duplicado.');
      return {ok:true,docId,image};
    }catch(e){
      console.error('Sync unitário:',e);
      if(!silent)alert('Não foi possível sincronizar este produto.');
      return {ok:false,error:e};
    }
  };

  /* Injeta botão de reparo na tela final do Catálogo */
  const prevRenderCatalogV22=window.renderCatalogo;
  window.renderCatalogo=function(){
    const r=prevRenderCatalogV22?.();
    const page=document.getElementById('catalogo');
    if(!page)return r;

    const actions=page.querySelector('.heading .actions');
    if(actions&&!page.querySelector('[data-lp-repair-catalog]')){
      const b=document.createElement('button');
      b.className='btn ghost';
      b.dataset.lpRepairCatalog='1';
      b.textContent='Reparar catálogo';
      b.onclick=window.lpRepairCatalogNow;
      actions.prepend(b);
    }

    if(!page.querySelector('.lp-cat-repair-box')){
      const cards=page.querySelector('.cards');
      const box=document.createElement('div');
      box.className='lp-cat-repair-box';
      box.innerHTML='<b>Proteção contra duplicados e fotos ausentes</b><div class="cell-sub" style="margin-top:4px">O envio identifica o pneu principalmente pelo código. Se já existir no Firebase, ele é atualizado em vez de criar outro. Fotos existentes são preservadas; produtos sem foto tentam usar uma imagem já cadastrada da mesma marca.</div>';
      if(cards)cards.insertAdjacentElement('afterend',box);
    }
    return r;
  };
})();
</script>


<style id="lp-catalog-missing-v23-css">
.lp-missing-list{
  display:grid;gap:10px;margin-top:12px
}
.lp-missing-item{
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  padding:12px;border:1px solid #e2e8f0;border-radius:12px;background:#fff
}
.lp-missing-item b{display:block;color:#172033}
.lp-missing-item small{display:block;margin-top:3px;color:#64748b}
