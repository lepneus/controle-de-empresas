  if(!p) return {ok:false,reason:'missing'};
  try{
    const found=await findFirebaseCatalogDoc(p);
    const existing=found?found.data():{};
    const payload=productToFirebaseCatalog(p,existing);
    let docId;
    if(found){
      docId=found.id;
      await lpDb.collection('produtos').doc(docId).set(payload,{merge:true});
    }else{
      const ref=await lpDb.collection('produtos').add(payload);
      docId=ref.id;
    }
    let local=data.catalogItems.find(x=>String(x.productId)===String(p.id));
    if(local){
      Object.assign(local,{code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price,status:'Publicado',firebaseId:docId,updatedAt:new Date().toLocaleString('pt-BR')});
    }else{
      data.catalogItems.unshift({id:Date.now()+Math.random(),productId:p.id,code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price,status:'Publicado',firebaseId:docId,importedAt:new Date().toLocaleString('pt-BR')});
    }
    save();
    if(!silent) alert('Produto sincronizado com o catálogo pelo Firebase.');
    return {ok:true,docId};
  }catch(e){
    console.error('Publicação Firebase:',e);
    if(!silent) alert('Não foi possível atualizar o catálogo. Confira login e regras do Firestore.');
    return {ok:false,error:e};
  }
}

async function syncAllCatalogToFirebase(){
  if(!lpFirebaseUser) return firebaseLoginModal();
  if(!data.catalogItems.length) return alert('Não há produtos selecionados na aba Catálogo.');
  if(!confirm(`Sincronizar ${data.catalogItems.length} produto(s) selecionado(s) com o Firebase?`)) return;
  let ok=0,err=0;
  for(const item of [...data.catalogItems]){
    const r=await publishProductToFirebase(item.productId,true);
    r.ok?ok++:err++;
  }
  save(); renderCatalogo();
  alert(`Sincronização concluída.\nAtualizados: ${ok}\nErros: ${err}`);
}

async function pullFirebaseCatalog(){
  if(!lpFirebaseUser) return firebaseLoginModal();
  try{
    const snap=await lpDb.collection('produtos').get();
    const cloud=snap.docs.map(d=>({firebaseId:d.id,...d.data()}));
    let linked=0;
    cloud.forEach(c=>{
      let p=data.products.find(p=>String(p.id)===String(c.controlId||''));
      if(!p && c.code) p=data.products.find(p=>String(p.code||'')===String(c.code));
      if(!p) return;
      let x=data.catalogItems.find(x=>String(x.productId)===String(p.id));
      const val={code:p.code,name:p.name,brand:p.brand,category:p.category,qty:Number(c.stock??p.qty??0),price:Number(c.price??p.price??0),status:'Publicado',firebaseId:c.firebaseId};
      if(x) Object.assign(x,val);
      else data.catalogItems.unshift({id:Date.now()+Math.random(),productId:p.id,...val});
      linked++;
    });
    save();renderCatalogo();
    alert(`Catálogo lido do Firebase. ${linked} produto(s) foram vinculados ao estoque local.`);
  }catch(e){
    console.error(e);alert('Não foi possível ler o catálogo do Firebase.');
  }
}

/* Inicializa sem exigir login; a autenticação é feita ao publicar. */
setTimeout(initLePneusFirebase,0);

</script>

<script id="lepneus-planilhas-vendas-fechamento-v3">
/* ===== Le Pneus V3: importação Excel + diferenças + cancelamentos + fechamento ===== */
const lpSheetFiles={};
function lpEnsureV3(){
  ensureData(); enhanceData();
  data.saleCancellations=data.saleCancellations||[];
  data.importAudits=data.importAudits||[];
  data.pendingImportDifferences=data.pendingImportDifferences||[];
  data.spreadsheetConnections=data.spreadsheetConnections||{};
}
function lpNorm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ')}
function lpNum(v){
  if(typeof v==='number')return Number.isFinite(v)?v:0;
  let s=String(v??'').trim(); if(!s)return 0;
  s=s.replace(/R\$\s*/gi,'').replace(/\s/g,'');
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  s=s.replace(/[^0-9.-]/g,''); const n=Number(s); return Number.isFinite(n)?n:0;
}
function lpKey(v){return lpNorm(v).replace(/[^a-z0-9]/g,'')}
function lpCategory(type){return type==='carro'?'Pneu':type==='moto'?'Pneu de moto':'Acessórios'}
function lpGuessBrand(name,sheetName,type){
  const n=String(name||'').trim();
  const stop=new Set(['pneu','pneus','camara','câmara','de','ar','aro','moto','carro','radial']);
  const parts=n.split(/\s+/).filter(Boolean);
  for(let i=0;i<parts.length;i++){
    const t=lpNorm(parts[i]).replace(/[^a-z0-9]/g,'');
    if(stop.has(lpNorm(parts[i]))||/^\d/.test(parts[i]))continue;
    if(t.length>=3)return parts[i].replace(/[^A-Za-zÀ-ÿ0-9-]/g,'');
  }
  const sn=String(sheetName||'').replace(/^P\.\s*/i,'').trim();
  return type==='moto'&&sn&&!/outros/i.test(sn)?sn:'';
}
function lpHeaderIndex(row,aliases){
  const keys=row.map(lpKey);
  for(const a of aliases){const k=lpKey(a),i=keys.findIndex(x=>x===k||x.includes(k));if(i>=0)return i}
  return -1;
}
function lpParseWorkbook(wb,type){
  const products=[]; const warnings=[];
  wb.SheetNames.forEach(sheetName=>{
    const ws=wb.Sheets[sheetName];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
    if(!rows.length)return;
    let hi=-1, map=null;
    for(let r=0;r<Math.min(rows.length,25);r++){
      const row=rows[r].map(x=>String(x??'').trim());
      const code=lpHeaderIndex(row,['Cod','Código','Codigo','SKU']);
      const name=lpHeaderIndex(row,['Pneu','Produto','Descrição','Descricao','Item']);
      const stock=lpHeaderIndex(row,['Estoque','Qtd','Quantidade','Saldo']);
      const cost=lpHeaderIndex(row,['Custo','Custo Total','Preço Custo','Preco Custo']);
      const price=lpHeaderIndex(row,['Valor Venda','Venda','Preço Venda','Preco Venda','Vista','À Vista','A Vista']);
      if((code>=0||name>=0)&&stock>=0){hi=r;map={code,name,stock,cost,price};break}
    }
    if(hi<0){warnings.push(sheetName+': cabeçalho não identificado');return}
    for(let r=hi+1;r<rows.length;r++){
      const row=rows[r];
      const code=map.code>=0?String(row[map.code]??'').trim():'';
      const name=map.name>=0?String(row[map.name]??'').trim():'';
      if(!code&&!name)continue;
      if(/^(total|subtotal|estoque|codigo|código|cod)$/i.test(lpNorm(name)))continue;
      const stock=Math.max(0,Math.round(lpNum(row[map.stock])));
      const cost=map.cost>=0?lpNum(row[map.cost]):0;
      const price=map.price>=0?lpNum(row[map.price]):0;
      const codeIsGeneric=/^(sn|s\/?n|semcodigo|semcod|0)$/i.test(lpKey(code));
      const stable=(!codeIsGeneric&&code)?code:`${type}-${sheetName}-${name}`;
      products.push({code:stable,name:name||('Produto '+code),qty:stock,cost,price,category:lpCategory(type),brand:lpGuessBrand(name,sheetName,type),sheet:sheetName,row:r+1,sourceCode:code});
    }
  });
  const by=new Map();
  products.forEach(p=>{const k=lpKey(p.code);if(k&&!by.has(k))by.set(k,p)});
  return {products:[...by.values()],warnings};
}
function connectSpreadsheet(type){
  lpEnsureV3();
  const input=document.getElementById(spreadsheetInputId(type));
  if(!input||!input.files||!input.files[0])return alert('Escolha a planilha '+sheetConnectionLabel(type)+'.');
  const f=input.files[0]; lpSheetFiles[type]=f;
  data.spreadsheetConnections[type]={name:f.name,size:f.size,lastModified:f.lastModified,connectedAt:new Date().toLocaleString('pt-BR'),status:'Pronta para importar'};
  save(); renderPlanilhas();
}

function lpEnsureMLImportItem(p,type){
  lpEnsureV3();
  if(type==='acessorios')return;
  data.settings.mlDefaultFeePct=Number(data.settings.mlDefaultFeePct??16);
  data.settings.mlDefaultFreight=Number(data.settings.mlDefaultFreight??0);
  data.settings.mlDefaultOther=Number(data.settings.mlDefaultOther??0);
  data.settings.mlDefaultProfit=Number(data.settings.mlDefaultProfit??40);
  let item=data.mercadoLivreItems.find(x=>String(x.productId)===String(p.id));
  if(!item){
    item={id:idNow(),productId:p.id,code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price,status:'Preparação automática',sales:0,orderStatus:'Aguardando publicação',importedAt:nowBR(),mlAutoDraft:true};
    data.mercadoLivreItems.unshift(item);
  }
  item.code=p.code;item.name=p.name;item.brand=p.brand;item.category=p.category;item.qty=p.qty;item.price=p.price;
  if(item.mlFeePct===undefined)item.mlFeePct=Number(data.settings.mlDefaultFeePct||16);
  if(item.mlFreight===undefined)item.mlFreight=Number(data.settings.mlDefaultFreight||0);
  if(item.mlOtherCost===undefined)item.mlOtherCost=Number(data.settings.mlDefaultOther||0);
  if(item.mlTargetProfit===undefined)item.mlTargetProfit=Number(data.settings.mlDefaultProfit??40);
  item.updatedAt=nowBR();
}
function mlSuggestedFromItem(x,p){
  const cost=Math.max(0,Number(p?.cost||0));
  const feePct=Math.max(0,Math.min(95,Number(x?.mlFeePct??data.settings.mlDefaultFeePct??16)))/100;
  const freight=Math.max(0,Number(x?.mlFreight??data.settings.mlDefaultFreight??0));
  const other=Math.max(0,Number(x?.mlOtherCost??data.settings.mlDefaultOther??0));
  const targetProfit=Math.max(0,Number(x?.mlTargetProfit??data.settings.mlDefaultProfit??40));
  const denom=1-feePct;
  let suggested=denom>0?(cost+freight+other+targetProfit)/denom:0;
  if(!Number.isFinite(suggested)||suggested<0)suggested=0;
  const fee=suggested*feePct;
  const profit=suggested-fee-freight-other-cost;
  return {cost,feePct:feePct*100,freight,other,targetProfit,suggested,fee,profit};
}
function mlSearchQuery(x,p){
  let q=String(p?.name||x?.name||'').replace(/\s+/g,' ').trim();
  if(!q)q=[x?.brand,p?.brand,x?.code].filter(Boolean).join(' ');
  return q.replace(/\b(PNEU|NOVO|NOVOS|UNIDADE|UNIDADES)\b/gi,' ').replace(/\s+/g,' ').trim();
}
function searchMLSimilar(id){
  const x=data.mercadoLivreItems.find(i=>Number(i.id)===Number(id));if(!x)return;
  const p=data.products.find(p=>String(p.id)===String(x.productId));
  const q=mlSearchQuery(x,p);if(!q)return alert('Não consegui montar a busca para este produto.');
  const slug=q.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase();
  window.open('https://lista.mercadolivre.com.br/'+encodeURIComponent(slug),'_blank','noopener,noreferrer');
}
function saveMLDefaults(){
  lpEnsureV3();
  data.settings.mlDefaultFeePct=Math.max(0,Number($('#mlDefaultFeePct')?.value||0));
  data.settings.mlDefaultFreight=Math.max(0,Number($('#mlDefaultFreight')?.value||0));
  data.settings.mlDefaultOther=Math.max(0,Number($('#mlDefaultOther')?.value||0));
  data.settings.mlDefaultProfit=Math.max(0,Number($('#mlDefaultProfit')?.value||40));
  data.mercadoLivreItems.forEach(x=>{if(x.mlAutoDraft){x.mlFeePct=data.settings.mlDefaultFeePct;x.mlFreight=data.settings.mlDefaultFreight;x.mlOtherCost=data.settings.mlDefaultOther;x.mlTargetProfit=data.settings.mlDefaultProfit;}});
  save();renderMercadoLivre();alert('Padrões do Mercado Livre salvos e preços sugeridos recalculados.');
}
function editMLSuggestion(id){
  lpEnsureV3();const x=data.mercadoLivreItems.find(i=>Number(i.id)===Number(id));if(!x)return;const p=data.products.find(p=>String(p.id)===String(x.productId));if(!p)return;
  const fee=prompt('Comissão/taxa estimada do Mercado Livre (%):',x.mlFeePct??data.settings.mlDefaultFeePct??16);if(fee===null)return;
  const freight=prompt('Frete estimado pago pela loja (R$):',x.mlFreight??data.settings.mlDefaultFreight??0);if(freight===null)return;
  const other=prompt('Outros custos estimados (R$):',x.mlOtherCost??data.settings.mlDefaultOther??0);if(other===null)return;
  const profit=prompt('Lucro desejado por pneu (R$):',x.mlTargetProfit??data.settings.mlDefaultProfit??40);if(profit===null)return;
  x.mlFeePct=Math.max(0,Number(fee)||0);x.mlFreight=Math.max(0,Number(freight)||0);x.mlOtherCost=Math.max(0,Number(other)||0);x.mlTargetProfit=Math.max(0,Number(profit)||0);x.mlAutoDraft=true;x.status='Preparação automática';x.updatedAt=nowBR();save();renderMercadoLivre();
}
function useMLSuggestedPrice(id){
  const x=data.mercadoLivreItems.find(i=>Number(i.id)===Number(id));if(!x)return;const p=data.products.find(p=>String(p.id)===String(x.productId));if(!p)return;const c=mlSuggestedFromItem(x,p);x.mlAdvertisedPrice=Number(c.suggested.toFixed(2));x.mlFee=Number(c.fee.toFixed(2));x.status='Preço sugerido aplicado';x.orderStatus='Aguardando publicação';save();renderMercadoLivre();
}
async function importSpreadsheet(type){
  lpEnsureV3();
  let f=lpSheetFiles[type];
  const input=document.getElementById(spreadsheetInputId(type));
  if(input?.files?.[0]){f=input.files[0];lpSheetFiles[type]=f}
  if(!f)return alert('Escolha novamente o arquivo '+sheetConnectionLabel(type)+' e depois clique em Importar / Atualizar.');
  if(typeof XLSX==='undefined')return alert('O leitor de Excel não carregou. Verifique a internet e abra o arquivo novamente.');
  try{
    const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true});
    const parsed=lpParseWorkbook(wb,type); if(!parsed.products.length)return alert('Nenhum produto válido foi encontrado nesta planilha.');
    let created=0,updated=0,diffs=0; const batchId=Date.now();
    for(const imp of parsed.products){
      let p=data.products.find(x=>lpKey(x.code)===lpKey(imp.code));
      if(!p){
        p={id:idNow(),code:imp.code,name:imp.name,category:imp.category,brand:imp.brand,qty:imp.qty,min:Number(data.settings.defaultMinStock||0),cost:imp.cost,price:imp.price,location:'Planilha: '+imp.sheet};
        data.products.push(p); created++;
        if(p.qty>0)data.stockMovements.unshift({id:idNow(),date:nowBR(),productId:p.id,product:p.name,type:'Entrada',qty:p.qty,before:0,after:p.qty,reason:'Importação inicial da planilha',ref:f.name+' • '+imp.sheet,user:'Administrador'});
      }else{
        const oldQty=Number(p.qty||0),newQty=Number(imp.qty||0);
        p.name=imp.name||p.name; p.category=imp.category||p.category; p.brand=imp.brand||p.brand; p.cost=Number(imp.cost||p.cost||0); p.price=Number(imp.price||p.price||0); p.location=p.location||('Planilha: '+imp.sheet); updated++;
        if(oldQty!==newQty){
          data.pendingImportDifferences.push({id:idNow(),batchId,type,productId:p.id,code:p.code,name:p.name,oldQty,newQty,diff:newQty-oldQty,cost:p.cost,price:p.price,file:f.name,sheet:imp.sheet,createdAt:nowBR(),status:'Pendente'}); diffs++;
        }
        syncProductChannels(p);
      }
      lpEnsureMLImportItem(p,type);
    }
    data.spreadsheetConnections[type]={name:f.name,size:f.size,lastModified:f.lastModified,connectedAt:data.spreadsheetConnections[type]?.connectedAt||nowBR(),lastImportedAt:nowBR(),status:'Importada'};
    data.importAudits.unshift({id:batchId,date:nowBR(),type,file:f.name,created,updated,differences:diffs,warnings:parsed.warnings});
    data.importAudits=data.importAudits.slice(0,100); save(); renderAll();
    if(diffs){alert(`Importação concluída.\nNovos: ${created}\nAtualizados: ${updated}\nDiferenças de estoque: ${diffs}\n\nO sistema vai pedir a confirmação de cada diferença.`);setTimeout(()=>lpNextDifference(batchId),50)}
    else alert(`Importação concluída.\nNovos: ${created}\nAtualizados: ${updated}\nNenhuma diferença de estoque pendente.`);
  }catch(e){console.error(e);alert('Não foi possível ler esta planilha. O arquivo não foi alterado.');}
}
function lpNextDifference(batchId){
  lpEnsureV3(); const d=data.pendingImportDifferences.find(x=>x.status==='Pendente'&&(!batchId||x.batchId===batchId)); if(!d)return;
  const p=data.products.find(x=>String(x.id)===String(d.productId)); if(!p){d.status='Ignorada';save();return lpNextDifference(batchId)}
  if(d.diff<0) lpDifferenceSaleModal(d.id); else lpDifferenceEntryModal(d.id);
}
function lpDifferenceSaleModal(diffId){
 const d=data.pendingImportDifferences.find(x=>String(x.id)===String(diffId));if(!d)return;
 const q=Math.abs(d.diff);
 showModal(`<h2>Diferença detectada no estoque</h2><div class="notice"><b>${esc(d.name)}</b><br>Controle: <b>${d.oldQty}</b> → Planilha: <b>${d.newQty}</b><br>Saída detectada: <b>${q} unidade(s)</b>.</div>
 <p style="margin:12px 0;color:var(--muted)">Essa saída foi uma venda?</p>
 <div class="form"><label>Preço vendido por unidade<input id="diprice" type="number" step="0.01" value="${Number(d.price||0).toFixed(2)}"></label><label>Pagamento<select id="dipayment"><option>PIX</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Cheque</option><option>Transferência</option><option>Boleto</option><option>Outro</option></select></label><label>Nome do comprador<input id="dicustomer" placeholder="Opcional"></label><label>Telefone<input id="diphone" placeholder="Opcional"></label><label class="full">Observação<input id="dinote" placeholder="Opcional"></label></div>
 <div class="modal-actions"><button class="btn ghost" onclick="lpResolveDifference(${d.id},'ignorar')">Deixar pendente</button><button class="btn ghost" onclick="lpResolveDifference(${d.id},'ajuste')">Foi ajuste</button><button class="btn primary" onclick="lpResolveDifference(${d.id},'venda')">Confirmar venda</button></div>`);
}
function lpDifferenceEntryModal(diffId){
 const d=data.pendingImportDifferences.find(x=>String(x.id)===String(diffId));if(!d)return;

function lpFindOrCreateCustomer(name,phone){
  name=String(name||'').trim();phone=String(phone||'').trim(); if(!name&&!phone)return '';
  let c=data.customers.find(x=>(phone&&String(x.phone||'').replace(/\D/g,'')===phone.replace(/\D/g,''))||(name&&lpNorm(x.name)===lpNorm(name)));
  if(!c){c={id:idNow(),name:name||'Cliente '+phone,phone,email:'',doc:'',address:'',city:'',notes:'Cadastrado automaticamente por importação de planilha'};data.customers.unshift(c);}
  return c.id;
}
async function lpResolveDifference(diffId,action){
  lpEnsureV3(); const d=data.pendingImportDifferences.find(x=>String(x.id)===String(diffId));if(!d)return;
  const p=data.products.find(x=>String(x.id)===String(d.productId));if(!p)return;
  if(action==='ignorar'){closeModal();return;}
  if(action==='venda'){
    const q=Math.abs(d.diff),unit=Number($('#diprice')?.value||d.price||0),payment=$('#dipayment')?.value||'PIX',name=$('#dicustomer')?.value||'',phone=$('#diphone')?.value||'',note=$('#dinote')?.value||'';
    if(unit<0)return alert('Informe um preço de venda válido.');
    const customerId=lpFindOrCreateCustomer(name,phone);
    const res=createIntegratedSale({customerId,items:[{id:p.id,qty:q,price:unit,cost:Number(p.cost||0)}],discount:0,payment,financialStatus:'Pago',originType:'Importação Excel',originNumber:'PLANILHA-'+d.id});
    if(res.error)return alert(res.error);
    res.sale.importDifferenceId=d.id;res.sale.importNote=note; d.saleId=res.sale.id; d.status='Venda confirmada';
    syncProductChannels(p);queueExcelSync(p,'Venda detectada na planilha #'+res.sale.id);
    log(`Planilha detectou venda #${res.sale.id}: ${p.name} × ${q}`);
  }else{
    const reason=d.diff>0?($('#dientryreason')?.value||'Entrada detectada na planilha'):'Ajuste de estoque confirmado';
    addStockMovement(p.id,'Ajuste',d.newQty,reason,d.file+' • '+d.sheet); d.status='Ajuste confirmado'; syncProductChannels(p);queueExcelSync(p,'Ajuste confirmado por importação');
    log(`Diferença de planilha ajustada: ${p.name} ${d.oldQty} → ${d.newQty}`);
  }
  d.resolvedAt=nowBR(); save(); closeModal(); renderAll();
  if(lpFirebaseUser&&data.catalogItems.some(x=>String(x.productId)===String(p.id))){try{await publishProductToFirebase(p.id,true)}catch(e){console.warn(e)}}
  setTimeout(()=>lpNextDifference(d.batchId),50);
}

/* ===== Mercado Livre V5: descrição pronta + oportunidades por custo ===== */
function mlCleanProductName(name){
 return String(name||'').replace(/\s+/g,' ').trim();
}
function mlExtractTireInfo(p){
 const name=mlCleanProductName(p?.name||'');
 const size=(name.match(/\b\d{3}\s*[\/-]\s*\d{2}\s*(?:R|ZR)?\s*\d{2}\b/i)||name.match(/\b\d{2,3}\s*\/?\s*\d{2,3}\s*[-x]\s*\d{2}\b/i)||[])[0]||'';
 const aro=(name.match(/\bR\s?(\d{2})\b/i)||[])[1]||'';
 return {name,size:size.replace(/\s+/g,' ').trim(),aro};
}
function mlListingTitle(p){
 const info=mlExtractTireInfo(p);
 let title=info.name.replace(/^PNEU\s+/i,'Pneu ');
 if(!/^pneu\b/i.test(title))title='Pneu '+title;
 return title.replace(/\s+/g,' ').trim().slice(0,60);
}
function mlDetailedDescription(p,x){
 const info=mlExtractTireInfo(p), brand=String(p?.brand||x?.brand||'').trim();
 const lines=[
  mlListingTitle(p),
  '',
  'Produto disponível no estoque da Le Pneus.',
  '',
  'DETALHES DO PRODUTO',
  '• Produto: '+info.name,
  brand?'• Marca: '+brand:'',
  info.size?'• Medida: '+info.size:'',
  info.aro?'• Aro: '+info.aro:'',
  '• Condição: novo',
  '• Quantidade do anúncio: 1 unidade',
  '',
  'ANTES DA COMPRA',
  'Confira a medida indicada no pneu atualmente instalado no veículo e confirme a compatibilidade com seu carro ou moto.',
  '',
  'ENVIO E ATENDIMENTO',
  'Produto separado conforme disponibilidade de estoque. Em caso de dúvida sobre medida ou aplicação, utilize o campo de perguntas do anúncio antes da compra.',
  '',
  'Observação: características específicas como índice de carga, velocidade e aplicação devem ser confirmadas na identificação do produto antes da publicação do anúncio.'
 ].filter(v=>v!==''||true);
 return lines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

}
function mlOpportunityData(){
 const items=(data.mercadoLivreItems||[]).map(x=>{const p=data.products.find(p=>String(p.id)===String(x.productId));return {x,p,cost:Number(p?.cost||0),qty:Number(p?.qty||0)}}).filter(o=>o.p&&o.cost>0&&o.qty>0&&!/acess/i.test(String(o.p.category||'')));
 const costs=items.map(o=>o.cost).sort((a,b)=>a-b);
 const q=(pct)=>costs.length?costs[Math.min(costs.length-1,Math.floor((costs.length-1)*pct))]:0;
 const q25=q(.25),q50=q(.50);
 return items.map(o=>{
  let level='Normal',score=0,reason='Custo acima da metade do estoque analisado.';
  if(o.cost<=q25){level='Melhor custo';score=3;reason='Está entre os 25% de menor custo do estoque com unidades disponíveis.';}
  else if(o.cost<=q50){level='Bom custo';score=2;reason='Está entre os 50% de menor custo do estoque com unidades disponíveis.';}
  else {score=1;}
  if(o.qty>=4)score+=1;
  return {...o,level,score,reason};
 }).sort((a,b)=>b.score-a.score||a.cost-b.cost);
}
function mlOpportunityFor(productId){
 return mlOpportunityData().find(o=>String(o.p.id)===String(productId))||null;
}
function mlOpportunityBadge(o){
 if(!o)return '<span class="badge">Sem análise</span>';

 if(o.level==='Bom custo')return '<span class="badge ok">Bom custo</span>';
 return '<span class="badge warn">Comparar mercado</span>';
}

 data.settings.mlDefaultFreight=Number(data.settings.mlDefaultFreight??0);
 data.settings.mlDefaultOther=Number(data.settings.mlDefaultOther??0);

   const est=mlSuggestedFromItem(x,p),opp=mlOpportunityFor(x.productId);
   const actual=Number(x.mlAdvertisedPrice||0),applied=actual>0;
   const actualFee=applied?Number(x.mlFee||actual*(est.feePct/100)):est.fee;
   const actualProfit=applied?actual-actualFee-est.freight-est.other-est.cost:est.profit;
   return `<tr>
   <td><b>${esc(x.code)}</b></td>
   <td>${esc(x.name)}<small class="cell-sub">${esc(x.brand||'')} • estoque ${Number(x.qty||0)}</small></td>
   <td>${money(est.cost)}</td>
   <td>${mlOpportunityBadge(opp)}<small class="cell-sub">${opp?esc(opp.reason):'Sem estoque/custo válido'}</small></td>
   <td>${money(Number(p?.price||x.price||0))}<small class="cell-sub">preço da planilha</small></td>
   <td>${est.feePct.toFixed(1)}%</td>
   <td>${money(est.freight)}</td>
   <td><b>${money(est.targetProfit)}</b><small class="cell-sub">por pneu</small></td>
   <td><b>${money(est.suggested)}</b><small class="cell-sub">custo + despesas + lucro</small></td>
   <td>${applied?`<b>${money(actual)}</b><small class="cell-sub">lucro est. ${money(actualProfit)}</small>`:'<span class="badge warn">Ainda não aplicado</span>'}</td>
   <td><div class="actions"><button class="btn primary small" onclick="useMLSuggestedPrice(${x.id})">Usar sugerido</button><button class="btn ghost small" onclick="showMLDescription(${x.id})">Descrição</button><button class="btn ghost small" onclick="searchMLSimilar(${x.id})">🔎 Buscar anúncios</button><button class="btn ghost small" onclick="editMLSuggestion(${x.id})">Frete/taxas</button><button class="btn ghost small" onclick="removeFromML(${x.id})">Remover</button></div></td>
   </tr>`;
 }).join('');
 const suggestedTotal=data.mercadoLivreItems.reduce((a,x)=>{const p=data.products.find(p=>String(p.id)===String(x.productId));return a+mlSuggestedFromItem(x,p).suggested},0);
 const topCount=mlOpportunityData().filter(o=>o.level==='Melhor custo').length;
 $('#mercadolivre').innerHTML=heading('Mercado Livre','Preço, descrição e seleção automática das melhores oportunidades do estoque',`<button class="btn primary" onclick="showMLOpportunities()">⭐ Ver melhores para anunciar</button>`)+
 `<div class="notice"><b>Depois da importação:</b> pneus de Carro e Moto entram automaticamente aqui. O sistema calcula o preço usando o custo da planilha, despesas estimadas e <b>R$ ${Number(data.settings.mlDefaultProfit).toFixed(2).replace('.',',')} de lucro por pneu</b>. Também gera uma descrição pronta para copiar.</div>
 <div class="notice"><b>Seleção inteligente pelo custo:</b> o sistema destaca os pneus com menor custo dentro do seu próprio estoque e que possuem unidades disponíveis. Isso é uma triagem interna; para saber se realmente vale anunciar, compare os concorrentes com o botão <b>Buscar anúncios</b>.</div>
 <div class="cards">${metric('Produtos preparados',data.mercadoLivreItems.length,'vindos do estoque','green')}${metric('Melhor custo',topCount,'prioridade para comparar','green')}${metric('Total sugerido',money(suggestedTotal),'soma dos preços sugeridos','green')}${metric('Lucro alvo',money(data.settings.mlDefaultProfit),'por pneu','green')}</div>
 <div class="card" style="margin-top:16px"><div class="panel-head"><div><h3 class="section-title" style="margin:0">Padrões do cálculo</h3><small class="cell-sub">Ajuste quando souber os custos reais do anúncio</small></div></div><div class="form-grid">
 <label class="field"><span>Comissão/taxa ML (%)</span><input id="mlDefaultFeePct" type="number" step="0.1" min="0" value="${data.settings.mlDefaultFeePct}"></label>
 <label class="field"><span>Frete médio pago pela loja (R$)</span><input id="mlDefaultFreight" type="number" step="0.01" min="0" value="${data.settings.mlDefaultFreight}"></label>
 <label class="field"><span>Outros custos por venda (R$)</span><input id="mlDefaultOther" type="number" step="0.01" min="0" value="${data.settings.mlDefaultOther}"></label>

 </div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="saveMLDefaults()">Salvar e recalcular todos</button><button class="btn ghost" onclick="showMLOpportunities()">Ver ranking por custo</button></div></div>
 <div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Código</th><th>Produto</th><th>Custo</th><th>Oportunidade</th><th>Preço planilha</th><th>Taxa</th><th>Frete</th><th>Lucro/pneu</th><th>Preço sugerido ML</th><th>Preço aplicado</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="11" class="empty">Importe a planilha de Carro ou Moto para gerar as sugestões automaticamente.</td></tr>'}</tbody></table></div>`;
}
</script>

<script id="lepneus-stock-brand-image-overrides">
/* ===== Le Pneus: importar apenas itens úteis + imagem de marca no catálogo ===== */
(function(){
  const _origLpEnsureMLImportItem = window.lpEnsureMLImportItem;
  const _origRenderMercadoLivre = window.renderMercadoLivre;
  const _origRenderCatalogo = window.renderCatalogo;

  function lpInStock(p){ return Number(p?.qty||0) > 0; }

  /* Pneus sem estoque não entram como rascunho automático do Mercado Livre. */
  window.lpEnsureMLImportItem = function(p,type){
    if(!p || Number(p.qty||0) <= 0){
      if(window.data?.mercadoLivreItems){
        data.mercadoLivreItems = data.mercadoLivreItems.filter(x => !(String(x.productId)===String(p?.id) && x.mlAutoDraft));
      }
      return;
    }
    return _origLpEnsureMLImportItem ? _origLpEnsureMLImportItem(p,type) : undefined;
  };

  /* Importação real: não cria no Controle produtos novos que estejam zerados.
     Se um produto já existia e caiu para zero, ele continua sendo comparado para
     o sistema detectar a saída e perguntar se foi venda ou ajuste. */
  window.importSpreadsheet = async function(type){
    lpEnsureV3();
    let f=lpSheetFiles[type];
    const input=document.getElementById(spreadsheetInputId(type));
    if(input?.files?.[0]){f=input.files[0];lpSheetFiles[type]=f}
    if(!f)return alert('Escolha novamente o arquivo '+sheetConnectionLabel(type)+' e depois clique em Importar / Atualizar.');
    if(typeof XLSX==='undefined')return alert('O leitor de Excel não carregou. Verifique a internet e abra o arquivo novamente.');
    try{
      const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true});
      const parsed=lpParseWorkbook(wb,type); if(!parsed.products.length)return alert('Nenhum produto válido foi encontrado nesta planilha.');
      let created=0,updated=0,diffs=0,skippedZero=0; const batchId=Date.now();
      for(const imp of parsed.products){
        let p=data.products.find(x=>lpKey(x.code)===lpKey(imp.code));
        if(!p && Number(imp.qty||0)<=0){ skippedZero++; continue; }
        if(!p){
          p={id:idNow(),code:imp.code,name:imp.name,category:imp.category,brand:imp.brand,qty:imp.qty,min:Number(data.settings.defaultMinStock||0),cost:imp.cost,price:imp.price,location:'Planilha: '+imp.sheet};
          data.products.push(p); created++;
          if(p.qty>0)data.stockMovements.unshift({id:idNow(),date:nowBR(),productId:p.id,product:p.name,type:'Entrada',qty:p.qty,before:0,after:p.qty,reason:'Importação inicial da planilha',ref:f.name+' • '+imp.sheet,user:'Administrador'});
        }else{
          const oldQty=Number(p.qty||0),newQty=Number(imp.qty||0);
          p.name=imp.name||p.name; p.category=imp.category||p.category; p.brand=imp.brand||p.brand; p.cost=Number(imp.cost||p.cost||0); p.price=Number(imp.price||p.price||0); p.location=p.location||('Planilha: '+imp.sheet); updated++;
          if(oldQty!==newQty){
            data.pendingImportDifferences.push({id:idNow(),batchId,type,productId:p.id,code:p.code,name:p.name,oldQty,newQty,diff:newQty-oldQty,cost:p.cost,price:p.price,file:f.name,sheet:imp.sheet,createdAt:nowBR(),status:'Pendente'}); diffs++;
          }
          syncProductChannels(p);
        }
        if(Number(p.qty||0)>0) lpEnsureMLImportItem(p,type);
      }
      data.spreadsheetConnections[type]={name:f.name,size:f.size,lastModified:f.lastModified,connectedAt:data.spreadsheetConnections[type]?.connectedAt||nowBR(),lastImportedAt:nowBR(),status:'Importada'};
      data.importAudits.unshift({id:batchId,date:nowBR(),type,file:f.name,created,updated,differences:diffs,skippedZero,warnings:parsed.warnings});
      data.importAudits=data.importAudits.slice(0,100); save(); renderAll();
      const zeroMsg=skippedZero?`\nSem estoque ignorados: ${skippedZero}`:'';
      if(diffs){alert(`Importação concluída.\nNovos com estoque: ${created}\nAtualizados: ${updated}${zeroMsg}\nDiferenças de estoque: ${diffs}\n\nO sistema vai pedir a confirmação de cada diferença.`);setTimeout(()=>lpNextDifference(batchId),50)}
      else alert(`Importação concluída.\nNovos com estoque: ${created}\nAtualizados: ${updated}${zeroMsg}\nNenhuma diferença de estoque pendente.`);
    }catch(e){console.error(e);alert('Não foi possível ler esta planilha. O arquivo não foi alterado.');}
  };

  /* Remove da preparação automática do ML itens que chegaram a estoque zero. */
  function lpCleanupZeroML(){
    if(!window.data?.mercadoLivreItems)return;
    data.mercadoLivreItems=data.mercadoLivreItems.filter(x=>{
      const p=data.products.find(p=>String(p.id)===String(x.productId));
      return !x.mlAutoDraft || !p || lpInStock(p);
    });
  }
  window.renderMercadoLivre=function(){ lpCleanupZeroML(); return _origRenderMercadoLivre?.(); };

  function lpBrandFallbackImage(brand){
    const b=String(brand||'Le Pneus').trim();
    const domains={
      'pirelli':'pirelli.com','michelin':'michelin.com','bridgestone':'bridgestone.com','continental':'continental-tires.com',
      'goodyear':'goodyear.com','dunlop':'dunloptires.com','hankook':'hankooktire.com','yokohama':'yokohamatire.com',
      'kumho':'kumhotire.com','maxxis':'maxxis.com','firestone':'firestone.com','nexen':'nexentire.com',
      'metzeler':'metzeler.com','borilli':'borilli.com.br','maggion':'maggion.com.br','levorin':'levorin.com.br',
      'delinte':'delintetires.com','linglong':'linglongtire.com','westlake':'westlaketire.com','goodride':'goodridetire.com'
    };
    const k=lpNorm(b).split(/\s+/)[0];
    if(domains[k]) return `https://logo.clearbit.com/${domains[k]}?size=512`;
    const safe=b.replace(/[&<>"']/g,'').slice(0,32);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" rx="42" fill="#111827"/><circle cx="450" cy="235" r="120" fill="#ffffff" opacity=".08"/><text x="450" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#ffffff">${safe}</text><text x="450" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#cbd5e1">IMAGEM DA MARCA</text></svg>`;
    return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
  }

  async function lpResolveCatalogImage(p,existing={}){
    if(String(existing.image||'').trim()) return existing.image;
    const brand=String(p.brand||existing.brand||'').trim();
    if(brand && window.lpDb){
      try{
        const snap=await lpDb.collection('produtos').where('brand','==',brand).limit(15).get();
        for(const d of snap.docs){
          const img=String(d.data()?.image||'').trim();
          if(img) return img;
        }
      }catch(e){ console.warn('Busca de imagem por marca:',e); }
    }
    return lpBrandFallbackImage(brand||'Le Pneus');
  }
  window.lpResolveCatalogImage=lpResolveCatalogImage;

  /* Sincroniza catálogo preservando foto existente. Se o pneu ainda não tem foto,
     procura uma imagem já usada pela mesma marca; se não achar, aplica imagem da marca. */
  window.publishProductToFirebase=async function(productId,silent=false){
    ensureData();
    if(!lpFirebaseUser){ if(!silent)firebaseLoginModal(); return {ok:false,reason:'auth'}; }
    const p=data.products.find(x=>String(x.id)===String(productId));
    if(!p)return {ok:false,reason:'missing'};
    try{
      const found=await findFirebaseCatalogDoc(p);
      const existing=found?found.data():{};
      if(Number(p.qty||0)<=0){
        if(found){ await lpDb.collection('produtos').doc(found.id).set({stock:0,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }
        data.catalogItems=data.catalogItems.filter(x=>String(x.productId)!==String(p.id));
        save(); if(!silent)alert('Produto sem estoque: ele não ficará disponível no catálogo.');
        return {ok:true,outOfStock:true,docId:found?.id||''};
      }
      const image=await lpResolveCatalogImage(p,existing);
      const payload=productToFirebaseCatalog(p,{...existing,image});
      let docId;
      if(found){ docId=found.id; await lpDb.collection('produtos').doc(docId).set(payload,{merge:true}); }
      else { const ref=await lpDb.collection('produtos').add(payload); docId=ref.id; }
      let local=data.catalogItems.find(x=>String(x.productId)===String(p.id));
      const vals={code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price,status:'Publicado',firebaseId:docId,image,updatedAt:new Date().toLocaleString('pt-BR')};
      if(local)Object.assign(local,vals);else data.catalogItems.unshift({id:Date.now()+Math.random(),productId:p.id,...vals,importedAt:new Date().toLocaleString('pt-BR')});
      save(); if(!silent)alert('Produto sincronizado com o catálogo pelo Firebase.');
      return {ok:true,docId};
    }catch(e){console.error('Publicação Firebase:',e);if(!silent)alert('Não foi possível atualizar o catálogo. Confira login e regras do Firestore.');return {ok:false,error:e};}
  };

  window.sendToCatalogo=async function(id){
    ensureData();
    const p=data.products.find(x=>String(x.id)===String(id)); if(!p)return;
    if(Number(p.qty||0)<=0){
      if(lpFirebaseUser)await publishProductToFirebase(id,true);
      alert('Esse produto está sem estoque e não será adicionado ao catálogo.');
      renderCatalogo(); return;
    }
    let exists=data.catalogItems.find(x=>String(x.productId)===String(id));
    if(exists)Object.assign(exists,{code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price,updatedAt:new Date().toLocaleString('pt-BR')});
    else data.catalogItems.unshift({id:Date.now()+Math.random(),productId:p.id,code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price,status:lpFirebaseUser?'Publicando...':'Pronto para publicar',importedAt:new Date().toLocaleString('pt-BR')});
    save(); if(lpFirebaseUser)await publishProductToFirebase(id);else{renderCatalogo();firebaseLoginModal();}
  };

  /* A tela do catálogo mostra somente itens com estoque disponível. */
  window.renderCatalogo=function(){
    const original=data.catalogItems;
    const visible=original.filter(x=>{
      const p=data.products.find(p=>String(p.id)===String(x.productId));
      return p ? lpInStock(p) : Number(x.qty||0)>0;
    });
    data.catalogItems=visible;
    try{return _origRenderCatalogo?.();}finally{data.catalogItems=original;}
  };

  window.syncAllCatalogToFirebase=async function(){
    if(!lpFirebaseUser)return firebaseLoginModal();
    if(!data.catalogItems.length)return alert('Não há produtos selecionados na aba Catálogo.');
    const copy=[...data.catalogItems];
    if(!confirm(`Atualizar o catálogo? Produtos com estoque zero serão retirados da disponibilidade.`))return;
    let ok=0,err=0,semEstoque=0;
    for(const item of copy){const r=await publishProductToFirebase(item.productId,true);if(r.ok){ok++;if(r.outOfStock)semEstoque++;}else err++;}
    save();renderCatalogo();alert(`Sincronização concluída.\nAtualizados: ${ok}\nSem estoque retirados: ${semEstoque}\nErros: ${err}`);
  };
})();
</script>


<script id="lepneus-valores-corrigidos-ml-completo-v6">
/* ===== Le Pneus V6: leitura exata das planilhas reais + cálculo completo ML ===== */
(function(){
  function lpExactHeaderIndex(row, labels){
    const keys=(row||[]).map(v=>lpKey(v));
    for(const label of labels){
      const k=lpKey(label);
      const idx=keys.findIndex(x=>x===k);
      if(idx>=0)return idx;
    }
    return -1;
  }

  /*
    Estrutura confirmada nas planilhas reais Le Pneus:
    Cod | Pneu | Custo | Vista | Valor Venda | Cartão Débito | 2x a 4x | Custo Total | Estoque
    A leitura abaixo usa correspondência EXATA de cabeçalho para impedir que "Custo"
    seja confundido com "Custo Total" e que "Valor Venda" seja confundido com outras colunas.
  */
  window.lpParseWorkbook=function(wb,type){
    const products=[], warnings=[];
    wb.SheetNames.forEach(sheetName=>{
      const ws=wb.Sheets[sheetName];
      /* raw:true preserva o valor numérico real da célula, sem depender da formatação exibida no Excel. */
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
      if(!rows.length)return;
      let hi=-1,map=null;
      for(let r=0;r<Math.min(rows.length,15);r++){
        const row=rows[r];
        const code=lpExactHeaderIndex(row,['Cod','Código','Codigo']);
        const name=lpExactHeaderIndex(row,['Pneu','Produto','Descrição','Descricao']);
        const cost=lpExactHeaderIndex(row,['Custo']);
        const vista=lpExactHeaderIndex(row,['Vista']);
        const price=lpExactHeaderIndex(row,['Valor Venda']);
        const stock=lpExactHeaderIndex(row,['Estoque']);
        if(code>=0 && name>=0 && cost>=0 && price>=0 && stock>=0){
          hi=r; map={code,name,cost,vista,price,stock}; break;
        }
      }
      if(hi<0){warnings.push(sheetName+': não encontrei exatamente Cod, Pneu, Custo, Valor Venda e Estoque.');return;}

      for(let r=hi+1;r<rows.length;r++){
        const row=rows[r]||[];
        const sourceCode=String(row[map.code]??'').trim();
        const name=String(row[map.name]??'').trim();
        if(!sourceCode&&!name)continue;
        if(!name || /^(total|subtotal|estoque|codigo|código|cod)$/i.test(lpNorm(name)))continue;

        const qty=Math.max(0,Math.round(lpNum(row[map.stock])));
        const cost=Math.max(0,lpNum(row[map.cost]));
        const price=Math.max(0,lpNum(row[map.price]));
        const vista=map.vista>=0?Math.max(0,lpNum(row[map.vista])):0;
        const codeIsGeneric=!sourceCode || /^(sn|s\/?n|semcodigo|semcod|0)$/i.test(lpKey(sourceCode));
        const stable=(!codeIsGeneric)?sourceCode:`${type}-${sheetName}-${name}`;

        products.push({
          code:stable,
          sourceCode,
          name,
          qty,
          cost,
          price,
          vista,
          category:lpCategory(type),
          brand:lpGuessBrand(name,sheetName,type),
          sheet:sheetName,
          row:r+1
        });
      }
    });

    /* Código é a chave principal. Se houver duplicata real no mesmo arquivo, mantém a primeira e avisa. */
    const by=new Map();
    for(const p of products){
      const k=lpKey(p.code);
      if(!k)continue;
      if(by.has(k)){
        const old=by.get(k);
        warnings.push(`Código duplicado ${p.code}: ${old.sheet} e ${p.sheet}. Mantido o primeiro.`);
        continue;
      }
      by.set(k,p);
    }
    return {products:[...by.values()],warnings};
  };

  /* Atualiza importação para nunca reaproveitar um valor antigo quando a planilha traz zero. */
  window.importSpreadsheet=async function(type){
    lpEnsureV3();
    let f=lpSheetFiles[type];
    const input=document.getElementById(spreadsheetInputId(type));
    if(input?.files?.[0]){f=input.files[0];lpSheetFiles[type]=f;}
    if(!f)return alert('Escolha novamente o arquivo '+sheetConnectionLabel(type)+' e depois clique em Importar / Atualizar.');
    if(typeof XLSX==='undefined')return alert('O leitor de Excel não carregou. Verifique a internet e abra o arquivo novamente.');
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      const parsed=window.lpParseWorkbook(wb,type);
      if(!parsed.products.length)return alert('Nenhum produto válido foi encontrado nesta planilha.');

      let created=0,updated=0,diffs=0,skippedZero=0;
      const batchId=Date.now();
      for(const imp of parsed.products){
        let p=data.products.find(x=>lpKey(x.code)===lpKey(imp.code));
        if(!p && Number(imp.qty||0)<=0){skippedZero++;continue;}

        if(!p){
          p={id:idNow(),code:imp.code,name:imp.name,category:imp.category,brand:imp.brand,qty:Number(imp.qty||0),min:Number(data.settings.defaultMinStock||0),cost:Number(imp.cost||0),price:Number(imp.price||0),vista:Number(imp.vista||0),location:'Planilha: '+imp.sheet,sourceSheet:imp.sheet,sourceRow:imp.row};
          data.products.push(p);created++;
          if(p.qty>0)data.stockMovements.unshift({id:idNow(),date:nowBR(),productId:p.id,product:p.name,type:'Entrada',qty:p.qty,before:0,after:p.qty,reason:'Importação inicial da planilha',ref:f.name+' • '+imp.sheet,user:'Administrador'});
        }else{
          const oldQty=Number(p.qty||0),newQty=Number(imp.qty||0);
          p.name=imp.name||p.name;
          p.category=imp.category||p.category;
          p.brand=imp.brand||p.brand;
          /* Valores vêm SEMPRE das colunas exatas da planilha atual. */
          p.cost=Number(imp.cost||0);
          p.price=Number(imp.price||0);
          p.vista=Number(imp.vista||0);
          p.sourceSheet=imp.sheet;p.sourceRow=imp.row;
          p.location='Planilha: '+imp.sheet;
          updated++;
          if(oldQty!==newQty){
            data.pendingImportDifferences.push({id:idNow(),batchId,type,productId:p.id,code:p.code,name:p.name,oldQty,newQty,diff:newQty-oldQty,cost:p.cost,price:p.price,file:f.name,sheet:imp.sheet,createdAt:nowBR(),status:'Pendente'});diffs++;
          }
          syncProductChannels(p);
        }
        if(Number(p.qty||0)>0)lpEnsureMLImportItem(p,type);
      }

      data.spreadsheetConnections[type]={name:f.name,size:f.size,lastModified:f.lastModified,connectedAt:data.spreadsheetConnections[type]?.connectedAt||nowBR(),lastImportedAt:nowBR(),status:'Importada'};
      data.importAudits.unshift({id:batchId,date:nowBR(),type,file:f.name,created,updated,differences:diffs,skippedZero,warnings:parsed.warnings});
      data.importAudits=data.importAudits.slice(0,100);
      save();renderAll();

      const warn=parsed.warnings.length?`\nAvisos: ${parsed.warnings.length}`:'';
      const z=skippedZero?`\nSem estoque ignorados: ${skippedZero}`:'';
      if(diffs){
        alert(`Importação corrigida concluída.\nNovos com estoque: ${created}\nAtualizados: ${updated}${z}\nDiferenças de estoque: ${diffs}${warn}\n\nCusto = coluna Custo\nPreço = coluna Valor Venda\nEstoque = coluna Estoque`);
        setTimeout(()=>lpNextDifference(batchId),50);
      }else{
        alert(`Importação corrigida concluída.\nNovos com estoque: ${created}\nAtualizados: ${updated}${z}${warn}\n\nCusto = coluna Custo\nPreço = coluna Valor Venda\nEstoque = coluna Estoque`);
      }
    }catch(e){console.error(e);alert('Não foi possível ler esta planilha. O arquivo não foi alterado.');}
  };

  function mlCompleteBreakdown(x,p,priceOverride){
    const base=mlSuggestedFromItem(x,p);
    const price=Math.max(0,Number(priceOverride??x?.mlAdvertisedPrice??0)) || base.suggested;
    const feePct=Math.max(0,Math.min(95,Number(x?.mlFeePct??data.settings.mlDefaultFeePct??16)));
    const fee=price*(feePct/100);
    const freight=Math.max(0,Number(x?.mlFreight??data.settings.mlDefaultFreight??0));
    const other=Math.max(0,Number(x?.mlOtherCost??data.settings.mlDefaultOther??0));
    const cost=Math.max(0,Number(p?.cost||0));
    const totalExpenses=cost+fee+freight+other;
    const netAfterMarketplace=price-fee-freight-other;
    const profit=price-totalExpenses;
    const margin=price>0?(profit/price)*100:0;
    const returnOnCost=cost>0?(profit/cost)*100:0;
    return {...base,price,feePct,fee,freight,other,cost,totalExpenses,netAfterMarketplace,profit,margin,returnOnCost};
  }
  window.mlCompleteBreakdown=mlCompleteBreakdown;

  window.showMLCostDetails=function(id){
    const x=data.mercadoLivreItems.find(i=>Number(i.id)===Number(id));if(!x)return;
    const p=data.products.find(p=>String(p.id)===String(x.productId));if(!p)return;
    const suggested=mlSuggestedFromItem(x,p);
    const c=mlCompleteBreakdown(x,p,suggested.suggested);
    showModal(`<h2>Cálculo completo • Mercado Livre</h2>
      <div class="notice"><b>${esc(p.name)}</b><br>O cálculo abaixo usa o custo real importado da coluna <b>Custo</b> da planilha e o lucro alvo configurado.</div>
      <div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px">
        ${metric('Custo do pneu',money(c.cost),'planilha','green')}
        ${metric('Preço sugerido',money(c.price),'para atingir o lucro alvo','green')}
        ${metric('Despesas totais',money(c.totalExpenses),'custo + taxa + frete + outros','red')}
        ${metric('Lucro líquido',money(c.profit),c.margin.toFixed(2).replace('.',',')+'% de margem','green')}
      </div>
      <div class="card table-wrap" style="margin-top:14px"><table><tbody>
        <tr><th>Preço de venda sugerido</th><td><b>${money(c.price)}</b></td></tr>
        <tr><th>Custo do produto</th><td>${money(c.cost)}</td></tr>
        <tr><th>Taxa/comissão ML</th><td>${c.feePct.toFixed(2).replace('.',',')}% = ${money(c.fee)}</td></tr>
        <tr><th>Frete pago pela loja</th><td>${money(c.freight)}</td></tr>
        <tr><th>Outros custos</th><td>${money(c.other)}</td></tr>
        <tr><th>Total de despesas</th><td><b>${money(c.totalExpenses)}</b></td></tr>
        <tr><th>Valor líquido após taxa/frete/outros</th><td>${money(c.netAfterMarketplace)}</td></tr>
        <tr><th>Lucro líquido por unidade</th><td><b>${money(c.profit)}</b></td></tr>
        <tr><th>Margem líquida sobre a venda</th><td><b>${c.margin.toFixed(2).replace('.',',')}%</b></td></tr>
        <tr><th>Lucro em relação ao custo</th><td>${c.returnOnCost.toFixed(2).replace('.',',')}%</td></tr>
      </tbody></table></div>
      <div class="modal-actions"><button class="btn ghost" onclick="editMLSuggestion(${x.id});closeModal()">Alterar taxa/frete/custos</button><button class="btn primary" onclick="useMLSuggestedPrice(${x.id});closeModal()">Usar preço sugerido</button></div>`);
  };

  window.renderMercadoLivre=function(){
    lpEnsureV3();
    data.settings.mlDefaultFeePct=Number(data.settings.mlDefaultFeePct??16);
    data.settings.mlDefaultFreight=Number(data.settings.mlDefaultFreight??0);
    data.settings.mlDefaultOther=Number(data.settings.mlDefaultOther??0);
    data.settings.mlDefaultProfit=Number(data.settings.mlDefaultProfit??40);

    /* limpa rascunhos automáticos sem estoque */
    data.mercadoLivreItems=data.mercadoLivreItems.filter(x=>{
      const p=data.products.find(p=>String(p.id)===String(x.productId));
      return !x.mlAutoDraft || !p || Number(p.qty||0)>0;
    });

    const rows=data.mercadoLivreItems.map(x=>{
      const p=data.products.find(p=>String(p.id)===String(x.productId));if(!p)return '';
      const est=mlSuggestedFromItem(x,p);
      const c=mlCompleteBreakdown(x,p,est.suggested);
      const opp=typeof mlOpportunityFor==='function'?mlOpportunityFor(x.productId):null;
      const actual=Number(x.mlAdvertisedPrice||0);
      const actualCalc=actual>0?mlCompleteBreakdown(x,p,actual):null;
      return `<tr>
        <td><b>${esc(x.code||p.code)}</b></td>
        <td>${esc(x.name||p.name)}<small class="cell-sub">Estoque: ${Number(p.qty||0)}</small></td>
        <td>${money(p.cost)}<small class="cell-sub">Custo da planilha</small></td>
        <td>${money(p.price)}<small class="cell-sub">Valor Venda da planilha</small></td>
        <td>${c.feePct.toFixed(1).replace('.',',')}%<small class="cell-sub">${money(c.fee)}</small></td>
        <td>${money(c.freight)}</td>
        <td>${money(c.other)}</td>
        <td><b>${money(c.totalExpenses)}</b></td>
        <td><b>${money(c.price)}</b><small class="cell-sub">alvo: ${money(c.targetProfit)} lucro</small></td>
        <td><b>${money(c.profit)}</b><small class="cell-sub">${c.margin.toFixed(1).replace('.',',')}% margem</small></td>
        <td>${actualCalc?`<b>${money(actual)}</b><small class="cell-sub">Lucro ${money(actualCalc.profit)} • ${actualCalc.margin.toFixed(1).replace('.',',')}%</small>`:'<span class="badge warn">Não aplicado</span>'}</td>
        <td class="actions"><button class="btn primary small" onclick="showMLCostDetails(${x.id})">Detalhes</button><button class="btn ghost small" onclick="editMLSuggestion(${x.id})">Taxa/frete</button><button class="btn ghost small" onclick="searchMLSimilar(${x.id})">Buscar anúncios</button>${typeof showMLDescription==='function'?`<button class="btn ghost small" onclick="showMLDescription(${x.id})">Descrição</button>`:''}<button class="btn ghost small" onclick="useMLSuggestedPrice(${x.id})">Usar preço</button></td>
      </tr>`;
    }).join('');

    const valid=data.mercadoLivreItems.map(x=>{const p=data.products.find(p=>String(p.id)===String(x.productId));return p?mlCompleteBreakdown(x,p,mlSuggestedFromItem(x,p).suggested):null}).filter(Boolean);
    const avgMargin=valid.length?valid.reduce((a,c)=>a+c.margin,0)/valid.length:0;
    const totalProfit=valid.reduce((a,c)=>a+c.profit,0);
    const totalExpenses=valid.reduce((a,c)=>a+c.totalExpenses,0);

    $('#mercadolivre').innerHTML=heading('Mercado Livre','Cálculo completo de custo, despesas, preço e lucro por pneu',`<button class="btn primary" onclick="showMLOpportunities()">⭐ Ver melhores para anunciar</button>`)+
      `<div class="notice"><b>Como funciona:</b> o custo vem da coluna <b>Custo</b> da planilha e o preço normal vem de <b>Valor Venda</b>. Para o Mercado Livre, o sistema soma custo do produto, comissão percentual, frete, outros custos e calcula o preço necessário para sobrar o lucro desejado. As taxas e o frete são estimativas configuráveis — confira os valores reais do anúncio antes de publicar.</div>
      <div class="cards">${metric('Produtos preparados',valid.length,'somente com estoque','green')}${metric('Despesas calculadas',money(totalExpenses),'soma das unidades exibidas','red')}${metric('Lucro alvo total',money(totalProfit),'1 unidade de cada','green')}${metric('Margem média',avgMargin.toFixed(1).replace('.',',')+'%','sobre o preço sugerido','green')}</div>
      <div class="card" style="margin-top:16px"><div class="panel-head"><div><h3 class="section-title" style="margin:0">Padrões do cálculo</h3><small class="cell-sub">Você pode alterar por produto depois</small></div></div><div class="form-grid">
        <label class="field"><span>Comissão/taxa Mercado Livre (%)</span><input id="mlDefaultFeePct" type="number" step="0.1" min="0" max="95" value="${data.settings.mlDefaultFeePct}"></label>
        <label class="field"><span>Frete médio pago pela loja (R$)</span><input id="mlDefaultFreight" type="number" step="0.01" min="0" value="${data.settings.mlDefaultFreight}"></label>
        <label class="field"><span>Outros custos por venda (R$)</span><input id="mlDefaultOther" type="number" step="0.01" min="0" value="${data.settings.mlDefaultOther}"></label>
        <label class="field"><span>Lucro desejado por pneu (R$)</span><input id="mlDefaultProfit" type="number" step="0.01" min="0" value="${data.settings.mlDefaultProfit}"></label>
      </div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="saveMLDefaults()">Salvar e recalcular todos</button><button class="btn ghost" onclick="showMLOpportunities()">Ranking pelo custo</button></div></div>
      <div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Código</th><th>Produto</th><th>Custo</th><th>Preço planilha</th><th>Taxa ML</th><th>Frete</th><th>Outros</th><th>Despesa total</th><th>Preço sugerido</th><th>Lucro / margem</th><th>Preço aplicado</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="12" class="empty">Importe a planilha de Carro ou Moto para gerar os cálculos.</td></tr>'}</tbody></table></div>`;
  };
})();
</script>

<script>
// Camada de apoio para precificação competitiva. A comparação real de anúncios exige dados atuais do Mercado Livre/API.
window.lePneusMarketStrategy = {
  mode:'competitivo',
  description:'Prioriza preço competitivo e mostra lucro estimado, sem impor lucro fixo.',
  calculate:function(cost, marketPrice, feePct, shipping, other){
    cost=Number(cost)||0; marketPrice=Number(marketPrice)||0; feePct=(Number(feePct)||0)/100; shipping=Number(shipping)||0; other=Number(other)||0;
    const fee=marketPrice*feePct; const profit=marketPrice-cost-fee-shipping-other; const margin=marketPrice?profit/marketPrice*100:0;
    return {price:marketPrice,fee,shipping,other,totalExpenses:cost+fee+shipping+other,profit,margin};
  }

<style>
.ml-v6-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ml-v6-toolbar input,.ml-v6-toolbar select{min-width:160px}
.ml-signal{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;white-space:nowrap}
.ml-signal.good{background:#dcfce7;color:#166534}
.ml-signal.mid{background:#fef3c7;color:#92400e}
.ml-signal.bad{background:#fee2e2;color:#991b1b}
.ml-signal.neutral{background:#e5e7eb;color:#374151}
.ml-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.ml-price-main{font-size:17px;font-weight:900}

@media(max-width:800px){.ml-history-row{grid-template-columns:1fr 1fr}.ml-v6-toolbar>*{width:100%}}
</style>
<script>
/* ===== Mercado Livre V6: preço competitivo, mínimo, Clássico/Premium, ranking, histórico e semáforo ===== */
(function(){
  function mlV6Ensure(){
    lpEnsureV3();
    data.settings=data.settings||{};
    if(data.settings.mlMinMarginPct===undefined)data.settings.mlMinMarginPct=5;
    if(data.settings.mlClassicFeePct===undefined)data.settings.mlClassicFeePct=Number(data.settings.mlDefaultFeePct??16);
    if(data.settings.mlPremiumFeePct===undefined)data.settings.mlPremiumFeePct=Math.min(95,Number(data.settings.mlClassicFeePct||16)+5);
    if(data.settings.mlPsychologicalPrice===undefined)data.settings.mlPsychologicalPrice=true;
    if(data.settings.mlCompetitiveDiscountPct===undefined)data.settings.mlCompetitiveDiscountPct=1;
    data.mercadoLivreItems=data.mercadoLivreItems||[];
    data.mercadoLivreItems.forEach(x=>{
      if(!Array.isArray(x.mlPriceHistory))x.mlPriceHistory=[];
      if(!x.mlListingStatus)x.mlListingStatus=x.status||'Preparando';
      if(x.mlMarketMin===undefined)x.mlMarketMin=0;
      if(x.mlMarketAvg===undefined)x.mlMarketAvg=0;
      if(x.mlSimilarListings===undefined)x.mlSimilarListings=0;
      if(x.mlMarketNote===undefined)x.mlMarketNote='';
    });
  }
  function n(v){v=Number(v);return Number.isFinite(v)?v:0}
  function pct(v){return Math.max(0,Math.min(95,n(v)))}
  function psych(v){
    v=Math.max(0,n(v));
    if(!data.settings.mlPsychologicalPrice)return Number(v.toFixed(2));
    let r=Math.ceil(v)-0.10;
    if(r+1e-9<v)r+=1;
    return Number(Math.max(0,r).toFixed(2));
  }
  function minPriceFor(p,x,feePct){
    const margin=pct(data.settings.mlMinMarginPct)/100;
    const fee=pct(feePct)/100;
    const base=n(p?.cost)+n(x?.mlFreight??data.settings.mlDefaultFreight)+n(x?.mlOtherCost??data.settings.mlDefaultOther);
    const den=1-fee-margin;
    return den>0?base/den:0;
  }
  function calcAt(p,x,price,feePct){
    price=n(price); feePct=pct(feePct);
    const fee=price*(feePct/100);
    const freight=n(x?.mlFreight??data.settings.mlDefaultFreight);
    const other=n(x?.mlOtherCost??data.settings.mlDefaultOther);
    const cost=n(p?.cost);
    const profit=price-cost-fee-freight-other;
    const margin=price>0?profit/price*100:0;
    return {price,feePct,fee,freight,other,cost,expenses:cost+fee+freight+other,profit,margin};
  }
  function marketTarget(p,x,feePct){
    const minimum=minPriceFor(p,x,feePct);
    const minMarket=n(x.mlMarketMin), avg=n(x.mlMarketAvg);
    const discount=pct(data.settings.mlCompetitiveDiscountPct)/100;
    let raw=0, source='';
    if(avg>0 && minMarket>0){
      raw=Math.min(avg*(1-discount),minMarket*1.02);
      source='concorrência';
    }else if(avg>0){
      raw=avg*(1-discount); source='média concorrentes';
    }else if(minMarket>0){
      raw=minMarket*1.02; source='menor concorrente';
    }else if(n(p.price)>0){
      raw=n(p.price); source='preço da planilha';
    }else{
      raw=minimum; source='preço mínimo';
    }
    let target=Math.max(minimum,raw);
    target=psych(target);
    return {minimum:psych(minimum),raw,target,source};
  }
  function bestPlan(p,x){
    const classicFee=pct(data.settings.mlClassicFeePct);
    const premiumFee=pct(data.settings.mlPremiumFeePct);
    const tc=marketTarget(p,x,classicFee), tp=marketTarget(p,x,premiumFee);
    const cc=calcAt(p,x,tc.target,classicFee), cp=calcAt(p,x,tp.target,premiumFee);
    /* escolhe pelo lucro líquido; benefício de exposição do Premium não é presumido */
    const chosen=cc.profit>=cp.profit?{type:'Clássico',calc:cc,target:tc}:{type:'Premium',calc:cp,target:tp};
    return {classic:{calc:cc,target:tc},premium:{calc:cp,target:tp},chosen};
  }
  function competitiveness(p,x,plan){
    const avg=n(x.mlMarketAvg), min=n(x.mlMarketMin), price=plan.chosen.calc.price, margin=plan.chosen.calc.margin;
    if(plan.chosen.calc.profit<0 || margin<0)return {cls:'bad',text:'Não compensa'};
    if(avg<=0 && min<=0){
      if(margin>=pct(data.settings.mlMinMarginPct))return {cls:'mid',text:'Falta comparar'};
      return {cls:'bad',text:'Margem baixa'};
    }
    let ref=avg||min;
    const delta=ref>0?(price-ref)/ref*100:0;
    if(delta<=1.5 && margin>=pct(data.settings.mlMinMarginPct))return {cls:'good',text:'Competitivo'};
    if(delta<=6 && margin>=pct(data.settings.mlMinMarginPct))return {cls:'mid',text:'Pode competir'};
    return {cls:'bad',text:'Preço alto'};
  }
  function marketSignal(x){
    const count=n(x.mlSimilarListings), avg=n(x.mlMarketAvg), min=n(x.mlMarketMin);
    if(!count && !avg && !min)return {cls:'neutral',text:'Sem dados de mercado'};
    /* não chama isso de demanda real: é apenas sinal manual baseado nos dados registrados */
    if(count>=5 && avg>0)return {cls:'good',text:'Mercado ativo*'};
    if(count>=2 || avg>0 || min>0)return {cls:'mid',text:'Alguns comparáveis*'};
    return {cls:'neutral',text:'Poucos dados*'};
  }
  function opportunityScore(p,x,plan){
    const c=plan.chosen.calc;
    if(c.profit<=0)return 0;
    const stock=Math.min(20,n(p.qty));
    const margin=Math.max(0,Math.min(30,c.margin));
    let comp=10;
    const avg=n(x.mlMarketAvg);
    if(avg>0){
      const d=Math.abs(c.price-avg)/avg*100;
      comp=Math.max(0,30-d*4);
    }
    const costBonus=n(p.cost)>0?Math.max(0,20-Math.min(20,n(p.cost)/50)):0;
    return Math.round(stock*1.5+margin*2+comp+costBonus);
  }
  function signalHTML(s){return `<span class="ml-signal ${s.cls}"><span class="ml-dot"></span>${esc(s.text)}</span>`}
  window.mlV6CompetitorModal=function(id){
    mlV6Ensure();
    const x=data.mercadoLivreItems.find(i=>Number(i.id)===Number(id));if(!x)return;
    const p=data.products.find(p=>String(p.id)===String(x.productId));if(!p)return;
    showModal(`<h2>Comparação de anúncios</h2>
      <div class="notice"><b>${esc(p.name)}</b><br>Pesquise anúncios iguais e registre aqui os valores encontrados. Isso permite ao sistema calcular um preço competitivo. Os dados não são coletados automaticamente sem integração oficial.</div>
      <div class="form-grid">
        <label class="field"><span>Menor preço semelhante (R$)</span><input id="mlv6Min" type="number" min="0" step="0.01" value="${n(x.mlMarketMin)||''}"></label>
        <label class="field"><span>Preço médio observado (R$)</span><input id="mlv6Avg" type="number" min="0" step="0.01" value="${n(x.mlMarketAvg)||''}"></label>
        <label class="field"><span>Quantidade de anúncios semelhantes</span><input id="mlv6Count" type="number" min="0" step="1" value="${n(x.mlSimilarListings)||''}"></label>
        <label class="field"><span>Observação</span><input id="mlv6Note" value="${esc(x.mlMarketNote||'')}" placeholder="Ex.: maioria com frete grátis"></label>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="searchMLSimilar(${x.id})">Abrir busca no Mercado Livre</button>
        <button class="btn primary" onclick="mlV6SaveCompetitors(${x.id})">Salvar comparação</button>
      </div>`);
  };
  window.mlV6SaveCompetitors=function(id){
    const x=data.mercadoLivreItems.find(i=>Number(i.id)===Number(id));if(!x)return;
    x.mlMarketMin=Math.max(0,n($('#mlv6Min')?.value));
    x.mlMarketAvg=Math.max(0,n($('#mlv6Avg')?.value));
    x.mlSimilarListings=Math.max(0,Math.round(n($('#mlv6Count')?.value)));
    x.mlMarketNote=String($('#mlv6Note')?.value||'').trim();
    x.updatedAt=nowBR();save();closeModal();renderMercadoLivre();
  };
  window.mlV6SaveDefaults=function(){
    mlV6Ensure();
    data.settings.mlClassicFeePct=pct($('#mlV6Classic')?.value);
    data.settings.mlPremiumFeePct=pct($('#mlV6Premium')?.value);
    data.settings.mlMinMarginPct=pct($('#mlV6MinMargin')?.value);
    data.settings.mlCompetitiveDiscountPct=pct($('#mlV6Discount')?.value);
    data.settings.mlDefaultFreight=Math.max(0,n($('#mlV6Freight')?.value));
    data.settings.mlDefaultOther=Math.max(0,n($('#mlV6Other')?.value));
    data.settings.mlPsychologicalPrice=!!$('#mlV6Psych')?.checked;
    save();renderMercadoLivre();alert('Estratégia do Mercado Livre salva e recalculada.');
  };
  window.mlV6ApplyPrice=function(id){
    mlV6Ensure();
    const x=data.mercadoLivreItems.find(i=>Number(i.id)===Number(id));if(!x)return;
    const p=data.products.find(p=>String(p.id)===String(x.productId));if(!p)return;
    const plan=bestPlan(p,x), c=plan.chosen.calc;
    x.mlPriceHistory.unshift({date:nowBR(),price:c.price,profit:c.profit,margin:c.margin,type:plan.chosen.type,reason:'Preço competitivo aplicado'});
    x.mlPriceHistory=x.mlPriceHistory.slice(0,50);

(function(){
 const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0}, M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

 window.renderDashboard=function(){const low=data.products.filter(p=>N(p.qty)<1).length,s=typeof activeSales==='function'?activeSales():data.sales;document.getElementById('dashboard').innerHTML=heading('Dashboard','Resumo da operação Le Pneus')+`<div class="cards">${metric('Faturamento',M(s.reduce((a,x)=>a+N(x.total),0)),'vendas ativas','green')}${metric('Itens zerados',low,low?'estoque abaixo de 1':'nenhum alerta',low?'red':'green')}${metric('Vendas',s.length,'registradas','green')}${metric('Produtos',data.products.length,'cadastrados','green')}</div>`};
 window.renderVendas=function(){const pend=(data.pendingImportDifferences||[]).filter(d=>N(d.diff)<0&&d.status==='Pendente');const cards=pend.map(d=>`<div class="lp-diff"><b>${esc(d.name)}</b><small class="cell-sub">Tinha ${N(d.oldQty)}, agora ${N(d.newQty)} — baixou ${Math.abs(N(d.diff))}</small><div class="actions" style="margin-top:9px"><button class="btn ghost small" onclick="lpResolveDifference(${d.id},'ajuste')">Foi ajuste</button><button class="btn primary small" onclick="lpDifferenceSaleModal(${d.id})">Dar baixa / vendido</button></div></div>`).join('');const rows=data.sales.map(s=>`<tr><td>#${s.id}</td><td>${esc(s.date||'')}</td><td>${esc(s.customer||'Consumidor')}</td><td>${M(s.total)}</td><td>${M(s.profit)}</td><td>${statusBadge(s.status||'Concluída')}</td></tr>`).join('');document.getElementById('vendas').innerHTML=heading('Vendas','Confirme as baixas detectadas na planilha',`<button class="btn primary" onclick="saleModal()">+ Venda manual</button>`)+`<div class="card"><h3 class="section-title">Baixas detectadas</h3>${cards||'<div class="empty">Nenhuma baixa pendente.</div>'}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Venda</th><th>Data</th><th>Cliente</th><th>Total</th><th>Lucro</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`};
 window.renderCatalogo=function(){const items=(data.catalogItems||[]).filter(x=>N(x.qty)>0);const rows=items.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.brand)}</td><td>${N(x.qty)}</td><td>${M(x.price)}</td></tr>`).join('');document.getElementById('catalogo').innerHTML=heading('Catálogo LePneus','Produtos disponíveis no catálogo público')+`<div class="cards">${metric('Produtos',items.length,'com estoque','green')}${metric('Unidades',items.reduce((a,x)=>a+N(x.qty),0),'disponíveis','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Código</th><th>Produto</th><th>Marca</th><th>Estoque</th><th>Preço</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">Nenhum produto no catálogo.</td></tr>'}</tbody></table></div>`};
 function opp(){return (data.mercadoLivreItems||[]).map(x=>{const p=data.products.find(p=>String(p.id)===String(x.productId));if(!p||N(p.qty)<=0)return null;const cost=N(p.cost),feePct=N(x.mlFeePct||data.settings.mlClassicFeePct||14),freight=N(x.mlFreight||data.settings.mlDefaultFreight),other=N(x.mlOtherCost||data.settings.mlDefaultOther),base=Math.max(N(p.price),cost+freight+other);const price=base*1.05,fee=price*feePct/100,fiscal=price*.05,profit=price-cost-fee-fiscal-freight-other,margin=price?profit/price*100:0;return{x,p,cost,feePct,freight,other,price,fee,fiscal,profit,margin}}).filter(Boolean).sort((a,b)=>b.profit-a.profit).slice(0,30)}
 window.mlShowTop30=function(){const cards=opp().map((r,i)=>`<div class="lp-opp"><b>#${i+1} • ${esc(r.p.name)}</b><div class="lp-grid" style="margin-top:10px"><div class="lp-box"><span>Custo</span><b>${M(r.cost)}</b></div><div class="lp-box"><span>Preço sugerido</span><b>${M(r.price)}</b></div><div class="lp-box"><span>Taxa ML</span><b>${M(r.fee)}</b></div><div class="lp-box"><span>Reserva fiscal 5%</span><b>${M(r.fiscal)}</b></div><div class="lp-box"><span>Frete + outros</span><b>${M(r.freight+r.other)}</b></div><div class="lp-box"><span>Lucro</span><b>${M(r.profit)} (${r.margin.toFixed(1)}%)</b></div></div></div>`).join('');showModal(`<h2>30 melhores oportunidades</h2><div class="notice">Preço-base + 5% e reserva fiscal de 5%. Valores de concorrência continuam manuais.</div>${cards||'<div class="empty">Nenhuma oportunidade.</div>'}`)};
 window.renderMercadoLivre=function(){const a=opp(),good=a.filter(r=>r.profit>0&&r.margin>=10);document.getElementById('mercadolivre').innerHTML=heading('Mercado Livre','Visão simples das oportunidades, sem listar todo o estoque',`<button class="btn primary" onclick="mlShowTop30()">Ver 30 melhores</button>`)+`<div class="cards">${metric('Oportunidades',a.length,'máximo 30','green')}${metric('Compensam',good.length,'lucro positivo','green')}${metric('Melhor lucro',M(a[0]?.profit||0),'estimado por unidade','green')}${metric('Reserva fiscal','5%','separada no cálculo','green')}</div><div class="card" style="margin-top:16px"><div class="notice">O cálculo mostra custo, taxa ML, frete/outros, reserva fiscal de 5% e lucro. O preço sugerido recebe +5%.</div><button class="btn primary" onclick="mlShowTop30()">Abrir oportunidades</button></div>`};
 window.renderClientes=function(){const rows=data.customers.map(c=>{const sales=(typeof activeSales==='function'?activeSales():data.sales).filter(s=>String(s.customerId)===String(c.id)||String(s.customer||'').toLowerCase()===String(c.name||'').toLowerCase());let last=sales[0];const item=last?.items?.[0]?.name||'Nenhuma compra';let days='-';if(last?.date){const d=typeof parseBRDateTime==='function'?parseBRDateTime(last.date):new Date(last.date);if(d&&!isNaN(d))days=Math.max(0,Math.floor((Date.now()-d)/86400000))+' dia(s)'}return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'-')}</td><td>${sales.length}</td><td>${esc(item)}</td><td>${days}</td><td><button class="btn ghost small" onclick="customerDetail(${c.id})">Ver detalhes</button></td></tr>`}).join('');document.getElementById('clientes').innerHTML=heading('Clientes','Compras e tempo desde a última compra',`<button class="btn primary" onclick="customerModalV2()">+ Cliente</button>`)+`<div class="card table-wrap"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Compras</th><th>Último produto</th><th>Tempo</th><th>Ação</th></tr></thead><tbody>${rows}</tbody></table></div>`};
 // modal display fix
 const oldShow=window.showModal;window.showModal=function(x){if(typeof oldShow==='function')oldShow(x);const m=document.getElementById('modal');if(m){m.style.display='flex';m.style.pointerEvents='auto'}};const oldClose=window.closeModal;window.closeModal=function(){try{oldClose?.()}catch(e){}const m=document.getElementById('modal');if(m){m.classList.remove('show');m.style.display='none';m.style.pointerEvents='none'}document.body.style.overflow=''};
 document.body.classList.remove('dark');try{localStorage.setItem('theme','light')}catch(e){}
})();
</script>
