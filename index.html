body.dark{
  --bg:#0d1422;
  --panel:#121c2d;
  --panel2:#0f1828;
  --text:#eff4fb;
  --muted:#94a0b4;
  --line:#263249;
  --primary-soft:#202b52;
}
body{background:var(--bg);font-size:14px}
.sidebar{width:auto;background:#111827;padding:18px 13px;border-right:1px solid rgba(255,255,255,.045)}
.brand{margin-bottom:14px;padding:5px 9px 18px}
.brand img{filter:drop-shadow(0 6px 12px rgba(0,0,0,.16))}
.brand-copy strong{font-size:15px;letter-spacing:-.02em}
.brand-copy small{font-size:9px;color:#7f8ba0}
.nav-label{font-size:9px;padding:0 11px 7px;color:#5e6b80}
.nav button{min-height:42px;padding:10px 11px;border-radius:10px;font-size:13px;color:#9aa5b7}
.nav button:hover{transform:none;background:rgba(255,255,255,.05)}
.nav button.active{background:rgba(79,99,230,.16);box-shadow:inset 3px 0 #667cff}
.topbar{height:70px;padding:0 26px;background:color-mix(in srgb,var(--panel) 94%,transparent)}
.search input{height:42px;background:var(--panel2);border-radius:12px}
.content{padding:26px 30px 44px;max-width:1580px}
.heading{margin-bottom:18px}
.heading h1{font-size:25px;font-weight:800;letter-spacing:-.035em}
.heading p{font-size:13px;max-width:760px}
.cards{gap:13px}
.card{
  border-radius:14px;
  border:1px solid var(--line);
  padding:16px;
  box-shadow:var(--shadow);
}
.metric .value{font-size:24px;letter-spacing:-.04em}
.metric .label{font-size:12px}
.metric .delta{font-size:11px}
.grid2{gap:13px;margin-top:13px}
.btn{min-height:38px;border-radius:9px;padding:8px 13px;font-size:13px}
.btn.primary{background:var(--primary);box-shadow:none}
.btn.primary:hover{background:var(--primary2);transform:none}
.btn.ghost:hover{background:var(--panel2);transform:none}
.toolbar{gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select,.form input,.form select,.form textarea,
.form-grid input,.form-grid select,.form-grid textarea{
  border-radius:9px!important;
  border:1px solid var(--line)!important;
  background:var(--panel)!important;
  min-height:40px;
}
table{min-width:760px}
th{font-size:10px;letter-spacing:.055em;background:var(--panel2);position:sticky;top:0;z-index:1}
th,td{padding:11px 10px}
tbody tr:hover{background:color-mix(in srgb,var(--primary-soft) 34%,transparent)}
.badge{padding:4px 7px;font-size:10px}
.notice{border-radius:11px!important;padding:12px 13px!important}
.alert{border-radius:9px;padding:11px}
.modal{backdrop-filter:blur(3px)}
.modal-card{border-radius:16px;box-shadow:var(--shadow-lg);padding:19px}
.section-title{font-size:16px}
.summary-list>div{padding:10px 0}
.soft-chip{font-size:10px;padding:5px 8px}
.table-wrap{border-radius:10px}
#backup .grid2 .card,#planilhas .settings-grid .card{min-height:190px}
@media(max-width:1100px){
  .content{padding:22px}
}
@media(max-width:800px){
  .content{padding:16px 13px 34px}
  .topbar{height:64px;padding:0 12px}
  .heading{align-items:flex-start;flex-direction:column}
  .heading h1{font-size:22px}
  .actions{flex-wrap:wrap}
  .btn{min-height:40px}
}
</style>

function sheetConnectionLabel(type){
 const names={carro:'Estoque Carro',moto:'Estoque Moto',acessorios:'Estoque Acessórios'};
 return names[type]||type;
}
function spreadsheetInputId(type){return 'sheetFile_'+type}
function connectSpreadsheet(type){
 const input=document.getElementById(spreadsheetInputId(type));
 if(!input||!input.files||!input.files[0])return alert('Escolha a planilha '+sheetConnectionLabel(type)+'.');
 const f=input.files[0];
 data.spreadsheetConnections=data.spreadsheetConnections||{};
 data.spreadsheetConnections[type]={name:f.name,size:f.size,lastModified:f.lastModified,connectedAt:new Date().toLocaleString('pt-BR'),status:'Selecionada'};
 save();
 alert('Planilha '+sheetConnectionLabel(type)+' selecionada. Nesta versão o sistema registra a conexão; a leitura automática dos dados será ativada na etapa de sincronização.');
 renderAll();
}
function disconnectSpreadsheet(type){
 if(!confirm('Desconectar '+sheetConnectionLabel(type)+'?'))return;
 delete data.spreadsheetConnections[type];save();renderAll();
}
function renderPlanilhas(){
 ensureData();
 const cards=['carro','moto','acessorios'].map(type=>{
  const c=data.spreadsheetConnections[type];
  return `<div class="card"><div class="panel-head"><div><h3 class="section-title" style="margin:0">${sheetConnectionLabel(type)}</h3><small class="cell-sub">${type==='carro'?'Pneus de carro':type==='moto'?'Pneus de moto':'Câmaras, rodas, peças e acessórios'}</small></div>${c?'<span class="badge ok">Selecionada</span>':'<span class="badge warn">Não conectada</span>'}</div>
  ${c?`<div class="notice"><b>Arquivo:</b> ${esc(c.name)}<br><b>Selecionado em:</b> ${esc(c.connectedAt)}</div>`:'<p style="color:var(--muted);font-size:13px">Escolha a planilha original usada para este estoque.</p>'}
  <input id="${spreadsheetInputId(type)}" type="file" accept=".xlsx,.xls" style="width:100%;margin:10px 0 12px">
  <div class="actions"><button class="btn primary" onclick="connectSpreadsheet('${type}')">${c?'Trocar planilha':'Escolher planilha'}</button>${c?`<button class="btn ghost" onclick="disconnectSpreadsheet('${type}')">Desconectar</button>`:''}</div></div>`
 }).join('');

 $('#planilhas').innerHTML=heading('Conexão Planilhas','Selecione somente as três planilhas que serão usadas no estoque')+

 <div class="cards">${metric('Planilhas previstas','3','Carro • Moto • Acessórios','green')}${metric('Selecionadas',connected,'neste navegador',connected===3?'green':'red')}${metric('Fluxo Usados','Fora','não será utilizado','green')}</div>
 <div class="settings-grid" style="margin-top:16px">${cards}</div>`;
}

function productModal(id){let p=id?data.products.find(x=>x.id===id):{};showModal(`<h2>${id?'Editar':'Novo'} produto</h2><div class="form"><label>Código<input id="pcode" value="${p.code||''}"></label><label>Nome<input id="pname" value="${p.name||''}"></label><label>Categoria<input id="pcat" value="${p.category||''}"></label><label>Marca<input id="pbrand" value="${p.brand||''}"></label><label>Quantidade<input id="pqty" type="number" value="${p.qty||0}"></label><label>Estoque mínimo<input id="pmin" type="number" value="${p.min||0}"></label><label>Custo<input id="pcost" type="number" step="0.01" value="${p.cost||0}"></label><label>Preço<input id="pprice" type="number" step="0.01" value="${p.price||0}"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProduct(${id||'null'})">Salvar</button></div>`)}

function editProduct(id){productModal(id)} function deleteProduct(id){let p=data.products.find(x=>x.id===id);if(confirm('Excluir este produto?')){data.products=data.products.filter(x=>x.id!==id);log('Excluiu produto '+p.name);save();renderAll()}}
function mlStatusBadge(status){let cls=status==='Vendido'?'ok':status==='Publicado'?'ok':status==='Pausado'?'danger':'warn';return `<span class="badge ${cls}">${esc(status||'Importado')}</span>`}
function sendToMercadoLivre(id){ensureData();let p=data.products.find(x=>x.id===id);if(!p)return;let exists=data.mercadoLivreItems.find(x=>String(x.productId)===String(id));if(exists){exists.code=p.code;exists.name=p.name;exists.brand=p.brand;exists.category=p.category;exists.qty=p.qty;exists.price=p.price;exists.updatedAt=new Date().toLocaleString('pt-BR');alert('Produto atualizado na fila do Mercado Livre.');}else{data.mercadoLivreItems.unshift({id:Date.now(),productId:p.id,code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price,status:'Importado',sales:0,orderStatus:'Aguardando publicação',importedAt:new Date().toLocaleString('pt-BR')});log('Importou produto para Mercado Livre: '+p.name);alert('Produto importado para a aba Mercado Livre. Ainda NÃO foi publicado no Mercado Livre.');}save();renderAll()}
function sendToCatalogo(id){ensureData();let p=data.products.find(x=>x.id===id);if(!p)return;let exists=data.catalogItems.find(x=>String(x.productId)===String(id));if(exists){Object.assign(exists,{code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price,updatedAt:new Date().toLocaleString('pt-BR')});alert('Produto atualizado no Catálogo LePneus.');}else{data.catalogItems.unshift({id:Date.now(),productId:p.id,code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price,status:'Ativo',importedAt:new Date().toLocaleString('pt-BR')});log('Enviou produto ao Catálogo LePneus: '+p.name);alert('Produto adicionado à aba Catálogo LePneus.');}save();renderAll()}

function removeFromCatalog(id){if(!confirm('Remover este produto do Catálogo LePneus?'))return;data.catalogItems=data.catalogItems.filter(x=>x.id!==id);save();renderAll()}

hum produto.</td></tr>'}</tbody></table></div></div>`}

function mlManualSave(){
 ensureData();
 const pid=Number($('#mlProduct')?.value||0);
 const p=data.products.find(x=>Number(x.id)===pid);
 if(!p)return alert('Escolha um produto do estoque.');
 const advertised=Number($('#mlPrice')?.value||0);
 const fee=Number($('#mlFee')?.value||0);
 const freight=Number($('#mlFreight')?.value||0);
 const other=Number($('#mlOther')?.value||0);
 const qty=Number($('#mlQty')?.value||1);
 const listingId=String($('#mlListingId')?.value||'').trim();
 if(advertised<=0)return alert('Informe o preço anunciado no Mercado Livre.');
 let item=data.mercadoLivreItems.find(x=>String(x.productId)===String(pid));
 if(!item){
   item={id:Date.now(),productId:p.id,code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,sales:0};
   data.mercadoLivreItems.unshift(item);
 }
 item.price=p.price;
 item.mlAdvertisedPrice=advertised;
 item.mlFee=fee;
 item.mlFreight=freight;
 item.mlOtherCost=other;
 item.mlQty=qty>0?qty:1;
 item.mlListingId=listingId;
 item.status='Publicado manualmente';
 item.orderStatus='Controle manual';
 item.updatedAt=new Date().toLocaleString('pt-BR');
 save();renderAll();
 alert('Dados do anúncio do Mercado Livre salvos no controle.');
}
function editMLManual(id){
 ensureData();
 const x=data.mercadoLivreItems.find(i=>Number(i.id)===Number(id));
 if(!x)return;
 const p=data.products.find(p=>String(p.id)===String(x.productId));
 const advertised=prompt('Preço anunciado no Mercado Livre:',x.mlAdvertisedPrice??x.price??p?.price??0);
 if(advertised===null)return;
 const fee=prompt('Taxas/comissão do Mercado Livre (R$):',x.mlFee??0); if(fee===null)return;
 const freight=prompt('Custo de frete que ficou por sua conta (R$):',x.mlFreight??0); if(freight===null)return;
 const other=prompt('Outros custos do anúncio/venda (R$):',x.mlOtherCost??0); if(other===null)return;
 const listing=prompt('Código/ID do anúncio no Mercado Livre (opcional):',x.mlListingId??''); if(listing===null)return;
 x.mlAdvertisedPrice=Number(advertised)||0;
 x.mlFee=Number(fee)||0;
 x.mlFreight=Number(freight)||0;
 x.mlOtherCost=Number(other)||0;
 x.mlListingId=listing.trim();
 x.status='Publicado manualmente';
 x.orderStatus='Controle manual';
 x.updatedAt=new Date().toLocaleString('pt-BR');
 save();renderAll();
}
function mlCalc(x,p){
 const price=Number(x.mlAdvertisedPrice??x.price??0);
 const fee=Number(x.mlFee||0);
 const freight=Number(x.mlFreight||0);
 const other=Number(x.mlOtherCost||0);
 const cost=Number(p?.cost||0);
 const net=price-fee-freight-other;
 const profit=net-cost;
 const margin=price>0?(profit/price*100):0;
 return {price,fee,freight,other,cost,net,profit,margin};
}

function renderMercadoLivre(){
 ensureData();
 const opts=data.products.map(p=>`<option value="${p.id}">${esc(p.code)} — ${esc(p.name)}</option>`).join('');
 let rows=data.mercadoLivreItems.map(x=>{
   let p=data.products.find(p=>String(p.id)===String(x.productId));
   if(p){x.qty=p.qty;x.name=p.name;x.code=p.code;x.brand=p.brand}
   const c=mlCalc(x,p);
   return `<tr>
   <td>${esc(x.code)}</td>
   <td>${esc(x.name)}${x.mlListingId?`<small class="cell-sub">Anúncio: ${esc(x.mlListingId)}</small>`:''}</td>
   <td>${x.qty}</td>
   <td>${money(c.cost)}</td>
   <td>${money(c.price)}</td>
   <td>${money(c.fee)}</td>
   <td>${money(c.freight)}</td>
   <td>${money(c.other)}</td>
   <td><b>${money(c.net)}</b></td>
   <td><b>${money(c.profit)}</b><small class="cell-sub">${c.margin.toFixed(1)}% margem</small></td>
   <td>${mlStatusBadge(x.status||'Controle manual')}</td>
   <td><div class="actions"><button class="btn ghost small" onclick="editMLManual(${x.id})">Editar</button><button class="btn ghost small" onclick="removeFromML(${x.id})">Remover</button></div></td>
   </tr>`
 }).join('');
 const totalRevenue=data.mercadoLivreItems.reduce((a,x)=>{const p=data.products.find(p=>String(p.id)===String(x.productId));return a+mlCalc(x,p).price},0);
 const totalCosts=data.mercadoLivreItems.reduce((a,x)=>{const p=data.products.find(p=>String(p.id)===String(x.productId));const c=mlCalc(x,p);return a+c.cost+c.fee+c.freight+c.other},0);
 const totalProfit=totalRevenue-totalCosts;
 $('#mercadolivre').innerHTML=heading('Mercado Livre','Controle manual dos anúncios e custos do Mercado Livre')+
 `<div class="notice"><b>Modo manual:</b> você publica o anúncio diretamente no Mercado Livre e registra aqui os dados para acompanhar preço, custo do produto, comissão/taxas, frete, outros custos e lucro estimado. Esta tela não publica nem altera anúncios no Mercado Livre.</div>
 <div class="cards">
 ${metric('Anúncios controlados',data.mercadoLivreItems.length,'registrados manualmente','green')}
 ${metric('Valor anunciado',money(totalRevenue),'soma dos preços informados','green')}
 ${metric('Custos estimados',money(totalCosts),'produto + taxas + frete + outros','red')}
 ${metric('Lucro estimado',money(totalProfit),'antes de outros impostos/despesas','green')}
 </div>
 <div class="card" style="margin-top:16px">
   <div class="panel-head"><div><h3 class="section-title" style="margin:0">Registrar anúncio manual</h3><small class="cell-sub">Escolha um produto que já existe no estoque</small></div></div>
   <div class="form-grid">
     <label class="field"><span>Produto do estoque</span><select id="mlProduct"><option value="">Selecione...</option>${opts}</select></label>
     <label class="field"><span>Preço anunciado (R$)</span><input id="mlPrice" type="number" step="0.01" min="0" placeholder="0,00"></label>
     <label class="field"><span>Taxas / comissão ML (R$)</span><input id="mlFee" type="number" step="0.01" min="0" value="0"></label>
     <label class="field"><span>Frete por sua conta (R$)</span><input id="mlFreight" type="number" step="0.01" min="0" value="0"></label>
     <label class="field"><span>Outros custos (R$)</span><input id="mlOther" type="number" step="0.01" min="0" value="0"></label>

 </div>
 <div class="card table-wrap" style="margin-top:16px"><table>
 <thead><tr><th>Código</th><th>Produto</th><th>Estoque</th><th>Custo produto</th><th>Preço ML</th><th>Taxas ML</th><th>Frete</th><th>Outros</th><th>Líquido</th><th>Lucro estimado</th><th>Status</th><th>Ação</th></tr></thead>
 <tbody>${rows||'<tr><td colspan="12" class="empty">Nenhum anúncio registrado ainda.</td></tr>'}</tbody></table></div>`;
}
function reminderModal(){let now=new Date(Date.now()+60*60*1000);now.setMinutes(now.getMinutes()-now.getTimezoneOffset());showModal(`<h2>Novo compromisso</h2><div class="form"><label class="full">Título<input id="rtitle" placeholder="Ex.: Retornar para cliente"></label><label>Data e hora<input id="rdatetime" type="datetime-local" value="${now.toISOString().slice(0,16)}"></label><label>Prioridade<select id="rpriority"><option>Média</option><option>Alta</option><option>Baixa</option></select></label><label>Cliente/Contato<input id="rcustomer" placeholder="Opcional"></label><label>Tipo<select id="rtype"><option>Compromisso</option><option>Ligação</option><option>Cobrança</option><option>Venda</option><option>Orçamento</option><option>Ordem de Serviço</option><option>Outro</option></select></label><label class="full">Observações<textarea id="rnotes" rows="3"></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveReminder()">Salvar lembrete</button></div>`)}
function saveReminder(){let title=$('#rtitle').value.trim(),datetime=$('#rdatetime').value;if(!title||!datetime)return alert('Informe o título e a data/hora.');data.reminders.push({id:Date.now(),title,datetime,priority:$('#rpriority').value,customer:$('#rcustomer').value.trim(),type:$('#rtype').value,notes:$('#rnotes').value.trim(),status:'Pendente',notified:false});log('Criou lembrete: '+title);save();closeModal();renderAll()}
function completeReminder(id){let r=data.reminders.find(x=>x.id===id);if(!r)return;r.status=r.status==='Concluído'?'Pendente':'Concluído';log((r.status==='Concluído'?'Concluiu':'Reabriu')+' lembrete: '+r.title);save();renderAll()}
function deleteReminder(id){if(confirm('Excluir este lembrete?')){data.reminders=data.reminders.filter(x=>x.id!==id);save();renderAll()}}
function filterAgenda(v){document.querySelectorAll('#agendaList .agenda-item').forEach((el,i)=>{let r=[...data.reminders].sort((a,b)=>new Date(a.datetime)-new Date(b.datetime))[i];el.style.display=(v==='all'||(v==='done'&&r.status==='Concluído')||(v==='pending'&&r.status!=='Concluído'))?'':'none'})}
function requestNotifications(){if(!('Notification'in window))return alert('Seu navegador não oferece notificações.');Notification.requestPermission().then(p=>alert(p==='granted'?'Notificações ativadas.':'Permissão não concedida.'))}
function checkReminders(){let now=Date.now(),lead=(+data.settings.reminderMinutes||30)*60000;data.reminders.forEach(r=>{if(r.status==='Concluído'||r.notified)return;let t=new Date(r.datetime).getTime();if(t-now<=lead&&t-now>-60000){r.notified=true;save();if(data.settings.browserNotifications&&'Notification'in window&&Notification.permission==='granted')new Notification('Lembrete: '+r.title,{body:new Date(r.datetime).toLocaleString('pt-BR')+(r.customer?' • '+r.customer:'')});}})}
function waPhone(v){return String(v||'').replace(/\D/g,'')}
function waText(text,name='cliente',date='',time=''){return String(text||'').replaceAll('{nome}',name||'cliente').replaceAll('{data}',date||'').replaceAll('{hora}',time||'')+(data.settings.whatsappSignature?'\n\n'+data.settings.whatsappSignature:'')}
function renderWhatsApp(){let msgs=[...data.whatsappMessages].sort((a,b)=>new Date(b.datetime)-new Date(a.datetime));let rows=msgs.map(m=>`<tr><td>${esc(m.contact)}</td><td>${esc(m.phone)}</td><td>${new Date(m.datetime).toLocaleString('pt-BR')}</td><td><span class="badge ${m.status==='Enviado'?'ok':m.status==='Erro'?'danger':'warn'}">${m.status}</span></td><td><div class="actions"><button class="btn ghost small" onclick="openWhatsApp(${m.id})">Abrir WhatsApp</button><button class="btn ghost small" onclick="deleteWaMessage(${m.id})">Excluir</button></div></td></tr>`).join('');
 $('#whatsapp').innerHTML=heading('Mensagens no WhatsApp','Modelos, agendamentos e automações de atendimento',`<button class="btn primary" onclick="waMessageModal()">+ Agendar mensagem</button>`)+`<div class="notice"><b>Envio automático:</b> para mandar sem clicar, configure um webhook/backend conectado à <b>API oficial do WhatsApp Business</b>. Sem essa integração, o botão “Abrir WhatsApp” prepara a mensagem para você confirmar o envio.</div><div class="cards">${metric('Agendadas',data.whatsappMessages.filter(m=>m.status==='Agendado').length,'aguardando horário','green')}${metric('Enviadas',data.whatsappMessages.filter(m=>m.status==='Enviado').length,'histórico','green')}${metric('Modelos',data.whatsappTemplates.length,'mensagens prontas','green')}${metric('Automação',data.settings.whatsappAuto?'ATIVA':'DESATIVADA',data.settings.whatsappWebhook?'webhook configurado':'configure em Configurações',data.settings.whatsappAuto?'green':'red')}</div><div class="grid2"><div class="card table-wrap"><h3 class="section-title">Fila de mensagens</h3><table><thead><tr><th>Contato</th><th>Telefone</th><th>Data/Hora</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">Nenhuma mensagem agendada.</td></tr>'}</tbody></table></div><div class="card"><h3 class="section-title">Modelos rápidos</h3>${data.whatsappTemplates.map(t=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b style="font-size:13px">${esc(t.name)}</b><div class="wa-bubble" style="margin-top:8px">${esc(t.text)}</div></div>`).join('')}<button class="btn ghost" style="margin-top:12px" onclick="waTemplateModal()">+ Criar modelo</button></div></div>`
}
function waMessageModal(){let opts=data.whatsappTemplates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');let now=new Date(Date.now()+5*60000);now.setMinutes(now.getMinutes()-now.getTimezoneOffset());showModal(`<h2>Agendar mensagem</h2><div class="form"><label>Contato<input id="wacontact" placeholder="Nome do cliente"></label><label>Telefone com DDD<input id="waphone" placeholder="45999999999"></label><label>Modelo<select id="watemplate" onchange="loadWaTemplate()"><option value="">Escrever mensagem</option>${opts}</select></label><label>Data e hora<input id="wadatetime" type="datetime-local" value="${now.toISOString().slice(0,16)}"></label><label class="full">Mensagem<textarea id="watext" rows="5" placeholder="Olá, {nome}!"></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveWaMessage()">Agendar</button></div>`)}
function loadWaTemplate(){let t=data.whatsappTemplates.find(x=>x.id==$('#watemplate').value);if(t)$('#watext').value=t.text}
function saveWaMessage(){let contact=$('#wacontact').value.trim(),phone=waPhone($('#waphone').value),text=$('#watext').value.trim(),datetime=$('#wadatetime').value;if(!contact||phone.length<10||!text||!datetime)return alert('Preencha contato, telefone, mensagem e data/hora.');data.whatsappMessages.push({id:Date.now(),contact,phone,text,datetime,status:'Agendado',lastError:''});log('Agendou mensagem de WhatsApp para '+contact);save();closeModal();renderAll()}
function waTemplateModal(){showModal(`<h2>Novo modelo de WhatsApp</h2><div class="form"><label class="full">Nome do modelo<input id="wtname"></label><label class="full">Mensagem<textarea id="wttext" rows="6" placeholder="Use {nome}, {data} e {hora} quando quiser."></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveWaTemplate()">Salvar modelo</button></div>`)}
function saveWaTemplate(){let name=$('#wtname').value.trim(),text=$('#wttext').value.trim();if(!name||!text)return alert('Preencha nome e mensagem.');data.whatsappTemplates.push({id:Date.now(),name,text});save();closeModal();renderAll()}
function openWhatsApp(id){let m=data.whatsappMessages.find(x=>x.id===id);if(!m)return;let d=new Date(m.datetime),text=waText(m.text,m.contact,d.toLocaleDateString('pt-BR'),d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));window.open('https://wa.me/'+m.phone+'?text='+encodeURIComponent(text),'_blank')}
function deleteWaMessage(id){if(confirm('Excluir mensagem agendada?')){data.whatsappMessages=data.whatsappMessages.filter(x=>x.id!==id);save();renderAll()}}
async function processWhatsAppQueue(){if(!data.settings.whatsappAuto||!data.settings.whatsappWebhook)return;let due=data.whatsappMessages.filter(m=>m.status==='Agendado'&&new Date(m.datetime).getTime()<=Date.now());for(const m of due){try{let d=new Date(m.datetime),text=waText(m.text,m.contact,d.toLocaleDateString('pt-BR'),d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));let res=await fetch(data.settings.whatsappWebhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:m.phone,name:m.contact,message:text,scheduledAt:m.datetime})});if(!res.ok)throw new Error('HTTP '+res.status);m.status='Enviado';m.sentAt=new Date().toISOString();log('Enviou mensagem automática de WhatsApp para '+m.contact)}catch(e){m.status='Erro';m.lastError=e.message;save()}}save()}
function renderConfig(){let s=data.settings; $('#configuracoes').innerHTML=heading('Configurações','Personalize empresa, financeiro, estoque, notificações, segurança e integrações')+`<div class="settings-grid">
<div class="settings-section full"><div class="settings-head"><div class="settings-icon">🏢</div><div><h3>Dados da empresa</h3><p>Informações usadas em relatórios, documentos e atendimento</p></div></div><div class="form"><label>Razão social<input id="companyName" value="${esc(s.company)}"></label><label>Nome fantasia<input id="companyFantasy" value="${esc(s.fantasy)}"></label><label>CNPJ/CPF<input id="companyDoc" value="${esc(s.cnpj)}"></label><label>Telefone<input id="companyPhone" value="${esc(s.phone)}"></label><label>WhatsApp<input id="companyWhatsapp" value="${esc(s.whatsapp)}"></label><label>E-mail<input id="companyEmail" value="${esc(s.email)}"></label><label class="full">Endereço<input id="companyAddress" value="${esc(s.address)}"></label><label>Cidade/UF<input id="companyCity" value="${esc(s.city)}"></label><label>Moeda<select id="currency"><option value="BRL" ${s.currency==='BRL'?'selected':''}>Real (BRL)</option></select></label></div></div>
<div class="settings-section"><div class="settings-head"><div class="settings-icon">💰</div><div><h3>Financeiro e vendas</h3><p>Padrões para novas operações</p></div></div><div class="form"><label>Pagamento padrão<select id="defaultPayment">${['PIX','Dinheiro','Débito','Crédito','Boleto','Transferência'].map(x=>`<option ${s.defaultPayment===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Comissão padrão (%)<input id="commission" type="number" step="0.01" value="${s.commission}"></label></div></div>
<div class="settings-section"><div class="settings-head"><div class="settings-icon">📦</div><div><h3>Estoque</h3><p>Regras e alertas de produtos</p></div></div><div class="form"><label>Estoque mínimo padrão<input id="defaultMinStock" type="number" value="${s.defaultMinStock}"></label></div><div class="switch-row"><div><strong>Confirmar operações críticas</strong><small>Exclusões e alterações importantes</small></div><label class="switch"><input id="confirmCritical" type="checkbox" ${s.confirmCritical?'checked':''}><span class="slider"></span></label></div></div>
<div class="settings-section"><div class="settings-head"><div class="settings-icon">🔔</div><div><h3>Notificações e lembretes</h3><p>Como o sistema deve avisar você</p></div></div><div class="form"><label>Avisar com antecedência<input id="reminderMinutes" type="number" min="0" value="${s.reminderMinutes}"></label><label>Unidade<select disabled><option>minutos</option></select></label></div><div class="switch-row"><div><strong>Notificações do navegador</strong><small>Exibir lembretes quando o sistema estiver aberto</small></div><label class="switch"><input id="browserNotifications" type="checkbox" ${s.browserNotifications?'checked':''}><span class="slider"></span></label></div></div>
<div class="settings-section full"><div class="settings-head"><div class="settings-icon">💬</div><div><h3>WhatsApp Business</h3><p>Agendamento e integração de mensagens automáticas</p></div></div><div class="notice">Para envio realmente automático, use um backend/webhook conectado à API oficial do WhatsApp Business. Evite colocar tokens secretos diretamente neste arquivo HTML.</div><div class="form"><label>WhatsApp da empresa<input id="waBusiness" value="${esc(s.whatsapp)}" placeholder="5545999999999"></label><label>Webhook do seu backend<input id="waWebhook" value="${esc(s.whatsappWebhook)}" placeholder="https://seu-servidor.com/api/whatsapp/send"></label><label class="full">Assinatura padrão<textarea id="waSignature" rows="2" placeholder="Equipe da empresa">${esc(s.whatsappSignature)}</textarea></label></div><div class="switch-row"><div><strong>Ativar envio automático</strong><small>Mensagens vencidas serão enviadas ao webhook configurado</small></div><label class="switch"><input id="waAuto" type="checkbox" ${s.whatsappAuto?'checked':''}><span class="slider"></span></label></div></div>
<div class="settings-section"><div class="settings-head"><div class="settings-icon">🔐</div><div><h3>Segurança</h3><p>Sessão e controles administrativos</p></div></div><div class="form"><label>Tempo de sessão (min)<input id="sessionMinutes" type="number" value="${s.sessionMinutes}"></label><label>Fuso horário<select id="timezone"><option value="America/Sao_Paulo" ${s.timezone==='America/Sao_Paulo'?'selected':''}>Brasília / São Paulo</option></select></label></div></div>
<div class="settings-section"><div class="settings-head"><div class="settings-icon">💾</div><div><h3>Backup e dados</h3><p>Proteção e portabilidade das informações</p></div></div><div class="switch-row"><div><strong>Backup automático local</strong><small>Cria cópia local ao salvar alterações</small></div><label class="switch"><input id="autoBackup" type="checkbox" ${s.autoBackup?'checked':''}><span class="slider"></span></label></div><div class="toolbar" style="margin-top:12px"><button class="btn ghost" onclick="exportBackup()">Exportar backup</button><button class="btn ghost" onclick="importBackup()">Importar backup</button></div></div>
</div><div class="config-actions"><button class="btn ghost" onclick="renderConfig()">Descartar</button><button class="btn primary" onclick="saveSettings()">Salvar configurações</button></div>`}
function saveSettings(){let s=data.settings;s.company=$('#companyName').value;s.fantasy=$('#companyFantasy').value;s.cnpj=$('#companyDoc').value;s.phone=$('#companyPhone').value;s.whatsapp=$('#companyWhatsapp').value;s.email=$('#companyEmail').value;s.address=$('#companyAddress').value;s.city=$('#companyCity').value;s.currency=$('#currency').value;s.defaultPayment=$('#defaultPayment').value;s.commission=+$('#commission').value||0;s.defaultMinStock=+$('#defaultMinStock').value||0;s.confirmCritical=$('#confirmCritical').checked;s.reminderMinutes=+$('#reminderMinutes').value||0;s.browserNotifications=$('#browserNotifications').checked;s.whatsapp=$('#waBusiness').value;s.whatsappWebhook=$('#waWebhook').value.trim();s.whatsappSignature=$('#waSignature').value;s.whatsappAuto=$('#waAuto').checked;s.sessionMinutes=+$('#sessionMinutes').value||480;s.timezone=$('#timezone').value;s.autoBackup=$('#autoBackup').checked;log('Atualizou configurações da empresa');save();if(s.autoBackup)localStorage.setItem('gestaoBackupAuto',JSON.stringify({date:new Date().toISOString(),data}));alert('Configurações salvas com sucesso.');renderAll()}
function exportBackup(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='controle-de-empresas-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result),d=obj.data||obj;if(!d.products||!d.settings)throw new Error();if(confirm('Substituir os dados atuais pelo backup selecionado?')){data=d;ensureData();save();renderAll();alert('Backup restaurado.')}}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)};i.click()}
function showModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}
function filterTable(inputId,tableId){let q=$('#'+inputId).value.toLowerCase();$('#'+tableId).querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function sortStock(v){if(v==='qtyasc')data.products.sort((a,b)=>a.qty-b.qty);else if(v==='qtydesc')data.products.sort((a,b)=>b.qty-a.qty);else if(v==='pricedesc')data.products.sort((a,b)=>b.price-a.price);else data.products.sort((a,b)=>a.name.localeCompare(b.name));renderEstoque()}
function globalSearch(){let q=$('#globalSearch').value.toLowerCase();if(q.length<2)return;let p=data.products.find(x=>x.name.toLowerCase().includes(q)||x.code.toLowerCase().includes(q));let c=data.customers.find(x=>x.name.toLowerCase().includes(q));if(p){openPage('estoque');setTimeout(()=>{$('#stockSearch').value=q;filterTable('stockSearch','stockTable')},50)}else if(c)openPage('clientes')}
/* ===== Controle de Empresas V2 - módulos completos ===== */
function enhanceData(){
  data.stockMovements=data.stockMovements||[];
  data.cashRegister=data.cashRegister||{open:false,openedAt:'',openedBy:'Administrador',initial:0,closedAt:'',closingValue:0};
  data.settings=data.settings||{};
  const extra={quotePrefix:'ORC',osPrefix:'OS',purchasePrefix:'CMP',documentFooter:'Obrigado pela preferência!',defaultDueDays:30,lateFee:0,monthlyInterest:0,allowNegativeStock:false,autoLowStockAlerts:true,autoDueAlerts:true,businessHours:'08:00 às 18:00',requireSaleCustomer:false,showCostToSeller:false};
  Object.keys(extra).forEach(k=>{if(data.settings[k]===undefined)data.settings[k]=extra[k]});
  data.users=data.users||[{id:1,name:'Administrador',username:'admin',role:'ADMINISTRADOR',active:true}];
  data.users.forEach(u=>{if(u.username===undefined)u.username=(u.name||'usuario').toLowerCase().replace(/\s+/g,'.');if(u.active===undefined)u.active=true});
  data.quotes=data.quotes||[]; data.purchases=data.purchases||[]; data.serviceOrders=data.serviceOrders||[];
}
function statusBadge(status){let s=String(status||'Ativo');let cls=/vencido|cancelado|recusado|inativo/i.test(s)?'danger':/pendente|rascunho|aberta|aguardando|em andamento|enviado/i.test(s)?'warn':'ok';return `<span class="badge ${cls}">${esc(s)}</span>`}
function nowBR(){return new Date().toLocaleString('pt-BR')}
function todayISO(){return new Date().toISOString().slice(0,10)}
function productOptions(selected=''){return data.products.map(p=>`<option value="${p.id}" ${String(selected)===String(p.id)?'selected':''}>${esc(p.name)} — estoque ${p.qty}</option>`).join('')}
function customerOptions(selected=''){return `<option value="">Consumidor / não informado</option>`+data.customers.map(c=>`<option value="${c.id}" ${String(selected)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}
function supplierOptions(selected=''){return `<option value="">Selecione</option>`+data.suppliers.map(s=>`<option value="${s.id}" ${String(selected)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}
function findCustomerName(id){let c=data.customers.find(x=>String(x.id)===String(id));return c?c.name:'Consumidor'}
function findSupplierName(id){let s=data.suppliers.find(x=>String(x.id)===String(id));return s?s.name:'-'}
function addStockMovement(productId,type,qty,reason,ref=''){let p=data.products.find(x=>String(x.id)===String(productId));if(!p)return false;qty=Number(qty)||0;let before=Number(p.qty)||0,after=before;if(type==='Entrada'||type==='Devolução')after=before+qty;else if(type==='Saída'||type==='Perda')after=before-qty;else if(type==='Ajuste')after=qty;if(after<0&&!data.settings.allowNegativeStock)return false;p.qty=after;data.stockMovements.unshift({id:Date.now()+Math.random(),date:nowBR(),productId:p.id,product:p.name,type,qty,before,after,reason,ref,user:'Administrador'});return true}

function renderDashboard(){enhanceData();let revenue=data.sales.reduce((a,s)=>a+Number(s.total||0),0),expenses=data.finance.filter(f=>f.type==='Despesa').reduce((a,f)=>a+Number(f.value||0),0),profit=data.sales.reduce((a,s)=>a+Number(s.profit||0),0),low=data.products.filter(p=>Number(p.qty)<=Number(p.min||0)).length,pending=data.finance.filter(f=>f.status==='Pendente'||f.status==='Vencido').reduce((a,f)=>a+Number(f.value||0),0),openOS=data.serviceOrders.filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length;
$('#dashboard').innerHTML=heading('Dashboard','Visão rápida do que precisa da sua atenção hoje')+`<div class="cards">${metric('Faturamento',money(revenue),'vendas acumuladas','green')}${metric('Lucro estimado',money(profit),'margem das vendas','green')}${metric('Despesas',money(expenses),'lançamentos registrados','red')}${metric('A receber / pagar',money(pending),'pendências financeiras',pending?'red':'green')}${metric('Itens em estoque',data.products.reduce((a,p)=>a+Number(p.qty||0),0),low+' produto(s) com estoque baixo',low?'red':'green')}${metric('Vendas realizadas',data.sales.length,'operações concluídas','green')}${metric('OS abertas',openOS,'serviços em andamento',openOS?'red':'green')}${metric('Lembretes',data.reminders.filter(r=>!r.done).length,'pendentes na agenda','green')}</div>
<div class="grid2"><div class="card"><div class="panel-head"><h3 class="section-title">Faturamento recente</h3><span class="soft-chip">Últimas 10 vendas</span></div><canvas id="chartSales" height="105"></canvas></div><div class="card"><h3 class="section-title">Atenção necessária</h3><div class="alert-list">${low?`<div class="alert"><b>${low}</b> produto(s) abaixo do estoque mínimo.</div>`:''}${data.finance.filter(f=>f.status==='Vencido').slice(0,4).map(f=>`<div class="alert">Conta vencida: <b>${esc(f.desc)}</b> — ${money(f.value)}</div>`).join('')}${openOS?`<div class="alert"><b>${openOS}</b> ordem(ns) de serviço ainda abertas.</div>`:''}${!low&&!openOS&&!data.finance.some(f=>f.status==='Vencido')?'<div class="empty">Tudo certo por aqui.</div>':''}</div></div></div>
<div class="card" style="margin-top:16px"><div class="panel-head"><h3 class="section-title">Últimas movimentações</h3><button class="btn ghost small" onclick="openPage('historico')">Ver histórico</button></div><div class="activity-feed">${data.history.slice(0,6).map(h=>`<div class="activity-row"><span class="activity-dot"></span><div><b>${esc(h.action)}</b><small>${esc(h.date)} • ${esc(h.user)}</small></div></div>`).join('')||'<div class="empty">Nenhuma atividade registrada.</div>'}</div></div>`;
setTimeout(()=>{let ctx=$('#chartSales');if(!ctx)return;new Chart(ctx,{type:'bar',data:{labels:data.sales.slice(0,10).reverse().map((s,i)=>'#'+(i+1)),datasets:[{label:'Faturamento',data:data.sales.slice(0,10).reverse().map(s=>s.total),borderRadius:7}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}})},0)}

function renderEstoque(){enhanceData();let rows=data.products.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.brand)}</td><td><b>${p.qty}</b></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${p.qty<=p.min?'<span class="badge danger">Baixo</span>':'<span class="badge ok">Normal</span>'}</td><td class="actions"><button class="btn ghost small" onclick="stockMovementModal(${p.id})">Movimentar</button><button class="btn ghost small" onclick="productModal(${p.id})">Editar</button><button class="btn ghost small" onclick="deleteProduct(${p.id})">Excluir</button></td></tr>`).join('');
$('#estoque').innerHTML=heading('Estoque','Controle por movimentações, histórico e níveis mínimos',`<div class="actions"><button class="btn ghost" onclick="stockHistoryModal()">Histórico</button><button class="btn primary" onclick="productModal()">+ Produto</button></div>`)+`<div class="card"><div class="toolbar"><input id="stockSearch" placeholder="Pesquisar produto, código ou marca" oninput="filterTable('stockSearch','stockTable')"><select onchange="sortStock(this.value)"><option value="name">Ordenar por nome</option><option value="qtyasc">Menor estoque</option><option value="qtydesc">Maior estoque</option><option value="pricedesc">Maior preço</option></select></div><div class="table-wrap"><table id="stockTable"><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Marca</th><th>Qtd.</th><th>Custo</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">Nenhum produto cadastrado.</td></tr>'}</tbody></table></div></div>`}
function productModal(id){let p=id?data.products.find(x=>x.id===id):{};showModal(`<h2>${id?'Editar':'Novo'} produto</h2><div class="form"><label>Código<input id="pcode" value="${esc(p.code||'')}"></label><label>Nome<input id="pname" value="${esc(p.name||'')}"></label><label>Categoria<input id="pcat" value="${esc(p.category||'')}"></label><label>Marca<input id="pbrand" value="${esc(p.brand||'')}"></label><label>${id?'Estoque atual (use Movimentar)':'Estoque inicial'}<input id="pqty" type="number" value="${p.qty||0}" ${id?'readonly':''}></label><label>Estoque mínimo<input id="pmin" type="number" value="${p.min??data.settings.defaultMinStock}"></label><label>Custo<input id="pcost" type="number" step="0.01" value="${p.cost||0}"></label><label>Preço de venda<input id="pprice" type="number" step="0.01" value="${p.price||0}"></label><label class="full">Localização / observação<input id="plocation" value="${esc(p.location||'')}"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProductV2(${id||'null'})">Salvar</button></div>`)}
function saveProductV2(id){let old=id?data.products.find(x=>x.id===id):null,obj={id:id||Date.now(),code:$('#pcode').value.trim()||('P'+Date.now().toString().slice(-5)),name:$('#pname').value.trim(),category:$('#pcat').value.trim()||'Geral',brand:$('#pbrand').value.trim(),qty:id?old.qty:(+$('#pqty').value||0),min:+$('#pmin').value||0,cost:+$('#pcost').value||0,price:+$('#pprice').value||0,location:$('#plocation').value.trim()};if(!obj.name)return alert('Informe o nome do produto.');if(id)data.products[data.products.findIndex(x=>x.id===id)]=obj;else{data.products.push(obj);if(obj.qty>0)data.stockMovements.unshift({id:Date.now(),date:nowBR(),productId:obj.id,product:obj.name,type:'Entrada',qty:obj.qty,before:0,after:obj.qty,reason:'Estoque inicial',ref:'Cadastro',user:'Administrador'})}log((id?'Editou':'Cadastrou')+' produto '+obj.name);save();closeModal();renderAll()}
function stockMovementModal(productId){let p=data.products.find(x=>x.id===productId);showModal(`<h2>Movimentar estoque</h2><div class="notice"><b>${esc(p.name)}</b> • estoque atual: <b>${p.qty}</b></div><div class="form"><label>Tipo<select id="smtype"><option>Entrada</option><option>Saída</option><option>Ajuste</option><option>Devolução</option><option>Perda</option></select></label><label>Quantidade<input id="smqty" type="number" min="0" step="1" value="1"></label><label class="full">Motivo<input id="smreason" placeholder="Ex.: compra, venda manual, contagem, avaria..."></label><label class="full">Referência<input id="smref" placeholder="Nota, OS, venda ou observação"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveStockMovement(${productId})">Confirmar movimentação</button></div>`)}
function saveStockMovement(productId){let t=$('#smtype').value,q=+$('#smqty').value,r=$('#smreason').value.trim();if(q<0||(!q&&t!=='Ajuste'))return alert('Informe uma quantidade válida.');if(!addStockMovement(productId,t,q,r||'Movimentação manual',$('#smref').value.trim()))return alert('A movimentação deixaria o estoque negativo. Altere a configuração ou a quantidade.');log(`${t} de estoque: ${data.products.find(p=>p.id===productId).name}`);save();closeModal();renderAll()}
function stockHistoryModal(){let rows=data.stockMovements.slice(0,80).map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.product)}</td><td>${statusBadge(m.type)}</td><td>${m.qty}</td><td>${m.before} → <b>${m.after}</b></td><td>${esc(m.reason||'-')}</td><td>${esc(m.ref||'-')}</td></tr>`).join('');showModal(`<h2>Histórico de estoque</h2><div class="table-wrap"><table><thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Qtd.</th><th>Saldo</th><th>Motivo</th><th>Referência</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Sem movimentações.</td></tr>'}</tbody></table></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Fechar</button></div>`)}

function renderOrcamentos(){enhanceData();let total=data.quotes.reduce((a,q)=>a+Number(q.total||0),0),approved=data.quotes.filter(q=>q.status==='Aprovado').length;let rows=data.quotes.map(q=>`<tr><td><b>${esc(q.number||('#'+q.id))}</b></td><td>${esc(q.date||'-')}</td><td>${esc(findCustomerName(q.customerId))}</td><td>${esc(q.productName||'-')}</td><td>${money(q.total)}</td><td>${statusBadge(q.status)}</td><td class="actions"><button class="btn ghost small" onclick="changeQuoteStatus(${q.id})">Status</button>${q.status==='Aprovado'&&!q.converted?`<button class="btn primary small" onclick="convertQuote(${q.id})">Virar venda</button>`:''}<button class="btn ghost small" onclick="deleteQuote(${q.id})">Excluir</button></td></tr>`).join('');
$('#orcamentos').innerHTML=heading('Orçamentos','Crie, acompanhe e transforme orçamento aprovado em venda',`<button class="btn primary" onclick="quoteModal()">+ Novo orçamento</button>`)+`<div class="cards">${metric('Orçamentos',data.quotes.length,'registros','green')}${metric('Aprovados',approved,'prontos para venda','green')}${metric('Valor orçado',money(total),'total acumulado','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Produto</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhum orçamento criado.</td></tr>'}</tbody></table></div>`}
function quoteModal(){showModal(`<h2>Novo orçamento</h2><div class="form"><label>Cliente<select id="qcustomer">${customerOptions()}</select></label><label>Validade<input id="qvalid" type="date"></label><label>Produto<select id="qproduct">${productOptions()}</select></label><label>Quantidade<input id="qqty" type="number" min="1" value="1"></label><label>Desconto<input id="qdiscount" type="number" step="0.01" value="0"></label><label>Status<select id="qstatus"><option>Rascunho</option><option>Enviado</option><option>Aprovado</option><option>Recusado</option></select></label><label class="full">Observações<textarea id="qnotes" rows="3"></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveQuote()">Salvar orçamento</button></div>`)}
function saveQuote(){let p=data.products.find(x=>String(x.id)===$('#qproduct').value),qty=+$('#qqty').value||1,disc=+$('#qdiscount').value||0;if(!p)return alert('Selecione um produto.');let q={id:Date.now(),number:(data.settings.quotePrefix||'ORC')+'-'+String(data.quotes.length+1).padStart(4,'0'),date:new Date().toLocaleDateString('pt-BR'),customerId:$('#qcustomer').value,productId:p.id,productName:p.name,qty,discount:disc,total:Math.max(0,p.price*qty-disc),validUntil:$('#qvalid').value,status:$('#qstatus').value,notes:$('#qnotes').value,converted:false};data.quotes.unshift(q);log('Criou orçamento '+q.number);save();closeModal();renderAll()}
function changeQuoteStatus(id){let q=data.quotes.find(x=>x.id===id);let s=prompt('Novo status: Rascunho, Enviado, Aprovado, Recusado ou Vencido',q.status);if(!s)return;let valid=['Rascunho','Enviado','Aprovado','Recusado','Vencido'];let match=valid.find(x=>x.toLowerCase()===s.toLowerCase());if(!match)return alert('Status inválido.');q.status=match;log('Alterou status do orçamento '+q.number+' para '+match);save();renderAll()}
function convertQuote(id){let q=data.quotes.find(x=>x.id===id),p=data.products.find(x=>x.id===q.productId);if(!q||!p)return alert('Produto não encontrado.');if(q.qty>p.qty&&!data.settings.allowNegativeStock)return alert('Estoque insuficiente para converter este orçamento.');let total=q.total,profit=(p.price-p.cost)*q.qty-q.discount;data.sales.unshift({id:Date.now(),date:nowBR(),customer:findCustomerName(q.customerId),customerId:q.customerId,items:[{id:p.id,name:p.name,qty:q.qty}],total,profit,payment:data.settings.defaultPayment,origin:q.number});addStockMovement(p.id,'Saída',q.qty,'Conversão de orçamento',q.number);data.finance.unshift({id:Date.now()+1,type:'Receita',category:'Vendas',desc:'Venda '+q.number,value:total,status:'Pago',date:new Date().toLocaleDateString('pt-BR'),dueDate:todayISO(),payment:data.settings.defaultPayment});data.cash.unshift({id:Date.now()+2,type:'Entrada',desc:'Venda '+q.number,value:total,payment:data.settings.defaultPayment,date:nowBR()});q.converted=true;q.status='Aprovado';log('Converteu orçamento '+q.number+' em venda');save();renderAll()}
function deleteQuote(id){if(confirm('Excluir este orçamento?')){data.quotes=data.quotes.filter(x=>x.id!==id);log('Excluiu orçamento');save();renderAll()}}

function renderCompras(){enhanceData();let sum=data.purchases.reduce((a,p)=>a+Number(p.total||0),0),pending=data.purchases.filter(p=>p.status==='Pendente').length;let rows=data.purchases.map(p=>`<tr><td><b>${esc(p.number)}</b></td><td>${esc(p.date)}</td><td>${esc(findSupplierName(p.supplierId))}</td><td>${esc(p.productName)}</td><td>${p.qty}</td><td>${money(p.total)}</td><td>${statusBadge(p.status)}</td><td><button class="btn ghost small" onclick="deletePurchase(${p.id})">Excluir</button></td></tr>`).join('');$('#compras').innerHTML=heading('Compras','Entrada de mercadorias integrada ao estoque e financeiro',`<button class="btn primary" onclick="purchaseModal()">+ Nova compra</button>`)+`<div class="cards">${metric('Compras',data.purchases.length,'registros','green')}${metric('Total comprado',money(sum),'custo acumulado','red')}${metric('Pendentes',pending,'contas a pagar','red')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Fornecedor</th><th>Produto</th><th>Qtd.</th><th>Total</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Nenhuma compra registrada.</td></tr>'}</tbody></table></div>`}
function purchaseModal(){showModal(`<h2>Nova compra</h2><div class="form"><label>Fornecedor<select id="pusupplier">${supplierOptions()}</select></label><label>Produto<select id="puproduct">${productOptions()}</select></label><label>Quantidade<input id="puqty" type="number" min="1" value="1"></label><label>Custo unitário<input id="pucost" type="number" step="0.01" value="0"></label><label>Frete<input id="pufreight" type="number" step="0.01" value="0"></label><label>Pagamento<select id="pupayment"><option>PIX</option><option>Dinheiro</option><option>Boleto</option><option>Transferência</option><option>Crédito</option></select></label><label>Status financeiro<select id="pustatus"><option>Pago</option><option>Pendente</option></select></label><label>Vencimento<input id="pudue" type="date"></label><label class="full">Número da nota / observação<input id="punote"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="savePurchase()">Confirmar compra</button></div>`)}
function savePurchase(){let p=data.products.find(x=>String(x.id)===$('#puproduct').value),qty=+$('#puqty').value,cost=+$('#pucost').value,freight=+$('#pufreight').value||0;if(!p||qty<=0||cost<0)return alert('Preencha produto, quantidade e custo.');let total=qty*cost+freight,pu={id:Date.now(),number:(data.settings.purchasePrefix||'CMP')+'-'+String(data.purchases.length+1).padStart(4,'0'),date:new Date().toLocaleDateString('pt-BR'),supplierId:$('#pusupplier').value,productId:p.id,productName:p.name,qty,cost,freight,total,payment:$('#pupayment').value,status:$('#pustatus').value,dueDate:$('#pudue').value,note:$('#punote').value};data.purchases.unshift(pu);addStockMovement(p.id,'Entrada',qty,'Compra de fornecedor',pu.number);p.cost=cost;data.finance.unshift({id:Date.now()+1,type:'Despesa',category:'Compras',desc:'Compra '+pu.number,value:total,status:pu.status,date:new Date().toLocaleDateString('pt-BR'),dueDate:pu.dueDate,payment:pu.payment,supplierId:pu.supplierId});if(pu.status==='Pago')data.cash.unshift({id:Date.now()+2,type:'Saída',desc:'Compra '+pu.number,value:total,payment:pu.payment,date:nowBR()});log('Registrou compra '+pu.number+' e aumentou o estoque');save();closeModal();renderAll()}
function deletePurchase(id){let p=data.purchases.find(x=>x.id===id);if(!p)return;if(confirm('Excluir a compra? O histórico de estoque já realizado não será apagado.')){data.purchases=data.purchases.filter(x=>x.id!==id);log('Excluiu registro de compra '+p.number);save();renderAll()}}

function renderOS(){enhanceData();let rows=data.serviceOrders.map(o=>`<tr><td><b>${esc(o.number)}</b></td><td>${esc(o.date)}</td><td>${esc(findCustomerName(o.customerId))}</td><td>${esc(o.service)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td><td class="actions"><button class="btn ghost small" onclick="changeOSStatus(${o.id})">Status</button>${o.status==='Concluída'&&!o.received?`<button class="btn primary small" onclick="receiveOS(${o.id})">Receber</button>`:''}<button class="btn ghost small" onclick="deleteOS(${o.id})">Excluir</button></td></tr>`).join('');$('#os').innerHTML=heading('Ordens de Serviço','Acompanhe serviços, produtos utilizados e recebimentos',`<button class="btn primary" onclick="osModal()">+ Nova OS</button>`)+`<div class="cards">${metric('OS abertas',data.serviceOrders.filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length,'em atendimento','red')}${metric('Concluídas',data.serviceOrders.filter(o=>o.status==='Concluída'||o.status==='Entregue').length,'finalizadas','green')}${metric('Valor em OS',money(data.serviceOrders.reduce((a,o)=>a+Number(o.total||0),0)),'total registrado','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Serviço</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhuma ordem de serviço.</td></tr>'}</tbody></table></div>`}
function osModal(){showModal(`<h2>Nova Ordem de Serviço</h2><div class="form"><label>Cliente<select id="oscustomer">${customerOptions()}</select></label><label>Responsável<input id="osowner" value="Administrador"></label><label class="full">Serviço<input id="osservice" placeholder="Descrição do serviço"></label><label>Produto utilizado<select id="osproduct"><option value="">Nenhum</option>${productOptions()}</select></label><label>Quantidade<input id="osqty" type="number" min="0" value="0"></label><label>Valor do serviço<input id="osservicevalue" type="number" step="0.01" value="0"></label><label>Desconto<input id="osdiscount" type="number" step="0.01" value="0"></label><label>Status<select id="osstatus"><option>Aberta</option><option>Aguardando</option><option>Em andamento</option><option>Concluída</option></select></label><label class="full">Observações<textarea id="osnotes" rows="3"></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveOS()">Salvar OS</button></div>`)}
function saveOS(){let p=data.products.find(x=>String(x.id)===$('#osproduct').value),qty=+$('#osqty').value||0,serviceValue=+$('#osservicevalue').value||0,discount=+$('#osdiscount').value||0;if(!$('#osservice').value.trim())return alert('Informe o serviço.');if(p&&qty>p.qty&&!data.settings.allowNegativeStock)return alert('Estoque insuficiente para o produto selecionado.');let productValue=p?p.price*qty:0,total=Math.max(0,serviceValue+productValue-discount),o={id:Date.now(),number:(data.settings.osPrefix||'OS')+'-'+String(data.serviceOrders.length+1).padStart(4,'0'),date:new Date().toLocaleDateString('pt-BR'),customerId:$('#oscustomer').value,responsible:$('#osowner').value,service:$('#osservice').value.trim(),productId:p?.id||'',productName:p?.name||'',qty,productValue,serviceValue,discount,total,status:$('#osstatus').value,notes:$('#osnotes').value,stockDeducted:false,received:false};data.serviceOrders.unshift(o);if(p&&qty>0){addStockMovement(p.id,'Saída',qty,'Produto utilizado em OS',o.number);o.stockDeducted=true}log('Criou ordem de serviço '+o.number);save();closeModal();renderAll()}
function changeOSStatus(id){let o=data.serviceOrders.find(x=>x.id===id),s=prompt('Status: Aberta, Aguardando, Em andamento, Concluída, Entregue ou Cancelada',o.status);if(!s)return;let valid=['Aberta','Aguardando','Em andamento','Concluída','Entregue','Cancelada'],m=valid.find(x=>x.toLowerCase()===s.toLowerCase());if(!m)return alert('Status inválido.');o.status=m;log('Alterou '+o.number+' para '+m);save();renderAll()}
function receiveOS(id){let o=data.serviceOrders.find(x=>x.id===id);if(!o||o.received)return;let pay=prompt('Forma de pagamento',data.settings.defaultPayment)||data.settings.defaultPayment;data.finance.unshift({id:Date.now(),type:'Receita',category:'Serviços',desc:'Recebimento '+o.number,value:o.total,status:'Pago',date:new Date().toLocaleDateString('pt-BR'),dueDate:todayISO(),payment:pay});data.cash.unshift({id:Date.now()+1,type:'Entrada',desc:'Recebimento '+o.number,value:o.total,payment:pay,date:nowBR()});o.received=true;o.status='Entregue';log('Recebeu ordem de serviço '+o.number);save();renderAll()}
function deleteOS(id){if(confirm('Excluir esta ordem de serviço?')){data.serviceOrders=data.serviceOrders.filter(x=>x.id!==id);log('Excluiu ordem de serviço');save();renderAll()}}

function renderFinanceiro(){enhanceData();let rec=data.finance.filter(f=>f.type==='Receita').reduce((a,b)=>a+Number(b.value||0),0),des=data.finance.filter(f=>f.type==='Despesa').reduce((a,b)=>a+Number(b.value||0),0),pending=data.finance.filter(f=>f.status==='Pendente').reduce((a,b)=>a+Number(b.value||0),0),overdue=data.finance.filter(f=>f.status==='Vencido').reduce((a,b)=>a+Number(b.value||0),0);let rows=data.finance.map(f=>`<tr><td>${statusBadge(f.type)}</td><td><b>${esc(f.desc)}</b><small class="cell-sub">${esc(f.category||'Geral')}</small></td><td>${money(f.value)}</td><td>${esc(f.date||'-')}</td><td>${esc(f.dueDate||'-')}</td><td>${esc(f.payment||'-')}</td><td>${statusBadge(f.status)}</td><td>${f.status!=='Pago'?`<button class="btn primary small" onclick="markFinancePaid(${f.id})">Dar baixa</button>`:''}</td></tr>`).join('');$('#financeiro').innerHTML=heading('Financeiro','Receitas, despesas, vencimentos e baixas integradas ao caixa',`<button class="btn primary" onclick="financeModalV2()">+ Novo lançamento</button>`)+`<div class="cards">${metric('Receitas',money(rec),'total registrado','green')}${metric('Despesas',money(des),'total registrado','red')}${metric('Pendentes',money(pending),'aguardando baixa','red')}${metric('Vencidas',money(overdue),'exigem atenção','red')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Lançamento</th><th>Vencimento</th><th>Pagamento</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Nenhum lançamento financeiro.</td></tr>'}</tbody></table></div>`}
function financeModalV2(){showModal(`<h2>Novo lançamento financeiro</h2><div class="form"><label>Tipo<select id="ftype"><option>Receita</option><option>Despesa</option></select></label><label>Categoria<input id="fcategory" placeholder="Ex.: Vendas, aluguel, fornecedor"></label><label class="full">Descrição<input id="fdesc"></label><label>Valor<input id="fvalue" type="number" step="0.01"></label><label>Forma de pagamento<select id="fpayment"><option>PIX</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Boleto</option><option>Transferência</option></select></label><label>Data<input id="fdate" type="date" value="${todayISO()}"></label><label>Vencimento<input id="fdue" type="date"></label><label>Status<select id="fstatus"><option>Pendente</option><option>Pago</option><option>Vencido</option><option>Cancelado</option></select></label><label class="full">Observação<textarea id="fnotes" rows="2"></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveFinanceV2()">Salvar</button></div>`)}
function saveFinanceV2(){let f={id:Date.now(),type:$('#ftype').value,category:$('#fcategory').value.trim()||'Geral',desc:$('#fdesc').value.trim(),value:+$('#fvalue').value||0,date:$('#fdate').value,status:$('#fstatus').value,dueDate:$('#fdue').value,payment:$('#fpayment').value,notes:$('#fnotes').value};if(!f.desc||f.value<=0)return alert('Informe descrição e valor.');data.finance.unshift(f);if(f.status==='Pago')data.cash.unshift({id:Date.now()+1,type:f.type==='Receita'?'Entrada':'Saída',desc:f.desc,value:f.value,payment:f.payment,date:nowBR()});log('Criou lançamento financeiro: '+f.desc);save();closeModal();renderAll()}
function markFinancePaid(id){let f=data.finance.find(x=>x.id===id);if(!f)return;if(f.status==='Pago')return;f.status='Pago';data.cash.unshift({id:Date.now()+1,type:f.type==='Receita'?'Entrada':'Saída',desc:f.desc,value:f.value,payment:f.payment||'Manual',date:nowBR()});log('Deu baixa financeira em '+f.desc);save();renderAll()}

function renderCaixa(){enhanceData();let ent=data.cash.filter(c=>c.type==='Entrada').reduce((a,b)=>a+Number(b.value||0),0),sai=data.cash.filter(c=>c.type==='Saída').reduce((a,b)=>a+Number(b.value||0),0),cr=data.cashRegister;$('#caixa').innerHTML=heading('Caixa','Abertura, movimentações e fechamento diário',cr.open?`<button class="btn primary" onclick="closeCashModal()">Fechar caixa</button>`:`<button class="btn primary" onclick="openCashModal()">Abrir caixa</button>`)+`<div class="cards">${metric('Situação',cr.open?'ABERTO':'FECHADO',cr.open?'desde '+cr.openedAt:'abra o caixa para iniciar',cr.open?'green':'red')}${metric('Valor inicial',money(cr.initial||0),'abertura atual','green')}${metric('Entradas',money(ent),'movimentações','green')}${metric('Saídas',money(sai),'movimentações','red')}${metric('Saldo esperado',money((cr.initial||0)+ent-sai),'inicial + entradas - saídas',(cr.initial||0)+ent-sai>=0?'green':'red')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Pagamento</th><th>Valor</th></tr></thead><tbody>${data.cash.map(c=>`<tr><td>${esc(c.date)}</td><td>${statusBadge(c.type)}</td><td>${esc(c.desc)}</td><td>${esc(c.payment||'-')}</td><td>${money(c.value)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sem movimentações.</td></tr>'}</tbody></table></div>`}
function openCashModal(){if(data.cashRegister.open)return alert('O caixa já está aberto.');showModal(`<h2>Abrir caixa</h2><div class="form"><label>Responsável<input id="cuser" value="Administrador"></label><label>Valor inicial<input id="cinitial" type="number" step="0.01" value="0"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="openCash()">Abrir caixa</button></div>`)}
function openCash(){data.cashRegister={open:true,openedAt:nowBR(),openedBy:$('#cuser').value||'Administrador',initial:+$('#cinitial').value||0,closedAt:'',closingValue:0};log('Abriu o caixa com '+money(data.cashRegister.initial));save();closeModal();renderAll()}
function closeCashModal(){let ent=data.cash.filter(c=>c.type==='Entrada').reduce((a,b)=>a+Number(b.value||0),0),sai=data.cash.filter(c=>c.type==='Saída').reduce((a,b)=>a+Number(b.value||0),0),expected=(data.cashRegister.initial||0)+ent-sai;showModal(`<h2>Fechar caixa</h2><div class="notice">Valor esperado: <b>${money(expected)}</b></div><div class="form"><label>Valor contado<input id="cclosing" type="number" step="0.01" value="${expected.toFixed(2)}"></label><label>Observação<input id="ccloseNote" placeholder="Diferenças, sangria, conferência..."></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="closeCashRegister(${expected})">Confirmar fechamento</button></div>`)}
function closeCashRegister(expected){let counted=+$('#cclosing').value||0;data.cashRegister.open=false;data.cashRegister.closedAt=nowBR();data.cashRegister.closingValue=counted;data.cashRegister.difference=counted-expected;data.cashRegister.note=$('#ccloseNote').value;log('Fechou o caixa. Diferença: '+money(counted-expected));save();closeModal();renderAll()}

function renderClientes(){enhanceData();let rows=data.customers.map(c=>{let sales=data.sales.filter(s=>String(s.customerId)===String(c.id)||s.customer===c.name),spent=sales.reduce((a,s)=>a+Number(s.total||0),0);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.doc||'-')}</td><td>${esc(c.phone||'-')}</td><td>${esc(c.email||'-')}</td><td>${sales.length}</td><td>${money(spent)}</td><td class="actions"><button class="btn ghost small" onclick="customerModalV2(${c.id})">Editar</button><button class="btn ghost small" onclick="deleteCustomer(${c.id})">Excluir</button></td></tr>`}).join('');$('#clientes').innerHTML=heading('Clientes','Cadastro com visão do relacionamento e total comprado',`<button class="btn primary" onclick="customerModalV2()">+ Novo cliente</button>`)+`<div class="card table-wrap"><table><thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th>E-mail</th><th>Compras</th><th>Total gasto</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhum cliente.</td></tr>'}</tbody></table></div>`}
function customerModalV2(id){let c=id?data.customers.find(x=>x.id===id):{};showModal(`<h2>${id?'Editar':'Novo'} cliente</h2><div class="form"><label>Nome<input id="cname" value="${esc(c.name||'')}"></label><label>CPF/CNPJ<input id="cdoc" value="${esc(c.doc||'')}"></label><label>Telefone / WhatsApp<input id="cphone" value="${esc(c.phone||'')}"></label><label>E-mail<input id="cemail" value="${esc(c.email||'')}"></label><label class="full">Endereço<input id="caddress" value="${esc(c.address||'')}"></label><label class="full">Observações<textarea id="cnotes" rows="3">${esc(c.notes||'')}</textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCustomerV2(${id||'null'})">Salvar</button></div>`)}
function saveCustomerV2(id){let c={id:id||Date.now(),name:$('#cname').value.trim(),doc:$('#cdoc').value.trim(),phone:$('#cphone').value.trim(),email:$('#cemail').value.trim(),address:$('#caddress').value.trim(),notes:$('#cnotes').value};if(!c.name)return alert('Informe o nome.');if(id)data.customers[data.customers.findIndex(x=>x.id===id)]=c;else data.customers.push(c);log((id?'Editou':'Cadastrou')+' cliente '+c.name);save();closeModal();renderAll()}

function renderFornecedores(){enhanceData();let rows=data.suppliers.map(s=>{let purchases=data.purchases.filter(p=>String(p.supplierId)===String(s.id)),sum=purchases.reduce((a,p)=>a+Number(p.total||0),0);return `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.doc||'-')}</td><td>${esc(s.phone||'-')}</td><td>${esc(s.email||'-')}</td><td>${purchases.length}</td><td>${money(sum)}</td><td class="actions"><button class="btn ghost small" onclick="supplierModal(${s.id})">Editar</button><button class="btn ghost small" onclick="deleteSupplier(${s.id})">Excluir</button></td></tr>`}).join('');$('#fornecedores').innerHTML=heading('Fornecedores','Cadastro e histórico de compras por fornecedor',`<button class="btn primary" onclick="supplierModal()">+ Novo fornecedor</button>`)+`<div class="card table-wrap"><table><thead><tr><th>Empresa</th><th>CNPJ/CPF</th><th>Telefone</th><th>E-mail</th><th>Compras</th><th>Total comprado</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhum fornecedor.</td></tr>'}</tbody></table></div>`}
function supplierModal(id){let s=id?data.suppliers.find(x=>x.id===id):{};showModal(`<h2>${id?'Editar':'Novo'} fornecedor</h2><div class="form"><label>Empresa / Nome<input id="supname" value="${esc(s.name||'')}"></label><label>CNPJ/CPF<input id="supdoc" value="${esc(s.doc||'')}"></label><label>Telefone / WhatsApp<input id="supphone" value="${esc(s.phone||'')}"></label><label>E-mail<input id="supemail" value="${esc(s.email||'')}"></label><label class="full">Endereço<input id="supaddress" value="${esc(s.address||'')}"></label><label class="full">Observações<textarea id="supnotes" rows="3">${esc(s.notes||'')}</textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveSupplier(${id||'null'})">Salvar</button></div>`)}
function saveSupplier(id){let s={id:id||Date.now(),name:$('#supname').value.trim(),doc:$('#supdoc').value.trim(),phone:$('#supphone').value.trim(),email:$('#supemail').value.trim(),address:$('#supaddress').value.trim(),notes:$('#supnotes').value};if(!s.name)return alert('Informe o fornecedor.');if(id)data.suppliers[data.suppliers.findIndex(x=>x.id===id)]=s;else data.suppliers.push(s);log((id?'Editou':'Cadastrou')+' fornecedor '+s.name);save();closeModal();renderAll()}
function deleteSupplier(id){if(confirm('Excluir este fornecedor?')){data.suppliers=data.suppliers.filter(x=>x.id!==id);log('Excluiu fornecedor');save();renderAll()}}

function renderUsuarios(){enhanceData();let rows=data.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td>${statusBadge(u.role)}</td><td>${u.active?'<span class="badge ok">Ativo</span>':'<span class="badge danger">Inativo</span>'}</td><td class="actions"><button class="btn ghost small" onclick="userModal(${u.id})">Editar</button>${u.id!==1?`<button class="btn ghost small" onclick="toggleUser(${u.id})">${u.active?'Desativar':'Ativar'}</button>`:''}</td></tr>`).join('');$('#usuarios').innerHTML=heading('Usuários e Permissões','Perfis de acesso preparados para futura autenticação multiusuário',`<button class="btn primary" onclick="userModal()">+ Novo usuário</button>`)+`<div class="notice">Nesta versão local, o login principal continua sendo <b>admin</b>. Os perfis abaixo já organizam permissões para a futura versão com banco de dados e backend.</div><div class="card table-wrap"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function userModal(id){let u=id?data.users.find(x=>x.id===id):{};showModal(`<h2>${id?'Editar':'Novo'} usuário</h2><div class="form"><label>Nome<input id="uname" value="${esc(u.name||'')}"></label><label>Usuário<input id="uusername" value="${esc(u.username||'')}"></label><label>Perfil<select id="urole">${['ADMINISTRADOR','GERENTE','FINANCEIRO','VENDEDOR','ESTOQUE'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Status<select id="uactive"><option value="1" ${u.active!==false?'selected':''}>Ativo</option><option value="0" ${u.active===false?'selected':''}>Inativo</option></select></label></div><div class="role-box"><b>Permissões sugeridas</b><p id="roleHelp">Administrador: acesso completo. Gerente: operação e relatórios. Financeiro: financeiro/caixa. Vendedor: vendas/clientes. Estoque: produtos/compras.</p></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveUser(${id||'null'})">Salvar</button></div>`)}
function saveUser(id){let u={id:id||Date.now(),name:$('#uname').value.trim(),username:$('#uusername').value.trim(),role:$('#urole').value,active:$('#uactive').value==='1'};if(!u.name||!u.username)return alert('Informe nome e usuário.');if(data.users.some(x=>x.id!==id&&x.username.toLowerCase()===u.username.toLowerCase()))return alert('Esse nome de usuário já existe.');if(id)data.users[data.users.findIndex(x=>x.id===id)]=u;else data.users.push(u);log((id?'Editou':'Cadastrou')+' usuário '+u.name);save();closeModal();renderAll()}
function toggleUser(id){let u=data.users.find(x=>x.id===id);u.active=!u.active;log((u.active?'Ativou':'Desativou')+' usuário '+u.name);save();renderAll()}

function renderRelatorios(){enhanceData();let rev=data.sales.reduce((a,s)=>a+Number(s.total||0),0),profit=data.sales.reduce((a,s)=>a+Number(s.profit||0),0),stockValue=data.products.reduce((a,p)=>a+Number(p.qty||0)*Number(p.cost||0),0);$('#relatorios').innerHTML=heading('Relatórios','Indicadores consolidados e exportação rápida',`<div class="actions"><button class="btn ghost" onclick="exportCSV('estoque')">Exportar estoque CSV</button><button class="btn primary" onclick="exportCSV('vendas')">Exportar vendas CSV</button></div>`)+`<div class="cards">${metric('Vendas',data.sales.length,'operações','green')}${metric('Faturamento',money(rev),'acumulado','green')}${metric('Lucro estimado',money(profit),'acumulado','green')}${metric('Valor do estoque',money(stockValue),'a custo','green')}</div><div class="grid2"><div class="card"><h3 class="section-title">Resumo operacional</h3><div class="summary-list"><div><span>Compras realizadas</span><b>${data.purchases.length}</b></div><div><span>Orçamentos</span><b>${data.quotes.length}</b></div><div><span>Ordens de Serviço</span><b>${data.serviceOrders.length}</b></div><div><span>Clientes</span><b>${data.customers.length}</b></div></div></div><div class="card"><h3 class="section-title">Estoque</h3><div class="summary-list"><div><span>Produtos cadastrados</span><b>${data.products.length}</b></div><div><span>Estoque baixo</span><b>${data.products.filter(p=>p.qty<=p.min).length}</b></div><div><span>Movimentações</span><b>${data.stockMovements.length}</b></div></div></div></div>`}
function exportCSV(type){let rows;if(type==='estoque')rows=[['Código','Produto','Categoria','Marca','Quantidade','Custo','Preço'],...data.products.map(p=>[p.code,p.name,p.category,p.brand,p.qty,p.cost,p.price])];else rows=[['Venda','Data','Cliente','Total','Pagamento'],...data.sales.map(s=>[s.id,s.date,s.customer,s.total,s.payment])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${type}-${todayISO()}.csv`;a.click();URL.revokeObjectURL(a.href)}

function renderAlertas(){enhanceData();let low=data.products.filter(p=>p.qty<=p.min),due=data.finance.filter(f=>f.status==='Vencido'||(f.status==='Pendente'&&f.dueDate&&new Date(f.dueDate)<new Date())),rem=data.reminders.filter(r=>!r.done).slice(0,5);$('#alertas').innerHTML=heading('Central de Alertas','Estoque, financeiro, agenda e serviços em um só lugar')+`<div class="cards">${metric('Estoque baixo',low.length,'produto(s)','red')}${metric('Financeiro',due.length,'pendência(s)','red')}${metric('Lembretes',rem.length,'pendentes','green')}${metric('OS abertas',data.serviceOrders.filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length,'em andamento','red')}</div><div class="card" style="margin-top:16px"><div class="alert-list">${low.map(p=>`<div class="alert">Estoque baixo: <b>${esc(p.name)}</b> — ${p.qty}/${p.min}</div>`).join('')}${due.map(f=>`<div class="alert">Financeiro: <b>${esc(f.desc)}</b> — ${money(f.value)}</div>`).join('')}${rem.map(r=>`<div class="alert">Agenda: <b>${esc(r.title)}</b> — ${new Date(r.datetime).toLocaleString('pt-BR')}</div>`).join('')||(!low.length&&!due.length?'<div class="empty">Nenhum alerta importante.</div>':'')}</div></div>`}

function renderConfig(){enhanceData();let s=data.settings;$('#configuracoes').innerHTML=heading('Configurações','Empresa, documentos, financeiro, estoque, segurança, notificações e integrações')+`<div class="settings-grid">
<div class="settings-section full"><div class="settings-head"><div class="settings-icon">🏢</div><div><h3>Dados da empresa</h3><p>Identidade usada em documentos e atendimento</p></div></div><div class="form"><label>Razão social<input id="companyName" value="${esc(s.company)}"></label><label>Nome fantasia<input id="companyFantasy" value="${esc(s.fantasy)}"></label><label>CNPJ/CPF<input id="companyDoc" value="${esc(s.cnpj)}"></label><label>Telefone<input id="companyPhone" value="${esc(s.phone)}"></label><label>WhatsApp<input id="companyWhatsapp" value="${esc(s.whatsapp)}"></label><label>E-mail<input id="companyEmail" value="${esc(s.email)}"></label><label class="full">Endereço<input id="companyAddress" value="${esc(s.address)}"></label><label>Cidade/UF<input id="companyCity" value="${esc(s.city)}"></label><label>Horário de atendimento<input id="businessHours" value="${esc(s.businessHours)}"></label></div></div>
<div class="settings-section"><div class="settings-head"><div class="settings-icon">🧾</div><div><h3>Documentos</h3><p>Numeração e textos padrão</p></div></div><div class="form"><label>Prefixo orçamento<input id="quotePrefix" value="${esc(s.quotePrefix)}"></label><label>Prefixo OS<input id="osPrefix" value="${esc(s.osPrefix)}"></label><label>Prefixo compras<input id="purchasePrefix" value="${esc(s.purchasePrefix)}"></label><label>Vencimento padrão (dias)<input id="defaultDueDays" type="number" value="${s.defaultDueDays}"></label><label class="full">Rodapé dos documentos<textarea id="documentFooter" rows="2">${esc(s.documentFooter)}</textarea></label></div></div>
<div class="settings-section"><div class="settings-head"><div class="settings-icon">💰</div><div><h3>Financeiro e vendas</h3><p>Padrões e regras comerciais</p></div></div><div class="form"><label>Pagamento padrão<select id="defaultPayment">${['PIX','Dinheiro','Débito','Crédito','Boleto','Transferência'].map(x=>`<option ${s.defaultPayment===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Comissão padrão (%)<input id="commission" type="number" step="0.01" value="${s.commission}"></label><label>Multa por atraso (%)<input id="lateFee" type="number" step="0.01" value="${s.lateFee}"></label><label>Juros mensal (%)<input id="monthlyInterest" type="number" step="0.01" value="${s.monthlyInterest}"></label></div><div class="switch-row"><div><strong>Exigir cliente na venda</strong><small>Impede venda sem cliente selecionado</small></div><label class="switch"><input id="requireSaleCustomer" type="checkbox" ${s.requireSaleCustomer?'checked':''}><span class="slider"></span></label></div></div>
<div class="settings-section"><div class="settings-head"><div class="settings-icon">📦</div><div><h3>Estoque</h3><p>Regras para movimentações</p></div></div><div class="form"><label>Estoque mínimo padrão<input id="defaultMinStock" type="number" value="${s.defaultMinStock}"></label></div><div class="switch-row"><div><strong>Permitir estoque negativo</strong><small>Recomendado manter desligado</small></div><label class="switch"><input id="allowNegativeStock" type="checkbox" ${s.allowNegativeStock?'checked':''}><span class="slider"></span></label></div><div class="switch-row"><div><strong>Alertas de estoque baixo</strong><small>Mostra avisos no painel</small></div><label class="switch"><input id="autoLowStockAlerts" type="checkbox" ${s.autoLowStockAlerts?'checked':''}><span class="slider"></span></label></div></div>
<div class="settings-section"><div class="settings-head"><div class="settings-icon">🔔</div><div><h3>Notificações e lembretes</h3><p>Alertas do sistema</p></div></div><div class="form"><label>Avisar com antecedência (min)<input id="reminderMinutes" type="number" min="0" value="${s.reminderMinutes}"></label></div><div class="switch-row"><div><strong>Notificações do navegador</strong><small>Enquanto o sistema estiver aberto</small></div><label class="switch"><input id="browserNotifications" type="checkbox" ${s.browserNotifications?'checked':''}><span class="slider"></span></label></div><div class="switch-row"><div><strong>Alertas de vencimento</strong><small>Contas pendentes e vencidas</small></div><label class="switch"><input id="autoDueAlerts" type="checkbox" ${s.autoDueAlerts?'checked':''}><span class="slider"></span></label></div></div>
