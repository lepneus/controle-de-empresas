<script id="lp-final-refinement-js">
(function(){
 const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};
 const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 const E=v=>typeof esc==='function'?esc(v):String(v??'').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]));
 window.lpStockView=window.lpStockView||{category:'all',sort:'code'};

 function catKey(p){
   const s=String(p?.category||'').toLowerCase();
   if(s.includes('moto'))return 'moto';
   if(s.includes('acess')||s.includes('câmara')||s.includes('camara')||s.includes('roda')||s.includes('peça')||s.includes('peca'))return 'acessorios';
   return 'carro';
 }
 function catLabel(k){return k==='moto'?'Pneus de moto':k==='acessorios'?'Acessórios':'Pneus de carro'}
 function filteredStock(cat){return (data.products||[]).filter(p=>cat==='all'||catKey(p)===cat)}
 function sortProducts(list,sort){
   const a=[...list];
   if(sort==='code')a.sort((x,y)=>String(x.code||'').localeCompare(String(y.code||''),'pt-BR',{numeric:true,sensitivity:'base'}));
   else if(sort==='qtyasc')a.sort((x,y)=>N(x.qty)-N(y.qty));
   else if(sort==='qtydesc')a.sort((x,y)=>N(y.qty)-N(x.qty));
   else if(sort==='pricedesc')a.sort((x,y)=>N(y.price)-N(x.price));
   else a.sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'pt-BR',{numeric:true,sensitivity:'base'}));
   return a;
 }
 function stockRows(list){
   return list.map(p=>`<tr data-stock-search="${E([p.code,p.name,p.brand,p.category].join(' ').toLowerCase())}">
     <td><b>${E(p.code||'')}</b></td><td>${E(p.name||'')}</td><td><span class="lp-category-chip">${E(catLabel(catKey(p)))}</span></td><td>${E(p.brand||'')}</td>
     <td><b>${N(p.qty)}</b></td><td>${M(p.cost)}</td><td>${M(p.price)}</td><td>${N(p.qty)<1?'<span class="badge danger">Zerado</span>':'<span class="badge ok">Normal</span>'}</td>
     <td class="actions"><button class="btn ghost small" onclick="stockMovementModal(${p.id})">Movimentar</button><button class="btn ghost small" onclick="productModal(${p.id})">Editar</button></td></tr>`).join('');
 }
 function stockSection(k,list){
   const qty=list.reduce((a,p)=>a+N(p.qty),0);
   return `<div class="card lp-stock-section"><div class="lp-stock-section-title"><h3>${E(catLabel(k))}</h3><span class="badge ok">${list.length} produto(s) • ${qty} unidade(s)</span></div>
     <div class="table-wrap"><table class="lp-stock-table"><thead><tr><th>Código</th><th>Produto</th><th>Classificação</th><th>Marca</th><th>Qtd.</th><th>Custo</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>${stockRows(list)||'<tr><td colspan="9" class="empty">Nenhum produto nesta classificação.</td></tr>'}</tbody></table></div></div>`;
 }
 window.lpSetStockCategory=function(k){window.lpStockView.category=k;renderEstoque()};
 window.lpSetStockSort=function(v){window.lpStockView.sort=v;renderEstoque()};
 window.lpFilterStock=function(v){
   const q=String(v||'').trim().toLowerCase();
   document.querySelectorAll('.lp-stock-table tbody tr[data-stock-search]').forEach(tr=>{tr.style.display=!q||tr.dataset.stockSearch.includes(q)?'':'none'});
 };
 window.lpStockCodeSummary=function(){
   const list=filteredStock(window.lpStockView.category);
   const map=new Map();
   list.forEach(p=>{
     const code=String(p.code||'Sem código');const key=code+'|'+catKey(p);
     const g=map.get(key)||{code,cat:catKey(p),qty:0,models:0,names:[]};
     g.qty+=N(p.qty);g.models++;if(p.name&&!g.names.includes(p.name))g.names.push(p.name);map.set(key,g);
   });
   const rows=[...map.values()].sort((a,b)=>a.code.localeCompare(b.code,'pt-BR',{numeric:true})).map(g=>`<tr><td>${E(g.code)}</td><td>${E(catLabel(g.cat))}</td><td>${g.models}</td><td><b>${g.qty}</b></td><td>${E(g.names.slice(0,3).join(' • '))}</td></tr>`).join('');
   showModal(`<h2>Resumo por código</h2><div class="notice">Aqui o sistema soma a quantidade de cada código. Exemplo: se o código 1082 aparecer mais de uma vez, as unidades são somadas.</div><div class="table-wrap"><table class="lp-code-table"><thead><tr><th>Código</th><th>Classificação</th><th>Cadastros</th><th>Qtd. total</th><th>Produto(s)</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">Nenhum produto.</td></tr>'}</tbody></table></div><div class="modal-actions lp-modal-footer"><button class="btn primary" onclick="closeModal()">Fechar</button></div>`);
 };

 window.renderEstoque=function(){
   ensureData();enhanceData();
   const cat=window.lpStockView.category||'all',sort=window.lpStockView.sort||'code';
   const selected=sortProducts(filteredStock(cat),sort);
   const qty=selected.reduce((a,p)=>a+N(p.qty),0),zeros=selected.filter(p=>N(p.qty)<1).length,codes=new Set(selected.map(p=>String(p.code||'')).filter(Boolean)).size;
   const tabs=['all','carro','moto','acessorios'].map(k=>`<button class="lp-stock-tab ${cat===k?'active':''}" onclick="lpSetStockCategory('${k}')">${k==='all'?'Todos':catLabel(k)}</button>`).join('');
   let sections='';
   if(cat==='all'){
     for(const k of ['carro','moto','acessorios'])sections+=stockSection(k,sortProducts(filteredStock(k),sort));
   }else sections=stockSection(cat,selected);
   document.getElementById('estoque').innerHTML=heading('Estoque','Separado por carro, moto e acessórios, com quantidade por código',`<div class="actions"><button class="btn ghost" onclick="lpStockCodeSummary()">Resumo por código</button><button class="btn primary" onclick="productModal()">+ Produto</button></div>`)+
   `<div class="lp-stock-summary-grid">${metric('Produtos / cadastros',selected.length,'itens nesta classificação','green')}${metric('Unidades em estoque',qty,'soma das quantidades','green')}${metric('Códigos',codes,'códigos distintos','green')}${metric('Zerados',zeros,'alerta somente abaixo de 1',zeros?'red':'green')}</div>
   <div class="card"><div class="lp-stock-tabs">${tabs}</div><div class="toolbar"><input id="lpStockSearch" placeholder="Pesquisar código, produto, marca ou classificação" oninput="lpFilterStock(this.value)"><select onchange="lpSetStockSort(this.value)"><option value="code" ${sort==='code'?'selected':''}>Ordenar por código</option><option value="name" ${sort==='name'?'selected':''}>Ordenar por nome</option><option value="qtyasc" ${sort==='qtyasc'?'selected':''}>Menor estoque</option><option value="qtydesc" ${sort==='qtydesc'?'selected':''}>Maior estoque</option><option value="pricedesc" ${sort==='pricedesc'?'selected':''}>Maior preço</option></select></div></div>${sections}`;
 };

 /* Modal universal: X, Escape, clique fora e botão Fechar nos conteúdos que precisam. */
 window.closeModal=function(){
   const m=document.getElementById('modal');if(!m)return;
   m.classList.remove('show');m.style.display='none';m.style.pointerEvents='none';document.body.style.overflow='';
 };
 window.showModal=function(content){
   const m=document.getElementById('modal'),body=document.getElementById('modalBody');if(!m||!body)return;
   body.innerHTML=`<button class="modal-close-x" type="button" aria-label="Fechar" title="Fechar" onclick="closeModal()">×</button>${content}`;
   m.style.display='flex';m.style.pointerEvents='auto';m.classList.add('show');document.body.style.overflow='hidden';
 };
 if(!window.__lpModalEvents){
   window.__lpModalEvents=true;
   document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal')?.classList.contains('show'))closeModal()});
   document.getElementById('modal')?.addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
 }

 /* Catálogo: restaura e deixa visível a conexão Firebase. */
 window.lpCatalogConnect=function(){try{if(typeof firebaseLoginModal==='function')firebaseLoginModal();else alert('Firebase ainda não carregou.')}catch(e){console.error(e);alert('Não foi possível abrir a conexão Firebase.')}};
 window.lpCatalogPull=async function(){try{if(typeof pullFirebaseCatalog==='function')await pullFirebaseCatalog();else alert('Função de leitura do Firebase indisponível.')}catch(e){console.error(e);alert('Não foi possível baixar o catálogo agora.')}};
 window.lpCatalogSyncAll=async function(){try{if(typeof syncAllCatalogToFirebase==='function')await syncAllCatalogToFirebase();else alert('Função de sincronização indisponível.')}catch(e){console.error(e);alert('Não foi possível sincronizar agora.')}};
 window.lpCatalogSyncOne=async function(id){try{if(typeof publishProductToFirebase==='function')await publishProductToFirebase(id);else alert('Função de sincronização indisponível.')}catch(e){console.error(e);alert('Não foi possível sincronizar este produto.')}};
 window.renderCatalogo=function(){
   ensureData();
   const all=Array.isArray(data.catalogItems)?data.catalogItems:[];
   const items=all.filter(x=>N(x.qty)>0);
   const status=typeof firebaseStatusHTML==='function'?firebaseStatusHTML():'<span class="badge warn">Firebase carregando...</span>';
   const rows=items.map(x=>{
     const p=(data.products||[]).find(p=>String(p.id)===String(x.productId));
     if(p)Object.assign(x,{code:p.code,name:p.name,brand:p.brand,category:p.category,qty:p.qty,price:p.price});
     return `<tr><td><b>${E(x.code||'')}</b></td><td>${E(x.name||'')}</td><td>${E(x.brand||'')}</td><td>${N(x.qty)}</td><td>${M(x.price)}</td><td>${x.firebaseId?'<span class="badge ok">Firebase</span>':'<span class="badge warn">Local</span>'}</td><td class="actions"><button class="btn ghost small" onclick="lpCatalogSyncOne('${E(x.productId)}')">Sincronizar</button>${typeof removeFromCatalog==='function'?`<button class="btn ghost small" onclick="removeFromCatalog(${x.id})">Remover</button>`:''}</td></tr>`;
   }).join('');
   document.getElementById('catalogo').innerHTML=heading('Catálogo LePneus','Conexão do Controle com o catálogo público',`<div class="actions"><button class="btn ghost" onclick="lpCatalogConnect()">Conectar Firebase</button><button class="btn ghost" onclick="lpCatalogPull()">Baixar catálogo</button><button class="btn primary" onclick="lpCatalogSyncAll()">Sincronizar selecionados</button></div>`)+
   `<div class="card lp-catalog-connection"><div class="lp-catalog-status"><h3 class="section-title" style="margin:0 0 9px">Conexão Firebase</h3>${status}<div class="notice" style="margin-top:12px;margin-bottom:0"><b>Fluxo:</b> Estoque → Catálogo LePneus → Firebase → site público. O custo não é publicado.</div></div><div class="lp-catalog-actions"><button class="btn ghost" onclick="lpCatalogConnect()">Conta / conexão</button><button class="btn primary" onclick="lpCatalogSyncAll()">Atualizar catálogo</button></div></div>
   <div class="cards" style="margin-top:16px">${metric('No catálogo',items.length,'produtos com estoque','green')}${metric('Publicados na nuvem',items.filter(x=>x.firebaseId).length,'vinculados ao Firebase','green')}${metric('Unidades',items.reduce((a,x)=>a+N(x.qty),0),'disponíveis','green')}</div>
   <div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Código</th><th>Produto</th><th>Marca</th><th>Estoque</th><th>Preço</th><th>Conexão</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhum produto selecionado para o catálogo. Vá ao Estoque e envie os produtos desejados.</td></tr>'}</tbody></table></div>`;
 };

 /* Serviços: mantém data, cliente e telefone visíveis. */
 window.lpFillServicePhone=function(){const id=document.getElementById('oscustomer')?.value;const c=(data.customers||[]).find(x=>String(x.id)===String(id));const el=document.getElementById('osphone');if(el)el.value=c?.phone||''};
 window.osModal=function(){
   const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
   showModal(`<h2>Novo serviço</h2><div class="form"><label>Data<input id="osdate" type="date" value="${now.toISOString().slice(0,10)}"></label><label>Cliente<select id="oscustomer" onchange="lpFillServicePhone()">${customerOptions()}</select></label><label>Telefone / WhatsApp<input id="osphone" placeholder="(00) 00000-0000"></label><label>Responsável<input id="osowner" value="Administrador"></label><label class="full">Serviço<input id="osservice" placeholder="Descrição do serviço"></label><label>Produto utilizado<select id="osproduct"><option value="">Nenhum</option>${productOptions()}</select></label><label>Quantidade<input id="osqty" type="number" min="0" value="0"></label><label>Valor do serviço<input id="osservicevalue" type="number" step="0.01" value="0"></label><label>Desconto<input id="osdiscount" type="number" step="0.01" value="0"></label><label>Status<select id="osstatus"><option>Aberta</option><option>Aguardando</option><option>Em andamento</option><option>Concluída</option></select></label><label class="full">Observações<textarea id="osnotes" rows="3"></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveOS()">Salvar serviço</button></div>`);setTimeout(lpFillServicePhone,0);
 };
 window.saveOS=function(){
   const p=(data.products||[]).find(x=>String(x.id)===String(document.getElementById('osproduct')?.value||''));
   const qty=N(document.getElementById('osqty')?.value),serviceValue=N(document.getElementById('osservicevalue')?.value),discount=N(document.getElementById('osdiscount')?.value);
   const service=String(document.getElementById('osservice')?.value||'').trim();if(!service)return alert('Informe o serviço.');
   if(p&&qty>N(p.qty)&&!data.settings.allowNegativeStock)return alert('Estoque insuficiente.');
   const customerId=document.getElementById('oscustomer')?.value||'',phone=String(document.getElementById('osphone')?.value||'').trim();
   const c=(data.customers||[]).find(x=>String(x.id)===String(customerId));if(c&&phone)c.phone=phone;
   const dv=document.getElementById('osdate')?.value;const date=dv?new Date(dv+'T12:00:00').toLocaleDateString('pt-BR'):new Date().toLocaleDateString('pt-BR');
   const productValue=p?N(p.price)*qty:0,total=Math.max(0,serviceValue+productValue-discount);
   const o={id:Date.now(),number:(data.settings.osPrefix||'OS')+'-'+String((data.serviceOrders||[]).length+1).padStart(4,'0'),date,customerId,customerPhone:phone,responsible:document.getElementById('osowner')?.value||'Administrador',service,productId:p?.id||'',productName:p?.name||'',qty,productValue,serviceValue,discount,total,status:document.getElementById('osstatus')?.value||'Aberta',notes:document.getElementById('osnotes')?.value||'',stockDeducted:false,received:false};
   data.serviceOrders.unshift(o);if(p&&qty>0){addStockMovement(p.id,'Saída',qty,'Produto utilizado em OS',o.number);o.stockDeducted=true}log('Criou serviço '+o.number);save();closeModal();renderAll();
 };
 window.renderOS=function(){
   enhanceData();const rows=(data.serviceOrders||[]).map(o=>{const c=(data.customers||[]).find(x=>String(x.id)===String(o.customerId));const ph=o.customerPhone||c?.phone||'-';return `<tr><td><b>${E(o.number)}</b></td><td>${E(o.date||'-')}</td><td>${E(findCustomerName(o.customerId))}</td><td>${E(ph)}</td><td>${E(o.service||'')}</td><td>${o.qty||'-'}</td><td>${M(o.serviceValue||o.total||0)}</td><td>${statusBadge(o.status)}</td><td class="actions"><button class="btn ghost small" onclick="changeOSStatus(${o.id})">Status</button>${o.status==='Concluída'&&!o.received?`<button class="btn primary small" onclick="receiveOSModal(${o.id})">Receber</button>`:''}</td></tr>`}).join('');
   document.getElementById('os').innerHTML=heading('Serviços','Data, cliente, telefone e serviço registrados juntos',`<button class="btn primary" onclick="osModal()">+ Novo serviço</button>`)+`<div class="card table-wrap"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Telefone</th><th>Serviço</th><th>Qtd.</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">Nenhum serviço registrado.</td></tr>'}</tbody></table></div>`;
 };

 /* Cliente: detalhes de cada compra e há quantos dias. */
 window.customerDetail=function(id){
   const c=(data.customers||[]).find(x=>String(x.id)===String(id));if(!c)return;
   const sales=(typeof activeSales==='function'?activeSales():data.sales||[]).filter(s=>String(s.customerId)===String(id)||String(s.customer||'').toLowerCase()===String(c.name||'').toLowerCase());
   const rows=[];sales.forEach(s=>{let d=typeof parseBRDateTime==='function'?parseBRDateTime(s.date):new Date(s.date);let days=(d&&!isNaN(d))?Math.max(0,Math.floor((Date.now()-d.getTime())/86400000)):null;(s.items||[]).forEach(i=>rows.push(`<tr><td>${E(s.date||'-')}</td><td>${E(i.name||'Produto')}</td><td>${N(i.qty)}</td><td>${M(N(i.price)*N(i.qty))}</td><td><b>${days===null?'-':days===0?'Hoje':days===1?'Há 1 dia':`Há ${days} dias`}</b></td></tr>`))});
   showModal(`<h2>${E(c.name)}</h2><div class="notice"><b>Telefone:</b> ${E(c.phone||'-')}</div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Produto</th><th>Qtd.</th><th>Valor</th><th>Tempo</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="5" class="empty">Nenhuma compra registrada.</td></tr>'}</tbody></table></div><div class="modal-actions lp-modal-footer"><button class="btn primary" onclick="closeModal()">Fechar</button></div>`);
 };

 /* Mercado Livre: modal sempre tem X e botão Fechar; sem travar a navegação. */
 const oldTop30=window.mlShowTop30;
 window.mlShowTop30=function(){
   try{
     if(typeof oldTop30==='function')oldTop30();
     const body=document.getElementById('modalBody');if(body&&!body.querySelector('.lp-modal-footer'))body.insertAdjacentHTML('beforeend','<div class="modal-actions lp-modal-footer"><button class="btn primary" onclick="closeModal()">Fechar</button></div>');
   }catch(e){console.error(e);showModal('<h2>Mercado Livre</h2><div class="notice">Não foi possível montar as oportunidades agora. Feche esta janela e tente novamente.</div><div class="modal-actions lp-modal-footer"><button class="btn primary" onclick="closeModal()">Fechar</button></div>')}
 };

 /* Mantém a navegação estável: renderiza só a página aberta. */
 window.renderPageStable=function(id){
   const map={dashboard:window.renderDashboard,estoque:window.renderEstoque,planilhas:window.renderPlanilhas,vendas:window.renderVendas,catalogo:window.renderCatalogo,mercadolivre:window.renderMercadoLivre,caixa:window.renderCaixa,compras:window.renderCompras,clientes:window.renderClientes,fornecedores:window.renderFornecedores,os:window.renderOS,agenda:window.renderAgenda,fechamento:window.renderFechamento,backup:window.renderBackup,usuarios:window.renderUsuarios};
   const fn=map[id];if(typeof fn!=='function')return;
   try{ensureData();enhanceData();fn()}catch(e){console.error('Tela '+id,e);const el=document.getElementById(id);if(el)el.innerHTML='<div class="card"><b>Não foi possível carregar esta tela.</b><p>O erro ficou isolado e não bloqueia o restante do sistema.</p></div>'}
 };
 window.renderAll=function(){const a=document.querySelector('.page.active');if(a)window.renderPageStable(a.id)};
})();
</script>

<script id="lp-dashboard-catalog-auto-v8-js">
(function(){
 const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};
 const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 const E=v=>typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
 const now=()=>new Date().toLocaleString('pt-BR');

 function categoryKey(p){
   const s=(String(p?.category||'')+' '+String(p?.location||'')+' '+String(p?.name||'')).toLowerCase();
   if(s.includes('moto')) return 'moto';
   if(s.includes('acess')||s.includes('câmara')||s.includes('camara')||s.includes('roda')||s.includes('material')) return 'acessorios';
   if(s.includes('caminh')||s.includes('peça')||s.includes('peca')) return 'pecas';
   return 'carro';
 }
 function autoCatalogProduct(p){ return ['carro','moto'].includes(categoryKey(p)); }
 function publicableProduct(p){ return autoCatalogProduct(p)&&N(p.qty)>0; }

 function activeSalesSafe(){
   try{return typeof activeSales==='function'?activeSales():(data.sales||[]).filter(s=>String(s.status||'').toLowerCase()!=='cancelada')}
   catch(e){return data.sales||[]}
 }
 function parseDateSafe(s){
   try{ if(typeof parseBRDateTime==='function'){const d=parseBRDateTime(s);if(d&&!isNaN(d))return d} }catch(e){}
   if(!s)return null;
   const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);
   if(m)return new Date(+m[3],+m[2]-1,+m[1]);
   const d=new Date(s); return isNaN(d)?null:d;
 }
 function monthKey(d){return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:''}

 /* DASHBOARD: mais informação, sem carregar gráficos fora da tela. */
 window.renderDashboard=function(){
   try{ensureData();enhanceData()}catch(e){}
   const sales=activeSalesSafe();
   const revenue=sales.reduce((a,s)=>a+N(s.total),0);
   const profit=sales.reduce((a,s)=>a+N(s.profit),0);
   const avgTicket=sales.length?revenue/sales.length:0;
   const units=(data.products||[]).reduce((a,p)=>a+N(p.qty),0);
   const cars=(data.products||[]).filter(p=>categoryKey(p)==='carro');
   const motos=(data.products||[]).filter(p=>categoryKey(p)==='moto');
   const acc=(data.products||[]).filter(p=>categoryKey(p)==='acessorios');
   const parts=(data.products||[]).filter(p=>categoryKey(p)==='pecas');
   const zero=(data.products||[]).filter(p=>N(p.qty)<1).length;
   const clients=(data.customers||[]).length;
   const openOS=(data.serviceOrders||[]).filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length;
   const cashIn=(data.cash||[]).filter(c=>c.type==='Entrada').reduce((a,c)=>a+N(c.value),0);
   const cashOut=(data.cash||[]).filter(c=>c.type==='Saída').reduce((a,c)=>a+N(c.value),0);
   const cash=cashIn-cashOut;

   document.getElementById('dashboard').innerHTML=
     heading('Dashboard','Visão geral de vendas, estoque, caixa, catálogo e operação')+
     `<div class="lp-dashboard-grid">
       ${metric('Faturamento',M(revenue),sales.length+' venda(s) ativa(s)','green')}
       ${metric('Lucro registrado',M(profit),'lucro das vendas','green')}
       ${metric('Ticket médio',M(avgTicket),'valor médio por venda','green')}
       ${metric('Saldo do caixa',M(cash),'entradas menos saídas',cash>=0?'green':'red')}
       ${metric('Unidades em estoque',units,(data.products||[]).length+' produtos cadastrados','green')}
       ${metric('Produtos zerados',zero,'alerta somente estoque < 1',zero?'red':'green')}
       ${metric('Clientes',clients,'cadastrados','green')}
       ${metric('Serviços abertos',openOS,'em andamento',openOS?'red':'green')}
     </div>
     <div class="lp-dashboard-charts">
       <div class="card lp-chart-card"><div class="panel-head"><div><h3 class="section-title" style="margin:0">Faturamento por mês</h3><small class="cell-sub">Últimos 6 meses com vendas registradas</small></div></div><div class="lp-chart-wrap"><canvas id="lpChartMonthly"></canvas></div></div>
       <div class="card lp-chart-card"><div class="panel-head"><div><h3 class="section-title" style="margin:0">Distribuição do estoque</h3><small class="cell-sub">Quantidade de cadastros por classificação</small></div></div><div class="lp-chart-wrap"><canvas id="lpChartStock"></canvas></div></div>
     </div>
     <div class="lp-dashboard-charts-3">
       <div class="card"><div class="panel-head"><h3 class="section-title" style="margin:0">Estoque por categoria</h3></div>
         <div class="summary-list"><div><span>Pneus de carro</span><b>${cars.length} produtos • ${cars.reduce((a,p)=>a+N(p.qty),0)} un.</b></div><div><span>Pneus de moto</span><b>${motos.length} produtos • ${motos.reduce((a,p)=>a+N(p.qty),0)} un.</b></div><div><span>Acessórios</span><b>${acc.length} produtos • ${acc.reduce((a,p)=>a+N(p.qty),0)} un.</b></div><div><span>Peças</span><b>${parts.length} produtos • ${parts.reduce((a,p)=>a+N(p.qty),0)} un.</b></div></div>
       </div>
       <div class="card"><div class="panel-head"><h3 class="section-title" style="margin:0">Catálogo automático</h3></div>
         <div class="summary-list"><div><span>Carro + Moto publicáveis</span><b>${(data.products||[]).filter(publicableProduct).length}</b></div><div><span>Vinculados localmente</span><b>${(data.catalogItems||[]).filter(x=>{const p=(data.products||[]).find(p=>String(p.id)===String(x.productId));return p&&publicableProduct(p)}).length}</b></div><div><span>Firebase</span><b>${window.lpFirebaseUser?'Conectado':'Aguardando login'}</b></div></div>
       </div>
       <div class="card"><div class="panel-head"><h3 class="section-title" style="margin:0">Últimas movimentações</h3></div>
         <div class="activity-feed">${(data.history||[]).slice(0,5).map(h=>`<div class="activity-row"><span class="activity-dot"></span><div><b>${E(h.action||'Movimentação')}</b><small>${E(h.date||'')} • ${E(h.user||'Administrador')}</small></div></div>`).join('')||'<div class="empty">Nenhuma movimentação registrada.</div>'}</div>
       </div>
     </div>`;

   setTimeout(()=>{
     if(typeof Chart==='undefined')return;
     try{
       const monthly=new Map();
       sales.forEach(s=>{const d=parseDateSafe(s.date);if(!d)return;const k=monthKey(d);monthly.set(k,(monthly.get(k)||0)+N(s.total))});
       const keys=[...monthly.keys()].sort().slice(-6);
       const c1=document.getElementById('lpChartMonthly');
       if(c1)new Chart(c1,{type:'bar',data:{labels:keys.map(k=>{const [y,m]=k.split('-');return `${m}/${y}`}),datasets:[{label:'Faturamento',data:keys.map(k=>monthly.get(k)),borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}});
       const c2=document.getElementById('lpChartStock');
       if(c2)new Chart(c2,{type:'doughnut',data:{labels:['Carro','Moto','Acessórios','Peças'],datasets:[{data:[cars.length,motos.length,acc.length,parts.length]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
     }catch(e){console.warn('Dashboard gráficos:',e)}
   },60);
 };

 /* CATÁLOGO: reconcilia automaticamente todos Carro/Moto com estoque. */
 window.lpReconcileAutoCatalog=function(){
   try{ensureData()}catch(e){}
   data.catalogItems=Array.isArray(data.catalogItems)?data.catalogItems:[];
   const products=Array.isArray(data.products)?data.products:[];
   let added=0,updated=0,removed=0;

   products.forEach(p=>{
     if(!autoCatalogProduct(p))return;
     const idx=data.catalogItems.findIndex(x=>String(x.productId)===String(p.id));
     if(N(p.qty)>0){
       const vals={code:p.code,name:p.name,brand:p.brand,category:p.category,qty:N(p.qty),price:N(p.price),updatedAt:now(),autoCatalog:true};
       if(idx>=0){Object.assign(data.catalogItems[idx],vals);updated++}
       else{data.catalogItems.unshift({id:Date.now()+Math.random(),productId:p.id,status:'Pronto para publicar',importedAt:now(),...vals});added++}
     }else if(idx>=0){
       data.catalogItems.splice(idx,1);removed++;
     }
   });
   try{save()}catch(e){}
   return {added,updated,removed};
 };

 function catalogAudit(){
   const products=Array.isArray(data.products)?data.products:[];
   const expected=products.filter(publicableProduct);
   const cars=expected.filter(p=>categoryKey(p)==='carro');
   const motos=expected.filter(p=>categoryKey(p)==='moto');
   const linkedIds=new Set((data.catalogItems||[]).map(x=>String(x.productId)));
   const missing=expected.filter(p=>!linkedIds.has(String(p.id)));
   const cloudLinked=expected.filter(p=>{const x=(data.catalogItems||[]).find(x=>String(x.productId)===String(p.id));return !!x?.firebaseId});
   return {expected,cars,motos,missing,cloudLinked};
 }
 window.lpShowCatalogDivergence=function(){
   window.lpReconcileAutoCatalog();
   const a=catalogAudit();
   const rows=a.missing.map(p=>`<tr><td>${E(p.code||'')}</td><td>${E(p.name||'')}</td><td>${E(categoryKey(p)==='moto'?'Moto':'Carro')}</td><td>${N(p.qty)}</td></tr>`).join('');
   showModal(`<h2>Conferência do catálogo</h2><div class="notice">O controle considera automático somente <b>pneus de Carro e Moto com estoque acima de zero</b>. Acessórios e Peças ficam fora da sincronização automática.</div><div class="lp-catalog-audit"><div><span>Carro publicável</span><b>${a.cars.length}</b></div><div><span>Moto publicável</span><b>${a.motos.length}</b></div><div><span>Total esperado</span><b>${a.expected.length}</b></div><div><span>Firebase vinculado</span><b>${a.cloudLinked.length}</b></div><div><span>Faltando local</span><b class="${a.missing.length?'lp-catalog-bad':'lp-catalog-ok'}">${a.missing.length}</b></div></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Código</th><th>Produto</th><th>Tipo</th><th>Estoque</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty">Nenhuma divergência local. Carro e Moto estão reconciliados.</td></tr>'}</tbody></table></div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Fechar</button></div>`);
 };
 window.lpAutoSyncCatalog=function(silent=false){
   window.lpReconcileAutoCatalog();
   if(!window.lpFirebaseUser){
     if(!silent&&typeof firebaseLoginModal==='function')firebaseLoginModal();
     return Promise.resolve({ok:false,reason:'auth'});
   }
   const eligible=(data.products||[]).filter(autoCatalogProduct);
   let ok=0,err=0;
   return (async()=>{
     for(const p of eligible){
       try{
         const r=await publishProductToFirebase(p.id,true);
         r?.ok?ok++:err++;
       }catch(e){err++}
     }
     try{save()}catch(e){}
     if(document.getElementById('catalogo')?.classList.contains('active'))window.renderCatalogo();
     if(!silent)alert(`Catálogo automático atualizado.\nCarro/Moto processados: ${eligible.length}\nSucesso: ${ok}\nErros: ${err}`);
     return {ok:true,total:eligible.length,success:ok,errors:err};
   })();
 };

 window.renderCatalogo=function(){
   window.lpReconcileAutoCatalog();
   const a=catalogAudit();
   const visible=(data.catalogItems||[]).filter(x=>{
     const p=(data.products||[]).find(p=>String(p.id)===String(x.productId));
     return p&&publicableProduct(p);
   });
   const rows=visible.map(x=>{
     const p=(data.products||[]).find(p=>String(p.id)===String(x.productId));
     return `<tr><td><b>${E(p?.code||x.code||'')}</b></td><td>${E(p?.name||x.name||'')}</td><td>${E(categoryKey(p)==='moto'?'Moto':'Carro')}</td><td>${E(p?.brand||x.brand||'')}</td><td><b>${N(p?.qty??x.qty)}</b></td><td>${M(p?.price??x.price)}</td><td>${x.firebaseId?'<span class="badge ok">Firebase</span>':'<span class="badge warn">Aguardando nuvem</span>'}</td></tr>`;
   }).join('');
   const status=window.lpFirebaseUser?'<span class="badge ok">Firebase conectado</span>':'<span class="badge warn">Firebase desconectado</span>';
   document.getElementById('catalogo').innerHTML=
     heading('Catálogo LePneus','Carro e Moto atualizam automaticamente a partir do Controle',`<div class="actions"><button class="btn ghost" onclick="lpShowCatalogDivergence()">Conferir divergências</button><button class="btn ghost" onclick="lpCatalogConnect()">Conectar Firebase</button><button class="btn primary" onclick="lpAutoSyncCatalog(false)">Atualizar agora</button></div>`)+
     `<div class="card"><div class="panel-head"><div><h3 class="section-title" style="margin:0">Sincronização automática</h3><small class="cell-sub">Estoque → Catálogo local → Firebase → site público</small></div>${status}</div>
       <div class="notice"><b>Regra:</b> todos os pneus de <b>Carro e Moto</b> com estoque acima de zero entram automaticamente. Acessórios e Peças não entram automaticamente.</div>
       <div class="lp-catalog-audit"><div><span>Carro publicável</span><b>${a.cars.length}</b></div><div><span>Moto publicável</span><b>${a.motos.length}</b></div><div><span>Total esperado</span><b>${a.expected.length}</b></div><div><span>Vinculados Firebase</span><b>${a.cloudLinked.length}</b></div><div><span>Divergência local</span><b class="${a.missing.length?'lp-catalog-bad':'lp-catalog-ok'}">${a.missing.length}</b></div></div>
     </div>
     <div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Código</th><th>Produto</th><th>Tipo</th><th>Marca</th><th>Estoque</th><th>Preço</th><th>Nuvem</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhum pneu de Carro/Moto com estoque disponível.</td></tr>'}</tbody></table></div>`;

 /* PLANILHAS: adiciona campo reservado para Peças. */
 const oldSheetLabel=window.sheetConnectionLabel;
 window.sheetConnectionLabel=function(type){
   if(type==='pecas')return 'Planilha de Peças';
   return typeof oldSheetLabel==='function'?oldSheetLabel(type):(type==='carro'?'Planilha Carro':type==='moto'?'Planilha Moto':'Planilha Acessórios');
 };
 window.lpReservedPartsImport=function(){
   alert('Campo de Peças já está reservado. Quando você enviar a planilha de peças de caminhão, eu configuro os cabeçalhos e a importação sem misturar com os pneus.');
 };
 window.renderPlanilhas=function(){
   try{ensureData();enhanceData()}catch(e){}
   data.spreadsheetConnections=data.spreadsheetConnections||{};
   data.pendingImportDifferences=data.pendingImportDifferences||[];
   const types=['carro','moto','acessorios','pecas'];
   const desc={carro:'Pneus de carro',moto:'Pneus de moto',acessorios:'Câmaras, rodas e acessórios',pecas:'Peças de caminhão • campo reservado'};
   const cards=types.map(type=>{
     const c=data.spreadsheetConnections[type];
     const pending=data.pendingImportDifferences.filter(x=>x.type===type&&x.status==='Pendente').length;
     const reserved=type==='pecas';
     return `<div class="card ${reserved?'lp-sheet-reserved':''}"><div class="panel-head"><div><h3 class="section-title" style="margin:0">${E(window.sheetConnectionLabel(type))}</h3><small class="cell-sub">${E(desc[type])}</small></div>${reserved?'<span class="badge warn">Reservado</span>':c?'<span class="badge ok">Configurada</span>':'<span class="badge warn">Não selecionada</span>'}</div>
       ${c?`<div class="notice"><b>Arquivo:</b> ${E(c.name||'')}${c.lastImportedAt?`<br><b>Última importação:</b> ${E(c.lastImportedAt)}`:''}</div>`:reserved?'<div class="notice">Já deixei a área pronta. A estrutura será configurada quando você enviar a planilha amanhã.</div>':'<p style="color:var(--muted);font-size:13px">Escolha a planilha original deste estoque.</p>'}
       <input id="${spreadsheetInputId(type)}" type="file" accept=".xlsx,.xls" style="width:100%;margin:10px 0 12px">
       <div class="actions"><button class="btn ghost" onclick="connectSpreadsheet('${type}')">Selecionar arquivo</button>${reserved?`<button class="btn primary" onclick="lpReservedPartsImport()">Configurar quando enviar</button>`:`<button class="btn primary" onclick="importSpreadsheet('${type}')">Importar / Atualizar agora</button>`}${pending?`<button class="btn ghost" onclick="lpNextDifference()">Revisar diferenças</button>`:''}</div>
     </div>`;
   }).join('');
   const connected=['carro','moto','acessorios'].filter(t=>data.spreadsheetConnections[t]).length;
   const pending=data.pendingImportDifferences.filter(x=>x.status==='Pendente').length;
   document.getElementById('planilhas').innerHTML=
     heading('Conexão Planilhas','Carro, Moto, Acessórios e campo reservado para Peças')+
     `<div class="notice"><b>Hoje:</b> a importação atualiza o Controle quando você seleciona o Excel. Depois da importação de Carro ou Moto, o Catálogo local é reconciliado automaticamente e, se o Firebase estiver conectado, a nuvem também é atualizada.</div>
      <div class="cards">${metric('Planilhas ativas','3','Carro • Moto • Acessórios','green')}${metric('Selecionadas',connected,'neste navegador',connected===3?'green':'red')}${metric('Campo Peças','Pronto','aguardando a planilha','green')}${metric('Diferenças pendentes',pending,'aguardando revisão',pending?'red':'green')}</div>
      <div class="settings-grid" style="margin-top:16px">${cards}</div>
      <div class="lp-auto-sync-box"><div class="panel-head"><div><h3 class="section-title" style="margin:0">Conexão automática — próxima etapa</h3><small class="cell-sub">Para a planilha alterar o sistema sozinha, sem clicar em Importar.</small></div><span class="badge warn">Precisa de ponte/backend</span></div>
        <div class="lp-auto-sync-steps"><div><b>1. Fonte da planilha</b><small>Excel no OneDrive/SharePoint ou uma pasta no PC monitorada por um programa ponte.</small></div><div><b>2. Serviço de sincronização</b><small>Um backend seguro lê a planilha periodicamente ou recebe alteração e envia os dados ao Controle/Firebase.</small></div><div><b>3. Regras de estoque</b><small>Comparar código, custo, preço e estoque; redução continua pedindo confirmação de venda/ajuste.</small></div><div><b>4. Catálogo</b><small>Carro/Moto sincronizam para Firebase automaticamente; acessórios e peças ficam conforme regra definida.</small></div></div>
      </div>`;
 };

 /* Após importar Carro/Moto, reconcilia o catálogo e sincroniza a nuvem se já estiver autenticado. */
 const previousImport=window.importSpreadsheet;
 if(typeof previousImport==='function'){
   window.importSpreadsheet=async function(type){
     const result=await previousImport(type);
     if(type==='carro'||type==='moto'){
       const r=window.lpReconcileAutoCatalog();
       try{save()}catch(e){}
       if(window.lpFirebaseUser){
         try{await window.lpAutoSyncCatalog(true)}catch(e){console.warn('Auto catálogo Firebase:',e)}
       }
       if(document.getElementById('catalogo')?.classList.contains('active'))window.renderCatalogo();
       console.info('Catálogo reconciliado após importação:',r);
     }
     return result;
   };
 }

 /* Corrige atualização de canal: qualquer mudança posterior em Carro/Moto atualiza o catálogo local. */
 const previousSyncChannels=window.syncProductChannels;
 if(typeof previousSyncChannels==='function'){
   window.syncProductChannels=function(p){
     const r=previousSyncChannels.apply(this,arguments);
     if(p&&autoCatalogProduct(p)){
       window.lpReconcileAutoCatalog();
     }
     return r;
   };
 }

 /* Reconciliação inicial sem tocar em acessórios. */
 setTimeout(()=>{try{window.lpReconcileAutoCatalog()}catch(e){console.warn(e)}},250);
})();
</script>

<script id="lp-service-status-v9-js">
(function(){
 const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};
 const E=v=>typeof esc==='function'?esc(v):String(v??'');
 const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 const TODAY=()=>new Date().toLocaleDateString('pt-BR');

 function serviceCustomer(o){
   return (data.customers||[]).find(x=>String(x.id)===String(o.customerId));
 }
 function servicePhone(o){
   const c=serviceCustomer(o);
   return o.customerPhone||c?.phone||'-';
 }
 function serviceCustomerName(o){
   const c=serviceCustomer(o);
   return c?.name||((typeof findCustomerName==='function')?findCustomerName(o.customerId):'Cliente')||'Cliente';
 }
 function serviceCompletedDate(o){
   return o.completedDate||o.completedAt||'';
 }
 function serviceIsToday(o){
   const d=String(serviceCompletedDate(o)||'');
   return d.startsWith(TODAY());
 }
 function serviceCompletedToday(){
   return (data.serviceOrders||[]).filter(o=>['Concluída','Entregue'].includes(o.status)&&serviceIsToday(o));
 }

 /* Modal de status: substitui prompt e permite ir/voltar entre estados */
 window.changeOSStatus=function(id){
   const o=(data.serviceOrders||[]).find(x=>String(x.id)===String(id));
   if(!o)return;
   const options=['Aberta','Aguardando','Em andamento','Concluída','Entregue','Cancelada'];
   showModal(`<h2>Alterar status do serviço</h2>
     <div class="notice"><b>${E(o.number)}</b> • ${E(serviceCustomerName(o))}<br>${E(o.service||'')}</div>
     <div class="form">
       <label class="full">Status
         <select id="lpOsNewStatus" class="lp-status-select">
           ${options.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
         </select>
       </label>
     </div>
     <div class="lp-service-info">
       <div><span>Cliente</span><b>${E(serviceCustomerName(o))}</b></div>
       <div><span>Telefone</span><b>${E(servicePhone(o))}</b></div>
       <div><span>Responsável</span><b>${E(o.responsible||'Administrador')}</b></div>
       <div><span>Valor do serviço</span><b>${M(o.serviceValue||0)}</b></div>
     </div>
     <div class="modal-actions">
       <button class="btn ghost" onclick="closeModal()">Cancelar</button>
       <button class="btn primary" onclick="lpSaveOSStatus(${id})">Salvar status</button>
     </div>`);
 };

 window.lpSaveOSStatus=function(id){
   const o=(data.serviceOrders||[]).find(x=>String(x.id)===String(id));
   if(!o)return;
   const el=document.getElementById('lpOsNewStatus');
   const next=el?.value||o.status;
   const old=o.status;

   if(next==='Cancelada'){
     closeModal();
     if(typeof cancelOS==='function')return cancelOS(o.id);
     o.status='Cancelada';
     o.cancelledAt=new Date().toLocaleString('pt-BR');
   }else{
     o.status=next;
   }

   if(['Concluída','Entregue'].includes(next) && !['Concluída','Entregue'].includes(old)){
     o.completedAt=new Date().toLocaleString('pt-BR');
     o.completedDate=TODAY();
     o.completedBy=(typeof currentUser==='function'&&currentUser()?.name)||'Administrador';
   }
   if(!['Concluída','Entregue'].includes(next) && ['Concluída','Entregue'].includes(old)){
     /* Ao reabrir, remove dos indicadores de concluídos do dia */
     o.completedAt='';
     o.completedDate='';
     o.completedBy='';
   }

   try{log('Alterou '+o.number+' de '+old+' para '+next)}catch(e){}
   try{save()}catch(e){}
   closeModal();
   if(document.getElementById('os')?.classList.contains('active'))renderOS();
   if(document.getElementById('dashboard')?.classList.contains('active'))renderDashboard();
 };

 /* Detalhes completos do serviço */
 window.lpServiceDetails=function(id){
   const o=(data.serviceOrders||[]).find(x=>String(x.id)===String(id));
   if(!o)return;
   showModal(`<h2>${E(o.number)} — detalhes do serviço</h2>
     <div class="lp-service-info">
       <div><span>Data de abertura</span><b>${E(o.date||'-')}</b></div>
       <div><span>Cliente</span><b>${E(serviceCustomerName(o))}</b></div>
       <div><span>Telefone</span><b>${E(servicePhone(o))}</b></div>
       <div><span>Aberto por</span><b>${E(o.responsible||'Administrador')}</b></div>
       <div><span>Status</span><b>${E(o.status||'-')}</b></div>
       <div><span>Quantidade</span><b>${N(o.qty)}</b></div>
       <div><span>Valor do serviço</span><b>${M(o.serviceValue||0)}</b></div>
       <div><span>Total da OS</span><b>${M(o.total||0)}</b></div>
     </div>
     <div class="card" style="box-shadow:none;margin-top:10px">
       <b>Descrição</b>
       <p style="margin:8px 0 0">${E(o.service||'-')}</p>
       <small class="cell-sub">Cliente: ${E(serviceCustomerName(o))} • Telefone: ${E(servicePhone(o))} • Aberto por: ${E(o.responsible||'Administrador')}</small>
     </div>
     ${o.notes?`<div class="notice" style="margin-top:12px"><b>Observações:</b><br>${E(o.notes)}</div>`:''}
     ${serviceCompletedDate(o)?`<div class="notice"><b>Concluído:</b> ${E(serviceCompletedDate(o))}${o.completedBy?` • por ${E(o.completedBy)}`:''}</div>`:''}
     <div class="modal-actions"><button class="btn ghost" onclick="changeOSStatus(${o.id})">Alterar status</button><button class="btn primary" onclick="closeModal()">Fechar</button></div>`);
 };

 /* Tabela de serviços com cliente, telefone, responsável e status editável */
 window.renderOS=function(){
   try{enhanceData()}catch(e){}
   const list=data.serviceOrders||[];
   const today=serviceCompletedToday();
   const todayValue=today.reduce((a,o)=>a+N(o.serviceValue),0);
   const todayQty=today.reduce((a,o)=>a+N(o.qty),0);
   const open=list.filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length;
   const concluded=list.filter(o=>['Concluída','Entregue'].includes(o.status)).length;

   const rows=list.map(o=>`<tr>
     <td><b>${E(o.number)}</b><small class="cell-sub">${E(o.date||'-')}</small></td>
     <td>${E(serviceCustomerName(o))}<small class="cell-sub">${E(servicePhone(o))}</small></td>
     <td>${E(o.responsible||'Administrador')}</td>
     <td class="lp-service-description">${E(o.service||'')}<small>Cliente: ${E(serviceCustomerName(o))} • ${E(servicePhone(o))}</small></td>
     <td>${N(o.qty)||'-'}</td>
     <td>${M(o.serviceValue||0)}</td>
     <td>${statusBadge(o.status)}</td>
     <td class="actions">
       <button class="btn ghost small" onclick="lpServiceDetails(${o.id})">Ver</button>
       <button class="btn ghost small" onclick="changeOSStatus(${o.id})">Editar status</button>
       ${o.status==='Concluída'&&!o.received?`<button class="btn primary small" onclick="receiveOSModal(${o.id})">Receber</button>`:''}
     </td>
   </tr>`).join('');

   document.getElementById('os').innerHTML=
     heading('Serviços','Acompanhe abertura, cliente, telefone, responsável, status e conclusão',`<button class="btn primary" onclick="osModal()">+ Novo serviço</button>`)+
     `<div class="cards">
       ${metric('Em andamento',open,'serviços ainda abertos',open?'red':'green')}
       ${metric('Concluídos',concluded,'total finalizado','green')}
       ${metric('Serviços concluídos hoje',today.length,'quantidade de OS finalizadas hoje','green')}
       ${metric('Valor de serviços hoje',M(todayValue),todayQty+' item(ns) usados nas OS de hoje','green')}
     </div>
     <div class="card table-wrap" style="margin-top:16px">
       <table>
         <thead><tr><th>OS / Data</th><th>Cliente / Telefone</th><th>Aberto por</th><th>Descrição</th><th>Qtd.</th><th>Valor serviço</th><th>Status</th><th>Ações</th></tr></thead>
         <tbody>${rows||'<tr><td colspan="8" class="empty">Nenhum serviço registrado.</td></tr>'}</tbody>
       </table>
     </div>`;
 };

 /* Dashboard: acrescenta indicador diário de serviços concluídos */
 const previousDashboardV9=window.renderDashboard;
 window.renderDashboard=function(){
   previousDashboardV9();
   const page=document.getElementById('dashboard');
   if(!page)return;
   const today=serviceCompletedToday();
   const todayValue=today.reduce((a,o)=>a+N(o.serviceValue),0);
   const todayQty=today.reduce((a,o)=>a+N(o.qty),0);
   const cards=page.querySelector('.lp-dashboard-grid,.cards');
   if(cards && !document.getElementById('lpServiceTodayDashboard')){
     const wrap=document.createElement('div');
     wrap.id='lpServiceTodayDashboard';
     wrap.className='card metric';
     wrap.innerHTML=`<div class="label">Serviços concluídos hoje</div><div class="value">${today.length}</div><div class="delta green">${M(todayValue)} • ${todayQty} item(ns)</div>`;
     cards.appendChild(wrap);
   }
 };

 /* Guarda nome/telefone do cliente na OS no momento da criação */
 const previousSaveOSV9=window.saveOS;
 window.saveOS=function(){
   const customerId=document.getElementById('oscustomer')?.value||'';
   const c=(data.customers||[]).find(x=>String(x.id)===String(customerId));
   const phone=String(document.getElementById('osphone')?.value||c?.phone||'').trim();
   const before=(data.serviceOrders||[]).length;
   previousSaveOSV9();
   const after=data.serviceOrders||[];
   if(after.length>before){
     const o=after[0];
     o.customerNameSnapshot=c?.name||'';
     o.customerPhone=phone;
     try{save()}catch(e){}
   }
 };

})();
</script>

            <small class="cell-sub">Esse login é somente para sincronizar o Controle com o catálogo público. O Controle abre sem pedir login.</small>
          </div>
          ${connected?'<span class="badge ok">Conectado</span>':'<span class="badge warn">Desconectado</span>'}
        </div>
        <div class="lp-firebase-actions" style="margin-top:12px">
          ${connected
            ?`<button class="btn ghost" onclick="lpFirebaseAdminLogout()">Desconectar Firebase</button>`
            :`<button class="btn primary" onclick="lpFirebaseAdminLogin()">Entrar com e-mail e senha do Firebase</button>`}
        </div>
        <div class="notice" style="margin-top:12px"><b>Segurança:</b> o e-mail e a senha são enviados para autenticação do Firebase. A senha não fica gravada no HTML.</div>
      </div>`;
 };

 /* ---------- CATÁLOGO: ENVIO MANUAL MAIS CLARO ---------- */
 function catalogType(p){
   const s=(String(p?.category||'')+' '+String(p?.name||'')).toLowerCase();
   if(s.includes('moto'))return 'Moto';
   return 'Carro';
 }
 function isTireForCatalog(p){
   const s=(String(p?.category||'')+' '+String(p?.name||'')).toLowerCase();
   return N(p?.qty)>0 && (s.includes('pneu')||s.includes('moto')||s.includes('carro')) &&
          !s.includes('acess')&&!s.includes('peça')&&!s.includes('peca')&&!s.includes('câmara')&&!s.includes('camara');
 }

 window.lpSendOneToCatalog=async function(id){
   const p=(data.products||[]).find(x=>String(x.id)===String(id));
   if(!p)return alert('Produto não encontrado.');
   if(N(p.qty)<=0)return alert('Esse produto está sem estoque e não pode ser enviado ao catálogo.');
   try{
     if(typeof sendToCatalogo==='function'){
       await sendToCatalogo(p.id);
     }else{
       throw new Error('Função sendToCatalogo indisponível');
     }
     if(window.lpFirebaseUser && typeof publishProductToFirebase==='function'){
       const r=await publishProductToFirebase(p.id,true);
       if(r?.ok) alert('Produto enviado/atualizado no catálogo e no Firebase.');
       else alert('Produto entrou no catálogo local, mas o Firebase não confirmou a atualização.');
     }else{
       alert('Produto enviado ao catálogo local. Para publicar no site, conecte o Firebase em Usuários.');
     }
   }catch(e){
     console.error(e);
     alert('Não foi possível enviar este produto ao catálogo.');
   }
   renderCatalogo();
 };

 window.lpSendAllTiresToCatalog=async function(){
   const tires=(data.products||[]).filter(isTireForCatalog);
   if(!tires.length)return alert('Nenhum pneu com estoque disponível para enviar.');
   let local=0,cloud=0,errors=0;
   for(const p of tires){
     try{
       let item=(data.catalogItems||[]).find(x=>String(x.productId)===String(p.id));
       const values={code:p.code,name:p.name,brand:p.brand,category:p.category,qty:N(p.qty),price:N(p.price),status:'Ativo',updatedAt:new Date().toLocaleString('pt-BR')};
       if(item)Object.assign(item,values);
       else{
         (data.catalogItems||(data.catalogItems=[])).push({id:Date.now()+Math.random(),productId:p.id,importedAt:new Date().toLocaleString('pt-BR'),...values});
       }
       local++;
       if(window.lpFirebaseUser&&typeof publishProductToFirebase==='function'){
         const r=await publishProductToFirebase(p.id,true);
         if(r?.ok)cloud++;else errors++;
       }
     }catch(e){errors++}
   }
   try{save()}catch(e){}
   renderCatalogo();
   alert(window.lpFirebaseUser
     ?`Envio concluído.\nPneus preparados: ${local}\nAtualizados no Firebase: ${cloud}\nErros: ${errors}`
     :`Pneus enviados ao catálogo local: ${local}.\nPara aparecerem no site público, entre no Firebase em Usuários e clique em “Enviar todos ao site”.`);
 };

 window.lpSendAllCloud=async function(){
   if(!window.lpFirebaseUser){
     alert('Primeiro conecte o Firebase em Usuários.');
     return;
   }
   const tires=(data.products||[]).filter(isTireForCatalog);
   let ok=0,err=0;
   for(const p of tires){
     try{
       const r=await publishProductToFirebase(p.id,true);
       r?.ok?ok++:err++;
     }catch(e){err++}
   }
   renderCatalogo();
   alert(`Envio ao site concluído.\nAtualizados: ${ok}\nErros: ${err}`);
 };

 window.renderCatalogo=function(){
   try{ensureData()}catch(e){}
   const tires=(data.products||[]).filter(isTireForCatalog);
   const localIds=new Set((data.catalogItems||[]).map(x=>String(x.productId)));
   const local=tires.filter(p=>localIds.has(String(p.id)));
   const cloud=local.filter(p=>{
     const x=(data.catalogItems||[]).find(i=>String(i.productId)===String(p.id));
     return !!x?.firebaseId;
   });
   const rows=tires.map(p=>{
     const item=(data.catalogItems||[]).find(x=>String(x.productId)===String(p.id));
     const inLocal=!!item;
     const inCloud=!!item?.firebaseId;
     return `<tr>
       <td><b>${E(p.code||'')}</b></td>
       <td>${E(p.name||'')}</td>
       <td>${E(catalogType(p))}</td>
       <td>${E(p.brand||'')}</td>
       <td><b>${N(p.qty)}</b></td>
       <td>${M(p.price)}</td>
       <td>${inLocal?'<span class="badge ok">No catálogo</span>':'<span class="badge warn">Não enviado</span>'}</td>
       <td>${inCloud?'<span class="badge ok">No site</span>':'<span class="badge warn">Aguardando Firebase</span>'}</td>
       <td><button class="btn primary small" onclick="lpSendOneToCatalog(${p.id})">${inLocal?'Atualizar':'Enviar'}</button></td>
     </tr>`;
   }).join('');

   document.getElementById('catalogo').innerHTML=
     heading('Catálogo LePneus','Envie os pneus manualmente e confira o que realmente chegou ao site',`
       <div class="lp-catalog-actions">
         <button class="btn ghost" onclick="lpShowCatalogDivergence()">Conferir diferenças</button>
         <button class="btn ghost" onclick="lpSendAllTiresToCatalog()">Enviar pneus ao catálogo</button>
         <button class="btn primary" onclick="lpSendAllCloud()">Enviar todos ao site</button>
       </div>`)+
     `<div class="cards">
       ${metric('Pneus com estoque',tires.length,'Carro + Moto','green')}
       ${metric('No catálogo local',local.length,'preparados no Controle',local.length===tires.length?'green':'red')}
       ${metric('Confirmados no Firebase',cloud.length,'com vínculo de nuvem',cloud.length===tires.length?'green':'red')}
       ${metric('Firebase',window.lpFirebaseUser?'Conectado':'Desconectado',window.lpFirebaseUser?'pronto para publicar':'entre em Usuários','green')}
     </div>
     <div class="notice" style="margin-top:16px"><b>Como usar:</b> “Enviar pneus ao catálogo” prepara todos os pneus de Carro e Moto no Controle. Depois, com o Firebase conectado em <b>Usuários</b>, use “Enviar todos ao site” para atualizar o catálogo público.</div>
     <div class="card table-wrap" style="margin-top:16px">
       <table><thead><tr><th>Código</th><th>Produto</th><th>Tipo</th><th>Marca</th><th>Estoque</th><th>Preço</th><th>Controle</th><th>Site</th><th>Ação</th></tr></thead>
       <tbody>${rows||'<tr><td colspan="9" class="empty">Nenhum pneu com estoque disponível.</td></tr>'}</tbody></table>
     </div>`;
 };

 /* Mantém o controle aberto mesmo após eventos do Firebase */
 if(window.lpAuth&&typeof window.lpAuth.onAuthStateChanged==='function'){
   window.lpAuth.onAuthStateChanged(function(user){
     window.lpFirebaseUser=user||null;
     forceControlOpen();
     if(document.getElementById('usuarios')?.classList.contains('active'))renderUsuarios();
     if(document.getElementById('catalogo')?.classList.contains('active'))renderCatalogo();
   });
 }

})();
</script>

      const page=document.getElementById('mercadolivre');
      if(page && !page.querySelector('.lp-ml-checked-note')){
        const note=document.createElement('div');
        note.className='notice lp-ml-checked-note';
        note.style.marginTop='14px';
        note.innerHTML='<b>Mercado Livre revisado:</b> cálculo de preço, oportunidades e comparação de anúncios foram mantidos. Se um modal abrir, use o <b>×</b> no canto superior para fechar.';

      }

      console.error('Mercado Livre:',e);
      const el=document.getElementById('mercadolivre');
      if(el) el.innerHTML='<div class="card"><h3 style="margin-top:0">Mercado Livre</h3><p>Não foi possível carregar essa área agora. O restante do sistema continua funcionando.</p></div>';

  const prevSaveStatus = window.lpSaveOSStatus;
  window.lpSaveOSStatus = function(id){

      if(document.getElementById('dashboard')?.classList.contains('active')) window.renderDashboard?.();

    return res;

  function enhanceOldServiceRows(){
    if(!window.data || !Array.isArray(data.serviceOrders)) return;
    let changed=false;
    (data.serviceOrders||[]).forEach(o=>{
      const c=(data.customers||[]).find(x=>String(x.id)===String(o.customerId));
      if(!o.customerNameSnapshot && c?.name){o.customerNameSnapshot=c.name;changed=true;}
      if((!o.customerPhone || String(o.customerPhone).trim()==='') && c?.phone){o.customerPhone=c.phone;changed=true;}
    });
    if(changed){ try{save?.()}catch(e){} }
  }

  const prevRenderOS = window.renderOS;
  window.renderOS = function(){
    enhanceOldServiceRows();

  };

  setTimeout(applyBetterLogo,300);

<script id="lp-ml-clean-v12-js">
(function(){
  const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};
  const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const E=v=>typeof esc==='function'?esc(v):String(v??'');

  window.__lpMLFilter=window.__lpMLFilter||'todos';
  window.__lpMLShowSettings=window.__lpMLShowSettings||false;
  window.__lpMLVisibleCount=window.__lpMLVisibleCount||12;

  function mlRows(){
    try{ if(typeof mlV6Ensure==='function')mlV6Ensure(); }catch(e){}
    const settings=data.settings||{};
    return (data.mercadoLivreItems||[]).map(x=>{
      const p=(data.products||[]).find(p=>String(p.id)===String(x.productId));
      if(!p||N(p.qty)<=0)return null;

      const cost=N(p.cost);
      const classic=N(x.mlClassicFeePct??x.mlFeePct??settings.mlClassicFeePct??14);
      const premium=N(x.mlPremiumFeePct??settings.mlPremiumFeePct??19);
      const feePct=Math.min(classic||14,premium||19);
      const listingType=(feePct===classic?'Clássico':'Premium');
      const freight=N(x.mlFreight??settings.mlDefaultFreight??0);
      const other=N(x.mlOtherCost??settings.mlDefaultOther??0);
      const fiscalPct=.05;
      const minMargin=N(settings.mlMinMarginPct??15)/100;
      const competitorAvg=N(x.mlMarketAvg);
      const competitorMin=N(x.mlMarketMin);
      const discount=N(settings.mlCompetitiveDiscountPct??2)/100;

      const denominator=1-(feePct/100)-fiscalPct-minMargin;
      const minPrice=denominator>0?(cost+freight+other)/denominator:cost+freight+other;
      const marketTarget=competitorAvg>0?competitorAvg*(1-discount):(competitorMin>0?competitorMin:0);
      const base=Math.max(N(p.price),minPrice,marketTarget);
      let price=base*1.05;
      if(settings.mlPsychologicalPrice&&price>1)price=Math.floor(price)+.90;

      const fee=price*feePct/100;
      const fiscal=price*fiscalPct;
      const profit=price-cost-fee-fiscal-freight-other;
      const margin=price?profit/price*100:0;

      let score=0;
      if(profit>0)score+=35;
      if(margin>=N(settings.mlMinMarginPct??15))score+=25;
      if(N(p.qty)>=3)score+=10;
      if(competitorAvg>0){
        const delta=(price-competitorAvg)/competitorAvg;
        if(delta<=.05)score+=25;
        else if(delta<=.12)score+=12;
      }else score+=5;
      score=Math.max(0,Math.min(100,Math.round(score)));

      let cls='neutral',label='Falta comparar';
      if(profit<=0){cls='bad';label='Não compensa'}
      else if(margin>=N(settings.mlMinMarginPct??15) && (!competitorAvg||price<=competitorAvg*1.12)){cls='good';label='Compensa'}
      else {cls='mid';label='Revisar'}

      return {x,p,cost,feePct,listingType,freight,other,fiscal,price,fee,profit,margin,score,competitorAvg,competitorMin,cls,label};
    }).filter(Boolean).sort((a,b)=>b.score-a.score||b.profit-a.profit);
  }

  window.lpMLSetFilter=function(v){
    window.__lpMLFilter=v;
    window.__lpMLVisibleCount=12;
    renderMercadoLivre();
  };
  window.lpMLToggleSettings=function(){
    window.__lpMLShowSettings=!window.__lpMLShowSettings;
    renderMercadoLivre();
  };
  window.lpMLShowMore=function(){
    window.__lpMLVisibleCount+=12;
    renderMercadoLivre();
  };

  window.lpMLSaveSettings=function(){
    data.settings=data.settings||{};
    const val=(id,def)=>N(document.getElementById(id)?.value??def);
    data.settings.mlClassicFeePct=val('lpMLClassic',data.settings.mlClassicFeePct||14);
    data.settings.mlPremiumFeePct=val('lpMLPremium',data.settings.mlPremiumFeePct||19);
    data.settings.mlMinMarginPct=val('lpMLMargin',data.settings.mlMinMarginPct||15);
    data.settings.mlCompetitiveDiscountPct=val('lpMLDiscount',data.settings.mlCompetitiveDiscountPct||2);
    data.settings.mlDefaultFreight=val('lpMLFreight',data.settings.mlDefaultFreight||0);
    data.settings.mlDefaultOther=val('lpMLOther',data.settings.mlDefaultOther||0);
    try{save()}catch(e){}
    renderMercadoLivre();
  };

  window.renderMercadoLivre=function(){
    const all=mlRows();
    const f=String(window.__lpMLFilter||'todos');
    let list=all;
    if(f==='bons')list=all.filter(r=>r.cls==='good');
    if(f==='atencao')list=all.filter(r=>r.cls==='mid'||r.cls==='neutral');
    if(f==='ruins')list=all.filter(r=>r.cls==='bad');

    const good=all.filter(r=>r.cls==='good');
    const mid=all.filter(r=>r.cls==='mid'||r.cls==='neutral');
    const bad=all.filter(r=>r.cls==='bad');
    const best=all[0];
    const avgProfit=good.length?good.reduce((a,r)=>a+r.profit,0)/good.length:0;
    const visible=list.slice(0,window.__lpMLVisibleCount||12);

    const filterBtn=(v,label)=>`<button class="lp-ml-filter ${f===v?'active':''}" onclick="lpMLSetFilter('${v}')">${label}</button>`;

    const cards=visible.map((r,i)=>`
      <div class="lp-ml-card ${r.cls}">
        <div class="lp-ml-head">
          <div>
            <div class="lp-ml-name">${E(r.p.name)}</div>
            <span class="lp-ml-sub">${E(r.p.code||'')} • estoque ${N(r.p.qty)} • ${E(r.listingType)}</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="badge ${r.cls==='good'?'ok':r.cls==='bad'?'danger':'warn'}">${E(r.label)}</span>
            <span class="lp-ml-score">${r.score}</span>
          </div>
        </div>
        <div class="lp-ml-grid">
          <div class="lp-ml-box"><span>Custo</span><b>${M(r.cost)}</b></div>
          <div class="lp-ml-box"><span>Preço sugerido</span><b>${M(r.price)}</b></div>
          <div class="lp-ml-box"><span>Lucro</span><b>${M(r.profit)} (${r.margin.toFixed(1)}%)</b></div>
          <div class="lp-ml-box"><span>Taxa ML</span><b>${M(r.fee)} (${r.feePct.toFixed(1)}%)</b></div>
          <div class="lp-ml-box"><span>Reserva fiscal</span><b>${M(r.fiscal)} (5%)</b></div>
          <div class="lp-ml-box"><span>Concorrência média</span><b>${r.competitorAvg?M(r.competitorAvg):'Não informada'}</b></div>
        </div>
        <div class="lp-ml-actions">
          <button class="btn ghost" onclick="searchMLSimilar(${r.x.id})">Buscar anúncios</button>
          <button class="btn ghost" onclick="mlV6CompetitorModal(${r.x.id})">Registrar preços</button>
          <button class="btn ghost" onclick="mlV6Details(${r.x.id})">Detalhes</button>
          <button class="btn primary" onclick="mlV6ApplyPrice(${r.x.id})">Aplicar preço</button>
        </div>
      </div>`).join('');

    const s=data.settings||{};
    const settings=window.__lpMLShowSettings?`
      <div class="lp-ml-settings">
        <div class="panel-head"><div><h3 class="section-title" style="margin:0">Custos e taxas</h3><small class="cell-sub">Só mexa quando tiver os valores reais do seu anúncio.</small></div></div>
        <div class="lp-ml-settings-grid">
          <label>Taxa Clássico (%)<input id="lpMLClassic" type="number" step="0.1" value="${N(s.mlClassicFeePct||14)}"></label>
          <label>Taxa Premium (%)<input id="lpMLPremium" type="number" step="0.1" value="${N(s.mlPremiumFeePct||19)}"></label>
          <label>Margem mínima (%)<input id="lpMLMargin" type="number" step="0.1" value="${N(s.mlMinMarginPct||15)}"></label>
          <label>Desconto vs média (%)<input id="lpMLDiscount" type="number" step="0.1" value="${N(s.mlCompetitiveDiscountPct||2)}"></label>
          <label>Frete médio (R$)<input id="lpMLFreight" type="number" step="0.01" value="${N(s.mlDefaultFreight||0)}"></label>
          <label>Outros custos (R$)<input id="lpMLOther" type="number" step="0.01" value="${N(s.mlDefaultOther||0)}"></label>
        </div>
        <div class="actions" style="margin-top:12px"><button class="btn primary" onclick="lpMLSaveSettings()">Salvar e recalcular</button></div>
      </div>`:'';

    document.getElementById('mercadolivre').innerHTML=
      heading('Mercado Livre','Veja primeiro o que compensa. Abra detalhes somente quando precisar.',`
        <div class="actions">
          <button class="btn ghost" onclick="lpMLToggleSettings()">${window.__lpMLShowSettings?'Ocultar custos':'Custos e taxas'}</button>
          <button class="btn primary" onclick="mlV6Top10()">Top 10</button>
        </div>`)+
      `<div class="cards">
        ${metric('Compensam',good.length,'margem e preço aceitáveis','green')}
        ${metric('Revisar',mid.length,'precisam de comparação',mid.length?'red':'green')}
        ${metric('Não compensam',bad.length,'cenário atual',bad.length?'red':'green')}
        ${metric('Lucro médio',M(avgProfit),'das oportunidades verdes','green')}
      </div>
      <div class="lp-ml-help">
        <div><b>1. Compare</b><small>Use “Registrar preços” para informar menor preço e média dos concorrentes.</small></div>
        <div><b>2. Confira o lucro</b><small>O cartão mostra custo, taxa, reserva fiscal, preço e lucro estimado por unidade.</small></div>
        <div><b>3. Aplique</b><small>Quando a oportunidade fizer sentido, use “Aplicar preço”.</small></div>
      </div>
      ${settings}
      <div class="lp-ml-topbar">
        <div class="lp-ml-filterbar">
          ${filterBtn('todos','Todos')}
          ${filterBtn('bons','Compensam')}
          ${filterBtn('atencao','Revisar')}
          ${filterBtn('ruins','Não compensam')}
        </div>
        <small class="cell-sub">${visible.length} de ${list.length} oportunidade(s)</small>
      </div>
      ${best?`<div class="notice"><b>Melhor oportunidade agora:</b> ${E(best.p.name)} • preço ${M(best.price)} • lucro ${M(best.profit)} (${best.margin.toFixed(1)}%).</div>`:''}
      <div class="lp-ml-list">${cards||'<div class="card empty">Nenhuma oportunidade neste filtro.</div>'}</div>
      ${list.length>visible.length?`<div style="text-align:center;margin-top:14px"><button class="btn ghost" onclick="lpMLShowMore()">Mostrar mais</button></div>`:''}
      <small class="cell-sub" style="display:block;margin-top:14px">A comparação não é automática: os preços de concorrentes dependem dos valores que você registrar. O controle não mede vendas reais do Mercado Livre.</small>`;
  };
})();
</script>

<script id="lp-complete-v13-js">
(function(){
  const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};
  const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const E=v=>typeof esc==='function'?esc(v):String(v??'');
  const $id=id=>document.getElementById(id);

  function parseDate(v){
    if(!v)return null;
    try{if(typeof parseBRDateTime==='function'){const d=parseBRDateTime(v);if(d&&!isNaN(d))return d}}catch(e){}
    const s=String(v);
    let m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(m)return new Date(+m[3],+m[2]-1,+m[1]);
    const d=new Date(s); return isNaN(d)?null:d;
  }
  function sameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
  function activeSalesSafe(){
    try{return typeof activeSales==='function'?activeSales():(data.sales||[]).filter(s=>String(s.status||'').toLowerCase()!=='cancelada')}
    catch(e){return data.sales||[]}
  }
  function productAro(p){
    const text=String(p?.name||'')+' '+String(p?.size||'')+' '+String(p?.aro||'');
    const direct=String(p?.aro||'').match(/\d{2}/);
    if(direct)return direct[0];
    const m=text.match(/\bR?\s*(1[0-9]|2[0-4])\b/i);
    return m?m[1]:'';
  }
  function productCategory(p){
    const s=(String(p?.category||'')+' '+String(p?.name||'')+' '+String(p?.location||'')).toLowerCase();
    if(s.includes('moto'))return 'Moto';
    if(s.includes('acess')||s.includes('câmara')||s.includes('camara')||s.includes('roda')||s.includes('material'))return 'Acessórios';
    if(s.includes('peça')||s.includes('peca')||s.includes('caminh'))return 'Peças';
    return 'Carro';
  }

  /* ===== ESTOQUE: filtros avançados + destaques ===== */
  window.__lpStockFilters=window.__lpStockFilters||{q:'',cat:'Todos',brand:'Todas',aro:'Todos',qty:'todos'};
  window.lpStockFilter=function(){
    window.__lpStockFilters={
      q:String($id('lpStockQ')?.value||'').toLowerCase(),
      cat:$id('lpStockCat')?.value||'Todos',
      brand:$id('lpStockBrand')?.value||'Todas',
      aro:$id('lpStockAro')?.value||'Todos',
      qty:$id('lpStockQty')?.value||'todos'
    };
    renderEstoque();
  };
  window.renderEstoque=function(){
    const products=Array.isArray(data.products)?data.products:[];
    const brands=[...new Set(products.map(p=>String(p.brand||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const aros=[...new Set(products.map(productAro).filter(Boolean))].sort((a,b)=>N(a)-N(b));
    const f=window.__lpStockFilters||{};
    const filtered=products.filter(p=>{
      const q=String(f.q||'');
      if(q && !(`${p.code||''} ${p.name||''} ${p.brand||''} ${p.category||''}`.toLowerCase().includes(q)))return false;
      if(f.cat&&f.cat!=='Todos'&&productCategory(p)!==f.cat)return false;
      if(f.brand&&f.brand!=='Todas'&&String(p.brand||'')!==f.brand)return false;
      if(f.aro&&f.aro!=='Todos'&&productAro(p)!==f.aro)return false;
      if(f.qty==='zero'&&N(p.qty)!==0)return false;
      if(f.qty==='baixo'&&!(N(p.qty)>0&&N(p.qty)<=2))return false;
      if(f.qty==='disponivel'&&N(p.qty)<1)return false;
      return true;
    });
    const units=filtered.reduce((a,p)=>a+N(p.qty),0);
    const zero=filtered.filter(p=>N(p.qty)<1).length;
    const low=filtered.filter(p=>N(p.qty)>0&&N(p.qty)<=2).length;
    const avgCost=filtered.length?filtered.reduce((a,p)=>a+N(p.cost),0)/filtered.length:0;
    const rows=filtered.map(p=>{
      const q=N(p.qty),cls=q<1?'lp-zero-row':q<=2?'lp-low-row':'';
      return `<tr class="${cls}">
        <td><b>${E(p.code||'')}</b></td><td>${E(p.name||'')}</td><td>${E(productCategory(p))}</td><td>${E(p.brand||'')}</td><td>${E(productAro(p)||'-')}</td>
        <td><b>${q}</b></td><td>${M(p.cost)}</td><td>${M(p.price)}</td>
        <td>${q<1?'<span class="badge danger">Zerado</span>':q<=2?'<span class="badge warn">Baixo</span>':'<span class="badge ok">Normal</span>'}</td>
        <td class="actions"><button class="btn ghost small" onclick="stockMovementModal(${p.id})">Movimentar</button><button class="btn ghost small" onclick="productModal(${p.id})">Editar</button></td>
      </tr>`;
    }).join('');
    $id('estoque').innerHTML=
      heading('Estoque','Filtre por categoria, marca, aro e quantidade',`<button class="btn primary" onclick="productModal()">+ Produto</button>`)+
      `<div class="lp-stock-kpis">
        <div><span>Produtos filtrados</span><b>${filtered.length}</b></div>
        <div><span>Unidades</span><b>${units}</b></div>
        <div><span>Zerados</span><b>${zero}</b></div>
        <div><span>Baixo (1–2)</span><b>${low}</b></div>
        <div><span>Custo médio</span><b>${M(avgCost)}</b></div>
      </div>
      <div class="card">
        <div class="lp-stock-filter-grid">
          <input id="lpStockQ" placeholder="Código, produto ou marca" value="${E(f.q||'')}" oninput="lpStockFilter()">
          <select id="lpStockCat" onchange="lpStockFilter()">${['Todos','Carro','Moto','Acessórios','Peças'].map(x=>`<option ${f.cat===x?'selected':''}>${x}</option>`).join('')}</select>
          <select id="lpStockBrand" onchange="lpStockFilter()"><option>Todas</option>${brands.map(x=>`<option ${f.brand===x?'selected':''}>${E(x)}</option>`).join('')}</select>
          <select id="lpStockAro" onchange="lpStockFilter()"><option>Todos</option>${aros.map(x=>`<option ${f.aro===x?'selected':''}>${x}</option>`).join('')}</select>
          <select id="lpStockQty" onchange="lpStockFilter()"><option value="todos" ${f.qty==='todos'?'selected':''}>Todas quantidades</option><option value="disponivel" ${f.qty==='disponivel'?'selected':''}>Somente disponíveis</option><option value="baixo" ${f.qty==='baixo'?'selected':''}>Baixo (1–2)</option><option value="zero" ${f.qty==='zero'?'selected':''}>Zerados</option></select>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Marca</th><th>Aro</th><th>Qtd.</th><th>Custo</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="empty">Nenhum produto neste filtro.</td></tr>'}</tbody></table></div>
      </div>`;
  };

  /* ===== VENDAS: relatório diário ===== */
  window.lpDailySalesReport=function(){
    const today=new Date();
    const sales=activeSalesSafe().filter(s=>sameDay(parseDate(s.date),today));
    const total=sales.reduce((a,s)=>a+N(s.total),0);
    const profit=sales.reduce((a,s)=>a+N(s.profit),0);
    const units=sales.reduce((a,s)=>a+(s.items||[]).reduce((b,i)=>b+N(i.qty),0),0);
    const payments={};
    sales.forEach(s=>{const p=s.payment||s.paymentMethod||'Não informado';payments[p]=(payments[p]||0)+N(s.total)});
    const products={};
    sales.forEach(s=>(s.items||[]).forEach(i=>{const k=i.name||'Produto';products[k]=(products[k]||0)+N(i.qty)}));
    const prodRows=Object.entries(products).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([name,q])=>`<tr><td>${E(name)}</td><td><b>${q}</b></td></tr>`).join('');
    const payRows=Object.entries(payments).sort((a,b)=>b[1]-a[1]).map(([name,v])=>`<tr><td>${E(name)}</td><td>${M(v)}</td></tr>`).join('');
    showModal(`<h2>Relatório de vendas de hoje</h2>
      <div class="lp-report-grid">
        <div><span>Vendas</span><b>${sales.length}</b></div><div><span>Faturamento</span><b>${M(total)}</b></div><div><span>Lucro</span><b>${M(profit)}</b></div><div><span>Unidades</span><b>${units}</b></div>
      </div>
      <div class="grid2" style="margin-top:14px">
        <div class="card" style="box-shadow:none"><h3 class="section-title">Produtos mais vendidos hoje</h3><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Qtd.</th></tr></thead><tbody>${prodRows||'<tr><td colspan="2" class="empty">Sem vendas hoje.</td></tr>'}</tbody></table></div></div>
        <div class="card" style="box-shadow:none"><h3 class="section-title">Formas de pagamento</h3><div class="table-wrap"><table><thead><tr><th>Forma</th><th>Valor</th></tr></thead><tbody>${payRows||'<tr><td colspan="2" class="empty">Sem dados.</td></tr>'}</tbody></table></div></div>
      </div>
      <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Fechar</button></div>`);
  };
  const prevRenderSalesV13=window.renderVendas;
  window.renderVendas=function(){
    prevRenderSalesV13();
    const page=$id('vendas'); if(!page)return;
    const headingActions=page.querySelector('.heading .actions');
    if(headingActions && !page.querySelector('[data-lp-daily-report]')){
      const b=document.createElement('button');b.className='btn ghost';b.dataset.lpDailyReport='1';b.textContent='Relatório de hoje';b.onclick=window.lpDailySalesReport;headingActions.prepend(b);
    }
  };

  /* ===== CLIENTES: compras + serviços + última compra ===== */
  window.customerDetail=function(id){
    const c=(data.customers||[]).find(x=>String(x.id)===String(id));if(!c)return;
    const sales=activeSalesSafe().filter(s=>String(s.customerId)===String(c.id)||String(s.customer||'').toLowerCase()===String(c.name||'').toLowerCase());
    const services=(data.serviceOrders||[]).filter(o=>String(o.customerId)===String(c.id));
    const saleRows=sales.map(s=>`<tr><td>${E(s.date||'-')}</td><td>${(s.items||[]).map(i=>E(i.name||'Produto')+' × '+N(i.qty)).join('<br>')||'-'}</td><td>${M(s.total)}</td><td>${M(s.profit)}</td></tr>`).join('');
    const serviceRows=services.map(o=>`<tr><td>${E(o.date||'-')}</td><td>${E(o.service||'-')}</td><td>${E(o.status||'-')}</td><td>${M(o.serviceValue||o.total||0)}</td></tr>`).join('');
    const dated=sales.map(s=>({s,d:parseDate(s.date)})).filter(x=>x.d).sort((a,b)=>b.d-a.d);
    const last=dated[0];
    const days=last?Math.max(0,Math.floor((Date.now()-last.d.getTime())/86400000)):null;
    showModal(`<h2>${E(c.name)}</h2>
      <div class="notice"><b>Telefone:</b> ${E(c.phone||'-')}<br><b>Última compra:</b> ${last?E(last.s.date)+' • há '+days+' dia(s)':'Nenhuma compra registrada'}</div>
      <div class="card" style="box-shadow:none"><h3 class="section-title">Compras</h3><div class="table-wrap"><table><thead><tr><th>Data</th><th>Itens</th><th>Total</th><th>Lucro</th></tr></thead><tbody>${saleRows||'<tr><td colspan="4" class="empty">Nenhuma compra.</td></tr>'}</tbody></table></div></div>
      <div class="card" style="box-shadow:none;margin-top:12px"><h3 class="section-title">Serviços</h3><div class="table-wrap"><table><thead><tr><th>Data</th><th>Serviço</th><th>Status</th><th>Valor</th></tr></thead><tbody>${serviceRows||'<tr><td colspan="4" class="empty">Nenhum serviço.</td></tr>'}</tbody></table></div></div>
      <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Fechar</button></div>`);
  };

    const keys=[...monthly.keys()].sort().slice(-6);

    const top=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,8);

  /* ===== CATÁLOGO: auditoria detalhada controle x site ===== */
  window.lpCatalogAuditDetailed=async function(){

    products.forEach(p=>{
      const key1=String(p.id),key2=String(p.code||'');
      const c=cloudByControl.get(key1)||cloudByControl.get(key2);
      if(!c)missing.push(p);
      else if(N(c.stock)!==N(p.qty))stockDiff.push({p,c});
      else ok.push(p);

    const productKeys=new Set(products.flatMap(p=>[String(p.id),String(p.code||'')]));

      ...extra.map(c=>`<tr><td>${E(c.code||'')}</td><td>${E(c.model||c.name||'Produto')}</td><td><span class="badge warn">No site, não no controle</span></td><td>-</td><td>${N(c.stock)}</td></tr>`)].join('');

      <div class="table-wrap"><table><thead><tr><th>Código</th><th>Produto</th><th>Situação</th><th>Controle</th><th>Site</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">Nenhuma divergência encontrada.</td></tr>'}</tbody></table></div>

  };
  const prevCatalogV13=window.renderCatalogo;
  window.renderCatalogo=function(){
    prevCatalogV13();
    const page=$id('catalogo');if(!page)return;
    const actions=page.querySelector('.heading .actions');
