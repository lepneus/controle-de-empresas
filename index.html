function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

async function doLogin(){
  const email=($('#loginUser')?.value||'').trim();
  const pass=$('#loginPass')?.value||'';
  const msg=$('#loginMessage');
  const btn=$('#loginButton');
  if(!email||!pass){ if(msg)msg.textContent='Digite o e-mail e a senha.'; return; }
  try{
    if(btn){btn.disabled=true;btn.textContent='Entrando...'}
    if(msg)msg.textContent='Validando acesso...';
    if(!window.firebase) throw new Error('Firebase não carregou. Verifique sua conexão com a internet.');
    if(!firebase.apps.length) firebase.initializeApp(LEPNEUS_FIREBASE_CONFIG);
    lpFirebaseApp=firebase.app(); lpDb=firebase.firestore(); lpAuth=firebase.auth();
    await lpAuth.signInWithEmailAndPassword(email,pass);
    sessionStorage.setItem('logged','firebase');
    if(msg)msg.textContent='Acesso autorizado.';
  }catch(e){
    console.error('Login Firebase:',e);
    if(msg)msg.textContent='Não foi possível entrar. Confira o e-mail, a senha e sua conexão.';
  }finally{ if(btn){btn.disabled=false;btn.textContent='Entrar com Firebase'} }
}
async function logout(){
  try{ if(lpAuth) await lpAuth.signOut(); }catch(e){ console.warn(e); }
  sessionStorage.removeItem('logged');
  const pass=document.getElementById('loginPass'); if(pass)pass.value='';
  document.getElementById('login')?.classList.remove('hidden');
}

 const other=Number($('#mlOther')?.value||0);
 const qty=Number($('#mlQty')?.value||1);

 if(advertised<=0)return alert('Informe o preço anunciado no Mercado Livre.');

 if(!item){

   data.mercadoLivreItems.unshift(item);
 }
 item.price=p.price;
 item.mlAdvertisedPrice=advertised;
 item.mlFee=fee;
 item.mlFreight=freight;
 item.mlOtherCost=other;
 item.mlQty=qty>0?qty:1;
 item.mlListingId=listingId;
 item.status='Publicado manualmente';

function editMLManual(id){
 ensureData();
 const x=data.mercadoLivreItems.find(i=>Number(i.id)===Number(id));
 if(!x)return;
 const p=data.products.find(p=>String(p.id)===String(x.productId));
 const advertised=prompt('Preço anunciado no Mercado Livre:',x.mlAdvertisedPrice??x.price??p?.price??0);
 if(advertised===null)return;
 const fee=prompt('Taxas/comissão do Mercado Livre (R$):',x.mlFee??0); if(fee===null)return;
 const freight=prompt('Custo de frete que ficou por sua conta (R$):',x.mlFreight??0); if(freight===null)return;
 const other=prompt('Outros custos do anúncio/venda (R$):',x.mlOtherCost??0); if(other===null)return;
 const listing=prompt('Código/ID do anúncio no Mercado Livre (opcional):',x.mlListingId??''); if(listing===null)return;
 x.mlAdvertisedPrice=Number(advertised)||0;
 x.mlFee=Number(fee)||0;
 x.mlFreight=Number(freight)||0;
 x.mlOtherCost=Number(other)||0;
 x.mlListingId=listing.trim();
 x.status='Publicado manualmente';
 x.orderStatus='Controle manual';
 x.updatedAt=new Date().toLocaleString('pt-BR');
 save();renderAll();
}
function mlCalc(x,p){
 const price=Number(x.mlAdvertisedPrice??x.price??0);
 const fee=Number(x.mlFee||0);
 const freight=Number(x.mlFreight||0);
 const other=Number(x.mlOtherCost||0);
 const cost=Number(p?.cost||0);
 const net=price-fee-freight-other;
 const profit=net-cost;
 const margin=price>0?(profit/price*100):0;
 return {price,fee,freight,other,cost,net,profit,margin};
}


function mlPriceCalculator(){
 showModal(`<h2>Calculadora de preço • Mercado Livre</h2>
 <div class="notice">Informe seu custo e os custos da venda. O sistema calcula um preço mínimo para atingir a margem de lucro desejada. Use como referência — taxas e frete podem variar conforme anúncio e modalidade.</div>
 <div class="form">
  <label>Custo do produto (R$)<input id="calcCost" type="number" step="0.01" min="0" placeholder="0,00"></label>
  <label>Comissão / taxa ML (%)<input id="calcFeePct" type="number" step="0.01" min="0" max="100" value="16"></label>
  <label>Frete por sua conta (R$)<input id="calcFreight" type="number" step="0.01" min="0" value="0"></label>
  <label>Outros custos (R$)<input id="calcOther" type="number" step="0.01" min="0" value="0"></label>
  <label>Margem de lucro desejada (%)<input id="calcMargin" type="number" step="0.01" min="0" max="80" value="20"></label>
 </div>
 <div class="card" style="margin-top:14px;background:var(--panel2)">
   <div class="summary-list">
    <div><span>Preço sugerido</span><b id="calcSuggested">R$ 0,00</b></div>
    <div><span>Taxa estimada ML</span><b id="calcFeeValue">R$ 0,00</b></div>
    <div><span>Lucro estimado</span><b id="calcProfit">R$ 0,00</b></div>
    <div><span>Margem sobre a venda</span><b id="calcMarginResult">0,0%</b></div>
   </div>
 </div>
 <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="applyMLSuggestedPrice()">Usar preço sugerido</button></div>`);
 ['calcCost','calcFeePct','calcFreight','calcOther','calcMargin'].forEach(id=>document.getElementById(id)?.addEventListener('input',updateMLPriceCalculator));
 updateMLPriceCalculator();
}
function updateMLPriceCalculator(){
 const cost=Math.max(0,Number($('#calcCost')?.value||0));
 const feePct=Math.max(0,Math.min(99,Number($('#calcFeePct')?.value||0)))/100;
 const freight=Math.max(0,Number($('#calcFreight')?.value||0));
 const other=Math.max(0,Number($('#calcOther')?.value||0));
 const targetMargin=Math.max(0,Math.min(80,Number($('#calcMargin')?.value||0)))/100;
 const denom=1-feePct-targetMargin;
 let price=denom>0?(cost+freight+other)/denom:0;
 if(!Number.isFinite(price)||price<0)price=0;
 const fee=price*feePct;
 const profit=price-fee-freight-other-cost;
 const margin=price>0?(profit/price*100):0;
 if($('#calcSuggested'))$('#calcSuggested').textContent=money(price);
 if($('#calcFeeValue'))$('#calcFeeValue').textContent=money(fee);
 if($('#calcProfit'))$('#calcProfit').textContent=money(profit);
 if($('#calcMarginResult'))$('#calcMarginResult').textContent=margin.toFixed(1)+'%';
 window.__mlSuggestedPrice=price;
}
function applyMLSuggestedPrice(){
 const p=Number(window.__mlSuggestedPrice||0);
 closeModal();
 const input=$('#mlPrice');
 if(input&&p>0){input.value=p.toFixed(2);input.focus();}
}

<div class="settings-section"><div class="settings-head"><div class="settings-icon">💾</div><div><h3>Backup e dados</h3><p>Proteção e portabilidade das informações</p></div></div><div class="switch-row"><div><strong>Backup automático local</strong><small>Cria cópia local ao salvar alterações</small></div><label class="switch"><input id="autoBackup" type="checkbox" ${s.autoBackup?'checked':''}><span class="slider"></span></label></div><div class="toolbar" style="margin-top:12px"><button class="btn ghost" onclick="exportBackup()">Exportar backup</button><button class="btn ghost" onclick="importBackup()">Importar backup</button></div></div>
</div><div class="config-actions"><button class="btn ghost" onclick="renderConfig()">Descartar</button><button class="btn primary" onclick="saveSettings()">Salvar configurações</button></div>`}
function saveSettings(){let s=data.settings;s.company=$('#companyName').value;s.fantasy=$('#companyFantasy').value;s.cnpj=$('#companyDoc').value;s.phone=$('#companyPhone').value;s.whatsapp=$('#companyWhatsapp').value;s.email=$('#companyEmail').value;s.address=$('#companyAddress').value;s.city=$('#companyCity').value;s.currency=$('#currency').value;s.defaultPayment=$('#defaultPayment').value;s.commission=+$('#commission').value||0;s.defaultMinStock=+$('#defaultMinStock').value||0;s.confirmCritical=$('#confirmCritical').checked;s.reminderMinutes=+$('#reminderMinutes').value||0;s.browserNotifications=$('#browserNotifications').checked;s.whatsapp=$('#waBusiness').value;s.whatsappWebhook=$('#waWebhook').value.trim();s.whatsappSignature=$('#waSignature').value;s.whatsappAuto=$('#waAuto').checked;s.sessionMinutes=+$('#sessionMinutes').value||480;s.timezone=$('#timezone').value;s.autoBackup=$('#autoBackup').checked;log('Atualizou configurações da empresa');save();if(s.autoBackup)localStorage.setItem('gestaoBackupAuto',JSON.stringify({date:new Date().toISOString(),data}));alert('Configurações salvas com sucesso.');renderAll()}
function exportBackup(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='controle-de-empresas-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result),d=obj.data||obj;if(!d.products||!d.settings)throw new Error();if(confirm('Substituir os dados atuais pelo backup selecionado?')){data=d;ensureData();save();renderAll();alert('Backup restaurado.')}}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)};i.click()}
function showModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}
function filterTable(inputId,tableId){let q=$('#'+inputId).value.toLowerCase();$('#'+tableId).querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function sortStock(v){if(v==='qtyasc')data.products.sort((a,b)=>a.qty-b.qty);else if(v==='qtydesc')data.products.sort((a,b)=>b.qty-a.qty);else if(v==='pricedesc')data.products.sort((a,b)=>b.price-a.price);else data.products.sort((a,b)=>a.name.localeCompare(b.name));renderEstoque()}
function globalSearch(){let q=$('#globalSearch').value.toLowerCase();if(q.length<2)return;let p=data.products.find(x=>x.name.toLowerCase().includes(q)||x.code.toLowerCase().includes(q));let c=data.customers.find(x=>x.name.toLowerCase().includes(q));if(p){openPage('estoque');setTimeout(()=>{$('#stockSearch').value=q;filterTable('stockSearch','stockTable')},50)}else if(c)openPage('clientes')}
/* ===== Controle de Empresas V2 - módulos completos ===== */
function enhanceData(){
  data.stockMovements=data.stockMovements||[];
  data.cashRegister=data.cashRegister||{open:false,openedAt:'',openedBy:'Administrador',initial:0,closedAt:'',closingValue:0};
  data.settings=data.settings||{};
  const extra={quotePrefix:'ORC',osPrefix:'OS',purchasePrefix:'CMP',documentFooter:'Obrigado pela preferência!',defaultDueDays:30,lateFee:0,monthlyInterest:0,allowNegativeStock:false,autoLowStockAlerts:true,autoDueAlerts:true,businessHours:'08:00 às 18:00',requireSaleCustomer:false,showCostToSeller:false};
  Object.keys(extra).forEach(k=>{if(data.settings[k]===undefined)data.settings[k]=extra[k]});
  data.users=data.users||[{id:1,name:'Administrador',username:'admin',role:'ADMINISTRADOR',active:true}];
  data.users.forEach(u=>{if(u.username===undefined)u.username=(u.name||'usuario').toLowerCase().replace(/\s+/g,'.');if(u.active===undefined)u.active=true});
  data.quotes=data.quotes||[]; data.purchases=data.purchases||[]; data.serviceOrders=data.serviceOrders||[];
}
function statusBadge(status){let s=String(status||'Ativo');let cls=/vencido|cancelado|recusado|inativo/i.test(s)?'danger':/pendente|rascunho|aberta|aguardando|em andamento|enviado/i.test(s)?'warn':'ok';return `<span class="badge ${cls}">${esc(s)}</span>`}
function nowBR(){return new Date().toLocaleString('pt-BR')}
function todayISO(){return new Date().toISOString().slice(0,10)}
function productOptions(selected=''){return data.products.map(p=>`<option value="${p.id}" ${String(selected)===String(p.id)?'selected':''}>${esc(p.name)} — estoque ${p.qty}</option>`).join('')}
function customerOptions(selected=''){return `<option value="">Consumidor / não informado</option>`+data.customers.map(c=>`<option value="${c.id}" ${String(selected)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}
function supplierOptions(selected=''){return `<option value="">Selecione</option>`+data.suppliers.map(s=>`<option value="${s.id}" ${String(selected)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}
function findCustomerName(id){let c=data.customers.find(x=>String(x.id)===String(id));return c?c.name:'Consumidor'}
function findSupplierName(id){let s=data.suppliers.find(x=>String(x.id)===String(id));return s?s.name:'-'}
function addStockMovement(productId,type,qty,reason,ref=''){let p=data.products.find(x=>String(x.id)===String(productId));if(!p)return false;qty=Number(qty)||0;let before=Number(p.qty)||0,after=before;if(type==='Entrada'||type==='Devolução')after=before+qty;else if(type==='Saída'||type==='Perda')after=before-qty;else if(type==='Ajuste')after=qty;if(after<0&&!data.settings.allowNegativeStock)return false;p.qty=after;data.stockMovements.unshift({id:Date.now()+Math.random(),date:nowBR(),productId:p.id,product:p.name,type,qty,before,after,reason,ref,user:'Administrador'});return true}

function renderDashboard(){enhanceData();let revenue=data.sales.reduce((a,s)=>a+Number(s.total||0),0),expenses=data.finance.filter(f=>f.type==='Despesa').reduce((a,f)=>a+Number(f.value||0),0),profit=data.sales.reduce((a,s)=>a+Number(s.profit||0),0),low=data.products.filter(p=>Number(p.qty)<=Number(p.min||0)).length,pending=data.finance.filter(f=>f.status==='Pendente'||f.status==='Vencido').reduce((a,f)=>a+Number(f.value||0),0),openOS=data.serviceOrders.filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length;
$('#dashboard').innerHTML=heading('Dashboard','Visão rápida do que precisa da sua atenção hoje')+`<div class="cards">${metric('Faturamento',money(revenue),'vendas acumuladas','green')}${metric('Lucro estimado',money(profit),'margem das vendas','green')}${metric('Despesas',money(expenses),'lançamentos registrados','red')}${metric('A receber / pagar',money(pending),'pendências financeiras',pending?'red':'green')}${metric('Itens em estoque',data.products.reduce((a,p)=>a+Number(p.qty||0),0),low+' produto(s) com estoque baixo',low?'red':'green')}${metric('Vendas realizadas',data.sales.length,'operações concluídas','green')}${metric('OS abertas',openOS,'serviços em andamento',openOS?'red':'green')}${metric('Lembretes',data.reminders.filter(r=>!r.done).length,'pendentes na agenda','green')}</div>
<div class="grid2"><div class="card"><div class="panel-head"><h3 class="section-title">Faturamento recente</h3><span class="soft-chip">Últimas 10 vendas</span></div><canvas id="chartSales" height="105"></canvas></div><div class="card"><h3 class="section-title">Atenção necessária</h3><div class="alert-list">${low?`<div class="alert"><b>${low}</b> produto(s) abaixo do estoque mínimo.</div>`:''}${data.finance.filter(f=>f.status==='Vencido').slice(0,4).map(f=>`<div class="alert">Conta vencida: <b>${esc(f.desc)}</b> — ${money(f.value)}</div>`).join('')}${openOS?`<div class="alert"><b>${openOS}</b> ordem(ns) de serviço ainda abertas.</div>`:''}${!low&&!openOS&&!data.finance.some(f=>f.status==='Vencido')?'<div class="empty">Tudo certo por aqui.</div>':''}</div></div></div>
<div class="card" style="margin-top:16px"><div class="panel-head"><h3 class="section-title">Últimas movimentações</h3><button class="btn ghost small" onclick="openPage('historico')">Ver histórico</button></div><div class="activity-feed">${data.history.slice(0,6).map(h=>`<div class="activity-row"><span class="activity-dot"></span><div><b>${esc(h.action)}</b><small>${esc(h.date)} • ${esc(h.user)}</small></div></div>`).join('')||'<div class="empty">Nenhuma atividade registrada.</div>'}</div></div>`;
setTimeout(()=>{let ctx=$('#chartSales');if(!ctx)return;new Chart(ctx,{type:'bar',data:{labels:data.sales.slice(0,10).reverse().map((s,i)=>'#'+(i+1)),datasets:[{label:'Faturamento',data:data.sales.slice(0,10).reverse().map(s=>s.total),borderRadius:7}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}})},0)}

function renderEstoque(){enhanceData();let rows=data.products.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.brand)}</td><td><b>${p.qty}</b></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${p.qty<=p.min?'<span class="badge danger">Baixo</span>':'<span class="badge ok">Normal</span>'}</td><td class="actions"><button class="btn ghost small" onclick="stockMovementModal(${p.id})">Movimentar</button><button class="btn ghost small" onclick="productModal(${p.id})">Editar</button><button class="btn ghost small" onclick="deleteProduct(${p.id})">Excluir</button></td></tr>`).join('');
$('#estoque').innerHTML=heading('Estoque','Controle por movimentações, histórico e níveis mínimos',`<div class="actions"><button class="btn ghost" onclick="stockHistoryModal()">Histórico</button><button class="btn primary" onclick="productModal()">+ Produto</button></div>`)+`<div class="card"><div class="toolbar"><input id="stockSearch" placeholder="Pesquisar produto, código ou marca" oninput="filterTable('stockSearch','stockTable')"><select onchange="sortStock(this.value)"><option value="name">Ordenar por nome</option><option value="qtyasc">Menor estoque</option><option value="qtydesc">Maior estoque</option><option value="pricedesc">Maior preço</option></select></div><div class="table-wrap"><table id="stockTable"><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Marca</th><th>Qtd.</th><th>Custo</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">Nenhum produto cadastrado.</td></tr>'}</tbody></table></div></div>`}
function productModal(id){let p=id?data.products.find(x=>x.id===id):{};showModal(`<h2>${id?'Editar':'Novo'} produto</h2><div class="form"><label>Código<input id="pcode" value="${esc(p.code||'')}"></label><label>Nome<input id="pname" value="${esc(p.name||'')}"></label><label>Categoria<input id="pcat" value="${esc(p.category||'')}"></label><label>Marca<input id="pbrand" value="${esc(p.brand||'')}"></label><label>${id?'Estoque atual (use Movimentar)':'Estoque inicial'}<input id="pqty" type="number" value="${p.qty||0}" ${id?'readonly':''}></label><label>Estoque mínimo<input id="pmin" type="number" value="${p.min??data.settings.defaultMinStock}"></label><label>Custo<input id="pcost" type="number" step="0.01" value="${p.cost||0}"></label><label>Preço de venda<input id="pprice" type="number" step="0.01" value="${p.price||0}"></label><label class="full">Localização / observação<input id="plocation" value="${esc(p.location||'')}"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProductV2(${id||'null'})">Salvar</button></div>`)}
function saveProductV2(id){let old=id?data.products.find(x=>x.id===id):null,obj={id:id||Date.now(),code:$('#pcode').value.trim()||('P'+Date.now().toString().slice(-5)),name:$('#pname').value.trim(),category:$('#pcat').value.trim()||'Geral',brand:$('#pbrand').value.trim(),qty:id?old.qty:(+$('#pqty').value||0),min:+$('#pmin').value||0,cost:+$('#pcost').value||0,price:+$('#pprice').value||0,location:$('#plocation').value.trim()};if(!obj.name)return alert('Informe o nome do produto.');if(id)data.products[data.products.findIndex(x=>x.id===id)]=obj;else{data.products.push(obj);if(obj.qty>0)data.stockMovements.unshift({id:Date.now(),date:nowBR(),productId:obj.id,product:obj.name,type:'Entrada',qty:obj.qty,before:0,after:obj.qty,reason:'Estoque inicial',ref:'Cadastro',user:'Administrador'})}log((id?'Editou':'Cadastrou')+' produto '+obj.name);save();closeModal();renderAll()}
function stockMovementModal(productId){let p=data.products.find(x=>x.id===productId);showModal(`<h2>Movimentar estoque</h2><div class="notice"><b>${esc(p.name)}</b> • estoque atual: <b>${p.qty}</b></div><div class="form"><label>Tipo<select id="smtype"><option>Entrada</option><option>Saída</option><option>Ajuste</option><option>Devolução</option><option>Perda</option></select></label><label>Quantidade<input id="smqty" type="number" min="0" step="1" value="1"></label><label class="full">Motivo<input id="smreason" placeholder="Ex.: compra, venda manual, contagem, avaria..."></label><label class="full">Referência<input id="smref" placeholder="Nota, OS, venda ou observação"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveStockMovement(${productId})">Confirmar movimentação</button></div>`)}
function saveStockMovement(productId){let t=$('#smtype').value,q=+$('#smqty').value,r=$('#smreason').value.trim();if(q<0||(!q&&t!=='Ajuste'))return alert('Informe uma quantidade válida.');if(!addStockMovement(productId,t,q,r||'Movimentação manual',$('#smref').value.trim()))return alert('A movimentação deixaria o estoque negativo. Altere a configuração ou a quantidade.');log(`${t} de estoque: ${data.products.find(p=>p.id===productId).name}`);save();closeModal();renderAll()}
function stockHistoryModal(){let rows=data.stockMovements.slice(0,80).map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.product)}</td><td>${statusBadge(m.type)}</td><td>${m.qty}</td><td>${m.before} → <b>${m.after}</b></td><td>${esc(m.reason||'-')}</td><td>${esc(m.ref||'-')}</td></tr>`).join('');showModal(`<h2>Histórico de estoque</h2><div class="table-wrap"><table><thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Qtd.</th><th>Saldo</th><th>Motivo</th><th>Referência</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Sem movimentações.</td></tr>'}</tbody></table></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Fechar</button></div>`)}

function renderOrcamentos(){enhanceData();let total=data.quotes.reduce((a,q)=>a+Number(q.total||0),0),approved=data.quotes.filter(q=>q.status==='Aprovado').length;let rows=data.quotes.map(q=>`<tr><td><b>${esc(q.number||('#'+q.id))}</b></td><td>${esc(q.date||'-')}</td><td>${esc(findCustomerName(q.customerId))}</td><td>${esc(q.productName||'-')}</td><td>${money(q.total)}</td><td>${statusBadge(q.status)}</td><td class="actions"><button class="btn ghost small" onclick="changeQuoteStatus(${q.id})">Status</button>${q.status==='Aprovado'&&!q.converted?`<button class="btn primary small" onclick="convertQuote(${q.id})">Virar venda</button>`:''}<button class="btn ghost small" onclick="deleteQuote(${q.id})">Excluir</button></td></tr>`).join('');
$('#orcamentos').innerHTML=heading('Orçamentos','Crie, acompanhe e transforme orçamento aprovado em venda',`<button class="btn primary" onclick="quoteModal()">+ Novo orçamento</button>`)+`<div class="cards">${metric('Orçamentos',data.quotes.length,'registros','green')}${metric('Aprovados',approved,'prontos para venda','green')}${metric('Valor orçado',money(total),'total acumulado','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Produto</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhum orçamento criado.</td></tr>'}</tbody></table></div>`}
function quoteModal(){showModal(`<h2>Novo orçamento</h2><div class="form"><label>Cliente<select id="qcustomer">${customerOptions()}</select></label><label>Validade<input id="qvalid" type="date"></label><label>Produto<select id="qproduct">${productOptions()}</select></label><label>Quantidade<input id="qqty" type="number" min="1" value="1"></label><label>Desconto<input id="qdiscount" type="number" step="0.01" value="0"></label><label>Status<select id="qstatus"><option>Rascunho</option><option>Enviado</option><option>Aprovado</option><option>Recusado</option></select></label><label class="full">Observações<textarea id="qnotes" rows="3"></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveQuote()">Salvar orçamento</button></div>`)}
function saveQuote(){let p=data.products.find(x=>String(x.id)===$('#qproduct').value),qty=+$('#qqty').value||1,disc=+$('#qdiscount').value||0;if(!p)return alert('Selecione um produto.');let q={id:Date.now(),number:(data.settings.quotePrefix||'ORC')+'-'+String(data.quotes.length+1).padStart(4,'0'),date:new Date().toLocaleDateString('pt-BR'),customerId:$('#qcustomer').value,productId:p.id,productName:p.name,qty,discount:disc,total:Math.max(0,p.price*qty-disc),validUntil:$('#qvalid').value,status:$('#qstatus').value,notes:$('#qnotes').value,converted:false};data.quotes.unshift(q);log('Criou orçamento '+q.number);save();closeModal();renderAll()}
function changeQuoteStatus(id){let q=data.quotes.find(x=>x.id===id);let s=prompt('Novo status: Rascunho, Enviado, Aprovado, Recusado ou Vencido',q.status);if(!s)return;let valid=['Rascunho','Enviado','Aprovado','Recusado','Vencido'];let match=valid.find(x=>x.toLowerCase()===s.toLowerCase());if(!match)return alert('Status inválido.');q.status=match;log('Alterou status do orçamento '+q.number+' para '+match);save();renderAll()}
function convertQuote(id){let q=data.quotes.find(x=>x.id===id),p=data.products.find(x=>x.id===q.productId);if(!q||!p)return alert('Produto não encontrado.');if(q.qty>p.qty&&!data.settings.allowNegativeStock)return alert('Estoque insuficiente para converter este orçamento.');let total=q.total,profit=(p.price-p.cost)*q.qty-q.discount;data.sales.unshift({id:Date.now(),date:nowBR(),customer:findCustomerName(q.customerId),customerId:q.customerId,items:[{id:p.id,name:p.name,qty:q.qty}],total,profit,payment:data.settings.defaultPayment,origin:q.number});addStockMovement(p.id,'Saída',q.qty,'Conversão de orçamento',q.number);data.finance.unshift({id:Date.now()+1,type:'Receita',category:'Vendas',desc:'Venda '+q.number,value:total,status:'Pago',date:new Date().toLocaleDateString('pt-BR'),dueDate:todayISO(),payment:data.settings.defaultPayment});data.cash.unshift({id:Date.now()+2,type:'Entrada',desc:'Venda '+q.number,value:total,payment:data.settings.defaultPayment,date:nowBR()});q.converted=true;q.status='Aprovado';log('Converteu orçamento '+q.number+' em venda');save();renderAll()}
function deleteQuote(id){if(confirm('Excluir este orçamento?')){data.quotes=data.quotes.filter(x=>x.id!==id);log('Excluiu orçamento');save();renderAll()}}

function renderCompras(){enhanceData();let sum=data.purchases.reduce((a,p)=>a+Number(p.total||0),0),pending=data.purchases.filter(p=>p.status==='Pendente').length;let rows=data.purchases.map(p=>`<tr><td><b>${esc(p.number)}</b></td><td>${esc(p.date)}</td><td>${esc(findSupplierName(p.supplierId))}</td><td>${esc(p.productName)}</td><td>${p.qty}</td><td>${money(p.total)}</td><td>${statusBadge(p.status)}</td><td><button class="btn ghost small" onclick="deletePurchase(${p.id})">Excluir</button></td></tr>`).join('');$('#compras').innerHTML=heading('Compras','Entrada de mercadorias integrada ao estoque e financeiro',`<button class="btn primary" onclick="purchaseModal()">+ Nova compra</button>`)+`<div class="cards">${metric('Compras',data.purchases.length,'registros','green')}${metric('Total comprado',money(sum),'custo acumulado','red')}${metric('Pendentes',pending,'contas a pagar','red')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Fornecedor</th><th>Produto</th><th>Qtd.</th><th>Total</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Nenhuma compra registrada.</td></tr>'}</tbody></table></div>`}
function purchaseModal(){showModal(`<h2>Nova compra</h2><div class="form"><label>Fornecedor<select id="pusupplier">${supplierOptions()}</select></label><label>Produto<select id="puproduct">${productOptions()}</select></label><label>Quantidade<input id="puqty" type="number" min="1" value="1"></label><label>Custo unitário<input id="pucost" type="number" step="0.01" value="0"></label><label>Frete<input id="pufreight" type="number" step="0.01" value="0"></label><label>Pagamento<select id="pupayment"><option>PIX</option><option>Dinheiro</option><option>Boleto</option><option>Transferência</option><option>Crédito</option></select></label><label>Status financeiro<select id="pustatus"><option>Pago</option><option>Pendente</option></select></label><label>Vencimento<input id="pudue" type="date"></label><label class="full">Número da nota / observação<input id="punote"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="savePurchase()">Confirmar compra</button></div>`)}
function savePurchase(){let p=data.products.find(x=>String(x.id)===$('#puproduct').value),qty=+$('#puqty').value,cost=+$('#pucost').value,freight=+$('#pufreight').value||0;if(!p||qty<=0||cost<0)return alert('Preencha produto, quantidade e custo.');let total=qty*cost+freight,pu={id:Date.now(),number:(data.settings.purchasePrefix||'CMP')+'-'+String(data.purchases.length+1).padStart(4,'0'),date:new Date().toLocaleDateString('pt-BR'),supplierId:$('#pusupplier').value,productId:p.id,productName:p.name,qty,cost,freight,total,payment:$('#pupayment').value,status:$('#pustatus').value,dueDate:$('#pudue').value,note:$('#punote').value};data.purchases.unshift(pu);addStockMovement(p.id,'Entrada',qty,'Compra de fornecedor',pu.number);p.cost=cost;data.finance.unshift({id:Date.now()+1,type:'Despesa',category:'Compras',desc:'Compra '+pu.number,value:total,status:pu.status,date:new Date().toLocaleDateString('pt-BR'),dueDate:pu.dueDate,payment:pu.payment,supplierId:pu.supplierId});if(pu.status==='Pago')data.cash.unshift({id:Date.now()+2,type:'Saída',desc:'Compra '+pu.number,value:total,payment:pu.payment,date:nowBR()});log('Registrou compra '+pu.number+' e aumentou o estoque');save();closeModal();renderAll()}
function deletePurchase(id){let p=data.purchases.find(x=>x.id===id);if(!p)return;if(confirm('Excluir a compra? O histórico de estoque já realizado não será apagado.')){data.purchases=data.purchases.filter(x=>x.id!==id);log('Excluiu registro de compra '+p.number);save();renderAll()}}

function renderOS(){enhanceData();let rows=data.serviceOrders.map(o=>`<tr><td><b>${esc(o.number)}</b></td><td>${esc(o.date)}</td><td>${esc(findCustomerName(o.customerId))}</td><td>${esc(o.service)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td><td class="actions"><button class="btn ghost small" onclick="changeOSStatus(${o.id})">Status</button>${o.status==='Concluída'&&!o.received?`<button class="btn primary small" onclick="receiveOS(${o.id})">Receber</button>`:''}<button class="btn ghost small" onclick="deleteOS(${o.id})">Excluir</button></td></tr>`).join('');$('#os').innerHTML=heading('Ordens de Serviço','Acompanhe serviços, produtos utilizados e recebimentos',`<button class="btn primary" onclick="osModal()">+ Nova OS</button>`)+`<div class="cards">${metric('OS abertas',data.serviceOrders.filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length,'em atendimento','red')}${metric('Concluídas',data.serviceOrders.filter(o=>o.status==='Concluída'||o.status==='Entregue').length,'finalizadas','green')}${metric('Valor em OS',money(data.serviceOrders.reduce((a,o)=>a+Number(o.total||0),0)),'total registrado','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Serviço</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhuma ordem de serviço.</td></tr>'}</tbody></table></div>`}
function osModal(){showModal(`<h2>Nova Ordem de Serviço</h2><div class="form"><label>Cliente<select id="oscustomer">${customerOptions()}</select></label><label>Responsável<input id="osowner" value="Administrador"></label><label class="full">Serviço<input id="osservice" placeholder="Descrição do serviço"></label><label>Produto utilizado<select id="osproduct"><option value="">Nenhum</option>${productOptions()}</select></label><label>Quantidade<input id="osqty" type="number" min="0" value="0"></label><label>Valor do serviço<input id="osservicevalue" type="number" step="0.01" value="0"></label><label>Desconto<input id="osdiscount" type="number" step="0.01" value="0"></label><label>Status<select id="osstatus"><option>Aberta</option><option>Aguardando</option><option>Em andamento</option><option>Concluída</option></select></label><label class="full">Observações<textarea id="osnotes" rows="3"></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveOS()">Salvar OS</button></div>`)}
function saveOS(){let p=data.products.find(x=>String(x.id)===$('#osproduct').value),qty=+$('#osqty').value||0,serviceValue=+$('#osservicevalue').value||0,discount=+$('#osdiscount').value||0;if(!$('#osservice').value.trim())return alert('Informe o serviço.');if(p&&qty>p.qty&&!data.settings.allowNegativeStock)return alert('Estoque insuficiente para o produto selecionado.');let productValue=p?p.price*qty:0,total=Math.max(0,serviceValue+productValue-discount),o={id:Date.now(),number:(data.settings.osPrefix||'OS')+'-'+String(data.serviceOrders.length+1).padStart(4,'0'),date:new Date().toLocaleDateString('pt-BR'),customerId:$('#oscustomer').value,responsible:$('#osowner').value,service:$('#osservice').value.trim(),productId:p?.id||'',productName:p?.name||'',qty,productValue,serviceValue,discount,total,status:$('#osstatus').value,notes:$('#osnotes').value,stockDeducted:false,received:false};data.serviceOrders.unshift(o);if(p&&qty>0){addStockMovement(p.id,'Saída',qty,'Produto utilizado em OS',o.number);o.stockDeducted=true}log('Criou ordem de serviço '+o.number);save();closeModal();renderAll()}
function changeOSStatus(id){let o=data.serviceOrders.find(x=>x.id===id),s=prompt('Status: Aberta, Aguardando, Em andamento, Concluída, Entregue ou Cancelada',o.status);if(!s)return;let valid=['Aberta','Aguardando','Em andamento','Concluída','Entregue','Cancelada'],m=valid.find(x=>x.toLowerCase()===s.toLowerCase());if(!m)return alert('Status inválido.');o.status=m;log('Alterou '+o.number+' para '+m);save();renderAll()}
function receiveOS(id){let o=data.serviceOrders.find(x=>x.id===id);if(!o||o.received)return;let pay=prompt('Forma de pagamento',data.settings.defaultPayment)||data.settings.defaultPayment;data.finance.unshift({id:Date.now(),type:'Receita',category:'Serviços',desc:'Recebimento '+o.number,value:o.total,status:'Pago',date:new Date().toLocaleDateString('pt-BR'),dueDate:todayISO(),payment:pay});data.cash.unshift({id:Date.now()+1,type:'Entrada',desc:'Recebimento '+o.number,value:o.total,payment:pay,date:nowBR()});o.received=true;o.status='Entregue';log('Recebeu ordem de serviço '+o.number);save();renderAll()}
function deleteOS(id){if(confirm('Excluir esta ordem de serviço?')){data.serviceOrders=data.serviceOrders.filter(x=>x.id!==id);log('Excluiu ordem de serviço');save();renderAll()}}

function renderFinanceiro(){enhanceData();let rec=data.finance.filter(f=>f.type==='Receita').reduce((a,b)=>a+Number(b.value||0),0),des=data.finance.filter(f=>f.type==='Despesa').reduce((a,b)=>a+Number(b.value||0),0),pending=data.finance.filter(f=>f.status==='Pendente').reduce((a,b)=>a+Number(b.value||0),0),overdue=data.finance.filter(f=>f.status==='Vencido').reduce((a,b)=>a+Number(b.value||0),0);let rows=data.finance.map(f=>`<tr><td>${statusBadge(f.type)}</td><td><b>${esc(f.desc)}</b><small class="cell-sub">${esc(f.category||'Geral')}</small></td><td>${money(f.value)}</td><td>${esc(f.date||'-')}</td><td>${esc(f.dueDate||'-')}</td><td>${esc(f.payment||'-')}</td><td>${statusBadge(f.status)}</td><td>${f.status!=='Pago'?`<button class="btn primary small" onclick="markFinancePaid(${f.id})">Dar baixa</button>`:''}</td></tr>`).join('');$('#financeiro').innerHTML=heading('Financeiro','Receitas, despesas, vencimentos e baixas integradas ao caixa',`<button class="btn primary" onclick="financeModalV2()">+ Novo lançamento</button>`)+`<div class="cards">${metric('Receitas',money(rec),'total registrado','green')}${metric('Despesas',money(des),'total registrado','red')}${metric('Pendentes',money(pending),'aguardando baixa','red')}${metric('Vencidas',money(overdue),'exigem atenção','red')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Lançamento</th><th>Vencimento</th><th>Pagamento</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Nenhum lançamento financeiro.</td></tr>'}</tbody></table></div>`}
function financeModalV2(){showModal(`<h2>Novo lançamento financeiro</h2><div class="form"><label>Tipo<select id="ftype"><option>Receita</option><option>Despesa</option></select></label><label>Categoria<input id="fcategory" placeholder="Ex.: Vendas, aluguel, fornecedor"></label><label class="full">Descrição<input id="fdesc"></label><label>Valor<input id="fvalue" type="number" step="0.01"></label><label>Forma de pagamento<select id="fpayment"><option>PIX</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Boleto</option><option>Transferência</option></select></label><label>Data<input id="fdate" type="date" value="${todayISO()}"></label><label>Vencimento<input id="fdue" type="date"></label><label>Status<select id="fstatus"><option>Pendente</option><option>Pago</option><option>Vencido</option><option>Cancelado</option></select></label><label class="full">Observação<textarea id="fnotes" rows="2"></textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveFinanceV2()">Salvar</button></div>`)}
function saveFinanceV2(){let f={id:Date.now(),type:$('#ftype').value,category:$('#fcategory').value.trim()||'Geral',desc:$('#fdesc').value.trim(),value:+$('#fvalue').value||0,date:$('#fdate').value,status:$('#fstatus').value,dueDate:$('#fdue').value,payment:$('#fpayment').value,notes:$('#fnotes').value};if(!f.desc||f.value<=0)return alert('Informe descrição e valor.');data.finance.unshift(f);if(f.status==='Pago')data.cash.unshift({id:Date.now()+1,type:f.type==='Receita'?'Entrada':'Saída',desc:f.desc,value:f.value,payment:f.payment,date:nowBR()});log('Criou lançamento financeiro: '+f.desc);save();closeModal();renderAll()}

function renderCaixa(){enhanceData();let ent=data.cash.filter(c=>c.type==='Entrada').reduce((a,b)=>a+Number(b.value||0),0),sai=data.cash.filter(c=>c.type==='Saída').reduce((a,b)=>a+Number(b.value||0),0),cr=data.cashRegister;$('#caixa').innerHTML=heading('Caixa','Abertura, movimentações e fechamento diário',cr.open?`<button class="btn primary" onclick="closeCashModal()">Fechar caixa</button>`:`<button class="btn primary" onclick="openCashModal()">Abrir caixa</button>`)+`<div class="cards">${metric('Situação',cr.open?'ABERTO':'FECHADO',cr.open?'desde '+cr.openedAt:'abra o caixa para iniciar',cr.open?'green':'red')}${metric('Valor inicial',money(cr.initial||0),'abertura atual','green')}${metric('Entradas',money(ent),'movimentações','green')}${metric('Saídas',money(sai),'movimentações','red')}${metric('Saldo esperado',money((cr.initial||0)+ent-sai),'inicial + entradas - saídas',(cr.initial||0)+ent-sai>=0?'green':'red')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Pagamento</th><th>Valor</th></tr></thead><tbody>${data.cash.map(c=>`<tr><td>${esc(c.date)}</td><td>${statusBadge(c.type)}</td><td>${esc(c.desc)}</td><td>${esc(c.payment||'-')}</td><td>${money(c.value)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sem movimentações.</td></tr>'}</tbody></table></div>`}
function openCashModal(){if(data.cashRegister.open)return alert('O caixa já está aberto.');showModal(`<h2>Abrir caixa</h2><div class="form"><label>Responsável<input id="cuser" value="Administrador"></label><label>Valor inicial<input id="cinitial" type="number" step="0.01" value="0"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="openCash()">Abrir caixa</button></div>`)}
function openCash(){data.cashRegister={open:true,openedAt:nowBR(),openedBy:$('#cuser').value||'Administrador',initial:+$('#cinitial').value||0,closedAt:'',closingValue:0};log('Abriu o caixa com '+money(data.cashRegister.initial));save();closeModal();renderAll()}
function closeCashModal(){let ent=data.cash.filter(c=>c.type==='Entrada').reduce((a,b)=>a+Number(b.value||0),0),sai=data.cash.filter(c=>c.type==='Saída').reduce((a,b)=>a+Number(b.value||0),0),expected=(data.cashRegister.initial||0)+ent-sai;showModal(`<h2>Fechar caixa</h2><div class="notice">Valor esperado: <b>${money(expected)}</b></div><div class="form"><label>Valor contado<input id="cclosing" type="number" step="0.01" value="${expected.toFixed(2)}"></label><label>Observação<input id="ccloseNote" placeholder="Diferenças, sangria, conferência..."></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="closeCashRegister(${expected})">Confirmar fechamento</button></div>`)}
function closeCashRegister(expected){let counted=+$('#cclosing').value||0;data.cashRegister.open=false;data.cashRegister.closedAt=nowBR();data.cashRegister.closingValue=counted;data.cashRegister.difference=counted-expected;data.cashRegister.note=$('#ccloseNote').value;log('Fechou o caixa. Diferença: '+money(counted-expected));save();closeModal();renderAll()}

/* ===== V3 — CAMADA DE INTEGRAÇÃO ENTRE MÓDULOS ===== */
function enhanceData(){
  data.stockMovements=data.stockMovements||[];
  data.cashRegister=data.cashRegister||{open:false,openedAt:'',openedBy:'Administrador',initial:0,closedAt:'',closingValue:0,sessionId:''};
  data.cashSessions=data.cashSessions||[];
  data.commissions=data.commissions||[];
  data.settings=data.settings||{};
  const extra={quotePrefix:'ORC',osPrefix:'OS',purchasePrefix:'CMP',documentFooter:'Obrigado pela preferência!',defaultDueDays:30,lateFee:0,monthlyInterest:0,allowNegativeStock:false,autoLowStockAlerts:true,autoDueAlerts:true,businessHours:'08:00 às 18:00',requireSaleCustomer:false,showCostToSeller:false,autoFinanceReminders:true};
  Object.keys(extra).forEach(k=>{if(data.settings[k]===undefined)data.settings[k]=extra[k]});
  data.users=data.users||[{id:1,name:'Administrador',username:'admin',role:'ADMINISTRADOR',active:true}];
  data.users.forEach(u=>{if(u.username===undefined)u.username=(u.name||'usuario').toLowerCase().replace(/\s+/g,'.');if(u.active===undefined)u.active=true});
  data.quotes=data.quotes||[]; data.purchases=data.purchases||[]; data.serviceOrders=data.serviceOrders||[];
  data.sales=data.sales||[]; data.finance=data.finance||[]; data.cash=data.cash||[]; data.reminders=data.reminders||[];
  // Migração leve dos registros antigos para permitir vínculos sem perder dados.
  data.sales.forEach(x=>{if(x.status===undefined)x.status='Concluída'; if(x.financialStatus===undefined)x.financialStatus='Pago'});
  data.purchases.forEach(x=>{if(x.stockApplied===undefined)x.stockApplied=x.status!=='Cancelado'});
  data.serviceOrders.forEach(x=>{if(x.saleId===undefined)x.saleId='';if(x.financeId===undefined)x.financeId=''});
  updateFinancialStatuses();
}
function idNow(offset=0){return Date.now()+offset+Math.floor(Math.random()*900)}
function getCustomer(id){return data.customers.find(c=>String(c.id)===String(id))}
function getSupplier(id){return data.suppliers.find(c=>String(c.id)===String(id))}
function activeSales(){return data.sales.filter(s=>s.status!=='Cancelada')}
function addCashMovement(type,desc,value,payment,originType='',originId='',originNumber=''){
  let c={id:idNow(),type,desc,value:Number(value)||0,payment:payment||'Manual',date:nowBR(),originType,originId,originNumber,cashSessionId:data.cashRegister.open?data.cashRegister.sessionId||'legacy-open':''};
  data.cash.unshift(c); return c;
}
function makeFinance({type,category,desc,value,status='Pendente',date=todayISO(),dueDate='',payment='',customerId='',supplierId='',originType='',originId='',originNumber=''}){
  let f={id:idNow(),type,category:category||'Geral',desc,value:Number(value)||0,status,date,dueDate,payment,customerId,supplierId,originType,originId,originNumber,cashId:'',reminderId:''};
  data.finance.unshift(f);
  if(status==='Pago'){let c=addCashMovement(type==='Receita'?'Entrada':'Saída',desc,f.value,payment,originType,originId,originNumber);f.cashId=c.id}
  if(status==='Pendente'&&dueDate&&data.settings.autoFinanceReminders)ensureFinanceReminder(f);
  return f;
}
function ensureFinanceReminder(f){
  if(!f||!f.dueDate||f.status==='Pago'||f.status==='Cancelado')return;
  if(f.reminderId&&data.reminders.some(r=>r.id===f.reminderId))return;
  let d=new Date(f.dueDate+'T09:00:00');
  let cust=getCustomer(f.customerId), sup=getSupplier(f.supplierId);
  let r={id:idNow(),title:(f.type==='Receita'?'Receber: ':'Pagar: ')+f.desc,datetime:d.toISOString().slice(0,16),priority:'Alta',customer:cust?.name||sup?.name||'',type:'Cobrança',notes:`Financeiro vinculado • ${money(f.value)} • ${f.originNumber||f.category||''}`,status:'Pendente',notified:false,financeId:f.id};
  data.reminders.push(r);f.reminderId=r.id;
}
function completeLinkedReminder(f){if(!f?.reminderId)return;let r=data.reminders.find(x=>x.id===f.reminderId);if(r)r.status='Concluído'}
function updateFinancialStatuses(){
  let today=todayISO();
  (data.finance||[]).forEach(f=>{if(f.status==='Pendente'&&f.dueDate&&f.dueDate<today)f.status='Vencido'});
}
function createIntegratedSale({customerId='',items=[],discount=0,payment='PIX',financialStatus='Pago',dueDate='',originType='Venda',originId='',originNumber='',skipStock=false,forcedTotal=null,forcedProfit=null}){
  if(data.settings.requireSaleCustomer&&!customerId)return {error:'Selecione um cliente para concluir a venda.'};
  let normalized=[];let subtotal=0,profit=0;
  for(const it of items){
    let p=data.products.find(x=>String(x.id)===String(it.id));
    if(!p&&it.kind!=='service')continue;
    let qty=Number(it.qty)||1,price=it.price!==undefined?Number(it.price):(p?Number(p.price):0),cost=it.cost!==undefined?Number(it.cost):(p?Number(p.cost):0);
    if(p&&!skipStock&&qty>Number(p.qty||0)&&!data.settings.allowNegativeStock)return {error:`Estoque insuficiente para ${p.name}.`};
    normalized.push({id:p?.id||it.id||'',name:it.name||p?.name||'Serviço',qty,price,cost,kind:it.kind||'product'}); subtotal+=price*qty;profit+=(price-cost)*qty;
  }
  let total=forcedTotal!==null?Number(forcedTotal):Math.max(0,subtotal-Number(discount||0)); profit=forcedProfit!==null?Number(forcedProfit):profit-Number(discount||0);
  let sale={id:idNow(),date:nowBR(),customerId,customer:findCustomerName(customerId),items:normalized,total,profit,discount:Number(discount)||0,payment,financialStatus,status:'Concluída',originType,originId,origin:originNumber||'',financeId:'',commissionId:''};
  if(!skipStock){for(const it of normalized.filter(x=>x.kind!=='service'&&x.id)){if(!addStockMovement(it.id,'Saída',it.qty,'Venda integrada',originNumber||('Venda #'+sale.id)))return {error:'Não foi possível movimentar o estoque.'}}}
  data.sales.unshift(sale);
  let f=makeFinance({type:'Receita',category:originType==='OS'?'Serviços':'Vendas',desc:(originType==='OS'?'Recebimento ':'Venda ')+(originNumber||('#'+sale.id)),value:total,status:financialStatus,date:todayISO(),dueDate:financialStatus==='Pago'?todayISO():(dueDate||''),payment,customerId,originType:'Venda',originId:sale.id,originNumber:originNumber||('VEN-'+sale.id)});sale.financeId=f.id;
  if(Number(data.settings.commission)>0){let c={id:idNow(),saleId:sale.id,origin:originNumber||('Venda #'+sale.id),seller:'Administrador',base:'Lucro',percent:Number(data.settings.commission),value:Math.max(0,profit)*Number(data.settings.commission)/100,status:'Pendente',date:todayISO()};data.commissions.unshift(c);sale.commissionId=c.id}
  return {sale,finance:f};
}

function renderVendas(){enhanceData();let rows=data.sales.map(s=>`<tr><td><b>#${s.id}</b><small class="cell-sub">${esc(s.origin||'Venda direta')}</small></td><td>${esc(s.date)}</td><td>${esc(s.customer||'Consumidor')}</td><td>${s.items?.length||0}</td><td>${money(s.total)}</td><td>${statusBadge(s.financialStatus||'Pago')}</td><td>${statusBadge(s.status||'Concluída')}</td></tr>`).join('');$('#vendas').innerHTML=heading('Vendas','Estoque, financeiro, caixa e comissão trabalhando juntos',`<button class="btn primary" onclick="saleModal()">+ Nova venda</button>`)+`<div class="cards">${metric('Vendas ativas',activeSales().length,'operações','green')}${metric('Faturamento',money(activeSales().reduce((a,s)=>a+Number(s.total||0),0)),'sem canceladas','green')}${metric('A receber',money(data.finance.filter(f=>f.type==='Receita'&&['Pendente','Vencido'].includes(f.status)).reduce((a,f)=>a+Number(f.value||0),0)),'vendas/serviços pendentes','red')}${metric('Comissões',money(data.commissions.filter(c=>c.status!=='Cancelada').reduce((a,c)=>a+Number(c.value||0),0)),'geradas automaticamente','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Venda</th><th>Data</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Financeiro</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhuma venda registrada.</td></tr>'}</tbody></table></div>`}
function saleModal(){let opts=data.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (estoque ${p.qty})</option>`).join('');let due=new Date();due.setDate(due.getDate()+(Number(data.settings.defaultDueDays)||30));let dueISO=due.toISOString().slice(0,10);showModal(`<h2>Nova venda integrada</h2><div class="notice">Ao concluir, o sistema baixa o estoque, cria o financeiro, movimenta o caixa se estiver pago e calcula comissão.</div><div class="form"><label class="full">Cliente<select id="scustomer">${customerOptions()}</select></label><label>Produto<select id="sproduct">${opts}</select></label><label>Quantidade<input id="sqty" type="number" value="1" min="1"></label><label>Desconto<input id="sdiscount" type="number" value="0" step="0.01"></label><label>Pagamento<select id="spayment">${['PIX','Dinheiro','Débito','Crédito','Boleto','Transferência'].map(x=>`<option ${data.settings.defaultPayment===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Status financeiro<select id="sfinancial"><option>Pago</option><option>Pendente</option></select></label><label>Vencimento<input id="sdue" type="date" value="${dueISO}"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="finishSale()">Concluir venda</button></div>`)}
function finishSale(){let p=data.products.find(x=>String(x.id)===$('#sproduct').value),q=+$('#sqty').value||0;if(!p||q<=0)return alert('Selecione o produto e informe a quantidade.');let res=createIntegratedSale({customerId:$('#scustomer').value,items:[{id:p.id,qty:q}],discount:+$('#sdiscount').value||0,payment:$('#spayment').value,financialStatus:$('#sfinancial').value,dueDate:$('#sdue').value,originType:'Venda'});if(res.error)return alert(res.error);log('Registrou venda integrada #'+res.sale.id+' → estoque, financeiro'+(res.finance.status==='Pago'?', caixa':'')+(res.sale.commissionId?' e comissão':''));save();closeModal();renderAll()}

function renderOrcamentos(){enhanceData();let total=data.quotes.reduce((a,q)=>a+Number(q.total||0),0),approved=data.quotes.filter(q=>q.status==='Aprovado').length;let rows=data.quotes.map(q=>`<tr><td><b>${esc(q.number||('#'+q.id))}</b>${q.saleId?'<small class="cell-sub">Venda vinculada #'+q.saleId+'</small>':''}</td><td>${esc(q.date||'-')}</td><td>${esc(findCustomerName(q.customerId))}</td><td>${esc(q.productName||'-')}</td><td>${money(q.total)}</td><td>${statusBadge(q.status)}</td><td class="actions"><button class="btn ghost small" onclick="changeQuoteStatus(${q.id})">Status</button>${q.customerId?`<button class="btn ghost small" onclick="quoteWhatsApp(${q.id})">WhatsApp</button>`:''}${q.status==='Aprovado'&&!q.converted?`<button class="btn primary small" onclick="convertQuote(${q.id})">Virar venda</button>`:''}<button class="btn ghost small" onclick="deleteQuote(${q.id})">Excluir</button></td></tr>`).join('');$('#orcamentos').innerHTML=heading('Orçamentos','Cliente → orçamento → venda → estoque → financeiro → caixa',`<button class="btn primary" onclick="quoteModal()">+ Novo orçamento</button>`)+`<div class="cards">${metric('Orçamentos',data.quotes.length,'registros','green')}${metric('Aprovados',approved,'prontos para venda','green')}${metric('Convertidos',data.quotes.filter(q=>q.converted).length,'viraram venda','green')}${metric('Valor orçado',money(total),'total acumulado','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Produto</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhum orçamento criado.</td></tr>'}</tbody></table></div>`}
function convertQuote(id){let q=data.quotes.find(x=>x.id===id),p=data.products.find(x=>x.id===q?.productId);if(!q||!p)return alert('Produto não encontrado.');if(q.converted)return alert('Este orçamento já foi convertido.');let status=confirm('Registrar esta venda como PAGA agora?\nOK = Pago / Cancelar = Pendente')?'Pago':'Pendente';let due='';if(status==='Pendente'){let d=new Date();d.setDate(d.getDate()+(Number(data.settings.defaultDueDays)||30));due=d.toISOString().slice(0,10)}let res=createIntegratedSale({customerId:q.customerId,items:[{id:p.id,qty:q.qty}],discount:q.discount,payment:data.settings.defaultPayment,financialStatus:status,dueDate:due,originType:'Orçamento',originId:q.id,originNumber:q.number});if(res.error)return alert(res.error);q.converted=true;q.saleId=res.sale.id;q.financeId=res.finance.id;q.status='Aprovado';log('Converteu '+q.number+' → venda #'+res.sale.id+' → estoque → financeiro'+(status==='Pago'?' → caixa':''));save();renderAll()}

function renderCompras(){enhanceData();let sum=data.purchases.filter(p=>p.status!=='Cancelado').reduce((a,p)=>a+Number(p.total||0),0),pending=data.purchases.filter(p=>p.status==='Pendente').length;let rows=data.purchases.map(p=>`<tr><td><b>${esc(p.number)}</b>${p.financeId?'<small class="cell-sub">Financeiro #'+p.financeId+'</small>':''}</td><td>${esc(p.date)}</td><td>${esc(findSupplierName(p.supplierId))}</td><td>${esc(p.productName)}</td><td>${p.qty}</td><td>${money(p.total)}</td><td>${statusBadge(p.status)}</td><td>${p.status!=='Cancelado'?`<button class="btn ghost small" onclick="cancelPurchase(${p.id})">Cancelar</button>`:''}</td></tr>`).join('');$('#compras').innerHTML=heading('Compras','Fornecedor → estoque → contas a pagar → caixa',`<button class="btn primary" onclick="purchaseModal()">+ Nova compra</button>`)+`<div class="cards">${metric('Compras ativas',data.purchases.filter(p=>p.status!=='Cancelado').length,'registros','green')}${metric('Total comprado',money(sum),'custo acumulado','red')}${metric('Pendentes',pending,'contas a pagar','red')}${metric('Mov. estoque',data.stockMovements.filter(m=>String(m.reason).includes('Compra')).length,'entradas de compra','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Fornecedor</th><th>Produto</th><th>Qtd.</th><th>Total</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Nenhuma compra registrada.</td></tr>'}</tbody></table></div>`}
function savePurchase(){let p=data.products.find(x=>String(x.id)===$('#puproduct').value),qty=+$('#puqty').value,cost=+$('#pucost').value,freight=+$('#pufreight').value||0;if(!p||qty<=0||cost<0)return alert('Preencha produto, quantidade e custo.');let total=qty*cost+freight,pu={id:idNow(),number:(data.settings.purchasePrefix||'CMP')+'-'+String(data.purchases.length+1).padStart(4,'0'),date:new Date().toLocaleDateString('pt-BR'),supplierId:$('#pusupplier').value,productId:p.id,productName:p.name,qty,cost,freight,total,payment:$('#pupayment').value,status:$('#pustatus').value,dueDate:$('#pudue').value,note:$('#punote').value,stockApplied:false,financeId:''};data.purchases.unshift(pu);if(!addStockMovement(p.id,'Entrada',qty,'Compra de fornecedor',pu.number)){data.purchases.shift();return alert('Não foi possível registrar a entrada no estoque.')}pu.stockApplied=true;p.cost=cost;let f=makeFinance({type:'Despesa',category:'Compras',desc:'Compra '+pu.number,value:total,status:pu.status,date:todayISO(),dueDate:pu.dueDate,payment:pu.payment,supplierId:pu.supplierId,originType:'Compra',originId:pu.id,originNumber:pu.number});pu.financeId=f.id;log('Registrou '+pu.number+' → estoque → financeiro'+(pu.status==='Pago'?' → caixa':''));save();closeModal();renderAll()}
function cancelPurchase(id){let pu=data.purchases.find(x=>x.id===id);if(!pu||pu.status==='Cancelado')return;if(!confirm('Cancelar esta compra? O sistema reverterá o estoque e cancelará/estornará o financeiro vinculado.'))return;if(pu.stockApplied){if(!addStockMovement(pu.productId,'Saída',pu.qty,'Cancelamento de compra',pu.number+' CANCELADA'))return alert('Não foi possível reverter o estoque.');pu.stockApplied=false}let f=data.finance.find(x=>x.id===pu.financeId)||data.finance.find(x=>x.originType==='Compra'&&x.originId===pu.id);if(f){if(f.status==='Pago'&&f.cashId){addCashMovement('Entrada','Estorno '+f.desc,f.value,f.payment,'Compra',pu.id,pu.number)}f.status='Cancelado';completeLinkedReminder(f)}pu.status='Cancelado';log('Cancelou '+pu.number+' → reverteu estoque e financeiro');save();renderAll()}
function deletePurchase(id){cancelPurchase(id)}

function renderOS(){enhanceData();let rows=data.serviceOrders.map(o=>`<tr><td><b>${esc(o.number)}</b>${o.saleId?'<small class="cell-sub">Venda #'+o.saleId+'</small>':''}</td><td>${esc(o.date)}</td><td>${esc(findCustomerName(o.customerId))}</td><td>${esc(o.service)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td><td class="actions"><button class="btn ghost small" onclick="changeOSStatus(${o.id})">Status</button>${o.customerId?`<button class="btn ghost small" onclick="osWhatsApp(${o.id})">WhatsApp</button>`:''}${o.status==='Concluída'&&!o.received?`<button class="btn primary small" onclick="receiveOSModal(${o.id})">Receber</button>`:''}${o.status!=='Cancelada'?`<button class="btn ghost small" onclick="cancelOS(${o.id})">Cancelar</button>`:''}</td></tr>`).join('');$('#os').innerHTML=heading('Ordens de Serviço','Cliente → OS → estoque → venda/financeiro → caixa',`<button class="btn primary" onclick="osModal()">+ Nova OS</button>`)+`<div class="cards">${metric('OS abertas',data.serviceOrders.filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length,'em atendimento','red')}${metric('Concluídas',data.serviceOrders.filter(o=>o.status==='Concluída'||o.status==='Entregue').length,'finalizadas','green')}${metric('Recebidas',data.serviceOrders.filter(o=>o.received).length,'integradas às vendas','green')}${metric('Valor em OS',money(data.serviceOrders.filter(o=>o.status!=='Cancelada').reduce((a,o)=>a+Number(o.total||0),0)),'total ativo','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Serviço</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhuma ordem de serviço.</td></tr>'}</tbody></table></div>`}
function receiveOSModal(id){let o=data.serviceOrders.find(x=>x.id===id);if(!o||o.received)return;let due=new Date();due.setDate(due.getDate()+(Number(data.settings.defaultDueDays)||30));showModal(`<h2>Receber ${esc(o.number)}</h2><div class="notice">Isso criará uma venda vinculada à OS e lançará o financeiro. O estoque não será baixado de novo porque já foi consumido pela OS.</div><div class="form"><label>Pagamento<select id="ospay">${['PIX','Dinheiro','Débito','Crédito','Boleto','Transferência'].map(x=>`<option ${data.settings.defaultPayment===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Status financeiro<select id="osfinstatus"><option>Pago</option><option>Pendente</option></select></label><label>Vencimento<input id="osfindue" type="date" value="${due.toISOString().slice(0,10)}"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="receiveOS(${id})">Confirmar recebimento</button></div>`)}
function receiveOS(id){let o=data.serviceOrders.find(x=>x.id===id);if(!o||o.received)return;let status=$('#osfinstatus')?.value||'Pago',pay=$('#ospay')?.value||data.settings.defaultPayment,due=$('#osfindue')?.value||'';let items=[];if(o.productId&&o.qty)items.push({id:o.productId,name:o.productName,qty:o.qty,price:o.qty?o.productValue/o.qty:0,cost:data.products.find(p=>p.id===o.productId)?.cost||0});if(o.serviceValue)items.push({id:'service-'+o.id,name:o.service,qty:1,price:o.serviceValue,cost:0,kind:'service'});let productCost=(o.productId?(data.products.find(p=>p.id===o.productId)?.cost||0)*Number(o.qty||0):0),forcedProfit=Number(o.total||0)-productCost;let res=createIntegratedSale({customerId:o.customerId,items,discount:o.discount||0,payment:pay,financialStatus:status,dueDate:due,originType:'OS',originId:o.id,originNumber:o.number,skipStock:true,forcedTotal:o.total,forcedProfit});if(res.error)return alert(res.error);o.received=true;o.status='Entregue';o.saleId=res.sale.id;o.financeId=res.finance.id;log('Recebeu '+o.number+' → venda #'+res.sale.id+' → financeiro'+(status==='Pago'?' → caixa':''));save();closeModal();renderAll()}
function cancelOS(id){let o=data.serviceOrders.find(x=>x.id===id);if(!o||o.status==='Cancelada')return;if(!confirm('Cancelar esta OS? O sistema tentará reverter estoque e lançamentos vinculados.'))return;if(o.stockDeducted&&o.productId&&o.qty){addStockMovement(o.productId,'Devolução',o.qty,'Cancelamento de OS',o.number);o.stockDeducted=false}if(o.saleId){let sale=data.sales.find(s=>s.id===o.saleId);if(sale){sale.status='Cancelada';let f=data.finance.find(x=>x.id===sale.financeId);if(f){if(f.status==='Pago'&&f.cashId)addCashMovement('Saída','Estorno '+f.desc,f.value,f.payment,'OS',o.id,o.number);f.status='Cancelado';completeLinkedReminder(f)}let com=data.commissions.find(c=>c.id===sale.commissionId);if(com)com.status='Cancelada'}}o.status='Cancelada';o.received=false;log('Cancelou '+o.number+' → reverteu vínculos possíveis');save();renderAll()}
function changeOSStatus(id){let o=data.serviceOrders.find(x=>x.id===id),s=prompt('Status: Aberta, Aguardando, Em andamento, Concluída, Entregue ou Cancelada',o.status);if(!s)return;let valid=['Aberta','Aguardando','Em andamento','Concluída','Entregue','Cancelada'],m=valid.find(x=>x.toLowerCase()===s.toLowerCase());if(!m)return alert('Status inválido.');if(m==='Cancelada')return cancelOS(id);o.status=m;log('Alterou '+o.number+' para '+m);save();renderAll()}
function deleteOS(id){cancelOS(id)}

function renderFinanceiro(){enhanceData();updateFinancialStatuses();let rec=data.finance.filter(f=>f.type==='Receita'&&f.status!=='Cancelado').reduce((a,b)=>a+Number(b.value||0),0),des=data.finance.filter(f=>f.type==='Despesa'&&f.status!=='Cancelado').reduce((a,b)=>a+Number(b.value||0),0),pending=data.finance.filter(f=>['Pendente','Vencido'].includes(f.status)).reduce((a,b)=>a+Number(b.value||0),0),overdue=data.finance.filter(f=>f.status==='Vencido').reduce((a,b)=>a+Number(b.value||0),0);let rows=data.finance.map(f=>`<tr><td>${statusBadge(f.type)}</td><td><b>${esc(f.desc)}</b><small class="cell-sub">${esc(f.category||'Geral')}${f.originNumber?' • '+esc(f.originNumber):''}</small></td><td>${money(f.value)}</td><td>${esc(f.date||'-')}</td><td>${esc(f.dueDate||'-')}</td><td>${esc(f.payment||'-')}</td><td>${statusBadge(f.status)}</td><td><div class="actions">${!['Pago','Cancelado'].includes(f.status)?`<button class="btn primary small" onclick="markFinancePaid(${f.id})">Dar baixa</button>`:''}${f.customerId&&!['Pago','Cancelado'].includes(f.status)?`<button class="btn ghost small" onclick="financeWhatsApp(${f.id})">WhatsApp</button>`:''}${f.reminderId?'<span class="soft-chip">Agenda</span>':''}</div></td></tr>`).join('');$('#financeiro').innerHTML=heading('Financeiro','Central que recebe vendas, compras e OS e envia baixas ao caixa',`<button class="btn primary" onclick="financeModalV2()">+ Novo lançamento</button>`)+`<div class="cards">${metric('Receitas',money(rec),'não canceladas','green')}${metric('Despesas',money(des),'não canceladas','red')}${metric('Pendentes',money(pending),'com agenda automática','red')}${metric('Vencidas',money(overdue),'exigem atenção','red')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Tipo</th><th>Descrição / Origem</th><th>Valor</th><th>Lançamento</th><th>Vencimento</th><th>Pagamento</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Nenhum lançamento financeiro.</td></tr>'}</tbody></table></div>`}
function saveFinanceV2(){let f=makeFinance({type:$('#ftype').value,category:$('#fcategory').value.trim()||'Geral',desc:$('#fdesc').value.trim(),value:+$('#fvalue').value||0,date:$('#fdate').value,status:$('#fstatus').value,dueDate:$('#fdue').value,payment:$('#fpayment').value,originType:'Manual'});if(!f.desc||f.value<=0){data.finance=data.finance.filter(x=>x.id!==f.id);return alert('Informe descrição e valor.')}f.notes=$('#fnotes').value;log('Criou lançamento financeiro: '+f.desc+(f.status==='Pendente'&&f.reminderId?' e lembrete automático':''));save();closeModal();renderAll()}
function markFinancePaid(id){let f=data.finance.find(x=>x.id===id);if(!f||f.status==='Pago'||f.status==='Cancelado')return;f.status='Pago';if(!f.cashId){let c=addCashMovement(f.type==='Receita'?'Entrada':'Saída',f.desc,f.value,f.payment||'Manual',f.originType,f.originId,f.originNumber);f.cashId=c.id}completeLinkedReminder(f);if(f.originType==='Compra'){let pu=data.purchases.find(p=>p.id===f.originId);if(pu)pu.status='Pago'}if(f.originType==='Venda'){let s=data.sales.find(x=>x.id===f.originId);if(s)s.financialStatus='Pago'}log('Deu baixa em '+f.desc+' → caixa e vínculos atualizados');save();renderAll()}

function syncProductChannels(product){
 if(!product)return;
 const cat=data.catalogItems.find(x=>String(x.productId)===String(product.id));
 if(cat)Object.assign(cat,{code:product.code,name:product.name,brand:product.brand,category:product.category,qty:product.qty,price:product.price,updatedAt:nowBR()});
 const ml=data.mercadoLivreItems.find(x=>String(x.productId)===String(product.id));
 if(ml)Object.assign(ml,{code:product.code,name:product.name,brand:product.brand,category:product.category,qty:product.qty,price:product.price,updatedAt:nowBR()});
}

/* ===== Ajustes Le Pneus: Dashboard, clientes e serviços ===== */
function parseBRDateTime(v){
 if(!v)return null; if(v instanceof Date)return v;
 const str=String(v);
 const m=str.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:,?\s+(\d{2}):(\d{2})(?::(\d{2}))?)?/);
 if(m)return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
 const d=new Date(str); return isNaN(d)?null:d;
}
function dashboardSalesIn(period){
 const now=new Date();
 return activeSales().filter(s=>{let d=parseBRDateTime(s.date); if(!d)return false;
  if(period==='day')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
  if(period==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  return d.getFullYear()===now.getFullYear();
 });
}

function monthKeyFromDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(key){
 const [y,m]=String(key).split('-').map(Number);
 return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
}
function eventDate(v){
 if(!v)return null;
 if(v instanceof Date)return v;
 if(/^\d{4}-\d{2}-\d{2}/.test(String(v))){const d=new Date(String(v).slice(0,10)+'T12:00:00');return isNaN(d)?null:d}
 if(typeof parseBRDateTime==='function'){const d=parseBRDateTime(v);if(d&&!isNaN(d))return d}
 const s=String(v).trim(), m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
 if(m){const d=new Date(+m[3],+m[2]-1,+m[1],+(m[4]||12),+(m[5]||0),+(m[6]||0));return isNaN(d)?null:d}
 const d=new Date(v);return isNaN(d)?null:d;
}
function inMonth(item,key,fields=['date']){
 for(const f of fields){const d=eventDate(item?.[f]);if(d&&monthKeyFromDate(d)===key)return true}
 return false;
}
function safeNum(v){v=Number(v||0);return Number.isFinite(v)?v:0}
function buildMonthClosing(key){
 enhanceData(); ensureData();
 const sales=(data.sales||[]).filter(s=>s.status!=='Cancelada'&&inMonth(s,key,['date','createdAt']));
 const finance=(data.finance||[]).filter(f=>f.status!=='Cancelado'&&inMonth(f,key,['date','createdAt']));
 const purchases=(data.purchases||[]).filter(p=>inMonth(p,key,['date','createdAt']));
 const services=(data.serviceOrders||[]).filter(o=>o.status!=='Cancelada'&&inMonth(o,key,['date','createdAt']));
 const cash=(data.cash||[]).filter(c=>inMonth(c,key,['date','createdAt']));
 const revenue=sales.reduce((a,s)=>a+safeNum(s.total),0);
 const profit=sales.reduce((a,s)=>a+safeNum(s.profit),0);
 const productCost=Math.max(0,revenue-profit);
 const serviceRevenue=services.filter(o=>o.received||['Concluída','Entregue'].includes(o.status)).reduce((a,o)=>a+safeNum(o.serviceValue||o.total),0);
 const purchaseTotal=purchases.reduce((a,p)=>a+safeNum(p.total),0);
 const financeRevenue=finance.filter(f=>f.type==='Receita').reduce((a,f)=>a+safeNum(f.value),0);
 const financeExpense=finance.filter(f=>f.type==='Despesa').reduce((a,f)=>a+safeNum(f.value),0);
 const cashIn=cash.filter(c=>c.type==='Entrada').reduce((a,c)=>a+safeNum(c.value),0);
 const cashOut=cash.filter(c=>c.type==='Saída').reduce((a,c)=>a+safeNum(c.value),0);
 const payments={};
 sales.forEach(s=>{const k=s.payment||'Não informado';payments[k]=(payments[k]||0)+safeNum(s.total)});
 const itemsSold=sales.reduce((a,s)=>a+(s.items||[]).reduce((b,i)=>b+safeNum(i.qty||1),0),0);
 const ml=(data.mercadoLivreItems||[]).map(x=>{const p=(data.products||[]).find(p=>String(p.id)===String(x.productId));const c=typeof mlCalc==='function'?mlCalc(x,p):{};return {id:x.id,productId:x.productId,code:x.code,name:x.name,listingId:x.mlListingId||'',advertisedPrice:safeNum(c.price||x.mlAdvertisedPrice),fee:safeNum(c.fee||x.mlFee),freight:safeNum(c.freight||x.mlFreight),other:safeNum(c.other||x.mlOtherCost),status:x.status||'Controle manual'}});
 return {
  id:'FM-'+key, month:key, label:monthLabel(key), closedAt:new Date().toLocaleString('pt-BR'),
  summary:{salesCount:sales.length,itemsSold,revenue,productCost,profit,serviceCount:services.length,serviceRevenue,purchaseCount:purchases.length,purchaseTotal,financeRevenue,financeExpense,cashIn,cashOut,cashBalance:cashIn-cashOut,netResult:financeRevenue-financeExpense,payments},
  details:{
   sales:sales.map(s=>({id:s.id,date:s.date,customer:s.customer||findCustomerName?.(s.customerId)||'',total:safeNum(s.total),profit:safeNum(s.profit),payment:s.payment||'',items:s.items||[]})),
   services:services.map(o=>({id:o.id,number:o.number,date:o.date,customer:typeof findCustomerName==='function'?findCustomerName(o.customerId):'',service:o.service,status:o.status,value:safeNum(o.serviceValue||o.total)})),
   purchases:purchases.map(p=>({id:p.id,number:p.number,date:p.date,product:p.productName,qty:p.qty,total:safeNum(p.total),status:p.status})),
   finance:finance.map(f=>({id:f.id,date:f.date,type:f.type,category:f.category,desc:f.desc,value:safeNum(f.value),status:f.status,payment:f.payment||''})),
   cash:cash.map(c=>({id:c.id,date:c.date,type:c.type,desc:c.desc,value:safeNum(c.value),payment:c.payment||''})),
   mercadoLivre:ml
  }
 };
}
function closeMonth(key,automatic=false){
 ensureData();
 if(!/^\d{4}-\d{2}$/.test(key))return alert('Selecione um mês válido.');
 if(data.monthlyClosings.some(c=>c.month===key))return automatic?null:alert('Esse mês já está fechado.');
 const current=monthKeyFromDate(new Date());
 if(key>current)return automatic?null:alert('Não é possível fechar um mês futuro.');
 if(key===current&&!automatic&&!confirm('Este é o mês atual. Deseja fechar agora mesmo? O resumo ficará salvo como uma fotografia deste momento.'))return;
 const closing=buildMonthClosing(key);
 data.monthlyClosings.unshift(closing);
 log('Fechamento mensal criado: '+closing.label+(automatic?' (automático)':''));
 save();
 if(!automatic){renderAll();alert('Fechamento de '+closing.label+' salvo com sucesso.');}
 return closing;
}

/* ===== Melhorias de segurança e conferência do estoque ===== */
function productWarnings(p){
 const w=[];
 if(!String(p.code||'').trim())w.push('Sem código');
 if(Number(p.qty||0)<=0)w.push('Zerado');
 else if(Number(p.qty||0)<=Number(p.min||0))w.push('Estoque baixo');
 if(Number(p.cost||0)<=0)w.push('Sem custo');
 if(Number(p.price||0)<=0)w.push('Sem preço');
 if(Number(p.cost||0)>0&&Number(p.price||0)>0&&Number(p.price)<=Number(p.cost))w.push('Preço ≤ custo');
 const code=String(p.code||'').trim().toLowerCase();
 if(code&&data.products.filter(x=>String(x.code||'').trim().toLowerCase()===code).length>1)w.push('Código duplicado');
 return w;
}
function stockAttention(){
 const ps=data.products||[];
 return {
  zero:ps.filter(p=>Number(p.qty||0)<=0),
  low:ps.filter(p=>Number(p.qty||0)>0&&Number(p.qty||0)<=Number(p.min||0)),
  noCost:ps.filter(p=>Number(p.cost||0)<=0),
  noPrice:ps.filter(p=>Number(p.price||0)<=0),
  belowCost:ps.filter(p=>Number(p.cost||0)>0&&Number(p.price||0)>0&&Number(p.price)<=Number(p.cost||0)),
  duplicate:ps.filter((p,i,a)=>{const c=String(p.code||'').trim().toLowerCase();return c&&a.findIndex(x=>String(x.code||'').trim().toLowerCase()===c)!==i})
 };
}
function categoryStockSummary(){
 const groups={};
 (data.products||[]).forEach(p=>{
  const k=p.category||'Sem categoria';
  groups[k]=groups[k]||{products:0,qty:0,cost:0,sale:0};
  groups[k].products++;
  groups[k].qty+=Number(p.qty||0);
  groups[k].cost+=Number(p.qty||0)*Number(p.cost||0);
  groups[k].sale+=Number(p.qty||0)*Number(p.price||0);
 });
 return groups;
}

function saveProductV2(id){

 const dup=data.products.find(x=>String(x.id)!==String(id||'')&&String(x.code||'').trim().toLowerCase()===code.toLowerCase());
 if(dup)return alert(`Já existe outro produto com o código ${code}: ${dup.name}. Use um código diferente.`);
 let obj={id:id||Date.now(),code,name:$('#pname').value.trim(),category:$('#pcat').value.trim()||'Geral',brand:$('#pbrand').value.trim(),qty:id?old.qty:(+$('#pqty').value||0),min:+$('#pmin').value||0,cost:+$('#pcost').value||0,price:+$('#pprice').value||0,location:$('#plocation').value.trim()};
 if(!obj.name)return alert('Informe o nome do produto.');

   queueExcelSync(obj,'Cadastro de produto');

function renderEstoque(){

function restoreFullBackup(){

 const reader=new FileReader();
 reader.onload=()=>{
   try{
     const parsed=JSON.parse(reader.result);
     const incoming=parsed&&parsed.data?parsed.data:parsed;
     if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw new Error('Formato inválido');
     const required=['products','sales','customers','cash'];

     };
     localStorage.setItem('lepneus_pre_restore_backup',JSON.stringify(safety));
     data=JSON.parse(JSON.stringify(incoming));
     ensureData();enhanceData();

function normalizeCatalogCategory(v){
  const s=String(v||'').toLowerCase();
  if(s.includes('moto')) return 'Pneu de moto';
  if(s.includes('acess')||s.includes('câmara')||s.includes('camara')) return 'Acessórios';
  return 'Pneu';
}

function extractCatalogSize(name){
  const s=String(name||'').toUpperCase().replace(/\s+/g,' ').trim();
  let m=s.match(/(\d{3})\s*\/?\s*(\d{2})\s*R\s*(\d{2})/i);
  if(m) return `${m[1]}/${m[2]} R${m[3]}`;
  m=s.match(/(\d{2,3})\s*\/\s*(\d{2,3})\s*[- ]\s*(\d{2})/i);
  if(m) return `${m[1]}/${m[2]}-${m[3]}`;
  m=s.match(/(\d{2,3})\s+(\d{2,3})\s+R?\s*(\d{2})/i);
  if(m) return `${m[1]}/${m[2]} R${m[3]}`;
  return '';
}

function catalogModelFromProduct(p){
  let n=String(p.name||'').trim();
  const b=String(p.brand||'').trim();
  if(b && n.toLowerCase().startsWith(b.toLowerCase())) n=n.slice(b.length).trim();
  return n || String(p.code||'Produto');
}

function productToFirebaseCatalog(p, existing={}){
  const size=existing.size || extractCatalogSize(p.name);
  const aro=(size.match(/(?:R|-)(\d{2})/i)||[])[1]||existing.aro||'';
  return {
    categoria: normalizeCatalogCategory(p.category),
    brand: p.brand || existing.brand || '',
    model: catalogModelFromProduct(p),
    size: size,
    aro: aro,
    load: existing.load || '',
    app: existing.app || '',
    price: Number(p.price||0),
    stock: Number(p.qty||0),
    promo: !!existing.promo,
    image: existing.image || '',
    code: String(p.code||''),
    controlId: String(p.id),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
}

async function findFirebaseCatalogDoc(p){
  if(!lpDb) return null;
  let snap=await lpDb.collection('produtos').where('controlId','==',String(p.id)).limit(1).get();
  if(!snap.empty) return snap.docs[0];
  if(p.code){
    snap=await lpDb.collection('produtos').where('code','==',String(p.code)).limit(1).get();
    if(!snap.empty) return snap.docs[0];
  }
  return null;
}
