function saveSettingsV2(){let s=data.settings;const val=id=>$('#'+id)?.value??'',chk=id=>!!$('#'+id)?.checked;s.company=val('companyName');s.fantasy=val('companyFantasy');s.cnpj=val('companyDoc');s.phone=val('companyPhone');s.whatsapp=val('companyWhatsapp');s.email=val('companyEmail');s.address=val('companyAddress');s.city=val('companyCity');s.businessHours=val('businessHours');s.quotePrefix=val('quotePrefix')||'ORC';s.osPrefix=val('osPrefix')||'OS';s.purchasePrefix=val('purchasePrefix')||'CMP';s.defaultDueDays=+val('defaultDueDays')||30;s.documentFooter=val('documentFooter');s.defaultPayment=val('defaultPayment');s.commission=+val('commission')||0;s.lateFee=+val('lateFee')||0;s.monthlyInterest=+val('monthlyInterest')||0;s.requireSaleCustomer=chk('requireSaleCustomer');s.defaultMinStock=+val('defaultMinStock')||0;s.allowNegativeStock=chk('allowNegativeStock');s.autoLowStockAlerts=chk('autoLowStockAlerts');s.reminderMinutes=+val('reminderMinutes')||0;s.browserNotifications=chk('browserNotifications');s.autoDueAlerts=chk('autoDueAlerts');s.whatsapp=val('waBusiness');s.whatsappWebhook=val('waWebhook').trim();s.whatsappSignature=val('waSignature');s.whatsappAuto=chk('waAuto');s.sessionMinutes=+val('sessionMinutes')||480;s.timezone=val('timezone');s.confirmCritical=chk('confirmCritical');s.autoBackup=chk('autoBackup');log('Atualizou configurações da empresa');save();if(s.autoBackup)localStorage.setItem('gestaoBackupAuto',JSON.stringify({date:new Date().toISOString(),data}));alert('Configurações salvas com sucesso.');renderAll()}


/* ===== V3 — CAMADA DE INTEGRAÇÃO ENTRE MÓDULOS ===== */
function enhanceData(){
  data.stockMovements=data.stockMovements||[];
  data.cashRegister=data.cashRegister||{open:false,openedAt:'',openedBy:'Administrador',initial:0,closedAt:'',closingValue:0,sessionId:''};
  data.cashSessions=data.cashSessions||[];
  data.commissions=data.commissions||[];
  data.settings=data.settings||{};
  const extra={quotePrefix:'ORC',osPrefix:'OS',purchasePrefix:'CMP',documentFooter:'Obrigado pela preferência!',defaultDueDays:30,lateFee:0,monthlyInterest:0,allowNegativeStock:false,autoLowStockAlerts:true,autoDueAlerts:true,businessHours:'08:00 às 18:00',requireSaleCustomer:false,showCostToSeller:false,autoFinanceReminders:true};
  Object.keys(extra).forEach(k=>{if(data.settings[k]===undefined)data.settings[k]=extra[k]});
  data.users=data.users||[{id:1,name:'Administrador',username:'admin',role:'ADMINISTRADOR',active:true}];
  data.users.forEach(u=>{if(u.username===undefined)u.username=(u.name||'usuario').toLowerCase().replace(/\s+/g,'.');if(u.active===undefined)u.active=true});
  data.quotes=data.quotes||[]; data.purchases=data.purchases||[]; data.serviceOrders=data.serviceOrders||[];
  data.sales=data.sales||[]; data.finance=data.finance||[]; data.cash=data.cash||[]; data.reminders=data.reminders||[];
  // Migração leve dos registros antigos para permitir vínculos sem perder dados.
  data.sales.forEach(x=>{if(x.status===undefined)x.status='Concluída'; if(x.financialStatus===undefined)x.financialStatus='Pago'});
  data.purchases.forEach(x=>{if(x.stockApplied===undefined)x.stockApplied=x.status!=='Cancelado'});
  data.serviceOrders.forEach(x=>{if(x.saleId===undefined)x.saleId='';if(x.financeId===undefined)x.financeId=''});
  updateFinancialStatuses();
}
function idNow(offset=0){return Date.now()+offset+Math.floor(Math.random()*900)}
function getCustomer(id){return data.customers.find(c=>String(c.id)===String(id))}
function getSupplier(id){return data.suppliers.find(c=>String(c.id)===String(id))}
function activeSales(){return data.sales.filter(s=>s.status!=='Cancelada')}
function addCashMovement(type,desc,value,payment,originType='',originId='',originNumber=''){
  let c={id:idNow(),type,desc,value:Number(value)||0,payment:payment||'Manual',date:nowBR(),originType,originId,originNumber,cashSessionId:data.cashRegister.open?data.cashRegister.sessionId||'legacy-open':''};
  data.cash.unshift(c); return c;
}
function makeFinance({type,category,desc,value,status='Pendente',date=todayISO(),dueDate='',payment='',customerId='',supplierId='',originType='',originId='',originNumber=''}){
  let f={id:idNow(),type,category:category||'Geral',desc,value:Number(value)||0,status,date,dueDate,payment,customerId,supplierId,originType,originId,originNumber,cashId:'',reminderId:''};
  data.finance.unshift(f);
  if(status==='Pago'){let c=addCashMovement(type==='Receita'?'Entrada':'Saída',desc,f.value,payment,originType,originId,originNumber);f.cashId=c.id}
  if(status==='Pendente'&&dueDate&&data.settings.autoFinanceReminders)ensureFinanceReminder(f);
  return f;
}
function ensureFinanceReminder(f){
  if(!f||!f.dueDate||f.status==='Pago'||f.status==='Cancelado')return;
  if(f.reminderId&&data.reminders.some(r=>r.id===f.reminderId))return;
  let d=new Date(f.dueDate+'T09:00:00');
  let cust=getCustomer(f.customerId), sup=getSupplier(f.supplierId);
  let r={id:idNow(),title:(f.type==='Receita'?'Receber: ':'Pagar: ')+f.desc,datetime:d.toISOString().slice(0,16),priority:'Alta',customer:cust?.name||sup?.name||'',type:'Cobrança',notes:`Financeiro vinculado • ${money(f.value)} • ${f.originNumber||f.category||''}`,status:'Pendente',notified:false,financeId:f.id};
  data.reminders.push(r);f.reminderId=r.id;
}
function completeLinkedReminder(f){if(!f?.reminderId)return;let r=data.reminders.find(x=>x.id===f.reminderId);if(r)r.status='Concluído'}
function updateFinancialStatuses(){
  let today=todayISO();
  (data.finance||[]).forEach(f=>{if(f.status==='Pendente'&&f.dueDate&&f.dueDate<today)f.status='Vencido'});
}
function createIntegratedSale({customerId='',items=[],discount=0,payment='PIX',financialStatus='Pago',dueDate='',originType='Venda',originId='',originNumber='',skipStock=false,forcedTotal=null,forcedProfit=null}){
  if(data.settings.requireSaleCustomer&&!customerId)return {error:'Selecione um cliente para concluir a venda.'};
  let normalized=[];let subtotal=0,profit=0;
  for(const it of items){
    let p=data.products.find(x=>String(x.id)===String(it.id));
    if(!p&&it.kind!=='service')continue;
    let qty=Number(it.qty)||1,price=it.price!==undefined?Number(it.price):(p?Number(p.price):0),cost=it.cost!==undefined?Number(it.cost):(p?Number(p.cost):0);
    if(p&&!skipStock&&qty>Number(p.qty||0)&&!data.settings.allowNegativeStock)return {error:`Estoque insuficiente para ${p.name}.`};
    normalized.push({id:p?.id||it.id||'',name:it.name||p?.name||'Serviço',qty,price,cost,kind:it.kind||'product'}); subtotal+=price*qty;profit+=(price-cost)*qty;
  }
  let total=forcedTotal!==null?Number(forcedTotal):Math.max(0,subtotal-Number(discount||0)); profit=forcedProfit!==null?Number(forcedProfit):profit-Number(discount||0);
  let sale={id:idNow(),date:nowBR(),customerId,customer:findCustomerName(customerId),items:normalized,total,profit,discount:Number(discount)||0,payment,financialStatus,status:'Concluída',originType,originId,origin:originNumber||'',financeId:'',commissionId:''};
  if(!skipStock){for(const it of normalized.filter(x=>x.kind!=='service'&&x.id)){if(!addStockMovement(it.id,'Saída',it.qty,'Venda integrada',originNumber||('Venda #'+sale.id)))return {error:'Não foi possível movimentar o estoque.'}}}
  data.sales.unshift(sale);
  let f=makeFinance({type:'Receita',category:originType==='OS'?'Serviços':'Vendas',desc:(originType==='OS'?'Recebimento ':'Venda ')+(originNumber||('#'+sale.id)),value:total,status:financialStatus,date:todayISO(),dueDate:financialStatus==='Pago'?todayISO():(dueDate||''),payment,customerId,originType:'Venda',originId:sale.id,originNumber:originNumber||('VEN-'+sale.id)});sale.financeId=f.id;
  if(Number(data.settings.commission)>0){let c={id:idNow(),saleId:sale.id,origin:originNumber||('Venda #'+sale.id),seller:'Administrador',base:'Lucro',percent:Number(data.settings.commission),value:Math.max(0,profit)*Number(data.settings.commission)/100,status:'Pendente',date:todayISO()};data.commissions.unshift(c);sale.commissionId=c.id}
  return {sale,finance:f};
}
function customerWhatsAppModal(customerId,text){let c=getCustomer(customerId);if(!c||!waPhone(c.phone).length)return alert('Este cliente não possui WhatsApp/telefone cadastrado.');let now=new Date(Date.now()+5*60000);now.setMinutes(now.getMinutes()-now.getTimezoneOffset());showModal(`<h2>Mensagem para ${esc(c.name)}</h2><div class="form"><label>Telefone<input id="waphone" value="${esc(waPhone(c.phone))}"></label><label>Data e hora<input id="wadatetime" type="datetime-local" value="${now.toISOString().slice(0,16)}"></label><label class="full">Mensagem<textarea id="watext" rows="6">${esc(text)}</textarea></label></div><input id="wacontact" type="hidden" value="${esc(c.name)}"><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveWaMessage()">Agendar mensagem</button></div>`)}
function quoteWhatsApp(id){let q=data.quotes.find(x=>x.id===id),c=getCustomer(q?.customerId);if(!q||!c)return alert('Vincule um cliente ao orçamento.');customerWhatsAppModal(c.id,`Olá, {nome}! O orçamento ${q.number}, no valor de ${money(q.total)}, está ${q.status.toLowerCase()}. Se quiser, posso te passar os detalhes por aqui.`)}
function financeWhatsApp(id){let f=data.finance.find(x=>x.id===id),c=getCustomer(f?.customerId);if(!f||!c)return alert('Este lançamento não está vinculado a um cliente com cadastro.');customerWhatsAppModal(c.id,`Olá, {nome}! Passando para lembrar sobre ${f.desc}, no valor de ${money(f.value)}${f.dueDate?' com vencimento em '+new Date(f.dueDate+'T12:00:00').toLocaleDateString('pt-BR'):''}.`)}
function osWhatsApp(id){let o=data.serviceOrders.find(x=>x.id===id),c=getCustomer(o?.customerId);if(!o||!c)return alert('Vincule um cliente à OS.');customerWhatsAppModal(c.id,`Olá, {nome}! Atualização da sua ${o.number}: status ${o.status}. Serviço: ${o.service}. Valor atual: ${money(o.total)}.`)}

function renderVendas(){enhanceData();let rows=data.sales.map(s=>`<tr><td><b>#${s.id}</b><small class="cell-sub">${esc(s.origin||'Venda direta')}</small></td><td>${esc(s.date)}</td><td>${esc(s.customer||'Consumidor')}</td><td>${s.items?.length||0}</td><td>${money(s.total)}</td><td>${statusBadge(s.financialStatus||'Pago')}</td><td>${statusBadge(s.status||'Concluída')}</td></tr>`).join('');$('#vendas').innerHTML=heading('Vendas','Estoque, financeiro, caixa e comissão trabalhando juntos',`<button class="btn primary" onclick="saleModal()">+ Nova venda</button>`)+`<div class="cards">${metric('Vendas ativas',activeSales().length,'operações','green')}${metric('Faturamento',money(activeSales().reduce((a,s)=>a+Number(s.total||0),0)),'sem canceladas','green')}${metric('A receber',money(data.finance.filter(f=>f.type==='Receita'&&['Pendente','Vencido'].includes(f.status)).reduce((a,f)=>a+Number(f.value||0),0)),'vendas/serviços pendentes','red')}${metric('Comissões',money(data.commissions.filter(c=>c.status!=='Cancelada').reduce((a,c)=>a+Number(c.value||0),0)),'geradas automaticamente','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Venda</th><th>Data</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Financeiro</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhuma venda registrada.</td></tr>'}</tbody></table></div>`}
function saleModal(){let opts=data.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (estoque ${p.qty})</option>`).join('');let due=new Date();due.setDate(due.getDate()+(Number(data.settings.defaultDueDays)||30));let dueISO=due.toISOString().slice(0,10);showModal(`<h2>Nova venda integrada</h2><div class="notice">Ao concluir, o sistema baixa o estoque, cria o financeiro, movimenta o caixa se estiver pago e calcula comissão.</div><div class="form"><label class="full">Cliente<select id="scustomer">${customerOptions()}</select></label><label>Produto<select id="sproduct">${opts}</select></label><label>Quantidade<input id="sqty" type="number" value="1" min="1"></label><label>Desconto<input id="sdiscount" type="number" value="0" step="0.01"></label><label>Pagamento<select id="spayment">${['PIX','Dinheiro','Débito','Crédito','Boleto','Transferência'].map(x=>`<option ${data.settings.defaultPayment===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Status financeiro<select id="sfinancial"><option>Pago</option><option>Pendente</option></select></label><label>Vencimento<input id="sdue" type="date" value="${dueISO}"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="finishSale()">Concluir venda</button></div>`)}
function finishSale(){let p=data.products.find(x=>String(x.id)===$('#sproduct').value),q=+$('#sqty').value||0;if(!p||q<=0)return alert('Selecione o produto e informe a quantidade.');let res=createIntegratedSale({customerId:$('#scustomer').value,items:[{id:p.id,qty:q}],discount:+$('#sdiscount').value||0,payment:$('#spayment').value,financialStatus:$('#sfinancial').value,dueDate:$('#sdue').value,originType:'Venda'});if(res.error)return alert(res.error);log('Registrou venda integrada #'+res.sale.id+' → estoque, financeiro'+(res.finance.status==='Pago'?', caixa':'')+(res.sale.commissionId?' e comissão':''));save();closeModal();renderAll()}

function renderOrcamentos(){enhanceData();let total=data.quotes.reduce((a,q)=>a+Number(q.total||0),0),approved=data.quotes.filter(q=>q.status==='Aprovado').length;let rows=data.quotes.map(q=>`<tr><td><b>${esc(q.number||('#'+q.id))}</b>${q.saleId?'<small class="cell-sub">Venda vinculada #'+q.saleId+'</small>':''}</td><td>${esc(q.date||'-')}</td><td>${esc(findCustomerName(q.customerId))}</td><td>${esc(q.productName||'-')}</td><td>${money(q.total)}</td><td>${statusBadge(q.status)}</td><td class="actions"><button class="btn ghost small" onclick="changeQuoteStatus(${q.id})">Status</button>${q.customerId?`<button class="btn ghost small" onclick="quoteWhatsApp(${q.id})">WhatsApp</button>`:''}${q.status==='Aprovado'&&!q.converted?`<button class="btn primary small" onclick="convertQuote(${q.id})">Virar venda</button>`:''}<button class="btn ghost small" onclick="deleteQuote(${q.id})">Excluir</button></td></tr>`).join('');$('#orcamentos').innerHTML=heading('Orçamentos','Cliente → orçamento → venda → estoque → financeiro → caixa',`<button class="btn primary" onclick="quoteModal()">+ Novo orçamento</button>`)+`<div class="cards">${metric('Orçamentos',data.quotes.length,'registros','green')}${metric('Aprovados',approved,'prontos para venda','green')}${metric('Convertidos',data.quotes.filter(q=>q.converted).length,'viraram venda','green')}${metric('Valor orçado',money(total),'total acumulado','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Produto</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhum orçamento criado.</td></tr>'}</tbody></table></div>`}
function convertQuote(id){let q=data.quotes.find(x=>x.id===id),p=data.products.find(x=>x.id===q?.productId);if(!q||!p)return alert('Produto não encontrado.');if(q.converted)return alert('Este orçamento já foi convertido.');let status=confirm('Registrar esta venda como PAGA agora?\nOK = Pago / Cancelar = Pendente')?'Pago':'Pendente';let due='';if(status==='Pendente'){let d=new Date();d.setDate(d.getDate()+(Number(data.settings.defaultDueDays)||30));due=d.toISOString().slice(0,10)}let res=createIntegratedSale({customerId:q.customerId,items:[{id:p.id,qty:q.qty}],discount:q.discount,payment:data.settings.defaultPayment,financialStatus:status,dueDate:due,originType:'Orçamento',originId:q.id,originNumber:q.number});if(res.error)return alert(res.error);q.converted=true;q.saleId=res.sale.id;q.financeId=res.finance.id;q.status='Aprovado';log('Converteu '+q.number+' → venda #'+res.sale.id+' → estoque → financeiro'+(status==='Pago'?' → caixa':''));save();renderAll()}

function renderCompras(){enhanceData();let sum=data.purchases.filter(p=>p.status!=='Cancelado').reduce((a,p)=>a+Number(p.total||0),0),pending=data.purchases.filter(p=>p.status==='Pendente').length;let rows=data.purchases.map(p=>`<tr><td><b>${esc(p.number)}</b>${p.financeId?'<small class="cell-sub">Financeiro #'+p.financeId+'</small>':''}</td><td>${esc(p.date)}</td><td>${esc(findSupplierName(p.supplierId))}</td><td>${esc(p.productName)}</td><td>${p.qty}</td><td>${money(p.total)}</td><td>${statusBadge(p.status)}</td><td>${p.status!=='Cancelado'?`<button class="btn ghost small" onclick="cancelPurchase(${p.id})">Cancelar</button>`:''}</td></tr>`).join('');$('#compras').innerHTML=heading('Compras','Fornecedor → estoque → contas a pagar → caixa',`<button class="btn primary" onclick="purchaseModal()">+ Nova compra</button>`)+`<div class="cards">${metric('Compras ativas',data.purchases.filter(p=>p.status!=='Cancelado').length,'registros','green')}${metric('Total comprado',money(sum),'custo acumulado','red')}${metric('Pendentes',pending,'contas a pagar','red')}${metric('Mov. estoque',data.stockMovements.filter(m=>String(m.reason).includes('Compra')).length,'entradas de compra','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Fornecedor</th><th>Produto</th><th>Qtd.</th><th>Total</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Nenhuma compra registrada.</td></tr>'}</tbody></table></div>`}
function savePurchase(){let p=data.products.find(x=>String(x.id)===$('#puproduct').value),qty=+$('#puqty').value,cost=+$('#pucost').value,freight=+$('#pufreight').value||0;if(!p||qty<=0||cost<0)return alert('Preencha produto, quantidade e custo.');let total=qty*cost+freight,pu={id:idNow(),number:(data.settings.purchasePrefix||'CMP')+'-'+String(data.purchases.length+1).padStart(4,'0'),date:new Date().toLocaleDateString('pt-BR'),supplierId:$('#pusupplier').value,productId:p.id,productName:p.name,qty,cost,freight,total,payment:$('#pupayment').value,status:$('#pustatus').value,dueDate:$('#pudue').value,note:$('#punote').value,stockApplied:false,financeId:''};data.purchases.unshift(pu);if(!addStockMovement(p.id,'Entrada',qty,'Compra de fornecedor',pu.number)){data.purchases.shift();return alert('Não foi possível registrar a entrada no estoque.')}pu.stockApplied=true;p.cost=cost;let f=makeFinance({type:'Despesa',category:'Compras',desc:'Compra '+pu.number,value:total,status:pu.status,date:todayISO(),dueDate:pu.dueDate,payment:pu.payment,supplierId:pu.supplierId,originType:'Compra',originId:pu.id,originNumber:pu.number});pu.financeId=f.id;log('Registrou '+pu.number+' → estoque → financeiro'+(pu.status==='Pago'?' → caixa':''));save();closeModal();renderAll()}

function renderOS(){enhanceData();let rows=data.serviceOrders.map(o=>`<tr><td><b>${esc(o.number)}</b>${o.saleId?'<small class="cell-sub">Venda #'+o.saleId+'</small>':''}</td><td>${esc(o.date)}</td><td>${esc(findCustomerName(o.customerId))}</td><td>${esc(o.service)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td><td class="actions"><button class="btn ghost small" onclick="changeOSStatus(${o.id})">Status</button>${o.customerId?`<button class="btn ghost small" onclick="osWhatsApp(${o.id})">WhatsApp</button>`:''}${o.status==='Concluída'&&!o.received?`<button class="btn primary small" onclick="receiveOSModal(${o.id})">Receber</button>`:''}${o.status!=='Cancelada'?`<button class="btn ghost small" onclick="cancelOS(${o.id})">Cancelar</button>`:''}</td></tr>`).join('');$('#os').innerHTML=heading('Ordens de Serviço','Cliente → OS → estoque → venda/financeiro → caixa',`<button class="btn primary" onclick="osModal()">+ Nova OS</button>`)+`<div class="cards">${metric('OS abertas',data.serviceOrders.filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length,'em atendimento','red')}${metric('Concluídas',data.serviceOrders.filter(o=>o.status==='Concluída'||o.status==='Entregue').length,'finalizadas','green')}${metric('Recebidas',data.serviceOrders.filter(o=>o.received).length,'integradas às vendas','green')}${metric('Valor em OS',money(data.serviceOrders.filter(o=>o.status!=='Cancelada').reduce((a,o)=>a+Number(o.total||0),0)),'total ativo','green')}</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Serviço</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhuma ordem de serviço.</td></tr>'}</tbody></table></div>`}
function receiveOSModal(id){let o=data.serviceOrders.find(x=>x.id===id);if(!o||o.received)return;let due=new Date();due.setDate(due.getDate()+(Number(data.settings.defaultDueDays)||30));showModal(`<h2>Receber ${esc(o.number)}</h2><div class="notice">Isso criará uma venda vinculada à OS e lançará o financeiro. O estoque não será baixado de novo porque já foi consumido pela OS.</div><div class="form"><label>Pagamento<select id="ospay">${['PIX','Dinheiro','Débito','Crédito','Boleto','Transferência'].map(x=>`<option ${data.settings.defaultPayment===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Status financeiro<select id="osfinstatus"><option>Pago</option><option>Pendente</option></select></label><label>Vencimento<input id="osfindue" type="date" value="${due.toISOString().slice(0,10)}"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="receiveOS(${id})">Confirmar recebimento</button></div>`)}
function receiveOS(id){let o=data.serviceOrders.find(x=>x.id===id);if(!o||o.received)return;let status=$('#osfinstatus')?.value||'Pago',pay=$('#ospay')?.value||data.settings.defaultPayment,due=$('#osfindue')?.value||'';let items=[];if(o.productId&&o.qty)items.push({id:o.productId,name:o.productName,qty:o.qty,price:o.qty?o.productValue/o.qty:0,cost:data.products.find(p=>p.id===o.productId)?.cost||0});if(o.serviceValue)items.push({id:'service-'+o.id,name:o.service,qty:1,price:o.serviceValue,cost:0,kind:'service'});let productCost=(o.productId?(data.products.find(p=>p.id===o.productId)?.cost||0)*Number(o.qty||0):0),forcedProfit=Number(o.total||0)-productCost;let res=createIntegratedSale({customerId:o.customerId,items,discount:o.discount||0,payment:pay,financialStatus:status,dueDate:due,originType:'OS',originId:o.id,originNumber:o.number,skipStock:true,forcedTotal:o.total,forcedProfit});if(res.error)return alert(res.error);o.received=true;o.status='Entregue';o.saleId=res.sale.id;o.financeId=res.finance.id;log('Recebeu '+o.number+' → venda #'+res.sale.id+' → financeiro'+(status==='Pago'?' → caixa':''));save();closeModal();renderAll()}

.</td></tr>'}</tbody></table></div>`}

function renderCaixa(){enhanceData();let session=data.cashRegister.sessionId||'',movs=session?data.cash.filter(c=>c.cashSessionId===session):data.cash,ent=movs.filter(c=>c.type==='Entrada').reduce((a,b)=>a+Number(b.value||0),0),sai=movs.filter(c=>c.type==='Saída').reduce((a,b)=>a+Number(b.value||0),0),cr=data.cashRegister;$('#caixa').innerHTML=heading('Caixa','Recebe automaticamente baixas do financeiro, vendas, compras e OS',cr.open?`<button class="btn primary" onclick="closeCashModal()">Fechar caixa</button>`:`<button class="btn primary" onclick="openCashModal()">Abrir caixa</button>`)+`<div class="cards">${metric('Situação',cr.open?'ABERTO':'FECHADO',cr.open?'desde '+cr.openedAt:'abra o caixa para iniciar',cr.open?'green':'red')}${metric('Valor inicial',money(cr.initial||0),'sessão atual','green')}${metric('Entradas',money(ent),'sessão atual','green')}${metric('Saídas',money(sai),'sessão atual','red')}${metric('Saldo esperado',money((cr.initial||0)+ent-sai),'sessão atual',(cr.initial||0)+ent-sai>=0?'green':'red')}</div><div class="notice" style="margin-top:16px">Movimentos pagos gerados pelo Financeiro entram aqui automaticamente. Registros feitos com o caixa fechado ficam no histórico geral, sem sessão.</div><div class="card table-wrap" style="margin-top:16px"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Origem</th><th>Pagamento</th><th>Valor</th></tr></thead><tbody>${data.cash.map(c=>`<tr><td>${esc(c.date)}</td><td>${statusBadge(c.type)}</td><td>${esc(c.desc)}</td><td>${esc(c.originNumber||c.originType||'Manual')}</td><td>${esc(c.payment||'-')}</td><td>${money(c.value)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sem movimentações.</td></tr>'}</tbody></table></div>`}

function closeCashModal(){let session=data.cashRegister.sessionId||'',movs=session?data.cash.filter(c=>c.cashSessionId===session):[],ent=movs.filter(c=>c.type==='Entrada').reduce((a,b)=>a+Number(b.value||0),0),sai=movs.filter(c=>c.type==='Saída').reduce((a,b)=>a+Number(b.value||0),0),expected=(data.cashRegister.initial||0)+ent-sai;showModal(`<h2>Fechar caixa</h2><div class="notice">Sessão: <b>${esc(session||'-')}</b><br>Valor esperado: <b>${money(expected)}</b></div><div class="form"><label>Valor contado<input id="cclosing" type="number" step="0.01" value="${expected.toFixed(2)}"></label><label>Observação<input id="ccloseNote" placeholder="Diferenças, sangria, conferência..."></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="closeCashRegister(${expected})">Confirmar fechamento</button></div>`)}

function renderClientes(){enhanceData();let rows=data.customers.map(c=>{let sales=data.sales.filter(s=>String(s.customerId)===String(c.id)&&s.status!=='Cancelada'),spent=sales.reduce((a,s)=>a+Number(s.total||0),0),pending=data.finance.filter(f=>String(f.customerId)===String(c.id)&&['Pendente','Vencido'].includes(f.status)).reduce((a,f)=>a+Number(f.value||0),0);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.doc||'-')}</td><td>${esc(c.phone||'-')}</td><td>${sales.length}</td><td>${money(spent)}</td><td>${money(pending)}</td><td class="actions"><button class="btn primary small" onclick="customerDetail(${c.id})">Visão 360°</button><button class="btn ghost small" onclick="customerModalV2(${c.id})">Editar</button><button class="btn ghost small" onclick="deleteCustomer(${c.id})">Excluir</button></td></tr>`}).join('');$('#clientes').innerHTML=heading('Clientes','Cadastro conectado a vendas, orçamentos, OS, financeiro e WhatsApp',`<button class="btn primary" onclick="customerModalV2()">+ Novo cliente</button>`)+`<div class="card table-wrap"><table><thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th>Vendas</th><th>Total gasto</th><th>Pendente</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhum cliente.</td></tr>'}</tbody></table></div>`}

function deleteSupplier(id){let linked=data.purchases.some(p=>String(p.supplierId)===String(id))||data.finance.some(f=>String(f.supplierId)===String(id));if(linked)return alert('Este fornecedor possui compras ou lançamentos financeiros vinculados e não pode ser excluído.');if(confirm('Excluir este fornecedor?')){data.suppliers=data.suppliers.filter(x=>x.id!==id);log('Excluiu fornecedor');save();renderAll()}}

function globalSearch(){let q=$('#globalSearch').value.trim().toLowerCase();if(q.length<2)return;let checks=[['estoque',data.products,x=>(x.name+' '+x.code+' '+(x.brand||'')).toLowerCase().includes(q)],['clientes',data.customers,x=>(x.name+' '+(x.doc||'')+' '+(x.phone||'')).toLowerCase().includes(q)],['fornecedores',data.suppliers,x=>(x.name+' '+(x.doc||'')).toLowerCase().includes(q)],['orcamentos',data.quotes,x=>(x.number+' '+findCustomerName(x.customerId)).toLowerCase().includes(q)],['os',data.serviceOrders,x=>(x.number+' '+x.service+' '+findCustomerName(x.customerId)).toLowerCase().includes(q)],['vendas',data.sales,x=>(String(x.id)+' '+(x.customer||'')+' '+(x.origin||'')).toLowerCase().includes(q)]];for(const [page,arr,test] of checks){if(arr.some(test)){openPage(page);if(page==='estoque')setTimeout(()=>{$('#stockSearch').value=q;filterTable('stockSearch','stockTable')},50);return}}}

function renderDashboard(){enhanceData();let sales=activeSales(),revenue=sales.reduce((a,s)=>a+Number(s.total||0),0),expenses=data.finance.filter(f=>f.type==='Despesa'&&f.status!=='Cancelado').reduce((a,f)=>a+Number(f.value||0),0),profit=sales.reduce((a,s)=>a+Number(s.profit||0),0),low=data.products.filter(p=>Number(p.qty)<=Number(p.min||0)).length,pending=data.finance.filter(f=>['Pendente','Vencido'].includes(f.status)).reduce((a,f)=>a+Number(f.value||0),0),openOS=data.serviceOrders.filter(o=>!['Concluída','Entregue','Cancelada'].includes(o.status)).length;$('#dashboard').innerHTML=heading('Dashboard','Tudo interligado: vendas, estoque, financeiro, caixa, OS, agenda e WhatsApp')+`<div class="cards">${metric('Faturamento',money(revenue),'vendas ativas','green')}${metric('Lucro estimado',money(profit),'margem das vendas','green')}${metric('Despesas',money(expenses),'compras + lançamentos','red')}${metric('Pendências',money(pending),'a pagar / receber','red')}${metric('Itens em estoque',data.products.reduce((a,p)=>a+Number(p.qty||0),0),low+' em estoque baixo',low?'red':'green')}${metric('Vendas',sales.length,'diretas + orçamento + OS','green')}${metric('OS abertas',openOS,'serviços em andamento',openOS?'red':'green')}${metric('Lembretes',data.reminders.filter(r=>r.status!=='Concluído').length,'inclui vencimentos','green')}</div><div class="grid2"><div class="card"><div class="panel-head"><h3 class="section-title">Faturamento recente</h3><span class="soft-chip">Últimas 10 vendas</span></div><canvas id="chartSales" height="105"></canvas></div><div class="card"><h3 class="section-title">Integrações ativas</h3><div class="summary-list"><div><span>Orçamentos convertidos em venda</span><b>${data.quotes.filter(q=>q.converted).length}</b></div><div><span>Compras ligadas ao financeiro</span><b>${data.purchases.filter(p=>p.financeId).length}</b></div><div><span>OS recebidas como venda</span><b>${data.serviceOrders.filter(o=>o.saleId).length}</b></div><div><span>Financeiro com lembrete</span><b>${data.finance.filter(f=>f.reminderId).length}</b></div></div></div></div><div class="card" style="margin-top:16px"><div class="panel-head"><h3 class="section-title">Últimas movimentações</h3><button class="btn ghost small" onclick="openPage('historico')">Ver histórico</button></div><div class="activity-feed">${data.history.slice(0,7).map(h=>`<div class="activity-row"><span class="activity-dot"></span><div><b>${esc(h.action)}</b><small>${esc(h.date)} • ${esc(h.user)}</small></div></div>`).join('')||'<div class="empty">Nenhuma atividade registrada.</div>'}</div></div>`;setTimeout(()=>{let ctx=$('#chartSales');if(!ctx)return;new Chart(ctx,{type:'bar',data:{labels:sales.slice(0,10).reverse().map(s=>s.origin||('#'+String(s.id).slice(-5))),datasets:[{label:'Faturamento',data:sales.slice(0,10).reverse().map(s=>s.total),borderRadius:7}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}})},0)}
function renderRelatorios(){enhanceData();let sales=activeSales(),rev=sales.reduce((a,s)=>a+Number(s.total||0),0),profit=sales.reduce((a,s)=>a+Number(s.profit||0),0),stockValue=data.products.reduce((a,p)=>a+Number(p.qty||0)*Number(p.cost||0),0);$('#relatorios').innerHTML=heading('Relatórios','Indicadores consolidados dos módulos interligados',`<div class="actions"><button class="btn ghost" onclick="exportCSV('estoque')">Exportar estoque CSV</button><button class="btn primary" onclick="exportCSV('vendas')">Exportar vendas CSV</button></div>`)+`<div class="cards">${metric('Vendas',sales.length,'ativas','green')}${metric('Faturamento',money(rev),'acumulado','green')}${metric('Lucro estimado',money(profit),'acumulado','green')}${metric('Valor do estoque',money(stockValue),'a custo','green')}</div><div class="grid2"><div class="card"><h3 class="section-title">Fluxos integrados</h3><div class="summary-list"><div><span>Orçamento → Venda</span><b>${data.quotes.filter(q=>q.converted).length}</b></div><div><span>Compra → Estoque/Financeiro</span><b>${data.purchases.filter(p=>p.financeId).length}</b></div><div><span>OS → Venda/Financeiro</span><b>${data.serviceOrders.filter(o=>o.saleId).length}</b></div><div><span>Financeiro → Agenda</span><b>${data.finance.filter(f=>f.reminderId).length}</b></div><div><span>Comissões geradas</span><b>${data.commissions.length}</b></div></div></div><div class="card"><h3 class="section-title">Estoque e caixa</h3><div class="summary-list"><div><span>Produtos cadastrados</span><b>${data.products.length}</b></div><div><span>Estoque baixo</span><b>${data.products.filter(p=>p.qty<=p.min).length}</b></div><div><span>Movimentações</span><b>${data.stockMovements.length}</b></div><div><span>Sessões de caixa</span><b>${data.cashSessions.length}</b></div></div></div></div>`}

function renderAll(){ensureData();enhanceData();renderDashboard();renderEstoque();renderVendas();renderOrcamentos();renderFinanceiro();renderCaixa();renderCompras();renderClientes();renderFornecedores();renderOS();renderAgenda();renderWhatsApp();renderRelatorios();renderAlertas();renderUsuarios();renderHistorico();renderConfig();}


initNav(); if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark'); $('#login').classList.add('hidden'); renderAll(); checkReminders(); processWhatsAppQueue(); setInterval(()=>{checkReminders();processWhatsAppQueue()},60000);
</script>
</body>
