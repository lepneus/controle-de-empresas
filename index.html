<script id="lp-catalog-missing-v23-js">
(function(){
  const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};
  const E=v=>typeof esc==='function'?esc(v):String(v??'');

  function norm(v){
    return String(v??'')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim().replace(/\s+/g,' ');
  }
  function normCode(v){
    return String(v??'').trim().toUpperCase().replace(/\.0+$/,'').replace(/\s+/g,'');
  }
  function productKey(p){
    const code=normCode(p?.code);
    if(code)return 'C:'+code;
    return 'P:'+norm(p?.brand)+'|'+norm(p?.name||p?.model)+'|'+norm(p?.size)+'|'+norm(p?.aro);
  }
  function docKey(d){
    const code=normCode(d?.code);
    if(code)return 'C:'+code;
    return 'P:'+norm(d?.brand)+'|'+norm(d?.model||d?.name)+'|'+norm(d?.size)+'|'+norm(d?.aro);
  }
  function dbSafe(){
    try{if(typeof lpDb!=='undefined'&&lpDb)return lpDb}catch(e){}
    return window.lpDb||null;
  }
  function userSafe(){
    try{if(typeof lpFirebaseUser!=='undefined'&&lpFirebaseUser)return lpFirebaseUser}catch(e){}
    return window.lpFirebaseUser||window.lpAuth?.currentUser||null;
  }
  function isTire(p){
    const s=norm((p?.category||'')+' '+(p?.name||'')+' '+(p?.location||''));
    if(N(p?.qty)<=0)return false;
    if(/ACESS|PECA|CAMARA|RODA|MATERIAL/.test(s))return false;
    return /PNEU|MOTO|CARRO|R13|R14|R15|R16|R17|R18|R19|R20|R21|R22/.test(s);
  }

  async function fetchCloud(){
    const db=dbSafe();
    if(!db)throw new Error('Firestore indisponível');
    const snap=await db.collection('produtos').get();
    return snap.docs.map(doc=>({id:doc.id,data:doc.data()}));
  }

  async function missingProducts(){
    const cloud=await fetchCloud();
    const keys=new Set(cloud.map(x=>docKey(x.data)).filter(Boolean));
    const tires=(data.products||[]).filter(isTire);
    return {
      cloud,
      tires,
      missing:tires.filter(p=>!keys.has(productKey(p)))
    };
  }

  window.lpFindOnlyMissingCatalog=async function(){
    if(!userSafe()){
      alert('Conecte o Firebase em Usuários primeiro.');
      return;
    }
    try{
      const r=await missingProducts();
      const rows=r.missing.map(p=>`
        <div class="lp-missing-item">
          <div><b>${E(p.name||'Pneu')}</b><small>Código ${E(p.code||'-')} • ${E(p.brand||'')} • estoque ${N(p.qty)}</small></div>
          <button class="btn primary small" onclick="lpSendMissingOne('${String(p.id)}')">Enviar</button>
        </div>`).join('');
      showModal(`<h2>Pneus que ainda não estão no catálogo</h2>
        <div class="notice">
          O sistema encontrou <b>${r.missing.length}</b> pneu(s) faltando.
          Os pneus que já existem no Firebase não serão alterados nem terão a foto trocada.
        </div>
        <div class="lp-missing-list">${rows||'<div class="empty">Todos os pneus atuais já existem no catálogo.</div>'}</div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Fechar</button>
          ${r.missing.length?'<button class="btn primary" onclick="closeModal();lpSendOnlyMissingCatalog()">Enviar somente os faltantes</button>':''}
        </div>`);
    }catch(e){
      console.error(e);
      alert('Não foi possível comparar o Controle com o Firebase.');
    }
  };

  window.lpSendMissingOne=async function(id){
    const p=(data.products||[]).find(x=>String(x.id)===String(id));
    if(!p)return;
    try{
      const r=await window.publishProductToFirebase(p.id,true);
      if(r?.ok){
        alert('Pneu enviado ao catálogo.');
        closeModal();
        renderCatalogo();
      }else{
        alert('Não foi possível enviar esse pneu.');
      }
    }catch(e){
      console.error(e);
      alert('Não foi possível enviar esse pneu.');
    }
  };

  window.lpSendOnlyMissingCatalog=async function(){
    if(!userSafe()){
      alert('Conecte o Firebase em Usuários primeiro.');
      return;
    }
    try{
      const r=await missingProducts();
      if(!r.missing.length){
        alert('Não há pneus faltando. O catálogo já possui todos os pneus atuais.');
        return;
      }

      let ok=0,err=0;
      for(const p of r.missing){
        try{
          const res=await window.publishProductToFirebase(p.id,true);
          res?.ok?ok++:err++;
        }catch(e){err++}
      }

      renderCatalogo();
      alert(`Envio concluído.\n\nPneus faltando encontrados: ${r.missing.length}\nEnviados: ${ok}\nErros: ${err}\n\nOs pneus que já estavam no catálogo não foram alterados.`);
    }catch(e){
      console.error(e);
      alert('Não foi possível enviar os pneus faltantes.');
    }
  };

  /* Envio normal agora trabalha SOMENTE com faltantes. */
  window.lpSendAllCloud=window.lpSendOnlyMissingCatalog;

  /* Mantém o reparo separado: use Reparar catálogo só quando quiser limpar clones/antigos. */
  const oldRenderCatalog=window.renderCatalogo;
  window.renderCatalogo=function(){
    const r=oldRenderCatalog?.();
    const page=document.getElementById('catalogo');
    if(!page)return r;

    const actions=page.querySelector('.heading .actions');
    if(actions){
      const send=[...actions.querySelectorAll('button')].find(b=>/enviar todos ao site/i.test(b.textContent||''));
      if(send){
        send.textContent='Enviar somente os faltantes';
        send.onclick=window.lpSendOnlyMissingCatalog;
      }
      if(!page.querySelector('[data-lp-find-missing]')){
        const b=document.createElement('button');
        b.className='btn ghost';
        b.dataset.lpFindMissing='1';
        b.textContent='Ver pneus faltando';
        b.onclick=window.lpFindOnlyMissingCatalog;
        actions.prepend(b);
      }
    }

    const notes=[...page.querySelectorAll('.notice')];
    const target=notes.find(n=>/Como usar|Proteção contra duplicados/i.test(n.textContent||''));
    if(target){
      target.innerHTML='<b>Sincronização:</b> o envio normal compara os códigos do Controle com o Firebase e envia <b>somente os pneus que ainda não existem no catálogo</b>. Produtos que já existem não têm preço/foto alterados por esse botão. Para remover clones ou produtos antigos, use <b>Reparar catálogo</b>.';
    }
    return r;
  };
})();
</script>

<script id="lp-table-scroll-v24-js">
(function(){
  if(window.__lpTableWheelV24)return;
  window.__lpTableWheelV24=true;

  /*
   * Alguns navegadores tratam .table-wrap com overflow-x:auto como uma área
   * de rolagem própria e deixam a roda vertical "presa" sobre a tabela.
   * Quando isso acontecer fora de um modal, repassamos deltaY para a página.
   */
  document.addEventListener('wheel',function(ev){
    if(document.getElementById('modal')?.classList.contains('show'))return;

    const wrap=ev.target?.closest?.('.table-wrap');
    if(!wrap)return;

    /* Se o gesto for principalmente horizontal, deixa a tabela cuidar. */
    if(Math.abs(ev.deltaX)>Math.abs(ev.deltaY))return;

    /* A tabela não deve consumir rolagem vertical da página. */
    if(Math.abs(ev.deltaY)>0){
      window.scrollBy({
        top:ev.deltaY,
        left:0,
        behavior:'auto'
      });
      ev.preventDefault();
    }
  },{passive:false,capture:true});
})();
</script>

<script id="lp-performance-v25-js">
(function(){
  if(window.__lpPerformanceV25)return;
  window.__lpPerformanceV25=true;
  const N=v=>{v=Number(v||0);return Number.isFinite(v)?v:0};
  const E=v=>typeof esc==='function'?esc(v):String(v??'');
  const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

  /* ---------- ROTEADOR DIRETO ----------
     Não chama as versões antigas de renderAll em cadeia. */
  let renderRAF=0;
  function renderer(id){
    return {
      dashboard:window.renderDashboard,
      estoque:window.renderEstoque,
      planilhas:window.renderPlanilhas,
      vendas:window.renderVendas,
      catalogo:window.renderCatalogo,
      mercadolivre:window.renderMercadoLivre,
      caixa:window.renderCaixa,
      compras:window.renderCompras,
      clientes:window.renderClientes,
      fornecedores:window.renderFornecedores,
      os:window.renderOS,
      agenda:window.renderAgenda,
      fechamento:window.renderFechamento,
      backup:window.renderBackup,
      usuarios:window.renderUsuarios
    }[id];
  }
  window.renderPageById=function(id){
    const fn=renderer(id);
    if(typeof fn!=='function')return false;
    try{
      if(typeof ensureData==='function')ensureData();
      if(typeof enhanceData==='function')enhanceData();
      fn();
      setTimeout(()=>window.lpV25BindTopButtons?.(),0);
      return true;
    }catch(err){
      console.error('Erro ao abrir '+id,err);
      const page=document.getElementById(id);
      if(page)page.innerHTML=`<div class="heading"><div><h1>Não foi possível abrir esta área</h1><p>O erro ficou isolado e o restante do sistema continua funcionando.</p></div></div><div class="card"><div class="notice">Tente abrir novamente. Se persistir, anote qual botão foi usado.</div></div>`;
      return false;
    }
  };
  window.renderPageStable=window.renderPageById;
  window.renderAll=function(){
    const id=document.querySelector('.page.active')?.id||'dashboard';
    if(renderRAF)cancelAnimationFrame(renderRAF);
    renderRAF=requestAnimationFrame(()=>{
      renderRAF=0;
      window.renderPageById(id);
    });
  };

  window.openPage=function(id,btn){
    const page=document.getElementById(id);
    if(!page)return false;
    /* nunca deixa overlay invisível prendendo os cliques */
    const modal=document.getElementById('modal');
    if(modal&&!modal.classList.contains('show')){
      modal.style.display='none';modal.style.pointerEvents='none';
    }
    document.querySelectorAll('.page.active').forEach(p=>p.classList.remove('active'));
    page.classList.add('active');
    document.querySelectorAll('.nav button.active').forEach(b=>b.classList.remove('active'));
    if(btn)btn.classList.add('active');
    else{
      const candidates=[...document.querySelectorAll('.nav button')];
      const found=candidates.find(b=>(b.getAttribute('onclick')||'').includes(`'${id}'`));
      found?.classList.add('active');
    }
    if(window.innerWidth<=800)document.getElementById('sidebar')?.classList.remove('open');
    window.renderAll();
    window.scrollTo({top:0,left:0,behavior:'auto'});
    return true;
  };

  /* ---------- BUSCA GLOBAL COM DEBOUNCE ---------- */
  let searchTimer=0;
  window.globalSearch=function(){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      const el=document.getElementById('globalSearch');
      const q=String(el?.value||'').trim().toLowerCase();
      if(q.length<2)return;
      const product=(data.products||[]).find(x=>`${x.name||''} ${x.code||''} ${x.brand||''}`.toLowerCase().includes(q));
      if(product){
        window.__lpStockFilters=window.__lpStockFilters||{};
        window.__lpStockFilters.q=q;
        window.__lpStockVisible=60;
        openPage('estoque');
        return;
      }
      const customer=(data.customers||[]).find(x=>`${x.name||''} ${x.phone||''} ${x.doc||''}`.toLowerCase().includes(q));
      if(customer){openPage('clientes');return;}
      const service=(data.serviceOrders||[]).find(x=>`${x.number||''} ${x.service||''}`.toLowerCase().includes(q));
      if(service){openPage('os');return;}
    },220);
  };

  /* ---------- ESTOQUE PAGINADO ---------- */
  window.__lpStockVisible=window.__lpStockVisible||60;
  function productAroFast(p){
    const direct=String(p?.aro||'').match(/\d{2}/);if(direct)return direct[0];
    const m=(String(p?.name||'')+' '+String(p?.size||'')).match(/\bR?\s*(1[0-9]|2[0-4])\b/i);return m?m[1]:'';
  }
  function productCategoryFast(p){
    const s=(String(p?.category||'')+' '+String(p?.name||'')+' '+String(p?.location||'')).toLowerCase();
    if(s.includes('moto'))return 'Moto';
    if(s.includes('acess')||s.includes('câmara')||s.includes('camara')||s.includes('roda')||s.includes('material'))return 'Acessórios';
    if(s.includes('peça')||s.includes('peca')||s.includes('caminh'))return 'Peças';
    return 'Carro';
  }
  window.lpStockShowMore=function(){window.__lpStockVisible+=60;window.renderEstoque()};
  window.lpStockFilter=function(){
    window.__lpStockFilters={
      q:String(document.getElementById('lpStockQ')?.value||'').toLowerCase(),
      cat:document.getElementById('lpStockCat')?.value||'Todos',
      brand:document.getElementById('lpStockBrand')?.value||'Todas',
      aro:document.getElementById('lpStockAro')?.value||'Todos',
      qty:document.getElementById('lpStockQty')?.value||'todos'
    };
    window.__lpStockVisible=60;
    clearTimeout(window.__lpStockFilterTimer);
    window.__lpStockFilterTimer=setTimeout(()=>window.renderEstoque(),100);
  };
  window.renderEstoque=function(){
    const products=Array.isArray(data.products)?data.products:[];
    const brands=[...new Set(products.map(p=>String(p.brand||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const aros=[...new Set(products.map(productAroFast).filter(Boolean))].sort((a,b)=>N(a)-N(b));
    const f=window.__lpStockFilters||{q:'',cat:'Todos',brand:'Todas',aro:'Todos',qty:'todos'};
    const filtered=products.filter(p=>{
      if(f.q&&!`${p.code||''} ${p.name||''} ${p.brand||''} ${p.category||''}`.toLowerCase().includes(f.q))return false;
      if(f.cat&&f.cat!=='Todos'&&productCategoryFast(p)!==f.cat)return false;
      if(f.brand&&f.brand!=='Todas'&&String(p.brand||'')!==f.brand)return false;
      if(f.aro&&f.aro!=='Todos'&&productAroFast(p)!==f.aro)return false;
      if(f.qty==='zero'&&N(p.qty)!==0)return false;
      if(f.qty==='baixo'&&!(N(p.qty)>0&&N(p.qty)<=2))return false;
      if(f.qty==='disponivel'&&N(p.qty)<1)return false;
      return true;
    });
    const visible=filtered.slice(0,window.__lpStockVisible);
    const units=filtered.reduce((a,p)=>a+N(p.qty),0),zero=filtered.filter(p=>N(p.qty)<1).length,low=filtered.filter(p=>N(p.qty)>0&&N(p.qty)<=2).length;
    const avgCost=filtered.length?filtered.reduce((a,p)=>a+N(p.cost),0)/filtered.length:0;
    const rows=visible.map(p=>{
      const q=N(p.qty),cls=q<1?'lp-zero-row':q<=2?'lp-low-row':'';
      return `<tr class="${cls}"><td><b>${E(p.code||'')}</b></td><td>${E(p.name||'')}</td><td>${E(productCategoryFast(p))}</td><td>${E(p.brand||'')}</td><td>${E(productAroFast(p)||'-')}</td><td><b>${q}</b></td><td>${M(p.cost)}</td><td>${M(p.price)}</td><td>${q<1?'<span class="badge danger">Zerado</span>':q<=2?'<span class="badge warn">Baixo</span>':'<span class="badge ok">Normal</span>'}</td><td class="actions"><button class="btn ghost small" onclick="stockMovementModal(${p.id})">Movimentar</button><button class="btn ghost small" onclick="productModal(${p.id})">Editar</button></td></tr>`;
    }).join('');
    document.getElementById('estoque').innerHTML=
      heading('Estoque','Filtre por categoria, marca, aro e quantidade',`<button class="btn primary" onclick="productModal()">+ Produto</button>`)+
      `<div class="lp-stock-kpis"><div><span>Produtos filtrados</span><b>${filtered.length}</b></div><div><span>Unidades</span><b>${units}</b></div><div><span>Zerados</span><b>${zero}</b></div><div><span>Baixo (1–2)</span><b>${low}</b></div><div><span>Custo médio</span><b>${M(avgCost)}</b></div></div>
      <div class="card"><div class="lp-stock-filter-grid"><input id="lpStockQ" placeholder="Código, produto ou marca" value="${E(f.q||'')}" oninput="lpStockFilter()"><select id="lpStockCat" onchange="lpStockFilter()">${['Todos','Carro','Moto','Acessórios','Peças'].map(x=>`<option ${f.cat===x?'selected':''}>${x}</option>`).join('')}</select><select id="lpStockBrand" onchange="lpStockFilter()"><option>Todas</option>${brands.map(x=>`<option ${f.brand===x?'selected':''}>${E(x)}</option>`).join('')}</select><select id="lpStockAro" onchange="lpStockFilter()"><option>Todos</option>${aros.map(x=>`<option ${f.aro===x?'selected':''}>${x}</option>`).join('')}</select><select id="lpStockQty" onchange="lpStockFilter()"><option value="todos" ${f.qty==='todos'?'selected':''}>Todas quantidades</option><option value="disponivel" ${f.qty==='disponivel'?'selected':''}>Somente disponíveis</option><option value="baixo" ${f.qty==='baixo'?'selected':''}>Baixo (1–2)</option><option value="zero" ${f.qty==='zero'?'selected':''}>Zerados</option></select></div><div class="table-wrap"><table><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Marca</th><th>Aro</th><th>Qtd.</th><th>Custo</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="empty">Nenhum produto neste filtro.</td></tr>'}</tbody></table></div>${filtered.length>visible.length?`<div class="lp-load-more"><button class="btn ghost" onclick="lpStockShowMore()">Mostrar mais (${visible.length} de ${filtered.length})</button></div>`:''}<div class="lp-performance-note">Exibindo ${visible.length} de ${filtered.length} produto(s) para manter o sistema leve.</div></div>`;
  };

  /* ---------- TOPBAR ---------- */
  window.lpV25BindTopButtons=function(){
    const bell=document.querySelector('.lp-bell-wrap button');
    if(bell&&typeof window.lpOpenNotifications==='function')bell.onclick=window.lpOpenNotifications;
    const menu=document.querySelector('.topbar .menu-btn,.topbar button[onclick*="toggleSidebar"]');
    if(menu)menu.onclick=window.toggleSidebar;
  };

  /* Remove cursor de processamento se alguma ação der erro. */
  window.addEventListener('error',()=>document.body.classList.remove('lp-busy-cursor'));
  window.addEventListener('unhandledrejection',()=>document.body.classList.remove('lp-busy-cursor'));

  document.addEventListener('DOMContentLoaded',()=>{
    setTimeout(()=>{
      window.lpV25BindTopButtons();
      const current=document.querySelector('.page.active')?.id||'dashboard';
      window.renderPageById(current);
    },80);
  });
})();
</script>

</body>
</html>
